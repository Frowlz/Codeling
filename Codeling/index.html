t":"A `for` loop puts the counter in one line: start; keep going while; step. This one runs with `i` = 0, 1, 2.","code":"for (int i = 0; i < 3; i++)\n{\n    Console.WriteLine(i); // 0, then 1, then 2\n}"},{"text":"Change the parts to count differently, like counting down by 5.","code":"for (int i = 10; i >= 0; i -= 5)\n{\n    Console.WriteLine(i); // 10, then 5, then 0\n}"},{"text":"`break` leaves the loop right away. `continue` skips the rest of this round and jumps to the next one.","code":"for (int i = 1; i <= 6; i++)\n{\n    if (i == 2) continue;\n    if (i == 5) break;\n    Console.WriteLine(i); // 1, then 3, then 4\n}"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"for (int i = 1; i <= 3; i++)\n{\n    Console.WriteLine(i * 2);\n}","options":["1\n2\n3","2\n4\n6","2\n4\n6\n8"],"answer":1,"explain":"`i` takes the values 1, 2, 3 (the loop stops when `i <= 3` is false), and each is doubled."},{"type":"output","prompt":"What does this print?","code":"int x = 1;\nwhile (x < 20)\n{\n    x *= 3;\n}\nConsole.WriteLine(x);","options":["27","9","20"],"answer":0,"explain":"`x` goes 1, 3, 9, 27. At 9 the condition is still true, so it runs once more and becomes 27."},{"type":"output","prompt":"What does this print?","code":"for (int i = 0; i < 5; i++)\n{\n    if (i % 2 == 0) continue;\n    Console.WriteLine(i);\n}","options":["0\n2\n4","1\n3\n5","1\n3"],"answer":2,"explain":"Even numbers hit `continue` and are skipped. The loop stops before 5, so only 1 and 3 print."},{"type":"fill","prompt":"Make it print 0, 1, 2, 3, 4","code":"for (int i = 0; i ___ 5; i___)\n{\n    Console.WriteLine(i);\n}","bank":["<=","<","++","--",">"],"answer":["<","++"],"explain":"`i < 5` stops after 4, and `i++` counts up. `<=` would also print 5."},{"type":"bug","prompt":"This should print 0, 1, 2. Tap the line with the bug","lines":["int count = 0;","while (count < 3)","{","    Console.WriteLine(count);","    count--;","}"],"answer":4,"explain":"`count--` makes `count` smaller, so `count < 3` is always true and the loop never ends. It should be `count++`."},{"type":"mcq","prompt":"How many times does the body of `for (int i = 0; i < 10; i += 2)` run?","options":["5","10","4","6"],"answer":0,"explain":"`i` is 0, 2, 4, 6, 8. That's 5 times; at 10 the condition fails."},{"type":"tf","prompt":"`continue` skips the rest of the current round, and the loop keeps going.","answer":true,"explain":"`continue` jumps to the next round. `break` is the one that exits the loop completely."},{"type":"order","prompt":"Put the lines in order so it adds 1 to 5 and prints the total once","lines":["int sum = 0;","for (int i = 1; i <= 5; i++)","{","    sum += i;","}","Console.WriteLine(sum);"],"explain":"`sum` must exist before the loop, the loop adds each `i`, and printing after the loop shows 15 once."}]}],"intermediate":[{"id":"cs-i1","title":"Methods","summary":"Define, call, parameters and return","teach":[{"text":"A **method** (a function) is a named block of code you can run whenever you need it. Write it inside the class next to `Main`, marked `static` so `Main` can call it. `void` means it gives nothing back.","code":"static void SayHi()\n{\n    Console.WriteLine(\"Hi!\");\n}\n\nSayHi(); // Hi!\nSayHi(); // Hi!"},{"text":"**Parameters** let you pass values in. Each parameter has a type and a name.","code":"static void Greet(string name, int times)\n{\n    for (int i = 0; i < times; i++)\n        Console.WriteLine($\"Hello, {name}\");\n}\n\nGreet(\"Zoe\", 2); // Hello, Zoe (twice)"},{"text":"Give a method a return type instead of `void` to send a value back with `return`. The call then works like a value.","code":"static int Square(int n)\n{\n    return n * n;\n}\n\nint result = Square(4);\nConsole.WriteLine(result + 1); // 17"},{"text":"**Scope**: a variable made inside a method only exists inside it. Simple values like `int` are copied into parameters, so changing the parameter doesn't change the caller's variable.","code":"static void AddTen(int x)\n{\n    x += 10;\n}\n\nint score = 5;\nAddTen(score);\nConsole.WriteLine(score); // 5"},{"text":"Short methods can use `=>` instead of a block. Parameters can have **default values** that are used when you leave them out.","code":"static int Twice(int n) => n * 2;\nstatic string Tag(string name, string title = \"Player\") => $\"{title} {name}\";\n\nConsole.WriteLine(Twice(21));          // 42\nConsole.WriteLine(Tag(\"Kai\"));         // Player Kai\nConsole.WriteLine(Tag(\"Kai\", \"Boss\")); // Boss Kai"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"static int Add(int a, int b)\n{\n    return a + b;\n}\n\nConsole.WriteLine(Add(2, 3) * Add(1, 1));","options":["7","10","5\n2"],"answer":1,"explain":"`Add(2, 3)` is 5 and `Add(1, 1)` is 2, so it prints 5 * 2 = 10."},{"type":"output","prompt":"What does this print?","code":"static int Bump(int n)\n{\n    n++;\n    return n;\n}\n\nint x = 1;\nBump(x);\nConsole.WriteLine(x);","options":["2","Error","1"],"answer":2,"explain":"`Bump` changes its own copy and returns 2, but the result is thrown away. `x` is still 1."},{"type":"fill","prompt":"Complete the method so `Half(5)` gives back 2.5","code":"static ___ Half(double x)\n{\n    ___ x / 2;\n}","bank":["void","double","int","return","print"],"answer":["double","return"],"explain":"The method gives back a decimal, so its return type is `double`, and `return` sends the value back."},{"type":"bug","prompt":"This method should give back twice the number. Tap the line with the bug","lines":["static void Double(int n)","{","    return n * 2;","}"],"answer":0,"explain":"A `void` method can't return a value. The return type should be `int`."},{"type":"mcq","prompt":"What does `void` mean in `static void Save()`?","options":["It takes no parameters","It returns nothing","It can't be called","It runs only once"],"answer":1,"explain":"`void` is the return type meaning no value comes back. Parameters go in the parentheses."},{"type":"tf","prompt":"A variable declared inside one method can be used directly in a different method.","answer":false,"explain":"Local variables only exist inside the method (and block) where they are declared. Pass values as parameters instead."},{"type":"output","prompt":"What does this print?","code":"static string Hello(string name = \"friend\") => $\"Hello, {name}!\";\n\nConsole.WriteLine(Hello());\nConsole.WriteLine(Hello(\"Ana\"));","options":["Hello, !\nHello, Ana!","Hello, friend!\nHello, friend!","Hello, friend!\nHello, Ana!"],"answer":2,"explain":"With no argument, the default `\"friend\"` is used. Passing `\"Ana\"` replaces the default."}]},{"id":"cs-i2","title":"Arrays and lists","summary":"Indexes, Count, Add/Remove and foreach","teach":[{"text":"An **array** holds a fixed number of values of one type. Indexes start at 0, and `.Length` gives the size.","code":"int[] scores = { 90, 75, 60 };\nConsole.WriteLine(scores[0]);     // 90\nConsole.WriteLine(scores.Length); // 3\nscores[2] = 65;\nConsole.WriteLine(scores[2]);     // 65"},{"text":"Valid indexes go from 0 to `Length - 1`. Going past the end crashes with an `IndexOutOfRangeException`.","code":"int[] a = { 1, 2, 3 };\nConsole.WriteLine(a[a.Length - 1]); // 3 (the last item)\n// Console.WriteLine(a[3]);  crash: no index 3"},{"text":"A `List<T>` can grow and shrink. `T` is the item type. It needs `using System.Collections.Generic;` at the top of the file. Use `.Count` for its size.","code":"var names = new List<string> { \"Ann\", \"Bo\" };\nnames.Add(\"Cy\");\nConsole.WriteLine(names.Count); // 3\nConsole.WriteLine(names[2]);    // Cy"},{"text":"`Remove` deletes by value, `RemoveAt` deletes by position, and `Contains` checks if an item is there. `string.Join` turns a list into one string.","code":"var items = new List<string> { \"sword\", \"shield\", \"potion\", \"map\" };\nitems.Remove(\"shield\");\nitems.RemoveAt(0);\nConsole.WriteLine(string.Join(\", \", items)); // potion, map\nConsole.WriteLine(items.Contains(\"map\"));    // True"},{"text":"`foreach` visits each item in turn. Use a `for` loop when you also need the index.","code":"var nums = new List<int> { 4, 8, 15 };\nforeach (int n in nums)\n{\n    Console.WriteLine(n); // 4, then 8, then 15\n}\nfor (int i = 0; i < nums.Count; i++)\n{\n    Console.WriteLine($\"{i}: {nums[i]}\"); // 0: 4, then 1: 8, then 2: 15\n}"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"var list = new List<int> { 5, 10, 15 };\nlist.Add(20);\nlist.RemoveAt(1);\nConsole.WriteLine(list[1]);","options":["10","15","20"],"answer":1,"explain":"After `Add` the list is 5, 10, 15, 20. `RemoveAt(1)` removes 10, leaving 5, 15, 20, so index 1 is 15."},{"type":"output","prompt":"What does this print?","code":"var nums = new List<int> { 2, 0, 1 };\nnums.Remove(1);\nConsole.WriteLine(string.Join(\",\", nums));","options":["2,1","0,1","2,0"],"answer":2,"explain":"`Remove(1)` removes the **value** 1, not index 1. `RemoveAt(1)` would have removed the 0."},{"type":"fill","prompt":"Make a list of strings, add one item and print 1","code":"var pets = new ___<string>();\npets.___(\"cat\");\nConsole.WriteLine(pets.Count);","bank":["Array","List","Push","Add","Insert"],"answer":["List","Add"],"explain":"`new List<string>()` makes an empty list, and `Add` puts an item on the end."},{"type":"bug","prompt":"This should print every day. Tap the line with the bug","lines":["int[] days = { 1, 2, 3, 4, 5, 6, 7 };","for (int i = 0; i <= days.Length; i++)","{","    Console.WriteLine(days[i]);","}"],"answer":1,"explain":"With `<=`, `i` reaches 7, but the last index is 6, so it crashes. Use `i < days.Length`."},{"type":"mcq","prompt":"How do you get the number of items in a `List<int>` called `ids`?","options":["ids.Length","ids.Size()","ids.Count","len(ids)"],"answer":2,"explain":"Lists use `Count`. Arrays use `Length`."},{"type":"tf","prompt":"The first item of a C# array is at index 0.","answer":true,"explain":"Indexes start at 0, so the first item is `arr[0]` and the last is `arr[arr.Length - 1]`."},{"type":"output","prompt":"What does this print?","code":"int[] prices = { 3, 7, 2 };\nint total = 0;\nforeach (int p in prices)\n{\n    if (p > 2) total += p;\n}\nConsole.WriteLine(total);","options":["10","12","7"],"answer":0,"explain":"Only 3 and 7 are greater than 2, so the total is 10. The 2 is skipped."}]},{"id":"cs-i3","title":"Dictionaries","summary":"Key/value lookup with Dictionary","teach":[{"text":"A `Dictionary<TKey, TValue>` stores pairs: a **key** you look up and the **value** it maps to. Each key appears only once.","code":"var ages = new Dictionary<string, int>\n{\n    { \"Ann\", 14 },\n    { \"Bo\", 16 }\n};\nConsole.WriteLine(ages[\"Bo\"]); // 16"},{"text":"`dict[key] = value` adds a new pair or replaces an existing value. `Add` also adds, but crashes if the key is already there.","code":"var stock = new Dictionary<string, int>();\nstock[\"apple\"] = 3;\nstock[\"apple\"] = 5;   // replaces 3\nstock.Add(\"pear\", 2);\n// stock.Add(\"pear\", 9);  crash: key already exists\nConsole.WriteLine(stock[\"apple\"]); // 5\nConsole.WriteLine(stock.Count);    // 2"},{"text":"Reading a missing key crashes with a `KeyNotFoundException`. Check with `ContainsKey`, or use `TryGetValue`, which checks and reads in one step.","code":"var hp = new Dictionary<string, int> { { \"orc\", 30 } };\nConsole.WriteLine(hp.ContainsKey(\"elf\")); // False\nif (hp.TryGetValue(\"orc\", out int value))\n{\n    Console.WriteLine(value); // 30\n}"},{"text":"`foreach` gives each pair with `.Key` and `.Value`. `Remove(key)` deletes a pair. Don't rely on a dictionary keeping any particular order.","code":"var scores = new Dictionary<string, int> { { \"Ann\", 7 }, { \"Bo\", 9 } };\nforeach (var pair in scores)\n{\n    Console.WriteLine($\"{pair.Key}: {pair.Value}\"); // Ann: 7, Bo: 9\n}\nscores.Remove(\"Ann\");\nConsole.WriteLine(scores.Count); // 1"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"var d = new Dictionary<string, int>();\nd[\"a\"] = 1;\nd[\"b\"] = 2;\nd[\"a\"] = d[\"a\"] + 10;\nConsole.WriteLine(d[\"a\"] + d[\"b\"]);","options":["3","13","12"],"answer":1,"explain":"`d[\"a\"]` becomes 1 + 10 = 11, and 11 + 2 = 13."},{"type":"output","prompt":"What does this print?","code":"var colors = new Dictionary<string, string>();\ncolors[\"sky\"] = \"blue\";\ncolors[\"grass\"] = \"green\";\ncolors[\"sky\"] = \"gray\";\nConsole.WriteLine(colors.Count);\nConsole.WriteLine(colors[\"sky\"]);","options":["3\ngray","3\nblue","2\ngray"],"answer":2,"explain":"Setting `\"sky\"` again replaces its value instead of adding a new pair, so there are still 2 keys."},{"type":"fill","prompt":"Print the price of milk only if it is in the dictionary","code":"if (prices.___(\"milk\"))\n{\n    Console.WriteLine(prices[___]);\n}","bank":["Contains","ContainsKey","milk","\"milk\"","HasKey"],"answer":["ContainsKey","\"milk\""],"explain":"`ContainsKey` checks for a key. The key is the string `\"milk\"`, in quotes."},{"type":"bug","prompt":"Tap the line that will crash","lines":["var inventory = new Dictionary<string, int>();","inventory.Add(\"arrow\", 10);","inventory.Add(\"bow\", 1);","inventory.Add(\"arrow\", 5);","Console.WriteLine(inventory[\"arrow\"]);"],"answer":3,"explain":"`Add` throws an `ArgumentException` when the key already exists. Use `inventory[\"arrow\"] = 5;` to replace it."},{"type":"mcq","prompt":"What happens if you read `dict[\"x\"]` when `\"x\"` is not a key?","options":["It throws a KeyNotFoundException","You get null","You get 0","It adds the key"],"answer":0,"explain":"Reading a missing key with `[ ]` throws. Use `ContainsKey` or `TryGetValue` when the key might be missing."},{"type":"tf","prompt":"A dictionary can hold two pairs with the same key.","answer":false,"explain":"Keys are unique. Setting the same key again replaces the value."},{"type":"output","prompt":"What does this print?","code":"var lives = new Dictionary<string, int> { { \"Ann\", 3 } };\nif (lives.TryGetValue(\"Bo\", out int n))\n    Console.WriteLine(n);\nelse\n    Console.WriteLine(\"none\");","options":["none","0","Error"],"answer":0,"explain":"`TryGetValue` returns false for a missing key instead of crashing, so the `else` branch runs."},{"type":"order","prompt":"Put the lines in order to count how many times each word appears in `words`","lines":["var counts = new Dictionary<string, int>();","foreach (string w in words)","{","    if (!counts.ContainsKey(w)) counts[w] = 0;","    counts[w]++;","}"],"explain":"Create the dictionary first. Inside the loop, start a new word at 0 before adding 1, or `counts[w]++` would crash."}]},{"id":"cs-i4","title":"Working with text","summary":"String methods, substrings and parsing","teach":[{"text":"Strings have handy methods like `ToUpper`, `ToLower` and `Trim` (removes spaces at both ends). Strings never change: these methods return a **new** string.","code":"string s = \"  Hello  \";\nstring t = s.Trim();\nConsole.WriteLine(t.ToUpper()); // HELLO\nConsole.WriteLine(t.Length);    // 5\nConsole.WriteLine(s.Length);    // 9"},{"text":"Search inside text with `Contains`, `StartsWith` and `IndexOf` (the position, or -1 if not found). `Replace` swaps text.","code":"string msg = \"level up\";\nConsole.WriteLine(msg.Contains(\"up\"));        // True\nConsole.WriteLine(msg.IndexOf(\"e\"));          // 1\nConsole.WriteLine(msg.IndexOf(\"z\"));          // -1\nConsole.WriteLine(msg.Replace(\"up\", \"down\")); // level down"},{"text":"`Substring(start, length)` takes a piece. `s[i]` gives one `char`. `Split` breaks text into an array.","code":"string word = \"Unity\";\nConsole.WriteLine(word.Substring(1, 3)); // nit\nConsole.WriteLine(word[0]);              // U\nstring[] parts = \"red,green,blue\".Split(',');\nConsole.WriteLine(parts[1]);             // green"},{"text":"`int.Parse` turns text into a number, and `ToString()` turns a number into text. For user input, `int.TryParse` is safer: it returns false instead of crashing.","code":"int n = int.Parse(\"42\");\nConsole.WriteLine(n + 1);       // 43\nstring s = 7.ToString();\nConsole.WriteLine(s + 1);       // 71\nbool ok = int.TryParse(\"abc\", out int x);\nConsole.WriteLine($\"{ok} {x}\"); // False 0"},{"text":"Format codes go after a colon in `{ }`: `F2` for 2 decimals, `D3` to pad a whole number to 3 digits.","code":"double t = 3.14159;\nint id = 7;\nConsole.WriteLine($\"{t:F2}\");  // 3.14\nConsole.WriteLine($\"{id:D3}\"); // 007\nConsole.WriteLine($\"Player {id:D3} at {t:F1}\"); // Player 007 at 3.1"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"string s = \"Hello\";\ns.ToUpper();\nConsole.WriteLine(s);","options":["HELLO","Hello","hello"],"answer":1,"explain":"`ToUpper` returns a new string but doesn't change `s`. You'd need `s = s.ToUpper();`."},{"type":"output","prompt":"What does this print?","code":"Console.WriteLine(\"abcdef\".Substring(2, 3));","options":["cde","bcd","cdef"],"answer":0,"explain":"Start at index 2 (`c`) and take 3 characters: `cde`."},{"type":"output","prompt":"What does this print?","code":"Console.WriteLine(\"10\" + 5);\nConsole.WriteLine(int.Parse(\"10\") + 5);","options":["15\n15","105\n105","105\n15"],"answer":2,"explain":"A string plus a number joins text, giving `105`. After `int.Parse`, it's real math: 15."},{"type":"fill","prompt":"Split the line and print how many parts there are (3)","code":"string line = \"a;b;c\";\nstring[] parts = line.___(';');\nConsole.WriteLine(parts.___);","bank":["Split","Count","Length","Divide","Size"],"answer":["Split","Length"],"explain":"`Split` returns an array, and arrays use `Length` for their size."},{"type":"bug","prompt":"Tap the line with the bug","lines":["string input = \"25\";","int age = input;","int next = age + 1;","Console.WriteLine($\"Next year: {next}\");"],"answer":1,"explain":"A `string` can't be stored in an `int` directly. Convert it with `int.Parse(input)`."},{"type":"mcq","prompt":"What is `\"banana\".IndexOf(\"n\")`?","options":["1","2","3","-1"],"answer":1,"explain":"Indexes start at 0: b=0, a=1, n=2. `IndexOf` returns the first match."},{"type":"tf","prompt":"`int.TryParse(\"abc\", out int x)` crashes because `\"abc\"` is not a number.","answer":false,"explain":"`TryParse` returns false and sets `x` to 0. `int.Parse` is the one that crashes."},{"type":"output","prompt":"What does this print?","code":"string name = \"ada\";\nConsole.WriteLine(char.ToUpper(name[0]) + name.Substring(1));","options":["ADA","Ada","ada"],"answer":1,"explain":"`name[0]` is `'a'`, uppercased to `'A'`, then joined with `\"da\"` to give `Ada`."}]},{"id":"cs-i5","title":"Classes and objects","summary":"Fields, constructors, methods and Unity","teach":[{"text":"A **class** is a blueprint. An **object** (an instance) is one thing built from it with `new`. **Fields** hold each object's own data.","code":"class Dog\n{\n    public string Name;\n    public int Age;\n}\n\nvar d = new Dog();\nd.Name = \"Rex\";\nd.Age = 3;\nConsole.WriteLine($\"{d.Name} is {d.Age}\"); // Rex is 3"},{"text":"A **constructor** runs when the object is created. It has the class's name and no return type. Use it to set starting values.","code":"class Player\n{\n    public string Name;\n    public int Health;\n    public Player(string name) { Name = name; Health = 100; }\n}\n\nvar p = new Player(\"Ava\");\nConsole.WriteLine($\"{p.Name} {p.Health}\"); // Ava 100"},{"text":"Methods in a class work on that object's data. A **property** like `{ get; private set; }` can be read from outside but only changed inside the class.","code":"class Counter\n{\n    public int Count { get; private set; }\n    public void Add() { Count++; }\n}\n\nvar a = new Counter();\nvar b = new Counter();\na.Add(); a.Add(); b.Add();\nConsole.WriteLine($\"{a.Count} {b.Count}\"); // 2 1"},{"text":"Objects are **references**. Copying the variable doesn't copy the object: both names point to the same one.","code":"class Box { public int Value; }\n\nvar b1 = new Box();\nvar b2 = b1;\nb2.Value = 50;\nConsole.WriteLine(b1.Value); // 50"},{"text":"In **Unity**, every script is a class that inherits from `MonoBehaviour`. Public fields show up in the Inspector. Unity calls `Start()` once and `Update()` every frame for you.","code":"using UnityEngine;\n\npublic class Spinner : MonoBehaviour\n{\n    public float speed = 90f; // editable in the Inspector\n    void Start() { Debug.Log(\"Spinner ready\"); }\n    void Update() // called every frame\n    {\n        transform.Rotate(0, speed * Time.deltaTime, 0);\n    }\n}"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"class Box { public int Value; }\n\nvar a = new Box();\na.Value = 1;\nvar b = a;\nb.Value = 5;\nConsole.WriteLine(a.Value);","options":["5","1","6"],"answer":0,"explain":"`b = a` copies the reference, so `a` and `b` are the same box. Changing `b.Value` changes what `a` sees."},{"type":"output","prompt":"What does this print?","code":"class Enemy\n{\n    public int Hp;\n    public Enemy(int hp) { Hp = hp * 2; }\n    public void Hit() { Hp -= 3; }\n}\n\nvar e = new Enemy(5);\ne.Hit();\nConsole.WriteLine(e.Hp);","options":["2","10","7"],"answer":2,"explain":"The constructor sets `Hp` to 5 * 2 = 10, then `Hit` subtracts 3, leaving 7."},{"type":"fill","prompt":"Complete the constructor and create a cat","code":"class Cat\n{\n    public string Name;\n    public ___(string name) { Name = name; }\n}\n\nvar c = ___ Cat(\"Tom\");","bank":["void","Cat","new","create","Cat()"],"answer":["Cat","new"],"explain":"A constructor is named after its class with no return type, and `new` creates the object."},{"type":"bug","prompt":"This class should have a constructor that sets `Speed`. Tap the line with the bug","lines":["class Ship","{","    public int Speed;","    public void Ship(int speed) { Speed = speed; }","}"],"answer":3,"explain":"Constructors have no return type. With `void` it's treated as a method, which can't share the class's name. Remove `void`."},{"type":"mcq","prompt":"What is the difference between a class and an object?","options":["They are the same thing","An object is a blueprint, and classes are built from it","A class is a blueprint, and an object is one instance built from it","A class can only ever have one object"],"answer":2,"explain":"You can make many objects from one class, each with its own field values."},{"type":"tf","prompt":"In Unity, `Update()` on an active `MonoBehaviour` is called once per frame.","answer":true,"explain":"Unity calls `Update()` every frame, which is why movement code usually goes there."},{"type":"mcq","prompt":"In a Unity script, what do you usually use instead of `Console.WriteLine` to print to the Console window?","options":["Console.Log","Debug.Log","Unity.Print","Print.Line"],"answer":1,"explain":"`Debug.Log` writes to Unity's Console window. `Console.WriteLine` output doesn't show up there."},{"type":"order","prompt":"Put the method in order so `Health` never ends up below 0","lines":["    public void TakeDamage(int amount)","    {","        Health -= amount;","        if (Health < 0) Health = 0;","    }"],"explain":"Subtract the damage first, then fix up a negative value. In the other order, the check runs too early."}]}],"advanced":[{"id":"cs-a1","title":"Inheritance and interfaces","summary":"Base classes, override, abstract, interfaces","teach":[{"text":"A class can **inherit** from another using `:`. The child gets the parent's fields and methods and can add its own.","code":"class Animal\n{\n    public string Name = \"?\";\n    public void Eat() { Console.WriteLine($\"{Name} eats\"); }\n}\nclass Bird : Animal\n{\n    public void Fly() { Console.WriteLine($\"{Name} flies\"); }\n}\nvar b = new Bird { Name = \"Tweety\" };\nb.Eat(); // Tweety eats\nb.Fly(); // Tweety flies"},{"text":"**Polymorphism**: mark a method `virtual` in the parent and `override` in the child. Calls go to the real object's version, even through a parent-type variable.","code":"class Shape\n{\n    public virtual double Area() { return 0; }\n}\nclass Square : Shape\n{\n    public double Side;\n    public override double Area() { return Side * Side; }\n}\n\nShape s = new Square { Side = 3 };\nConsole.WriteLine(s.Area()); // 9"},{"text":"An `abstract` class can't be created with `new`, and its `abstract` methods must be overridden. `base(...)` calls the parent's constructor.","code":"abstract class Enemy\n{\n    public int Hp;\n    public Enemy(int hp) { Hp = hp; }\n    public abstract string Sound();\n}\nclass Orc : Enemy\n{\n    public Orc() : base(50) { }\n    public override string Sound() => \"Grr\";\n}\nEnemy e = new Orc();\nConsole.WriteLine($\"{e.Sound()} {e.Hp}\"); // Grr 50"},{"text":"An **interface** is a contract: a list of methods a class promises to have. A class inherits only one class but can implement many interfaces. In Unity, an `IDamageable` lets bullets hit crates and enemies alike.","code":"interface IDamageable\n{\n    void TakeDamage(int amount);\n}\nclass Crate : IDamageable\n{\n    public void TakeDamage(int amount) { Console.WriteLine($\"Crate -{amount}\"); }\n}\n\nvar targets = new List<IDamageable> { new Crate() };\nforeach (var t in targets) t.TakeDamage(10); // Crate -10"},{"text":"Without `override`, a child method with the same name only **hides** the parent's (use `new` to say so). Then the variable's type decides which one runs.","code":"class A { public virtual string Hi() => \"A\"; }\nclass B : A { public new string Hi() => \"B\"; }\n\nA x = new B();\nConsole.WriteLine(x.Hi());      // A\nConsole.WriteLine(((B)x).Hi()); // B"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"class Animal { public virtual string Speak() => \"...\"; }\nclass Dog : Animal { public override string Speak() => \"Woof\"; }\nclass Cat : Animal { }\n\nvar pets = new List<Animal> { new Dog(), new Cat(), new Animal() };\nforeach (var p in pets) Console.WriteLine(p.Speak());","options":["Woof\nMeow\n...","Woof\n...\n...","...\n...\n..."],"answer":1,"explain":"`Dog` overrides `Speak`. `Cat` doesn't, so it inherits the parent's `\"...\"`."},{"type":"output","prompt":"What does this print?","code":"class Base { public virtual string Name() => \"Base\"; }\nclass Mid : Base { public override string Name() => \"Mid\"; }\nclass Top : Mid { public new string Name() => \"Top\"; }\n\nBase b = new Top();\nMid m = new Top();\nConsole.WriteLine(b.Name() + \" \" + m.Name());","options":["Top Top","Base Mid","Mid Top","Mid Mid"],"answer":3,"explain":"`Top` hides `Name` with `new` instead of overriding, so virtual calls stop at the last override, in `Mid`."},{"type":"output","prompt":"What does this print?","code":"class A { public A() { Console.WriteLine(\"A\"); } }\nclass B : A { public B() { Console.WriteLine(\"B\"); } }\n\nvar b = new B();","options":["A\nB","B\nA","B"],"answer":0,"explain":"The parent's constructor always runs first, then the child's."},{"type":"fill","prompt":"Make a `Character` variable holding a `Hero` print Slash","code":"class Character\n{\n    public ___ void Attack() { Console.WriteLine(\"...\"); }\n}\nclass Hero ___ Character\n{\n    public ___ void Attack() { Console.WriteLine(\"Slash\"); }\n}","bank":["override","virtual","extends",":","static","inherits"],"answer":["virtual",":","override"],"explain":"The parent marks the method `virtual`, `:` sets up inheritance, and the child uses `override`."},{"type":"bug","prompt":"Tap the line that won't compile","lines":["abstract class Weapon { public abstract int Damage(); }","class Sword : Weapon { public override int Damage() => 10; }","Weapon w1 = new Sword();","Weapon w2 = new Weapon();","Console.WriteLine(w1.Damage());"],"answer":3,"explain":"You can't create an instance of an `abstract` class. A `Weapon` variable can hold a `Sword`, though."},{"type":"mcq","prompt":"How many classes can a C# class directly inherit from?","options":["None","Two","Exactly one, plus any number of interfaces","As many as you like"],"answer":2,"explain":"C# allows one base class, but a class can implement many interfaces."},{"type":"tf","prompt":"A class can implement more than one interface.","answer":true,"explain":"For example `class Door : IDamageable, IInteractable`. This is how C# gets around the one-base-class rule."}]},{"id":"cs-a2","title":"Errors and exceptions","summary":"try, catch, finally and throw","teach":[{"text":"When something goes wrong while running, C# **throws** an exception. If nothing catches it, the program crashes. Put risky code in `try` and handle the problem in `catch`.","code":"try\n{\n    int[] a = new int[2];\n    a[5] = 1;\n    Console.WriteLine(\"not reached\");\n}\ncatch (IndexOutOfRangeException)\n{\n    Console.WriteLine(\"Bad index!\"); // Bad index!\n}"},{"text":"Catch specific types first and the general `Exception` last. The caught object `e` has a `Message`.","code":"try\n{\n    int n = int.Parse(\"abc\");\n}\ncatch (FormatException)\n{\n    Console.WriteLine(\"Not a number\"); // Not a number\n}\ncatch (Exception e)\n{\n    Console.WriteLine(\"Other: \" + e.Message);\n}"},{"text":"Use `throw` to raise your own exception when a value is invalid. The caller decides how to handle it.","code":"static void SetVolume(int v)\n{\n    if (v < 0 || v > 100)\n        throw new ArgumentException(\"Volume must be 0-100\");\n    Console.WriteLine($\"Volume {v}\");\n}\n\ntry { SetVolume(150); }\ncatch (ArgumentException e) { Console.WriteLine(e.Message); } // Volume must be 0-100"},{"text":"`finally` always runs, error or not. Use it for cleanup like closing a file.","code":"try\n{\n    Console.WriteLine(\"Open\");\n    throw new InvalidOperationException(\"Oops\");\n}\ncatch (InvalidOperationException e)\n{\n    Console.WriteLine(e.Message);\n}\nfinally { Console.WriteLine(\"Close\"); } // Open, then Oops, then Close"},{"text":"An exception travels up through the methods that called each other until a `catch` handles it. Code after the failing call is skipped.","code":"static void C() { throw new Exception(\"deep\"); }\nstatic void B() { C(); Console.WriteLine(\"B done\"); }\n\ntry { B(); }\ncatch (Exception e) { Console.WriteLine(\"Caught: \" + e.Message); } // Caught: deep"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"static int Test()\n{\n    try\n    {\n        return 1;\n    }\n    finally\n    {\n        Console.WriteLine(\"finally\");\n    }\n}\n\nConsole.WriteLine(Test());","options":["1","1\nfinally","finally\n1"],"answer":2,"explain":"`finally` runs before the method actually returns, so it prints first. Then `Main` prints the returned 1."},{"type":"output","prompt":"What does this print?","code":"try\n{\n    Console.WriteLine(\"A\");\n    int x = int.Parse(\"12a\");\n    Console.WriteLine(\"B\");\n}\ncatch (FormatException)\n{\n    Console.WriteLine(\"C\");\n}\nConsole.WriteLine(\"D\");","options":["A\nB\nC\nD","A\nC\nD","A\nC"],"answer":1,"explain":"The throw jumps straight to `catch`, skipping `B`. After the catch, the program continues normally with `D`."},{"type":"output","prompt":"What does this print?","code":"static void Inner()\n{\n    try { throw new InvalidOperationException(\"x\"); }\n    finally { Console.WriteLine(\"inner finally\"); }\n}\n\ntry { Inner(); Console.WriteLine(\"after\"); }\ncatch (Exception e) { Console.WriteLine(\"caught \" + e.Message); }","options":["caught x\ninner finally","inner finally\nafter\ncaught x","inner finally\ncaught x"],"answer":2,"explain":"`Inner` has no catch, but its `finally` still runs as the exception leaves. Then the outer catch handles it, and `after` is skipped."},{"type":"fill","prompt":"Handle text that isn't a number","code":"___\n{\n    int n = int.Parse(text);\n}\n___ (FormatException)\n{\n    Console.WriteLine(\"Not a number\");\n}","bank":["catch","finally","try","except","throw"],"answer":["try","catch"],"explain":"The risky code goes in `try`, and `catch (FormatException)` handles that kind of error."},{"type":"bug","prompt":"This won't compile. Tap the line the compiler complains about","lines":["try { DoWork(); }","catch (Exception e) { Console.WriteLine(\"General\"); }","catch (FormatException e) { Console.WriteLine(\"Format\"); }","finally { Console.WriteLine(\"Done\"); }"],"answer":2,"explain":"`catch (Exception)` already catches everything, so the `FormatException` catch can never run. Specific catches must come first."},{"type":"mcq","prompt":"When does a `finally` block run?","options":["Only if an exception was thrown","Only if no exception was thrown","Only when you call it by name","Always, after the try (and any catch) finishes"],"answer":3,"explain":"`finally` runs whether the try succeeded, threw, or returned early. That makes it the place for cleanup."},{"type":"tf","prompt":"You can throw an exception you create yourself, like `throw new ArgumentException(\"Bad value\");`.","answer":true,"explain":"Any exception object can be thrown, including your own exception classes. The caller can then catch it."}]},{"id":"cs-a3","title":"Recursion","summary":"Methods that call themselves","teach":[{"text":"A **recursive** method calls itself on a smaller problem. A **base case** stops it, or it would never end.","code":"static void CountDown(int n)\n{\n    if (n == 0) { Console.WriteLine(\"Liftoff!\"); return; } // base case\n    Console.WriteLine(n);\n    CountDown(n - 1); // smaller problem\n}\n\nCountDown(3); // 3, 2, 1, Liftoff!"},{"text":"Classic example: factorial. 5! = 5 * 4 * 3 * 2 * 1. Each call waits for the smaller answer, then multiplies.","code":"static int Factorial(int n)\n{\n    if (n <= 1) return 1;\n    return n * Factorial(n - 1);\n}\n\nConsole.WriteLine(Factorial(5)); // 120"},{"text":"Each call sits on the **call stack** until the call it made returns. Code after the recursive call runs on the way back, so it happens in reverse order.","code":"static void Show(int n)\n{\n    if (n == 0) return;\n    Show(n - 1);\n    Console.WriteLine(n);\n}\n\nShow(3); // 1, then 2, then 3"},{"text":"With no reachable base case, calls pile up until a `StackOverflowException` crashes the program. Naive Fibonacci works, but repeats the same calls again and again.","code":"static int Fib(int n)\n{\n    if (n < 2) return n;\n    return Fib(n - 1) + Fib(n - 2);\n}\n\nConsole.WriteLine(Fib(10)); // 55\n// Fib(40) makes hundreds of millions of calls"},{"text":"Recursion suits things that contain smaller things of the same kind: folders in folders, or child objects under a GameObject in Unity. Numbers work too: a number's digits are its last digit plus the rest.","code":"static int SumDigits(int n)\n{\n    if (n < 10) return n;\n    return n % 10 + SumDigits(n / 10);\n}\n\nConsole.WriteLine(SumDigits(4096)); // 19"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"static int Sum(int n)\n{\n    if (n == 0) return 0;\n    return n + Sum(n - 1);\n}\n\nConsole.WriteLine(Sum(4));","options":["4","24","10"],"answer":2,"explain":"4 + 3 + 2 + 1 + 0 = 10. (24 would be multiplying, like factorial.)"},{"type":"output","prompt":"What does this print?","code":"static void Echo(int n)\n{\n    if (n > 2) return;\n    Console.WriteLine(\"in \" + n);\n    Echo(n + 1);\n    Console.WriteLine(\"out \" + n);\n}\n\nEcho(1);","options":["in 1\nin 2\nout 1\nout 2","in 1\nin 2\nout 2\nout 1","in 1\nout 1\nin 2\nout 2"],"answer":1,"explain":"`Echo(1)` can't print `out 1` until `Echo(2)` finishes, so the `out` lines come back in reverse order."},{"type":"output","prompt":"What does this print?","code":"static string Rev(string s)\n{\n    if (s.Length <= 1) return s;\n    return Rev(s.Substring(1)) + s[0];\n}\n\nConsole.WriteLine(Rev(\"abc\"));","options":["cba","abc","bca"],"answer":0,"explain":"`Rev(\"abc\")` is `Rev(\"bc\") + 'a'`, which is `Rev(\"c\") + 'b' + 'a'`, giving `cba`."},{"type":"fill","prompt":"Complete `Power` so `Power(2, 3)` returns 8","code":"static int Power(int b, int e)\n{\n    if (e == ___) return 1;\n    return b * Power(b, e ___ 1);\n}","bank":["1","0","+","-","*"],"answer":["0","-"],"explain":"Any number to the power 0 is 1, which is the base case. Each step lowers `e` by 1 to move toward it."},{"type":"bug","prompt":"Tap the line with the bug","lines":["static int Count(int n)","{","    if (n <= 0) return 0;","    return 1 + Count(n);","}"],"answer":3,"explain":"It calls itself with the same `n`, so it never gets closer to the base case and overflows the stack. Use `Count(n - 1)`."},{"type":"mcq","prompt":"What happens if a recursive method never reaches its base case?","options":["It fills the call stack and crashes with a StackOverflowException","It returns 0","The compiler refuses to compile it","It stops by itself after 1000 calls"],"answer":0,"explain":"The compiler can't usually spot this. At run time every call adds to the stack until it runs out of space."},{"type":"tf","prompt":"Every recursive method needs at least one path where it does not call itself.","answer":true,"explain":"That path is the base case. Without it, the calls never stop."},{"type":"mcq","prompt":"Using the naive `Fib` (`if (n < 2) return n; return Fib(n - 1) + Fib(n - 2);`), how many calls happen in total for `Fib(4)`, counting the first?","options":["4","5","9","16"],"answer":2,"explain":"Fib(4) calls Fib(3) (5 calls) and Fib(2) (3 calls), plus itself: 1 + 5 + 3 = 9. The repeats are why it gets slow."}]},{"id":"cs-a4","title":"Searching and sorting","summary":"Linear vs binary search, sorting, Big-O","teach":[{"text":"**Linear search** checks each item in turn. It works on any list, but may look at every item. That's **O(n)**: the work grows with the size.","code":"static int Find(int[] a, int target)\n{\n    for (int i = 0; i < a.Length; i++)\n        if (a[i] == target) return i;\n    return -1;\n}\n\nConsole.WriteLine(Find(new[] { 4, 9, 2 }, 2)); // 2"},{"text":"**Binary search** needs sorted data. Check the middle, then throw away the half that can't hold the target. A million items takes about 20 checks: **O(log n)**.","code":"static int BinarySearch(int[] a, int target)\n{\n    int lo = 0, hi = a.Length - 1;\n    while (lo <= hi)\n    {\n        int mid = (lo + hi) / 2;\n        if (a[mid] == target) return mid;\n        if (a[mid] < target) lo = mid + 1;\n        else hi = mid - 1;\n    }\n    return -1;\n}"},{"text":"**Bubble sort** swaps neighbors that are out of order, pass after pass. It's easy to write but **O(n²)**: twice the items means about four times the work.","code":"static void BubbleSort(int[] a)\n{\n    for (int i = 0; i < a.Length - 1; i++)\n        for (int j = 0; j < a.Length - 1 - i; j++)\n            if (a[j] > a[j + 1])\n            {\n                int tmp = a[j]; a[j] = a[j + 1]; a[j + 1] = tmp;\n            }\n}\nint[] nums = { 5, 1, 4, 2 };\nBubbleSort(nums);\nConsole.WriteLine(string.Join(\" \", nums)); // 1 2 4 5"},{"text":"Big-O in plain words: **O(1)** takes the same time at any size (array index, dictionary lookup). **O(n)** looks at each item once. **O(n log n)** is a good sort. **O(n²)** is usually a loop inside a loop. In real code, use the fast built-ins.","code":"var list = new List<int> { 3, 1, 2 };\nlist.Sort();                               // O(n log n)\nConsole.WriteLine(string.Join(\",\", list)); // 1,2,3\nConsole.WriteLine(list.BinarySearch(3));   // 2"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"int[] a = { 1, 3, 5, 7, 9, 11, 13 };\nint lo = 0, hi = a.Length - 1, target = 11;\nwhile (lo <= hi)\n{\n    int mid = (lo + hi) / 2;\n    Console.WriteLine(a[mid]);\n    if (a[mid] == target) break;\n    if (a[mid] < target) lo = mid + 1;\n    else hi = mid - 1;\n}","options":["7\n9\n11","7\n11","1\n3\n5\n7\n9\n11"],"answer":1,"explain":"First `mid` is 3 (value 7). 7 < 11, so `lo` becomes 4 and the next `mid` is 5 (value 11). Found in 2 checks."},{"type":"output","prompt":"What does this print?","code":"int[] a = { 4, 3, 2, 1 };\nfor (int j = 0; j < a.Length - 1; j++)\n{\n    if (a[j] > a[j + 1])\n    {\n        int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;\n    }\n}\nConsole.WriteLine(string.Join(\" \", a));","options":["1 2 3 4","3 4 2 1","3 2 1 4"],"answer":2,"explain":"One pass carries the largest value (4) to the end, but the rest isn't sorted yet. Bubble sort needs more passes."},{"type":"mcq","prompt":"Binary search on a sorted array of about 1,000,000 items needs roughly how many checks at most?","options":["20","1,000","500,000","1,000,000"],"answer":0,"explain":"Each check halves what's left. 2 to the 20th power is about a million, so about 20 halvings are enough."},{"type":"mcq","prompt":"Two nested loops, each going over all `n` items, usually take...","options":["O(1)","O(log n)","O(n)","O(n²)"],"answer":3,"explain":"For each of `n` items you do `n` steps, so about n times n work."},{"type":"fill","prompt":"Complete the binary search step","code":"int mid = (lo + hi) / 2;\nif (a[mid] == target) return mid;\nif (a[mid] < target) lo = ___;\nelse hi = ___;","bank":["mid","mid + 1","mid - 1","lo + 1","hi - 1"],"answer":["mid + 1","mid - 1"],"explain":"`mid` was already checked, so skip past it. Using just `mid` can get stuck in an endless loop."},{"type":"bug","prompt":"This sometimes misses a value that is in the array. Tap the line with the bug","lines":["static int Search(int[] a, int target)","{","    int lo = 0, hi = a.Length - 1;","    while (lo < hi)","    {","        int mid = (lo + hi) / 2;","        if (a[mid] == target) return mid;","        if (a[mid] < target) lo = mid + 1;","        else hi = mid - 1;","    }","    return -1;","}"],"answer":3,"explain":"When one item is left, `lo == hi` and the loop stops without checking it. `Search(new[] { 5 }, 5)` returns -1. Use `lo <= hi`."},{"type":"tf","prompt":"Binary search gives correct results on an unsorted array.","answer":false,"explain":"Throwing away half only works if the order tells you which half the target can't be in."}]},{"id":"cs-a5","title":"LINQ, delegates and events","summary":"Func, Action, lambdas, events and LINQ","teach":[{"text":"A **delegate** is a variable that holds a method. `Func<...>` returns a value (its last type is the return type). `Action<...>` returns nothing. A **lambda** like `x => x * 2` is a short method written inline.","code":"Func<int, int> twice = x => x * 2;\nFunc<int, int, int> add = (a, b) => a + b;\nAction<string> say = msg => Console.WriteLine(msg);\n\nConsole.WriteLine(twice(5));  // 10\nConsole.WriteLine(add(2, 3)); // 5\nsay(\"hi\");                    // hi"},{"text":"A method can take a delegate as a parameter. That lets the caller decide what happens at each step.","code":"static void Repeat(int times, Action<int> action)\n{\n    for (int i = 0; i < times; i++) action(i);\n}\n\nRepeat(3, i => Console.WriteLine($\"Step {i}\")); // Step 0, Step 1, Step 2"},{"text":"An **event** lets other code subscribe with `+=` and unsubscribe with `-=`. Raising it runs every subscriber in order. This is how Unity-style callbacks work, like a button click. `?.Invoke` skips the call if nobody subscribed.","code":"class Player\n{\n    public event Action<int> Damaged;\n    public void Hit(int amount) { Damaged?.Invoke(amount); }\n}\n\nvar p = new Player();\np.Damaged += dmg => Console.WriteLine($\"UI: -{dmg} HP\");\np.Damaged += dmg => Console.WriteLine(\"Play sound\");\np.Hit(10); // UI: -10 HP, then Play sound"},{"text":"**LINQ** (`using System.Linq;`) adds query methods to lists and arrays. `Where` filters, `Select` transforms, `OrderBy` sorts. They return a new sequence and leave the original alone.","code":"var scores = new List<int> { 50, 90, 70, 30 };\nvar passed = scores.Where(s => s >= 50)\n                   .OrderBy(s => s)\n                   .Select(s => $\"[{s}]\");\nConsole.WriteLine(string.Join(\" \", passed)); // [50] [70] [90]\nConsole.WriteLine(scores.Count);             // 4"},{"text":"LINQ is **lazy**: a query runs when you loop over it or call something like `Count()` or `ToList()`, so it sees the list as it is then. In Unity, avoid LINQ inside `Update()`, as it makes garbage every frame.","code":"var nums = new List<int> { 1, 2, 3 };\nvar big = nums.Where(n => n > 1); // not run yet\nnums.Add(10);\nConsole.WriteLine(big.Count());          // 3\nConsole.WriteLine(nums.Sum());           // 16\nConsole.WriteLine(nums.Any(n => n > 5)); // True\nList<int> saved = big.ToList();          // runs now, keeps a copy"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"Func<int, int> inc = x => x + 1;\nFunc<int, int> sq = x => x * x;\nConsole.WriteLine(sq(inc(3)));\nConsole.WriteLine(inc(sq(3)));","options":["16\n10","10\n16","16\n16"],"answer":0,"explain":"`inc(3)` is 4 and 4 squared is 16. `sq(3)` is 9 and 9 + 1 is 10. The inner call runs first."},{"type":"output","prompt":"What does this print?","code":"class Door\n{\n    public event Action Opened;\n    public void Open() { Opened?.Invoke(); }\n}\n\nvar door = new Door();\ndoor.Opened += () => Console.WriteLine(\"hi\");\ndoor.Opened -= () => Console.WriteLine(\"hi\");\ndoor.Open();","options":["(nothing)","hi","hi\nhi"],"answer":1,"explain":"Each lambda is a separate delegate, so `-=` with a new lambda removes nothing. Keep the handler in a variable (or use a named method) to unsubscribe."},{"type":"output","prompt":"What does this print?","code":"var list = new List<int> { 5, 1, 4 };\nvar q = list.Where(x => x > 2);\nlist.Add(8);\nlist.Remove(5);\nConsole.WriteLine(string.Join(\",\", q));","options":["5,4","5,4,8","4,8"],"answer":2,"explain":"The query is lazy. It runs at `string.Join`, when the list is 1, 4, 8, so it gives 4 and 8."},{"type":"output","prompt":"What does this print?","code":"var words = new List<string> { \"pear\", \"fig\", \"banana\" };\nvar result = words.OrderBy(w => w.Length).Select(w => w.ToUpper()[0]);\nConsole.WriteLine(string.Join(\"\", result));","options":["PFB","FPB","BPF"],"answer":1,"explain":"Sorted by length: fig (3), pear (4), banana (6). Then each becomes its first letter in uppercase."},{"type":"fill","prompt":"Keep names starting with A, then make them uppercase","code":"var names = new List<string> { \"Ava\", \"Ben\", \"Al\" };\nvar aNames = names.___(n => n.StartsWith(\"A\"))\n                  .___(n => n.ToUpper());","bank":["Select","Where","OrderBy","Filter","Map"],"answer":["Where","Select"],"explain":"`Where` keeps matching items and `Select` transforms each one. C# has no `Filter` or `Map` here."},{"type":"bug","prompt":"Calling `Finish()` crashes. Tap the line with the bug","lines":["class Timer","{","    public event Action Done;","    public void Finish() { Done(); }","}","var t = new Timer();","t.Finish();"],"answer":3,"explain":"With no subscribers, `Done` is null, so calling it throws a `NullReferenceException`. Use `Done?.Invoke();`."},{"type":"mcq","prompt":"Which delegate type fits a method that takes a `string` and returns a `bool`?","options":["Action<string, bool>","Func<bool, string>","Action<bool>","Func<string, bool>"],"answer":3,"explain":"In `Func`, the inputs come first and the **last** type is the return type. `Action` never returns a value."},{"type":"tf","prompt":"Calling `Where` on a list removes the items that don't match from that list.","answer":false,"explain":"LINQ methods return a new sequence. The original list is not changed."}]}]}},{"id":"cpp","name":"C++","blurb":"A fast, compiled language for game engines like Unreal, apps, and anything where speed matters.","setup":"Install a C++ compiler: g++ (through MSYS2 on Windows, Xcode Command Line Tools on Mac, or build-essential on Linux) or Visual Studio. Save your code as `main.cpp`, compile it with `g++ -std=c++17 main.cpp -o main`, then run `./main`.","levels":{"beginner":[{"id":"cpp-b1","title":"Your first program","summary":"Printing with std::cout, comments, and main","teach":[{"text":"A program is a list of instructions for the computer. C++ is **compiled**: a tool called a compiler (like `g++`) turns your code into a program file, and then you run that file. Here is a complete C++ program.","code":"#include <iostream>\n\nint main() {\n    std::cout << \"Hello, world!\\n\";  // Hello, world!\n    return 0;\n}"},{"text":"`#include <iostream>` loads the input/output library, so you can use `std::cout`. Every program starts running at `int main()`. The code inside its `{ }` braces runs, and `return 0;` tells the system the program finished fine.","code":"#include <iostream>   // lets us use std::cout\n\nint main() {          // the program starts here\n    // your code goes inside the braces\n    return 0;         // 0 means \"all good\"\n}"},{"text":"`std::cout <<` sends output to the screen. You can chain several `<<` in a row. `\"\\n\"` or `std::endl` starts a new line. Every statement ends with a semicolon `;`. The `std::` part means \"from the standard library\". Some code writes `using namespace std;` to skip it, but we will write `std::` to keep things clear.","code":"std::cout << \"Hi\" << \" there\" << \"\\n\";  // Hi there\nstd::cout << 7 << \"\\n\";                 // 7\nstd::cout << \"A\" << std::endl;          // A"},{"text":"**Comments** are notes for humans. The compiler ignores them. `//` comments out the rest of a line. `/* ... */` can cover several lines.","code":"// This is a comment\n/* This comment\n   spans two lines */\nstd::cout << \"Run me\";  // Run me"},{"text":"Inside `main`, statements run **top to bottom**, one after another. Change the order of the lines and you change the order of the output.","code":"std::cout << \"One\\n\";    // One\nstd::cout << \"Two\\n\";    // Two\nstd::cout << \"Three\\n\";  // Three"}],"quiz":[{"type":"mcq","prompt":"Where does every C++ program start running?","options":["At the first line of the file","At the first comment","Inside the main function","At the last #include line"],"answer":2,"explain":"Execution always begins at `int main()`. Lines like `#include` are setup for the compiler, not steps that run."},{"type":"output","prompt":"What does this print?","code":"std::cout << \"Code\";\nstd::cout << \"Quest\\n\";","options":["Code\nQuest","CodeQuest","Code Quest"],"answer":1,"explain":"There is no `\\n` after `\"Code\"`, so the next output continues on the same line with no space."},{"type":"fill","prompt":"Complete the program so it prints Hi.","code":"#include ___\n\nint main() {\n    std::cout ___ \"Hi\\n\";\n    return 0;\n}","bank":["<iostream>","<<",">>","<cout>","<-"],"answer":["<iostream>","<<"],"explain":"`<iostream>` is the library that provides `std::cout`, and `<<` pushes the text into it. `>>` is for reading input."},{"type":"bug","prompt":"Tap the line with the bug.","lines":["#include <iostream>","int main() {","    std::cout << \"Hello\\n\"","    return 0;","}"],"answer":2,"explain":"Every statement needs a semicolon at the end. The `std::cout` line is missing its `;`."},{"type":"tf","prompt":"C++ code must be compiled before it can run.","answer":true,"explain":"A compiler such as `g++` turns your `.cpp` file into a program you can run. That is part of why C++ programs are fast."},{"type":"output","prompt":"What does this print?","code":"// std::cout << \"A\\n\";\nstd::cout << \"B\\n\";\n/* std::cout << \"C\\n\"; */","options":["A\nB\nC","B","A\nB","Nothing"],"answer":1,"explain":"The first and last lines are comments, so the compiler ignores them. Only `B` is printed."},{"type":"mcq","prompt":"What does `return 0;` at the end of `main` mean?","options":["Print the number 0","Restart the program","The program finished successfully","Delete the program"],"answer":2,"explain":"Returning 0 from `main` tells the operating system the program ended without problems. It does not print anything."},{"type":"order","prompt":"Put the lines in order to make a complete program that prints Ready.","lines":["#include <iostream>","int main() {","    std::cout << \"Ready\\n\";","    return 0;","}"],"explain":"Includes come first, then `main`. Inside main the print comes before `return 0;`, because nothing after a return runs."}]},{"id":"cpp-b2","title":"Variables and types","summary":"Storing numbers, text, and true/false values","teach":[{"text":"A **variable** is a named box that holds a value. In C++ you must say what **type** of value it holds. You can change the value later with `=`.","code":"int age = 16;\nstd::cout << age << \"\\n\";  // 16\nage = 17;                  // change the value\nstd::cout << age << \"\\n\";  // 17"},{"text":"Common types: `int` for whole numbers, `double` for decimals, `bool` for true/false, `char` for one character in single quotes, and `std::string` for text in double quotes. For strings, add `#include <string>` at the top.","code":"int lives = 3;\ndouble speed = 2.5;\nbool isAlive = true;\nchar grade = 'A';\nstd::string name = \"Sam\";\nstd::cout << name << \" \" << speed;  // Sam 2.5"},{"text":"By default, `std::cout` prints a `bool` as `1` (true) or `0` (false). Add `std::boolalpha` to print the words instead.","code":"bool ready = true;\nstd::cout << ready << \"\\n\";                    // 1\nstd::cout << std::boolalpha << ready << \"\\n\";  // true"},{"text":"Naming rules: use letters, digits, and `_`. A name cannot start with a digit, cannot have spaces, and cannot be a keyword like `int`. C++ is **case sensitive**, so `score` and `Score` are different variables.","code":"int score = 10;      // ok\nint player_2 = 5;    // ok\n// int 2player = 5;  // error: starts with a digit\n// int my score = 1; // error: has a space\nint Score = 99;      // a different variable from score"},{"text":"`const` makes a value that can never change. `auto` lets the compiler pick the type from the value you give it.","code":"const int maxHealth = 100;\nauto coins = 25;     // int\nauto price = 9.99;   // double\n// maxHealth = 50;   // error: it is const\nstd::cout << coins + maxHealth;  // 125"}],"quiz":[{"type":"mcq","prompt":"Which type is the best fit for the value `3.75`?","options":["int","bool","double","char"],"answer":2,"explain":"`double` holds decimal numbers. An `int` would throw away the `.75`."},{"type":"output","prompt":"What does this print?","code":"int x = 5;\nx = x + 2;\nx = 10;\nstd::cout << x;","options":["10","7","17","5"],"answer":0,"explain":"Each `=` replaces the old value. The last assignment sets `x` to 10, so that is what prints."},{"type":"fill","prompt":"Create a text variable holding the name Alex.","code":"std::___ name = ___;","bank":["string","\"Alex\"","'Alex'","text","Alex"],"answer":["string","\"Alex\""],"explain":"Text uses the type `std::string` and goes in double quotes. Single quotes are only for one `char`."},{"type":"output","prompt":"What does this print?","code":"bool done = false;\nstd::cout << done;","options":["false","0","1","Error"],"answer":1,"explain":"Without `std::boolalpha`, `std::cout` prints `false` as `0` and `true` as `1`."},{"type":"bug","prompt":"Tap the line with the bug.","lines":["int lives = 3;","double speed = 1.5;","std::string 2ndName = \"Kai\";","bool ok = true;"],"answer":2,"explain":"Variable names cannot start with a digit. Something like `secondName` would work."},{"type":"tf","prompt":"In C++, `score` and `Score` are the same variable.","answer":false,"explain":"C++ is case sensitive, so changing one capital letter makes a completely different name."},{"type":"mcq","prompt":"What happens with this code?","code":"const int maxHp = 100;\nmaxHp = 120;","options":["maxHp becomes 120","The code does not compile","maxHp becomes 220","It prints a warning but still works"],"answer":1,"explain":"A `const` variable cannot be assigned again. The compiler stops with an error."},{"type":"output","prompt":"What does this print?","code":"char letter = 'Z';\nint count = 3;\nstd::cout << letter << count;","options":["Z 3","'Z'3","Z3","90 3"],"answer":2,"explain":"A `char` prints as the character itself, without quotes. Nothing adds a space between the two values."}]},{"id":"cpp-b3","title":"Math and text","summary":"Operators, integer division, and joining strings","teach":[{"text":"C++ has the usual math operators: `+`, `-`, `*`, `/`. The `%` operator gives the **remainder** after dividing. Normal math order applies: `*` and `/` before `+` and `-`.","code":"std::cout << 7 + 3 << \"\\n\";  // 10\nstd::cout << 7 * 3 << \"\\n\";  // 21\nstd::cout << 7 - 3 << \"\\n\";  // 4\nstd::cout << 7 % 3 << \"\\n\";  // 1"},{"text":"When **both** numbers are `int`, `/` does **integer division** and drops the decimal part. If one side is a `double`, you get a decimal answer. `static_cast<double>(a)` turns an int into a double.","code":"std::cout << 7 / 2 << \"\\n\";    // 3\nstd::cout << 7.0 / 2 << \"\\n\";  // 3.5\nint a = 7, b = 2;\nstd::cout << static_cast<double>(a) / b;  // 3.5"},{"text":"Shortcuts update a variable in place: `+=`, `-=`, `*=`, `/=`. `++` adds one and `--` subtracts one.","code":"int score = 10;\nscore += 5;   // score is now 15\nscore *= 2;   // score is now 30\nscore++;      // score is now 31\nstd::cout << score;  // 31"},{"text":"Join `std::string` values with `+`. To put a number into text, convert it with `std::to_string`.","code":"std::string first = \"Ada\";\nstd::string last = \"Lovelace\";\nstd::string full = first + \" \" + last;\nstd::cout << full << \"\\n\";  // Ada Lovelace\nint level = 4;\nstd::string msg = \"Level \" + std::to_string(level);\nstd::cout << msg << \"\\n\";   // Level 4"},{"text":"To control decimals, add `#include <iomanip>`. Then `std::fixed` with `std::setprecision(2)` prints exactly two decimal places.","code":"double price = 4.5;\nstd::cout << \"Price: \" << std::fixed << std::setprecision(2) << price;  // Price: 4.50"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"std::cout << 17 / 5 << \" \" << 17 % 5;","options":["3.4 2","3 2","3 0.4","4 2"],"answer":1,"explain":"Both numbers are ints, so `17 / 5` is 3 (the decimal is dropped). The remainder `17 % 5` is 2."},{"type":"output","prompt":"What does this print?","code":"int x = 4;\nx *= 3;\nx -= 2;\nstd::cout << x;","options":["12","14","10","6"],"answer":2,"explain":"`x *= 3` makes 12, then `x -= 2` makes 10."},{"type":"fill","prompt":"Make it print 2.5.","code":"std::cout << ___ / 2;","bank":["5.0","5","\"5\"","2"],"answer":["5.0"],"explain":"`5 / 2` is integer division and gives 2. Writing `5.0` makes it a double, so the result is 2.5."},{"type":"mcq","prompt":"Given `int s = 7;`, which line builds the text Score: 7?","options":["std::string t = \"Score: \" + s;","std::string t = \"Score: \" + std::to_string(s);","std::string t = \"Score: \" & s;","std::string t = Score: + s;"],"answer":1,"explain":"You must convert the number with `std::to_string` first. Adding an int straight to a text literal does not join them."},{"type":"output","prompt":"What does this print?","code":"std::string a = \"3\";\nstd::string b = \"4\";\nstd::cout << a + b;","options":["34","7","3 4","Error"],"answer":0,"explain":"These are strings, not numbers, so `+` joins the text: `\"3\"` followed by `\"4\"`."},{"type":"bug","prompt":"This should print 2.5. Tap the line with the bug.","lines":["int total = 5;","int count = 2;","double avg = total / count;","std::cout << avg;"],"answer":2,"explain":"`total / count` is int / int, which gives 2 before it is stored in the double. Use `static_cast<double>(total) / count`."},{"type":"tf","prompt":"`10 % 3` gives 1.","answer":true,"explain":"10 divided by 3 is 3 with a remainder of 1, and `%` gives the remainder."},{"type":"output","prompt":"What does this print?","code":"std::cout << 2 + 3 * 4;","options":["20","234","24","14"],"answer":3,"explain":"Multiplication happens first: `3 * 4` is 12, then `2 + 12` is 14."}]},{"id":"cpp-b4","title":"Decisions","summary":"Comparisons, if / else, and && || !","teach":[{"text":"Comparisons give a `bool`: `==` equal, `!=` not equal, `<`, `>`, `<=`, `>=`. Careful: `=` **assigns** a value, `==` **compares**.","code":"int hp = 30;\nstd::cout << (hp > 0) << \"\\n\";    // 1\nstd::cout << (hp == 50) << \"\\n\";  // 0"},{"text":"`if` runs a block only when its condition is true. `else` runs when it is false. The condition goes in parentheses.","code":"int hp = 0;\nif (hp > 0) {\n    std::cout << \"Alive\\n\";\n} else {\n    std::cout << \"Game over\\n\";  // Game over\n}"},{"text":"Use `else if` to check more cases. C++ checks them top to bottom and runs **only the first** block whose condition is true.","code":"int score = 72;\nif (score >= 90) {\n    std::cout << \"A\";\n} else if (score >= 70) {\n    std::cout << \"B\";  // B\n} else {\n    std::cout << \"C\";\n}"},{"text":"Combine conditions with `&&` (and: both must be true), `||` (or: at least one is true), and `!` (not: flips true and false).","code":"bool hasKey = true;\nint level = 3;\nif (hasKey && level >= 3) {\n    std::cout << \"Door opens\\n\";  // Door opens\n}\nif (!hasKey || level < 2) {\n    std::cout << \"Locked\\n\";\n}"},{"text":"A classic mistake is writing `=` inside an `if`. It assigns instead of comparing, and any non-zero number counts as true. The compiler may only warn you, so watch for it.","code":"int x = 2;\nif (x = 5) {           // bug: assigns 5, which counts as true\n    std::cout << x;    // 5\n}"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"int t = 15;\nif (t > 20) {\n    std::cout << \"hot\";\n} else if (t > 10) {\n    std::cout << \"mild\";\n} else {\n    std::cout << \"cold\";\n}","options":["mild","hot","cold","mildcold"],"answer":0,"explain":"15 is not above 20, but it is above 10, so the `else if` block runs. After that the rest of the chain is skipped."},{"type":"mcq","prompt":"Which condition checks whether `a` equals 10?","options":["a = 10","a === 10","a := 10","a == 10"],"answer":3,"explain":"`==` compares. A single `=` would assign 10 to `a`. `===` and `:=` are not C++ operators."},{"type":"fill","prompt":"Print Pass when score is at least 50 and the player did not cheat.","code":"if (score ___ 50 ___ !cheated) {\n    std::cout << \"Pass\";\n}","bank":[">=","&&",">","||","=>"],"answer":[">=","&&"],"explain":"\"At least 50\" includes 50, so use `>=`. Both conditions must be true, so join them with `&&`."},{"type":"output","prompt":"What does this print?","code":"int x = 12;\nif (x > 5 && x < 10) {\n    std::cout << \"in\";\n} else {\n    std::cout << \"out\";\n}","options":["in","out","inout"],"answer":1,"explain":"`x > 5` is true but `x < 10` is false. With `&&` both must be true, so the `else` runs."},{"type":"bug","prompt":"This should print Game over only when lives is 0. Tap the line with the bug.","lines":["int lives = 3;","if (lives = 0) {","    std::cout << \"Game over\";","}"],"answer":1,"explain":"`lives = 0` assigns 0 instead of comparing. It needs `==`."},{"type":"tf","prompt":"In an if / else if / else chain, more than one block can run.","answer":false,"explain":"Only the first block with a true condition runs. Everything after it in the chain is skipped."},{"type":"output","prompt":"What does this print?","code":"bool raining = false;\nif (!raining) {\n    std::cout << \"Go outside\";\n} else {\n    std::cout << \"Stay in\";\n}","options":["Stay in","Go outside","Go outsideStay in"],"answer":1,"explain":"`raining` is false, so `!raining` is true and the first block runs."},{"type":"order","prompt":"Put the lines in order so it prints Even for even numbers and Odd otherwise.","lines":["int n = 4;","if (n % 2 == 0) {","    std::cout << \"Even\";","} else {","    std::cout << \"Odd\";","}"],"explain":"A number is even when the remainder after dividing by 2 is 0. The `if` block handles that case and `else` handles the rest."}]},{"id":"cpp-b5","title":"Loops","summary":"while, for, break and continue","teach":[{"text":"A `while` loop repeats its block as long as the condition is true. Something inside the loop must change, or it would run forever.","code":"int count = 3;\nwhile (count > 0) {\n    std::cout << count << \" \";\n    count--;\n}\nstd::cout << \"Go!\";  // 3 2 1 Go!"},{"text":"A `for` loop puts the three parts of counting in one line: start, condition, and step. This one counts from 0 up to 4.","code":"for (int i = 0; i < 5; i++) {\n    std::cout << i << \" \";\n}\n// 0 1 2 3 4"},{"text":"You can count by any step, and you can count down. Here `i -= 5` takes 5 away each time.","code":"for (int i = 10; i >= 0; i -= 5) {\n    std::cout << i << \" \";\n}\n// 10 5 0"},{"text":"`continue` skips the rest of this round and moves to the next one. `break` leaves the loop completely.","code":"for (int i = 1; i <= 10; i++) {\n    if (i % 2 == 0) continue;  // skip even numbers\n    if (i > 7) break;          // stop the loop\n    std::cout << i << \" \";\n}\n// 1 3 5 7"},{"text":"A `do ... while` loop checks its condition at the **end**, so the body always runs at least once.","code":"int tries = 0;\ndo {\n    tries++;\n} while (tries < 3);\nstd::cout << tries;  // 3"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"for (int i = 1; i <= 3; i++) {\n    std::cout << i * 2;\n}","options":["246","123","2 4 6","24"],"answer":0,"explain":"`i` takes the values 1, 2 and 3, and each round prints `i * 2`. No spaces are printed between them."},{"type":"output","prompt":"What does this print?","code":"int n = 10;\nint steps = 0;\nwhile (n > 1) {\n    n = n / 2;\n    steps++;\n}\nstd::cout << steps;","options":["4","2","3","5"],"answer":2,"explain":"With integer division `n` goes 10, 5, 2, 1. That is three rounds before `n > 1` becomes false."},{"type":"fill","prompt":"Make the loop print 0 1 2 3 4.","code":"for (int i = 0; i ___ 5; ___) {\n    std::cout << i << \" \";\n}","bank":["<","i++","<=","i--",">"],"answer":["<","i++"],"explain":"Start at 0, keep going while `i < 5`, and add one each time. `<=` would also print 5."},{"type":"output","prompt":"What does this print?","code":"for (int i = 0; i < 6; i++) {\n    if (i == 2) continue;\n    if (i == 4) break;\n    std::cout << i;\n}","options":["0123","013","01","0135"],"answer":1,"explain":"0 and 1 print. 2 is skipped by `continue`. 3 prints. At 4, `break` ends the loop."},{"type":"bug","prompt":"This should print 5 4 3 2 1. Tap the line with the bug.","lines":["int i = 5;","while (i > 0) {","    std::cout << i << \" \";","    i++;","}"],"answer":3,"explain":"`i++` makes `i` bigger, so `i > 0` stays true forever. It should be `i--`."},{"type":"tf","prompt":"A `do ... while` loop always runs its body at least once.","answer":true,"explain":"The condition is checked after the body, so the first round always happens."},{"type":"mcq","prompt":"How many times does this print Hi?","code":"for (int i = 0; i < 10; i += 3) {\n    std::cout << \"Hi\\n\";\n}","options":["3","4","10","9"],"answer":1,"explain":"`i` takes the values 0, 3, 6 and 9. The next value, 12, fails `i < 10`. That is 4 rounds."},{"type":"order","prompt":"Put the lines in order so it adds 1 + 2 + 3 and prints 6.","lines":["int total = 0;","for (int i = 1; i <= 3; i++) {","    total += i;","}","std::cout << total;"],"explain":"Create the total first, add to it inside the loop, and print only after the loop has finished."}]}],"intermediate":[{"id":"cpp-i1","title":"Functions","summary":"Parameters, return values, and scope","teach":[{"text":"A **function** is a named, reusable block of code. You write its return type, its name, and its parameters. A function must be declared **above** the code that calls it.","code":"int add(int a, int b) {\n    return a + b;\n}\n\nint main() {\n    std::cout << add(2, 3);  // 5\n    return 0;\n}"},{"text":"If a function gives nothing back, its return type is `void`. You call it just to make something happen.","code":"void greet(std::string name) {\n    std::cout << \"Hi, \" << name << \"!\\n\";\n}\n\nint main() {\n    greet(\"Mia\");  // Hi, Mia!\n    greet(\"Leo\");  // Hi, Leo!\n    return 0;\n}"},{"text":"Variables made inside a function only exist inside that function. This is called **scope**. To get a value out, return it.","code":"int doubleIt(int x) {\n    int result = x * 2;   // result only lives in here\n    return result;\n}\n\nint main() {\n    std::cout << doubleIt(4);  // 8\n    // std::cout << result;    // error: result is unknown here\n    return 0;\n}"},{"text":"Normally a parameter is a **copy**, so changing it does not affect the caller. Add `&` to make it a **reference** to the caller's variable. Use `const std::string&` to pass big values without copying them.","code":"void addBonus(int& score) {   // & = use the original\n    score += 10;\n}\n\nint main() {\n    int s = 5;\n    addBonus(s);\n    std::cout << s;  // 15\n    return 0;\n}"},{"text":"Parameters can have **default values**. If the caller leaves that argument out, the default is used.","code":"int power(int base, int exp = 2) {\n    int result = 1;\n    for (int i = 0; i < exp; i++) result *= base;\n    return result;\n}\n// in main:\nstd::cout << power(3) << \" \" << power(2, 5);  // 9 32"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"int square(int n) {\n    return n * n;\n}\n// in main:\nstd::cout << square(3) + square(2);","options":["13","25","10","36"],"answer":0,"explain":"`square(3)` is 9 and `square(2)` is 4. Their sum is 13."},{"type":"output","prompt":"What does this print?","code":"void reset(int x) {\n    x = 0;\n}\n\nint main() {\n    int hp = 50;\n    reset(hp);\n    std::cout << hp;\n}","options":["0","50","Error"],"answer":1,"explain":"`x` is a copy of `hp`. Setting the copy to 0 does not touch `hp`. You would need `int& x` for that."},{"type":"fill","prompt":"Complete the function so it gives back the larger number.","code":"___ biggest(int a, int b) {\n    if (a > b) {\n        ___ a;\n    }\n    return b;\n}","bank":["int","return","void","print","string"],"answer":["int","return"],"explain":"The function gives back an int, so its return type is `int`, and `return` sends the value back to the caller."},{"type":"bug","prompt":"Tap the line with the bug.","lines":["int addOne(int n) {","    int result = n + 1;","    return result;","}","int main() {","    std::cout << result;","}"],"answer":5,"explain":"`result` only exists inside `addOne`. Main should call the function instead, like `std::cout << addOne(4);`."},{"type":"tf","prompt":"A variable declared inside a function can be used in `main`.","answer":false,"explain":"Local variables are only visible inside the braces where they were declared. Return a value to share it."},{"type":"output","prompt":"What does this print?","code":"void swapValues(int& a, int& b) {\n    int temp = a;\n    a = b;\n    b = temp;\n}\n\nint main() {\n    int x = 1, y = 2;\n    swapValues(x, y);\n    std::cout << x << y;\n}","options":["12","21","22","11"],"answer":1,"explain":"The parameters are references, so the function swaps the real `x` and `y`."},{"type":"mcq","prompt":"What does the `&` mean in `void heal(int& hp)`?","options":["hp is a copy of the argument","hp cannot be changed","hp must be a decimal","hp refers to the caller's original variable"],"answer":3,"explain":"`int&` is a reference. Changes to `hp` inside the function change the variable the caller passed in."},{"type":"output","prompt":"What does this print?","code":"int area(int w, int h = 1) {\n    return w * h;\n}\n// in main:\nstd::cout << area(4) << \" \" << area(4, 3);","options":["1 12","4 3","4 12","Error"],"answer":2,"explain":"`area(4)` uses the default `h = 1`, giving 4. `area(4, 3)` passes 3 for `h`, giving 12."}]},{"id":"cpp-i2","title":"Lists with std::vector","summary":"Index from 0, size, push_back, and loops","teach":[{"text":"`std::vector` is a list that can grow. Add `#include <vector>`, then say what type it holds in angle brackets. Items are numbered from **0**.","code":"std::vector<int> scores = {90, 75, 60};\nstd::cout << scores[0] << \"\\n\";  // 90\nstd::cout << scores[2] << \"\\n\";  // 60"},{"text":"`push_back` adds an item to the end. `pop_back` removes the last item. `erase` removes an item at a position. `size()` tells you how many items there are.","code":"std::vector<std::string> names = {\"Ana\", \"Ben\"};\nnames.push_back(\"Cy\");        // now: Ana Ben Cy\nnames.erase(names.begin());   // now: Ben Cy\nnames.pop_back();             // now: Ben\nstd::cout << names.size();    // 1"},{"text":"You can change an item with `v[i] = ...`. To loop with an index, go from 0 while `i < v.size()`. `size()` returns an unsigned number, so `std::size_t` is the matching type for `i`.","code":"std::vector<int> nums = {1, 2, 3};\nnums[1] = 20;\nfor (std::size_t i = 0; i < nums.size(); i++) {\n    std::cout << nums[i] << \" \";\n}\n// 1 20 3"},{"text":"A **range-based for** loop visits every item without an index. Read it as \"for each n in nums\".","code":"std::vector<int> nums = {4, 5, 6};\nint total = 0;\nfor (int n : nums) {\n    total += n;\n}\nstd::cout << total;  // 15"},{"text":"In a range-based for, each item is a copy. Write `int&` to change the real items. Reading past the end with `[]` is undefined behavior (anything can happen). `.at()` checks the index and throws an error instead.","code":"std::vector<int> nums = {1, 2, 3};\nfor (int& n : nums) {\n    n *= 10;          // & changes the real items\n}\nstd::cout << nums[2] << \"\\n\";  // 30\n// nums[5]     -> out of range: undefined behavior\n// nums.at(5)  -> throws an error you can catch"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"std::vector<int> v = {5, 10, 15, 20};\nstd::cout << v[1] + v[3];","options":["25","35","30","15"],"answer":2,"explain":"Indexes start at 0, so `v[1]` is 10 and `v[3]` is 20."},{"type":"output","prompt":"What does this print?","code":"std::vector<int> v = {1, 2, 3};\nv.push_back(4);\nv.pop_back();\nv.push_back(9);\nstd::cout << v.size() << \" \" << v.back();","options":["4 9","5 9","3 3","4 4"],"answer":0,"explain":"After the push, pop and push, the vector is {1, 2, 3, 9}: 4 items, and the last is 9."},{"type":"fill","prompt":"Loop over every name and print it.","code":"std::vector<std::string> names = {\"Ana\", \"Ben\"};\nfor (const std::string& n ___ ___) {\n    std::cout << n << \"\\n\";\n}","bank":[":","names","in","n","size"],"answer":[":","names"],"explain":"A range-based for uses a colon: `for (item : container)`. C++ does not use `in` here."},{"type":"bug","prompt":"This should add up all items. Tap the line with the bug.","lines":["std::vector<int> v = {2, 4, 6};","int sum = 0;","for (std::size_t i = 0; i <= v.size(); i++) {","    sum += v[i];","}"],"answer":2,"explain":"With `<=` the loop reaches `i == 3`, one past the last item. It should be `i < v.size()`."},{"type":"output","prompt":"What does this print?","code":"std::vector<int> v = {1, 2, 3};\nfor (int x : v) {\n    x = x * 2;\n}\nstd::cout << v[0] << v[1] << v[2];","options":["246","123","Error"],"answer":1,"explain":"`int x` is a copy of each item, so the vector is not changed. `int& x` would double the real items."},{"type":"tf","prompt":"In a vector with 5 items, the last item is at index 5.","answer":false,"explain":"Indexes go from 0 to `size() - 1`, so the last of 5 items is at index 4."},{"type":"mcq","prompt":"Which line adds 7 to the end of `std::vector<int> v`?","options":["v.add(7);","v.push_back(7);","v.append(7);","v[v.size()] = 7;"],"answer":1,"explain":"`push_back` grows the vector. Writing to `v[v.size()]` goes past the end and does not add an item."},{"type":"output","prompt":"What does this print?","code":"std::vector<std::string> words = {\"red\", \"green\", \"blue\"};\nwords[0] = \"pink\";\nstd::cout << words[0] << \" \" << words.size();","options":["red 3","pink 4","pink 3"],"answer":2,"explain":"Assigning to `words[0]` replaces the first item. It does not add a new one, so the size stays 3."}]},{"id":"cpp-i3","title":"Maps","summary":"Key/value lookup with std::map","teach":[{"text":"A `std::map` stores **key/value pairs**, like a phone book. Add `#include <map>`. Use `[]` with a key to set or read its value.","code":"std::map<std::string, int> ages;\nages[\"Mia\"] = 14;\nages[\"Leo\"] = 16;\nstd::cout << ages[\"Leo\"] << \"\\n\";  // 16"},{"text":"You can fill a map with `{key, value}` pairs. Assigning to an existing key updates it. Assigning to a new key adds it.","code":"std::map<std::string, int> stock = {{\"apple\", 3}, {\"pear\", 5}};\nstock[\"apple\"] += 2;   // update\nstock[\"kiwi\"] = 1;     // add a new key\nstd::cout << stock[\"apple\"] << \" \" << stock.size();  // 5 3"},{"text":"To check if a key exists, use `count(key)`: it gives 1 if the key is there, 0 if not. Careful: reading a missing key with `[]` **adds** it with a default value of 0.","code":"std::map<std::string, int> stock = {{\"apple\", 3}};\nif (stock.count(\"pear\") > 0) {\n    std::cout << \"have pears\\n\";\n} else {\n    std::cout << \"no pears\\n\";     // no pears\n}\nstd::cout << stock[\"plum\"] << \"\\n\";  // 0  (this adds plum!)\nstd::cout << stock.size() << \"\\n\";   // 2"},{"text":"Loop over a map with a range-based for. `const auto& [name, points]` unpacks each pair into two names. A `std::map` keeps its keys **sorted**.","code":"std::map<std::string, int> score = {{\"Zoe\", 7}, {\"Ann\", 9}};\nfor (const auto& [name, points] : score) {\n    std::cout << name << \": \" << points << \"\\n\";\n}\n// Ann: 9\n// Zoe: 7"},{"text":"`erase(key)` removes a pair. `.at(key)` reads a value but throws an error if the key is missing, instead of adding it. `std::unordered_map` (from `<unordered_map>`) works the same way and is often faster, but its order is not predictable.","code":"std::unordered_map<std::string, int> hp = {{\"orc\", 30}, {\"elf\", 20}};\nhp.erase(\"orc\");\nstd::cout << hp.size() << \"\\n\";    // 1\nstd::cout << hp.at(\"elf\") << \"\\n\"; // 20"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"std::map<std::string, int> m;\nm[\"a\"] = 1;\nm[\"b\"] = 2;\nm[\"a\"] = 5;\nstd::cout << m[\"a\"] + m[\"b\"] << \" \" << m.size();","options":["3 2","7 3","7 2","8 3"],"answer":2,"explain":"Setting `m[\"a\"]` again replaces 1 with 5. There are still only two keys, so the size is 2."},{"type":"output","prompt":"What does this print?","code":"std::map<std::string, int> m = {{\"cat\", 3}, {\"ant\", 1}, {\"bee\", 2}};\nfor (const auto& [k, v] : m) {\n    std::cout << k;\n}","options":["catantbee","antbeecat","beecatant"],"answer":1,"explain":"A `std::map` keeps its keys sorted, so the loop visits them in alphabetical order, not the order you wrote them."},{"type":"fill","prompt":"Print Found only if the key pear exists, without adding it.","code":"if (stock.___(\"pear\") > 0) {\n    std::cout << \"Found\";\n}","bank":["count","has","exists","size","get"],"answer":["count"],"explain":"`count` returns 1 if the key is in the map and 0 if not, and it never adds anything."},{"type":"bug","prompt":"Tap the line with the bug.","lines":["std::map<std::string, int> ages;","ages[\"Kim\"] = 15;","ages[16] = \"Lee\";","std::cout << ages[\"Kim\"];"],"answer":2,"explain":"The keys are strings and the values are ints. This line has them backwards: it should be `ages[\"Lee\"] = 16;`."},{"type":"output","prompt":"What does this print?","code":"std::map<std::string, int> m = {{\"x\", 1}};\nif (m[\"y\"] == 0) {\n    std::cout << \"zero \";\n}\nstd::cout << m.size();","options":["1","zero 1","zero 2","Error"],"answer":2,"explain":"Reading `m[\"y\"]` with `[]` adds the key `y` with value 0. So the check is true and the size becomes 2."},{"type":"tf","prompt":"A `std::map` keeps its keys in sorted order.","answer":true,"explain":"That is a key difference from `std::unordered_map`, which has no predictable order."},{"type":"mcq","prompt":"What does `m.at(\"missing\")` do when that key is not in the map?","options":["Returns 0","Adds the key with value 0","Throws an exception (an error)","Returns an empty string"],"answer":2,"explain":"`.at()` never adds keys. It throws `std::out_of_range` if the key is missing, unlike `[]`."},{"type":"output","prompt":"What does this print?","code":"std::vector<std::string> words = {\"hi\", \"yo\", \"hi\", \"hi\"};\nstd::map<std::string, int> counts;\nfor (co
