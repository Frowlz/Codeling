__(self):","        super.__init__(500)","print(Boss().hp)"],"answer":5,"explain":"`super` must be called with parentheses: `super().__init__(500)`. Without them you are using the `super` class itself and get a `TypeError`."},{"type":"tf","prompt":"A child class can call the parent's version of an overridden method using `super()`.","answer":true,"explain":"`super()` gives access to the parent's methods, even ones the child has overridden."},{"type":"mcq","prompt":"What does **polymorphism** mean?","options":["Different objects respond to the same method call in their own way","A class can only have one parent","Objects cannot change after they are created","Every method must call `super()`"],"answer":0,"explain":"With polymorphism you can call `shape.area()` or `pet.speak()` without caring about the exact class."}]},{"id":"py-a2","title":"Errors and exceptions","summary":"try/except, raise, else, and finally","teach":[{"text":"When something goes wrong while running, Python **raises an exception**. If nothing handles it, the program stops with an error. Common ones are `ValueError`, `TypeError`, `KeyError`, `IndexError` and `ZeroDivisionError`.","code":"print(int(\"abc\"))\n# ValueError: invalid literal for int() with base 10: 'abc'"},{"text":"Put risky code inside `try`. If an exception happens, Python jumps straight to the matching `except` block instead of crashing. Catch specific error types, not everything.","code":"try:\n    n = int(\"abc\")\n    print(\"never runs\")\nexcept ValueError:\n    print(\"Not a number!\")\n# Not a number!"},{"text":"`as e` gives you the error object. `else` runs only if no error happened. `finally` always runs, error or not, so it is the place for cleanup.","code":"try:\n    result = 10 / 0\nexcept ZeroDivisionError as e:\n    print(\"Error:\", e)\nelse:\n    print(\"Result:\", result)\nfinally:\n    print(\"Done\")\n# Error: division by zero\n# Done"},{"text":"Use `raise` to signal a problem yourself. This is how a function rejects bad input. The caller can then catch it.","code":"def set_volume(level):\n    if level < 0 or level > 10:\n        raise ValueError(\"volume must be 0-10\")\n    return level\n\ntry:\n    set_volume(42)\nexcept ValueError as e:\n    print(e)  # volume must be 0-10"},{"text":"A `with` block does cleanup for you. When you open a file with `with open(...)`, Python closes it automatically at the end of the block, even if an error happens inside.","code":"with open(\"notes.txt\", \"w\") as f:\n    f.write(\"saved\")\n# the file is closed here"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"try:\n    print(\"A\")\n    x = 1 / 0\n    print(\"B\")\nexcept ZeroDivisionError:\n    print(\"C\")","options":["A\nB\nC","A\nC","C","A\nB"],"answer":1,"explain":"`A` prints, then the division fails. Python jumps to `except` right away, so `B` is skipped."},{"type":"output","prompt":"What does this print?","code":"def f():\n    try:\n        return \"try\"\n    finally:\n        print(\"cleanup\")\n\nprint(f())","options":["cleanup\ntry","try","try\ncleanup","cleanup"],"answer":0,"explain":"`finally` runs before the function actually hands back its value, so `cleanup` prints first, then `print` shows `try`."},{"type":"output","prompt":"What does this print?","code":"try:\n    n = int(\"7\")\nexcept ValueError:\n    print(\"bad\")\nelse:\n    print(n * 2)\nfinally:\n    print(\"end\")","options":["bad\nend","14\nend","77\nend","14"],"answer":1,"explain":"`int(\"7\")` works, so `except` is skipped, `else` prints 14, and `finally` always prints `end`."},{"type":"output","prompt":"What does this print?","code":"try:\n    items = [1, 2]\n    print(items[5])\nexcept KeyError:\n    print(\"key\")\nexcept IndexError:\n    print(\"index\")","options":["key","index","key\nindex","[1, 2]"],"answer":1,"explain":"A bad list index raises `IndexError`. Python skips the `KeyError` block and runs the first one that matches."},{"type":"fill","prompt":"Complete it so it prints `b cannot be 0`","code":"def divide(a, b):\n    if b == 0:\n        ___ ValueError(\"b cannot be 0\")\n    return a / b\n\n___:\n    divide(5, 0)\nexcept ValueError as e:\n    print(e)","bank":["except","try","catch","raise","throw"],"answer":["raise","try"],"explain":"Python uses `raise` to signal an error and `try` / `except` to handle it. `throw` and `catch` come from other languages."},{"type":"bug","prompt":"This should print `Not a number`. Tap the line with the bug.","lines":["try:","    score = int(\"ten\")","except TypeError:","    print(\"Not a number\")"],"answer":2,"explain":"`int(\"ten\")` raises a `ValueError`, not a `TypeError`, so this `except` does not catch it and the program crashes."},{"type":"tf","prompt":"A `finally` block runs even when an exception is raised and not caught.","answer":true,"explain":"`finally` always runs on the way out, which makes it the right place for cleanup."},{"type":"mcq","prompt":"Which keyword do you use to signal your own error?","options":["throw","error","raise","except"],"answer":2,"explain":"`raise ValueError(\"...\")` creates and signals an exception. `except` is for catching one."}]},{"id":"py-a3","title":"Recursion","summary":"Base cases, the call stack, classic examples","teach":[{"text":"A **recursive** function calls itself. Each call works on a smaller piece of the problem, until the piece is so small it can be solved directly.","code":"def countdown(n):\n    if n == 0:\n        print(\"Go!\")\n        return\n    print(n)\n    countdown(n - 1)\n\ncountdown(3)\n# 3\n# 2\n# 1\n# Go!"},{"text":"Every recursive function needs a **base case**: a condition where it stops calling itself. Without one, it calls itself until Python gives up with a `RecursionError`.","code":"def factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\n\nprint(factorial(5))  # 120"},{"text":"Each call waits on the **call stack** until the call inside it returns. Code before the recursive call runs on the way in. Code after it runs on the way back out, in reverse order.","code":"def show(n):\n    if n == 0:\n        return\n    print(\"in\", n)\n    show(n - 1)\n    print(\"out\", n)\n\nshow(2)\n# in 2\n# in 1\n# out 1\n# out 2"},{"text":"A classic example is Fibonacci: each number is the sum of the two before it (0, 1, 1, 2, 3, 5, 8...). Recursion fits problems that contain smaller copies of themselves, like folders inside folders.","code":"def fib(n):\n    if n < 2:\n        return n\n    return fib(n - 1) + fib(n - 2)\n\nprint(fib(6))   # 8\nprint(fib(10))  # 55"},{"text":"Recursion on lists: handle the first item, then recurse on the rest. Python stops recursion at about 1000 calls deep by default, so plain loops are often better for very long inputs.","code":"def total(nums):\n    if not nums:\n        return 0\n    return nums[0] + total(nums[1:])\n\nprint(total([4, 5, 6]))  # 15"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"def f(n):\n    if n == 0:\n        return 0\n    return n + f(n - 1)\n\nprint(f(4))","options":["4","10","24","0"],"answer":1,"explain":"f(4) = 4 + 3 + 2 + 1 + 0 = 10. The base case returns 0 when n reaches 0."},{"type":"output","prompt":"What does this print?","code":"def g(n):\n    if n > 0:\n        g(n - 1)\n        print(n)\n\ng(3)","options":["3\n2\n1","0\n1\n2\n3","3","1\n2\n3"],"answer":3,"explain":"Each call recurses first and prints after, so the deepest call (n = 1) prints first on the way back out."},{"type":"output","prompt":"What does this print?","code":"def power(b, e):\n    if e == 0:\n        return 1\n    return b * power(b, e - 1)\n\nprint(power(2, 4))","options":["8","16","6","32"],"answer":1,"explain":"It multiplies 2 four times before hitting the base case: 2 * 2 * 2 * 2 * 1 = 16."},{"type":"output","prompt":"What does this print?","code":"def rev(s):\n    if s == \"\":\n        return \"\"\n    return rev(s[1:]) + s[0]\n\nprint(rev(\"abc\"))","options":["abc","cba","bca","c"],"answer":1,"explain":"Each call puts its first letter after the reversed rest: rev(\"bc\") + \"a\" = \"cb\" + \"a\"."},{"type":"fill","prompt":"Complete the factorial so it works for any n of 0 or more","code":"def factorial(n):\n    if n ___ 1:\n        return 1\n    return n * factorial(n ___ 1)\n\nprint(factorial(5))","bank":["<=","+","-","//",">="],"answer":["<=","-"],"explain":"The base case catches 0 and 1, and each call must move toward it by using `n - 1`."},{"type":"bug","prompt":"Tap the line with the bug","lines":["def count_down(n):","    if n == 0:","        return","    print(n)","    count_down(n)"],"answer":4,"explain":"The recursive call passes the same `n`, so it never reaches the base case. It should be `count_down(n - 1)`."},{"type":"tf","prompt":"A recursive function with no base case eventually raises a `RecursionError`.","answer":true,"explain":"Each call adds to the call stack. Python stops it at its recursion limit (about 1000 by default)."},{"type":"mcq","prompt":"What is the **base case** of a recursive function?","options":["The case where it stops calling itself","The first line of the function","The largest possible input","The call that starts the recursion"],"answer":0,"explain":"The base case returns an answer directly, which lets all the waiting calls finish."}]},{"id":"py-a4","title":"Algorithms","summary":"Linear vs binary search, sorting, Big-O","teach":[{"text":"An **algorithm** is a step-by-step recipe for solving a problem. **Linear search** checks each item one by one until it finds the target. It works on any list, sorted or not.","code":"def linear_search(items, target):\n    for i, item in enumerate(items):\n        if item == target:\n            return i\n    return -1\n\nprint(linear_search([7, 3, 9], 9))  # 2"},{"text":"**Binary search** only works on a **sorted** list. It checks the middle item, then throws away the half that cannot hold the target. Each step halves the work.","code":"def binary_search(items, target):\n    lo, hi = 0, len(items) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if items[mid] == target:\n            return mid\n        if items[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1\nprint(binary_search([1, 3, 5, 7, 9, 11], 7))  # 3"},{"text":"**Big-O** describes how the work grows as the input grows. Linear search is **O(n)**: twice the items, twice the work. Binary search is **O(log n)**: a million sorted items take only about 20 steps, because 2 to the 20th power is about a million.","code":"print(2 ** 20)  # 1048576"},{"text":"**Bubble sort** is a simple sort: walk through the list, swap neighbors that are in the wrong order, and repeat. It is **O(n^2)**: double the items and it does about four times the work.","code":"def bubble_sort(items):\n    n = len(items)\n    for i in range(n):\n        for j in range(n - 1 - i):\n            if items[j] > items[j + 1]:\n                items[j], items[j + 1] = items[j + 1], items[j]\n    return items\n\nprint(bubble_sort([5, 2, 8, 1]))  # [1, 2, 5, 8]"},{"text":"In real code, use the built-in sort. It is **O(n log n)** and much faster than bubble sort. `sorted()` returns a new list. `.sort()` changes the list in place and returns `None`.","code":"nums = [3, 1, 2]\nprint(sorted(nums))  # [1, 2, 3]\nprint(nums)          # [3, 1, 2]\nnums.sort(reverse=True)\nprint(nums)          # [3, 2, 1]"}],"quiz":[{"type":"mcq","prompt":"Binary search only works if the list is...","options":["sorted","short","all strings","free of duplicates"],"answer":0,"explain":"Binary search decides which half to throw away by comparing with the middle item. That only works if the items are in order."},{"type":"mcq","prompt":"At most, about how many items does binary search check in a sorted list of 1,000 items?","options":["100","500","10","1000"],"answer":2,"explain":"Each step halves what is left: 1000, 500, 250, ... down to 1 takes about 10 steps, since 2 to the 10th power is 1024."},{"type":"output","prompt":"What does this print?","code":"nums = [4, 1, 3]\nresult = nums.sort()\nprint(result)","options":["None","[1, 3, 4]","[4, 1, 3]","Error"],"answer":0,"explain":"`.sort()` sorts the list in place and returns `None`. Use `sorted(nums)` if you want a new sorted list back."},{"type":"output","prompt":"What does this print?","code":"items = [2, 4, 6, 8, 10, 12, 14]\nlo, hi = 0, len(items) - 1\nsteps = 0\nwhile lo <= hi:\n    steps += 1\n    mid = (lo + hi) // 2\n    if items[mid] == 12:\n        break\n    if items[mid] < 12:\n        lo = mid + 1\n    else:\n        hi = mid - 1\nprint(steps)","options":["2","6","3","1"],"answer":0,"explain":"Step 1 checks index 3 (8), which is too small, so `lo` moves to 4. Step 2 checks index 5, which is 12."},{"type":"output","prompt":"What does this print?","code":"def find(items, target):\n    for i, item in enumerate(items):\n        if item == target:\n            return i\n    return -1\n\nprint(find([5, 8, 5, 2], 5), find([5, 8], 9))","options":["0 -1","2 -1","0 None","[0, 2] -1"],"answer":0,"explain":"Linear search returns at the first match, index 0. When nothing matches, the loop ends and it returns -1."},{"type":"fill","prompt":"Complete the swap in bubble sort","code":"items = [9, 4]\nj = 0\nif items[j] > items[j + 1]:\n    items[j], items[j + 1] = ___, ___\nprint(items)","bank":["j","items[j]","items[j - 1]","items[j + 1]"],"answer":["items[j + 1]","items[j]"],"explain":"Python can swap two values in one line: the right side is built first, then assigned to the left side in the new order."},{"type":"bug","prompt":"Tap the line with the bug","lines":["def binary_search(items, target):","    lo, hi = 0, len(items) - 1","    while lo <= hi:","        mid = (lo + hi) // 2","        if items[mid] == target:","            return mid","        if items[mid] < target:","            lo = mid","        else:","            hi = mid - 1","    return -1"],"answer":7,"explain":"`lo = mid` does not move past the item that was just checked, so the search can get stuck forever. It must be `lo = mid + 1`."},{"type":"tf","prompt":"An O(n) algorithm does about twice as much work on 2,000 items as on 1,000 items.","answer":true,"explain":"O(n) means the work grows in a straight line with the number of items."}]},{"id":"py-a5","title":"Pythonic power tools","summary":"Comprehensions, generators, and decorators","teach":[{"text":"A **list comprehension** builds a list in one line: `[expression for item in iterable]`. Add an `if` at the end to keep only some items.","code":"squares = [n * n for n in range(5)]\nprint(squares)  # [0, 1, 4, 9, 16]\nevens = [n for n in range(10) if n % 2 == 0]\nprint(evens)    # [0, 2, 4, 6, 8]"},{"text":"A **dict comprehension** uses curly braces and `key: value`. This is a clean way to build a lookup table from a list.","code":"words = [\"cat\", \"horse\", \"ox\"]\nlengths = {w: len(w) for w in words}\nprint(lengths)  # {'cat': 3, 'horse': 5, 'ox': 2}"},{"text":"A **generator** function uses `yield` instead of `return`. Each `yield` hands out one value and pauses the function until the next value is asked for. Values are made on demand, so even a huge or endless sequence uses little memory.","code":"def count_up(limit):\n    n = 1\n    while n <= limit:\n        yield n\n        n += 1\n\nfor x in count_up(3):\n    print(x)\n# 1\n# 2\n# 3"},{"text":"Calling a generator function does not run its body yet. It returns a generator object, and `next()` runs it up to the next `yield`. A **generator expression** looks like a comprehension in parentheses.","code":"def steps():\n    print(\"start\")\n    yield 1\n    yield 2\n\ng = steps()\nprint(next(g), next(g))\nprint(sum(n * n for n in range(4)))\n# start\n# 1 2\n# 14"},{"text":"A **decorator** wraps a function to add behavior without changing its code. It takes a function and returns a new one. Writing `@name` above a `def` applies it. `*args, **kwargs` lets the wrapper accept any arguments.","code":"def shout(func):\n    def wrapper(*args, **kwargs):\n        return func(*args, **kwargs).upper() + \"!\"\n    return wrapper\n\n@shout\ndef greet(name):\n    return f\"hi {name}\"\n\nprint(greet(\"sam\"))  # HI SAM!"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"print([x * 2 for x in range(1, 4)])","options":["[0, 2, 4]","[2, 4, 6]","[2, 4, 6, 8]","[1, 2, 3, 1, 2, 3]"],"answer":1,"explain":"`range(1, 4)` is 1, 2, 3, and each one is doubled."},{"type":"output","prompt":"What does this print?","code":"def gen():\n    print(\"A\")\n    yield 1\n    print(\"B\")\n    yield 2\n\ng = gen()\nprint(\"C\")\nprint(next(g))","options":["A\nC\n1","A\nB\nC\n1","C\n1","C\nA\n1"],"answer":3,"explain":"`gen()` does not run the body. The first `next(g)` runs it up to the first `yield`, so `A` prints after `C`, and `B` never runs."},{"type":"output","prompt":"What does this print?","code":"nums = (n * n for n in range(3))\nprint(sum(nums))\nprint(sum(nums))","options":["5\n5","5\n0","5\nError","0\n0"],"answer":1,"explain":"A generator can only be used once. The first `sum` uses up 0 + 1 + 4, so the second `sum` sees nothing and gives 0."},{"type":"output","prompt":"What does this print?","code":"def twice(func):\n    def wrapper():\n        func()\n        func()\n    return wrapper\n\n@twice\ndef hello():\n    print(\"hi\")\n\nhello()","options":["hi\nhi","hi","hi\nhi\nhi","None"],"answer":0,"explain":"`@twice` replaces `hello` with `wrapper`, which calls the original function two times."},{"type":"fill","prompt":"Make it print `{'apple': 4, 'pear': 6}`","code":"prices = {\"apple\": 2, \"pear\": 3}\ndoubled = {___: ___ * 2 for name, price in prices.items()}\nprint(doubled)","bank":["prices","key","item","name","price"],"answer":["name","price"],"explain":"In a dict comprehension the part before the colon is the key and the part after is the value."},{"type":"fill","prompt":"Make `evens` a generator so it prints `[0, 2, 4, 6]`","code":"def evens(limit):\n    for n in range(0, limit, 2):\n        ___ n\n\nprint(list(evens(7)))","bank":["return","yield","print","next"],"answer":["yield"],"explain":"`yield` hands out each value and keeps the loop going. `return` would end the function after the first number."},{"type":"bug","prompt":"This should print `calling add` and then `5`. Tap the line with the bug.","lines":["def log(func):","    def wrapper(*args):","        print(\"calling\", func.__name__)","        func(*args)","    return wrapper","@log","def add(a, b):","    return a + b","print(add(2, 3))"],"answer":3,"explain":"The wrapper calls `func` but throws away its result, so `add` now returns `None`. It should be `return func(*args)`."},{"type":"order","prompt":"Put the lines in order so it prints 3, 2, 1","lines":["def countdown(n):","    while n > 0:","        yield n","        n -= 1","for x in countdown(3):","    print(x)"],"explain":"Yield the current value before subtracting. Subtracting first would print 2, 1, 0."}]}]}},{"id":"javascript","name":"JavaScript","blurb":"The language of the web: interactive websites, servers with Node.js, and browser games.","levels":{"beginner":[{"id":"js-b1","title":"Your first program","summary":"Printing output, comments, and running in order","teach":[{"text":"A program is a list of instructions the computer follows. JavaScript runs in every web browser, and on your PC with Node.js. There is no `main` function to write: the file simply runs from the first line down."},{"text":"`console.log()` prints a value to the console. Text goes inside quotes. Numbers do not need quotes. A semicolon `;` ends each statement.","code":"console.log(\"Hello, world!\"); // Hello, world!\nconsole.log(42);              // 42"},{"text":"You can print several values at once by separating them with commas. They are printed with a space between them.","code":"console.log(\"Score:\", 10);    // Score: 10\nconsole.log(\"Sum is\", 2 + 3); // Sum is 5"},{"text":"Comments are notes for humans. The computer skips them. `//` starts a one-line comment, and `/* ... */` can cover many lines.","code":"// This line is ignored\n/* So is this one,\n   and this one too */\nconsole.log(\"Only this prints\"); // Only this prints"},{"text":"Statements run in order, top to bottom. Each `console.log` prints on its own new line.","code":"console.log(\"One\");   // One\nconsole.log(\"Two\");   // Two\nconsole.log(\"Three\"); // Three"}],"quiz":[{"type":"mcq","prompt":"Which line prints `Hi` in JavaScript?","options":["log(\"Hi\");","print(\"Hi\");","console.log(\"Hi\");","echo \"Hi\";"],"answer":2,"explain":"`console.log()` is how JavaScript prints to the console. `print` and `echo` belong to other languages."},{"type":"output","prompt":"What does this print?","code":"console.log(\"A\");\n// console.log(\"B\");\nconsole.log(\"C\");","options":["A\nC","A\nB\nC","C\nA","A"],"answer":0,"explain":"The middle line starts with `//`, so it is a comment and never runs. The other two run top to bottom."},{"type":"fill","prompt":"Fill the blank so it prints `Hello`.","code":"console.___(\"Hello\");","bank":["say","print","write","log"],"answer":["log"],"explain":"The method is `console.log`. The other words are not methods of `console`."},{"type":"order","prompt":"Put the lines in order so it prints Ready, then Set, then Go!","lines":["console.log(\"Ready\");","console.log(\"Set\");","console.log(\"Go!\");"],"explain":"Code runs top to bottom, so lines print in the order they appear."},{"type":"output","prompt":"What does this print?","code":"console.log(\"Score:\", 5 + 5);","options":["Score:10","Score: 10","Score: 5 + 5","Score: 55"],"answer":1,"explain":"The math `5 + 5` is done first. Values separated by commas are printed with a space between them."},{"type":"bug","prompt":"Tap the line with the bug.","lines":["// Greet the player","console.log(\"Welcome!\");","console.log(\"Have fun!);"],"answer":2,"explain":"The last line is missing the closing quote after `Have fun!`, so the text never ends."},{"type":"tf","prompt":"JavaScript needs a `main` function before any code can run.","answer":false,"explain":"JavaScript just runs the file from top to bottom. You do not need a `main` function."},{"type":"mcq","prompt":"Which symbol starts a one-line comment in JavaScript?","options":["--","#","//","**"],"answer":2,"explain":"`//` starts a one-line comment. `/* */` is used for comments over several lines."}]},{"id":"js-b2","title":"Variables and types","summary":"Storing numbers, text and booleans with let and const","teach":[{"text":"A variable is a named box that holds a value. Use `let` for a value that will change. Use `const` for a value that should stay the same. The `=` sign puts a value in the box.","code":"let score = 0;\nscore = 10;\nconst playerName = \"Ava\";\nconsole.log(playerName, score); // Ava 10"},{"text":"The basic types are **numbers** (whole and decimal are the same type), **strings** (text in quotes) and **booleans** (`true` or `false`). `typeof` tells you a value's type.","code":"console.log(typeof 42);    // number\nconsole.log(typeof 3.5);   // number\nconsole.log(typeof \"hi\");  // string\nconsole.log(typeof true);  // boolean"},{"text":"Strings can use double quotes, single quotes or backticks. A variable that has no value yet holds `undefined`.","code":"const a = \"double quotes\";\nconst b = 'single quotes';\nlet c;\nconsole.log(c); // undefined"},{"text":"Names can use letters, digits, `_` and `$`, but cannot start with a digit. They are case sensitive, so `score` and `Score` are different. The usual style is camelCase, like `highScore`.","code":"let highScore = 100;\nlet player2 = \"Max\";\nlet Score = 5;   // a different variable from score\n// let 2player = \"Max\";  // not allowed: starts with a digit"},{"text":"You cannot give a `const` a new value. Trying to do so stops the program with an error. A good habit: use `const` by default and switch to `let` only when the value must change.","code":"const lives = 3;\nlives = 2; // TypeError: Assignment to constant variable."}],"quiz":[{"type":"mcq","prompt":"Which keyword makes a variable that cannot be given a new value?","options":["static","let","fixed","const"],"answer":3,"explain":"`const` blocks reassignment. `let` allows it."},{"type":"output","prompt":"What does this print?","code":"let x = 5;\nx = x + 2;\nconsole.log(x);","options":["5","7","x + 2","52"],"answer":1,"explain":"The right side `x + 2` is worked out first (5 + 2), then stored back in `x`."},{"type":"output","prompt":"What does this print?","code":"console.log(typeof \"42\");","options":["boolean","string","42","number"],"answer":1,"explain":"`\"42\"` is in quotes, so it is a string, even though it looks like a number."},{"type":"fill","prompt":"Fill the blank so the code works.","code":"___ coins = 0;\ncoins = 5;","bank":["let","int","number","const"],"answer":["let"],"explain":"`coins` gets a new value on the next line, so it must be declared with `let`. `int` and `number` are not keywords in JavaScript."},{"type":"bug","prompt":"Tap the line that causes an error.","lines":["const maxHealth = 100;","let health = maxHealth;","health = 80;","maxHealth = 120;"],"answer":3,"explain":"`maxHealth` was declared with `const`, so it cannot be reassigned. Changing `health` is fine because it uses `let`."},{"type":"tf","prompt":"`Score` and `score` are the same variable in JavaScript.","answer":false,"explain":"JavaScript is case sensitive, so different capital letters make different names."},{"type":"mcq","prompt":"Which is a valid variable name?","options":["player-two","playerTwo","2ndPlayer","let"],"answer":1,"explain":"Names cannot start with a digit or contain `-`, and `let` is a reserved keyword."},{"type":"output","prompt":"What does this print?","code":"let ready;\nconsole.log(ready);","options":["null","0","undefined","false"],"answer":2,"explain":"A variable declared without a value holds `undefined`."}]},{"id":"js-b3","title":"Math and text","summary":"Operators, remainder, joining strings, template literals","teach":[{"text":"JavaScript has the usual math operators. `/` always gives the exact answer, even if it has decimals. `%` gives the **remainder** after dividing.","code":"console.log(7 + 3); // 10\nconsole.log(7 - 3); // 4\nconsole.log(7 * 3); // 21\nconsole.log(7 / 2); // 3.5\nconsole.log(7 % 3); // 1"},{"text":"There is no separate whole-number division. To drop the decimal part, use `Math.floor()`. `**` raises a number to a power.","code":"console.log(Math.floor(7 / 2)); // 3\nconsole.log(2 ** 3);            // 8\nconsole.log(Math.round(4.6));   // 5"},{"text":"Shortcuts save typing. `+=` adds to a variable, `-=` subtracts, `*=` multiplies. `++` adds 1 and `--` takes away 1.","code":"let coins = 10;\ncoins += 5;  // same as coins = coins + 5\ncoins++;     // add 1\nconsole.log(coins); // 16"},{"text":"`+` also joins strings. If one side is a string, the other side is turned into text too. It works left to right, which can surprise you.","code":"console.log(\"Hello, \" + \"Ava\"); // Hello, Ava\nconsole.log(\"Level \" + 3);      // Level 3\nconsole.log(\"5\" + 2);           // 52\nconsole.log(5 + 2 + \"1\");       // 71"},{"text":"**Template literals** use backticks. Put any value or expression inside `${ }` and it is dropped into the text. This is the easiest way to build messages.","code":"const name = \"Ava\";\nconst score = 42;\nconsole.log(`${name} has ${score} points`); // Ava has 42 points\nconsole.log(`Double: ${score * 2}`);       // Double: 84"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"console.log(10 % 4);","options":["2","4","0","2.5"],"answer":0,"explain":"10 divided by 4 is 2 with 2 left over. `%` gives the leftover part."},{"type":"output","prompt":"What does this print?","code":"console.log(\"3\" + 4 + 5);","options":["345","75","12","39"],"answer":0,"explain":"`\"3\" + 4` makes the string `\"34\"`, then adding 5 makes `\"345\"`. Once it is a string, `+` keeps joining."},{"type":"output","prompt":"What does this print?","code":"console.log(3 + 4 + \"5\");","options":["35","12","345","75"],"answer":3,"explain":"Left to right: `3 + 4` is the number 7, then `7 + \"5\"` joins to make `\"75\"`."},{"type":"fill","prompt":"Fill the blank so it prints `Hi, Sam!`","code":"const who = \"Sam\";\nconsole.log(`Hi, ___!`);","bank":["$who","{who}","${who}","+who+"],"answer":["${who}"],"explain":"Inside backticks, `${ }` inserts a value. Without the `$` and braces, the text is printed as is."},{"type":"mcq","prompt":"Which expression gives `3`?","options":["7 / 2","Math.floor(7 / 2)","7 % 2","7 // 2"],"answer":1,"explain":"`7 / 2` is 3.5 and `Math.floor` rounds down to 3. In JavaScript, `//` starts a comment, so `7 // 2` is just 7."},{"type":"bug","prompt":"Tap the line with the bug.","lines":["const price = 4;","const qty = 3;","const total = price x qty;","console.log(`Total: ${total}`);"],"answer":2,"explain":"Multiplication uses `*`, not `x`."},{"type":"tf","prompt":"In JavaScript, `9 / 2` gives `4`.","answer":false,"explain":"`/` keeps the decimal part, so `9 / 2` is `4.5`. Use `Math.floor(9 / 2)` to get 4."},{"type":"output","prompt":"What does this print?","code":"let n = 5;\nn += 3;\nn *= 2;\nconsole.log(n);","options":["10","11","16","13"],"answer":2,"explain":"`n` becomes 5 + 3 = 8, then 8 * 2 = 16."}]},{"id":"js-b4","title":"Decisions","summary":"Comparisons, if / else if / else, and && || !","teach":[{"text":"Comparisons give `true` or `false`. Use `===` to check if two values are equal and `!==` for not equal. `===` checks the type too. Avoid `==`, which converts types in surprising ways.","code":"console.log(5 === 5);   // true\nconsole.log(5 === \"5\"); // false\nconsole.log(5 == \"5\");  // true\nconsole.log(3 !== 4);   // true\nconsole.log(7 >= 10);   // false"},{"text":"`if` runs a block of code only when its condition is true. `else` runs when it is false. The condition goes in round brackets and the code goes in curly braces.","code":"const health = 30;\nif (health > 50) {\n  console.log(\"Healthy\");\n} else {\n  console.log(\"Find a medkit\"); // Find a medkit\n}"},{"text":"Use `else if` to check more cases. JavaScript checks them top to bottom and runs only the **first** block whose condition is true.","code":"const score = 85;\nif (score >= 90) {\n  console.log(\"A\");\n} else if (score >= 80) {\n  console.log(\"B\"); // B\n} else {\n  console.log(\"C\");\n}"},{"text":"Combine conditions with `&&` (and: both must be true), `||` (or: at least one is true) and `!` (not: flips true and false).","code":"const hasKey = true;\nconst doorLocked = true;\nif (doorLocked && hasKey) {\n  console.log(\"Unlock the door\"); // Unlock the door\n}\nconsole.log(!hasKey);       // false\nconsole.log(false || true); // true"},{"text":"In an `if`, some values count as false: `0`, `\"\"` (empty string), `null`, `undefined` and `NaN`. Everything else counts as true.","code":"const lives = 0;\nif (lives) {\n  console.log(\"Keep playing\");\n} else {\n  console.log(\"Game over\"); // Game over\n}"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"const x = 7;\nif (x > 10) {\n  console.log(\"big\");\n} else if (x > 5) {\n  console.log(\"medium\");\n} else {\n  console.log(\"small\");\n}","options":["medium\nsmall","medium","small","big"],"answer":1,"explain":"7 is not above 10, but it is above 5. Only the first true branch runs."},{"type":"output","prompt":"What does this print?","code":"console.log(10 === \"10\");","options":["Error","false","true"],"answer":1,"explain":"`===` checks the type too. A number and a string are never strictly equal."},{"type":"fill","prompt":"Fill the blank so it prints `Go` only when both are true.","code":"if (isReady ___ hasTicket) {\n  console.log(\"Go\");\n}","bank":["and","&&","!","||"],"answer":["&&"],"explain":"`&&` means both sides must be true. `||` needs only one. `and` is not a JavaScript operator."},{"type":"bug","prompt":"Tap the line with the bug.","lines":["const age = 15;","if (age >= 13) {","  console.log(\"Welcome\");","} else (age < 13) {","  console.log(\"Too young\");","}"],"answer":3,"explain":"`else` cannot have a condition. Write `} else {` or `} else if (age < 13) {`."},{"type":"mcq","prompt":"Which expression is `true` when `n` is 15?","options":["n > 20 || n < 10","!(n === 15)","n < 15","n > 10 && n < 20"],"answer":3,"explain":"15 is above 10 and below 20, so both sides of `&&` are true."},{"type":"tf","prompt":"`===` checks both the value and the type.","answer":true,"explain":"That is why `5 === \"5\"` is false. Prefer `===` over `==`."},{"type":"order","prompt":"Put the lines in order so it prints `Cold`.","lines":["const temp = 4;","if (temp < 10) {","  console.log(\"Cold\");","} else {","  console.log(\"Warm\");","}"],"explain":"The variable comes first, then the `if` block, then `else` with its own block."},{"type":"output","prompt":"What does this print?","code":"const name = \"\";\nif (name) {\n  console.log(\"Hi \" + name);\n} else {\n  console.log(\"No name\");\n}","options":["Hi ","Error","No name","Hi name"],"answer":2,"explain":"An empty string counts as false in an `if`, so the `else` block runs."}]},{"id":"js-b5","title":"Loops","summary":"while, for, counting loops, break and continue","teach":[{"text":"A `while` loop repeats its block as long as the condition is true. Something inside must change, or the loop runs forever.","code":"let count = 1;\nwhile (count <= 3) {\n  console.log(count); // 1, then 2, then 3\n  count++;\n}"},{"text":"A `for` loop puts the three parts of a counting loop on one line: the start, the condition to keep going, and the step after each pass.","code":"for (let i = 0; i < 3; i++) {\n  console.log(i); // 0, then 1, then 2\n}"},{"text":"You can count by any step, and count down too. Just change the start, condition and step.","code":"for (let i = 10; i > 0; i -= 3) {\n  console.log(i); // 10, then 7, then 4, then 1\n}"},{"text":"`continue` skips the rest of this pass and goes to the next one. `break` leaves the loop completely.","code":"for (let i = 1; i <= 10; i++) {\n  if (i === 3) continue; // skip 3\n  if (i === 5) break;    // stop at 5\n  console.log(i);        // 1, then 2, then 4\n}"},{"text":"A common pattern: make a variable before the loop, update it inside, and use it after the loop ends.","code":"let total = 0;\nfor (let i = 1; i <= 4; i++) {\n  total += i;\n}\nconsole.log(total); // 10"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"for (let i = 0; i < 3; i++) {\n  console.log(i * 2);\n}","options":["0\n2\n4\n6","0\n2\n4","0\n1\n2","2\n4\n6"],"answer":1,"explain":"`i` takes the values 0, 1 and 2. The loop stops when `i` reaches 3. Each value is doubled."},{"type":"output","prompt":"What does this print?","code":"let n = 1;\nwhile (n < 20) {\n  n *= 3;\n}\nconsole.log(n);","options":["27","20","9","81"],"answer":0,"explain":"`n` goes 1, 3, 9, 27. At 27 the condition `n < 20` is false, so the loop stops and prints 27."},{"type":"fill","prompt":"Fill the blanks so it prints 1 to 5.","code":"for (let i = 1; i ___ 5; i___) {\n  console.log(i);\n}","bank":["++","<=","--","<",">="],"answer":["<=","++"],"explain":"Start at 1, keep going while `i <= 5`, and add 1 each time. With `<` it would stop at 4."},{"type":"output","prompt":"What does this print?","code":"for (let i = 1; i <= 5; i++) {\n  if (i % 2 === 0) continue;\n  console.log(i);\n}","options":["1\n3\n5","1","2\n4","1\n2\n3\n4\n5"],"answer":0,"explain":"Even numbers hit `continue`, which skips the `console.log`. Only odd numbers are printed."},{"type":"bug","prompt":"This loop never ends. Tap the line with the bug.","lines":["let i = 0;","while (i < 5) {","  console.log(i);","  i--;","}"],"answer":3,"explain":"`i--` makes `i` smaller, so `i < 5` stays true forever. It should be `i++`."},{"type":"order","prompt":"Put the lines in order so it prints only `6`.","lines":["let sum = 0;","for (let i = 1; i <= 3; i++) {","  sum += i;","}","console.log(sum);"],"explain":"Set up `sum` first, add inside the loop, and print once after the loop closes."},{"type":"tf","prompt":"`break` skips the rest of this pass and jumps to the next one.","answer":false,"explain":"That is `continue`. `break` leaves the loop completely."},{"type":"mcq","prompt":"How many times does this loop body run?","code":"for (let i = 0; i < 10; i += 2) { }","options":["10","4","5","6"],"answer":2,"explain":"`i` is 0, 2, 4, 6 and 8. At 10, `i < 10` is false."}]}],"intermediate":[{"id":"js-i1","title":"Functions","summary":"Defining functions, parameters, return values, scope","teach":[{"text":"A function is a named, reusable block of code. **Parameters** are the inputs listed in the brackets. You call the function by writing its name with `()`.","code":"function greet(name) {\n  console.log(`Hello, ${name}!`);\n}\ngreet(\"Ava\"); // Hello, Ava!\ngreet(\"Max\"); // Hello, Max!"},{"text":"`return` sends a value back to the caller and ends the function right away. A function without `return` gives back `undefined`.","code":"function add(a, b) {\n  return a + b;\n}\nconst sum = add(2, 3);\nconsole.log(sum);         // 5\nconsole.log(add(10, 20)); // 30"},{"text":"**Arrow functions** are a shorter way to write a function. If the body is a single expression, you can skip the braces and `return`.","code":"const square = (n) => n * n;\nconst shout = (text) => {\n  return text.toUpperCase() + \"!\";\n};\nconsole.log(square(4));    // 16\nconsole.log(shout(\"hey\")); // HEY!"},{"text":"A parameter can have a **default value**. It is used when the caller leaves that argument out.","code":"const heal = (hp, amount = 10) => hp + amount;\nconsole.log(heal(50));     // 60\nconsole.log(heal(50, 25)); // 75"},{"text":"**Scope** means where a variable can be used. Variables made inside a function (or any `{ }` block) only exist there. Code inside a function can still see variables from outside.","code":"let total = 0;\nfunction addPoints(points) {\n  const bonus = 5;\n  total += points + bonus;\n}\naddPoints(10);\nconsole.log(total); // 15\n// console.log(bonus); would fail: bonus only exists inside addPoints"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"function double(x) {\n  return x * 2;\n}\nconsole.log(double(double(3)));","options":["9","6","12","36"],"answer":2,"explain":"The inner call runs first: `double(3)` is 6. Then `double(6)` is 12."},{"type":"output","prompt":"What does this print?","code":"function sayHi() {\n  console.log(\"hi\");\n}\nconst result = sayHi();\nconsole.log(result);","options":["undefined\nhi","hi\nundefined","hi","hi\nhi"],"answer":1,"explain":"Calling `sayHi()` prints `hi`. It has no `return`, so `result` is `undefined`."},{"type":"fill","prompt":"Fill the blank to make an arrow function.","code":"const add = (a, b) ___ a + b;\nconsole.log(add(2, 3)); // 5","bank":[":","=>","->","=="],"answer":["=>"],"explain":"Arrow functions use `=>` (an equals sign and a greater-than sign)."},{"type":"bug","prompt":"This should print 12 but prints `undefined`. Tap the line with the bug.","lines":["function area(w, h) {","  const result = w * h;","}","console.log(area(3, 4));"],"answer":1,"explain":"The function works out the result but never returns it. That line should be `return w * h;`."},{"type":"output","prompt":"What does this print?","code":"let x = 1;\nfunction change() {\n  let x = 2;\n  x++;\n}\nchange();\nconsole.log(x);","options":["2","1","3","Error"],"answer":1,"explain":"The `let x` inside the function is a new, separate variable. The outer `x` is never touched."},{"type":"tf","prompt":"Code after `return` inside the same function still runs.","answer":false,"explain":"`return` ends the function immediately. Any lines after it in that function are skipped."},{"type":"output","prompt":"What does this print?","code":"const greet = (name = \"friend\") => `Hi, ${name}`;\nconsole.log(greet());\nconsole.log(greet(\"Zoe\"));","options":["Hi, undefined\nHi, Zoe","Hi, friend\nHi, Zoe","Hi, friend\nHi, friend","Hi, \nHi, Zoe"],"answer":1,"explain":"With no argument, the default `\"friend\"` is used. With an argument, that value is used instead."},{"type":"order","prompt":"Put the lines in order so it prints 15.","lines":["const triple = (n) => {","  return n * 3;","};","console.log(triple(5));"],"explain":"A function stored in a `const` must be created before it is called. Calling it earlier throws an error."}]},{"id":"js-i2","title":"Arrays","summary":"Creating arrays, indexes, length, adding and removing","teach":[{"text":"An array is an ordered list of values in square brackets. Each item has an **index**, starting at 0. `.length` tells you how many items there are.","code":"const colors = [\"red\", \"green\", \"blue\"];\nconsole.log(colors[0]);     // red\nconsole.log(colors[2]);     // blue\nconsole.log(colors.length); // 3"},{"text":"`push` adds to the end and `pop` removes from the end. `unshift` and `shift` do the same at the start. Even a `const` array can change its items. Node prints arrays like `[ 'a', 'b' ]`.","code":"const items = [\"sword\", \"shield\"];\nitems.push(\"potion\");\nconsole.log(items);       // [ 'sword', 'shield', 'potion' ]\nconst last = items.pop();\nconsole.log(last);        // potion\nitems[0] = \"axe\";\nconsole.log(items);       // [ 'axe', 'shield' ]"},{"text":"Use `for...of` to visit each item. Use a counting `for` loop when you also need the index.","code":"const scores = [10, 20, 30];\nfor (const s of scores) {\n  console.log(s); // 10, then 20, then 30\n}\nfor (let i = 0; i < scores.length; i++) {\n  console.log(i, scores[i]); // 0 10, then 1 20, then 2 30\n}"},{"text":"`includes` checks if an item is there. `indexOf` finds its position (or -1). `splice(index, count)` removes items from the middle. `join` turns the array into one string.","code":"const pets = [\"cat\", \"dog\", \"fish\"];\nconsole.log(pets.includes(\"dog\")); // true\nconsole.log(pets.indexOf(\"fish\")); // 2\npets.splice(1, 1); // remove 1 item at index 1\nconsole.log(pets.join(\", \"));      // cat, fish"},{"text":"`map` makes a new array by changing every item. `filter` makes a new array with only the items that pass a test. The original array is not changed.","code":"const nums = [1, 2, 3, 4];\nconst doubled = nums.map((n) => n * 2);\nconst evens = nums.filter((n) => n % 2 === 0);\nconsole.log(doubled); // [ 2, 4, 6, 8 ]\nconsole.log(evens);   // [ 2, 4 ]"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"const a = [\"x\", \"y\", \"z\"];\nconsole.log(a[a.length - 1]);","options":["3","undefined","y","z"],"answer":3,"explain":"The length is 3, so `a.length - 1` is 2, the index of the last item."},{"type":"output","prompt":"What does this print?","code":"const a = [1, 2, 3];\nconsole.log(a[3]);","options":["undefined","Error","3","null"],"answer":0,"explain":"Indexes go 0, 1, 2. Reading a position that does not exist gives `undefined`, not an error."},{"type":"fill","prompt":"Fill the blank to add `\"apple\"` to the end of the array.","code":"const fruits = [\"pear\"];\nfruits.___(\"apple\");","bank":["pop","append","add","push"],"answer":["push"],"explain":"`push` adds to the end. `pop` removes from the end. `add` and `append` are not array methods."},{"type":"bug","prompt":"This crashes on the last pass. Tap the line with the bug.","lines":["const names = [\"Ann\", \"Bo\", \"Cy\"];","for (let i = 0; i <= names.length; i++) {","  console.log(names[i].toUpperCase());","}"],"answer":1,"explain":"With `<=`, `i` reaches 3, and `names[3]` is `undefined`. The condition should be `i < names.length`."},{"type":"output","prompt":"What does this print?","code":"const nums = [3, 1, 2];\nnums.push(5);\nnums.shift();\nconsole.log(nums.join(\"-\"));","options":["5-3-1-2","3-1-2-5","3-1-2","1-2-5"],"answer":3,"explain":"`push` adds 5 at the end: [3, 1, 2, 5]. `shift` removes the first item, leaving [1, 2, 5]."},{"type":"output","prompt":"What does this print?","code":"const nums = [1, 2, 3, 4, 5];\nconst r = nums.filter((n) => n > 2).map((n) => n * 10);\nconsole.log(r.length, r[0]);","options":["2 30","3 30","3 3","5 10"],"answer":1,"explain":"`filter` keeps 3, 4 and 5. `map` turns them into 30, 40 and 50. That is 3 items, starting with 30."},{"type":"tf","prompt":"You can push new items onto an array declared with `const`.","answer":true,"explain":"`const` stops you from pointing the name at a different array. The array's contents can still change."},{"type":"order","prompt":"Put the lines in order so it prints each tool on its own line.","lines":["const tools = [\"axe\", \"rope\"];","for (const tool of tools) {","  console.log(tool);","}"],"explain":"Create the array first, then loop over it with `for...of`, printing inside the loop."}]},{"id":"js-i3","title":"Objects as maps","summary":"Key/value lookup with objects, plus a look at Map","teach":[{"text":"An object stores **key/value pairs** inside curly braces. Keys are names, values can be anything. Look up a value with a dot or with square brackets and a string.","code":"const prices = { apple: 1.5, bread: 3, milk: 2 };\nconsole.log(prices.apple);    // 1.5\nconsole.log(prices[\"bread\"]); // 3"},{"text":"Add a pair by assigning to a new key. Assign again to change it. `delete` removes a key.","code":"const player = { name: \"Ava\" };\nplayer.level = 2;   // add a new key\nplayer.level = 3;   // change it\ndelete player.name; // remove a key\nconsole.log(player); // { level: 3 }"},{"text":"When the key is stored in a variable, you must use square brackets. A missing key gives `undefined`. Use `in` to check if a key exists, even when its value is `0`.","code":"const stock = { apples: 4, pears: 0 };\nconst key = \"apples\";\nconsole.log(stock[key]);       // 4\nconsole.log(stock.grapes);     // undefined\nconsole.log(\"pears\" in stock); // true\nconsole.log(\"kiwi\" in stock);  // false"},{"text":"`Object.keys` gives an array of keys. `Object.entries` gives `[key, value]` pairs, which you can loop over.","code":"const ages = { Ann: 31, Bo: 25 };\nconsole.log(Object.keys(ages)); // [ 'Ann', 'Bo' ]\nfor (const [name, age] of Object.entries(ages)) {\n  console.log(`${name} is ${age}`); // Ann is 31, then Bo is 25\n}"},{"text":"JavaScript also has `Map`, a type built just for key/value data. Its keys can be any type, and `.size` gives the count. Plain objects are fine for most simple cases.","code":"const visits = new Map();\nvisits.set(\"home\", 3);\nvisits.set(\"shop\", 1);\nconsole.log(visits.get(\"home\")); // 3\nconsole.log(visits.has(\"park\")); // false\nconsole.log(visits.size);        // 2"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"const inv = { gold: 10 };\ninv.gold += 5;\ninv.gems = 2;\nconsole.log(inv.gold + inv.gems);","options":["12","17","15","NaN"],"answer":1,"explain":"`gold` becomes 15 and a new key `gems` is added with 2. 15 + 2 is 17."},{"type":"output","prompt":"What does this print?","code":"const o = { a: 1 };\nconsole.log(o.b);","options":["Error","null","0","undefined"],"answer":3,"explain":"Reading a key that does not exist gives `undefined`. It is not an error."},{"type":"fill","prompt":"Fill the blank to check if the key `\"Zoe\"` exists.","code":"const scores = { Ann: 5, Zoe: 0 };\nif (\"Zoe\" ___ scores) {\n  console.log(\"found\");\n}","bank":["in","of","has","includes"],"answer":["in"],"explain":"`\"key\" in object` checks for a key. `has` is a method on `Map`, not an operator."},{"type":"output","prompt":"What does this print?","code":"const counts = {};\nfor (const w of [\"a\", \"b\", \"a\"]) {\n  counts[w] = (counts[w] || 0) + 1;\n}\nconsole.log(counts.a, counts.b);","options":["1 1","2 1","undefined 1","2 2"],"answer":1,"explain":"The first time a word is seen, `counts[w]` is `undefined`, so `|| 0` starts it at 0. \"a\" is counted twice."},{"type":"bug","prompt":"This should print `blue`. Tap the line with the bug.","lines":["const colors = { sky: \"blue\", grass: \"green\" };","const thing = \"sky\";","console.log(colors.thing);"],"answer":2,"explain":"`colors.thing` looks for a key literally named `thing`. To use the variable's value, write `colors[thing]`."},{"type":"mcq","prompt":"Which `Map` method adds or updates a pair?","options":["put","add","push","set"],"answer":3,"explain":"`map.set(key, value)` adds or replaces a pair. `get` reads it back."},{"type":"tf","prompt":"`Object.keys(obj)` returns an array of the object's keys.","answer":true,"explain":"For example, `Object.keys({ a: 1, b: 2 })` gives `[ 'a', 'b' ]`."},{"type":"output","prompt":"What does this print?","code":"const m = new Map();\nm.set(\"x\", 1);\nm.set(\"x\", 2);\nconsole.log(m.size, m.get(\"x\"));","options":["1 2","2 2","1 1","2 1"],"answer":0,"explain":"Keys are unique. Setting `\"x\"` again replaces its value, so there is still only one pair."}]},{"id":"js-i4","title":"Working with text","summary":"String methods, slicing, and number/text conversion","teach":[{"text":"A string is a sequence of characters. Like arrays, it has `.length` and indexes from 0. `.at(-1)` reads from the end.","code":"const word = \"Hello\";\nconsole.log(word.length); // 5\nconsole.log(word[0]);     // H\nconsole.log(word.at(-1)); // o"},{"text":"Strings have many handy methods. Strings never change in place: each method returns a **new** string.","code":"const msg = \"  Game Over  \";\nconsole.log(msg.trim());               // Game Over\nconsole.log(msg.trim().toUpperCase()); // GAME OVER\nconsole.log(\"banana\".includes(\"nan\")); // true\nconsole.log(\"cat\".replace(\"c\", \"b\"));  // bat\nconsole.log(\"a-b-c\".split(\"-\"));       // [ 'a', 'b', 'c' ]"},{"text":"`slice(start, end)` copies part of a string. It includes `start` but stops **before** `end`. Leave out `end` to go to the finish. Negative numbers count from the end.","code":"const text = \"JavaScript\";\nconsole.log(text.slice(0, 4)); // Java\nconsole.log(text.slice(4));    // Script\nconsole.log(text.slice(-3));   // ipt"},{"text":"Text from a user or a file is a string, even if it looks like a number. `Number()` converts text to a number. `parseInt` reads a whole number from the start. `String()` goes the other way.","code":"const input = \"42\";\nconsole.log(input + 1);            // 421\nconsole.log(Number(input) + 1);    // 43\nconsole.log(parseInt(\"7 apples\")); // 7\nconsole.log(Number(\"abc\"));        // NaN\nconsole.log(String(99) + \"!\");     // 99!"},{"text":"For tidy output: `toFixed(n)` rounds to `n` decimal places, `padStart` adds characters at the front, and `repeat` copies a string.","code":"const price = 4.5;\nconsole.log(`$${price.toFixed(2)}`); // $4.50\nconsole.log(\"7\".padStart(3, \"0\"));   // 007\nconsole.log(\"ha\".repeat(3));         // hahaha"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"console.log(\"Unity\".slice(1, 3));","options":["ni","Un","Uni","nit"],"answer":0,"explain":"Index 1 is `n`, index 2 is `i`. `slice` stops before index 3."},{"type":"output","prompt":"What does this print?","code":"console.log(\"5\" * 2, \"5\" + 2);","options":["52 10","52 52","10 52","10 7"],"answer":2,"explain":"`*` only works on numbers, so `\"5\"` is converted to 5. `+` with a string joins text instead."},{"type":"fill","prompt":"Fill the blank so `n` is the number 13.","code":"const n = ___(\"12\") + 1;","bank":["String","int","toNumber","Number"],"answer":["Number"],"explain":"`Number(\"12\")` gives 12, and 12 + 1 is 13. `String` would make `\"121\"`. `toNumber` and `int` do not exist."},{"type":"output","prompt":"What does this print?","code":"const s = \"hello\";\ns.toUpperCase();\nconsole.log(s);","options":["undefined","hello","Hello","HELLO"],"answer":1,"explain":"String methods return a new string. The result was thrown away, and `s` itself never changes."},{"type":"bug","prompt":"This should print `Ava`. Tap the line with the bug.","lines":["const name = \"ava\";","const first = name[0].toUpperCase();","const rest = name.slice(0);","console.log(first + rest);"],"answer":2,"explain":"`slice(0)` copies the whole word, giving `Aava`. It should be `slice(1)` to skip the first letter."},{"type":"mcq","prompt":"What is `\"a,b,c\".split(\",\").length`?","options":["2","5","3","1"],"answer":2,"explain":"Splitting on commas gives `[ 'a', 'b', 'c' ]`, an array with 3 items."},{"type":"tf","prompt":"`parseInt(\"3.9\")` gives `4`.","answer":false,"explain":"`parseInt` stops reading at the dot and does not round, so it gives 3."},{"type":"output","prompt":"What does this print?","code":"const score = 7;\nconsole.log(\"Score: \" + String(score).padStart(3, \"0\"));","options":["Score: 0007","Score: 7","Score: 700","Score: 007"],"answer":3,"explain":"`padStart(3, \"0\")` adds zeros at the front until the string is 3 characters long."}]},{"id":"js-i5","title":"Classes and objects","summary":"Classes, constructors, fields, methods, instances","teach":[{"text":"A **class** is a blueprint for objects. Each object made from it is an **instance** with its own data. `new` creates an instance and runs the `constructor`. Inside, `this` means the object being built.","code":"class Player {\n  constructor(name, health) {\n    this.name = name;\n    this.health = health;\n  }\n}\nconst p1 = new Player(\"Ava\", 100);\nconsole.log(p1.name, p1.health); // Ava 100"},{"text":"**Methods** are functions that belong to the class. Inside a method, `this` is the object the method was called on.","code":"class Player {\n  constructor(name) {\n    this.name = name;\n    this.health = 100;\n  }\n  takeDamage(amount) {\n    this.health -= amount;\n  }\n}\nconst p = new Player(\"Max\");\np.takeDamage(30);\nconsole.log(p.health); // 70"},{"text":"You can declare **fields** with starting values at the top of the class. Every instance gets its own copy, so changing one does not change the others.","code":"class Counter {\n  count = 0;\n  increment() {\n    this.count++;\n  }\n}\nconst a = new Counter();\nconst b = new Counter();\na.increment();\na.increment();\nconsole.log(a.count, b.count); // 2 0"},{"text":"A field whose name starts with `#` is **private**: only code inside the class can use it. A `get` method is read like a field, without `()`.","code":"class BankAccount {\n  #balance = 0;\n  deposit(amount) { this.#balance += amount; }\n  get balance() { return this.#balance; }\n}\nconst acct = new BankAccount();\nacct.deposit(50);\nconsole.log(acct.balance); // 50"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"class Dog {\n  constructor(name) {\n    this.name = name;\n  }\n  speak() {\n    return `${this.name} says woof`;\n  }\n}\nconst d = new Dog(\"Rex\");\nconsole.log(d.speak());","options":["Rex says woof","name says woof","undefined says woof","Dog says woof"],"answer":0,"explain":"The constructor stores `\"Rex\"` in `this.name`, and `speak` reads it back through `this`."},{"type":"fill","prompt":"Fill the blank to create a `Car` object.","code":"class Car {\n  constructor(color) { this.color = color; }\n}\nconst c = ___ Car(\"red\");","bank":["create","make","new","this"],"answer":["new"],"explain":"`new` builds an instance and runs the constructor. Calling a class without `new` throws an error."},{"type":"bug","prompt":"This should print 3 but prints `undefined`. Tap the line with the bug.","lines":["class Box {","  constructor(size) {","    size = size;","  }","}","console.log(new Box(3).size);"],"answer":2,"explain":"`size = size` just reassigns the parameter. To store it on the object, write `this.size = size;`."},{"type":"output","prompt":"What does this print?","code":"class Bag {\n  items = [];\n}\nconst a = new Bag();\nconst b = new Bag();\na.items.push(\"key\");\nconsole.log(a.items.length, b.items.length);","options":["0 0","2 2","1 0","1 1"],"answer":2,"explain":"Each instance gets its own new `items` array, so pushing to `a.items` does not affect `b`."},{"type":"mcq","prompt":"Inside a method, what does `this` refer to?","options":["The global object","The last object created","The object the method was called on","The class itself"],"answer":2,"explain":"When you call `p.takeDamage(30)`, `this` inside `takeDamage` is `p`."},{"type":"tf","prompt":"A class's `constructor` runs automatically when you use `new`.","answer":true,"explain":"`new Player(...)` creates the object and passes the arguments to `constructor`."},{"type":"output","prompt":"What does this print?","code":"class Point {\n  constructor(x, y) {\n    this.x = x;\n    this.y = y;\n  }\n}\nconst p = new Point(1, 2);\nconst q = p;\nq.x = 5;\nconsole.log(p.x);","options":["undefined","2","5","1"],"answer":2,"explain":"`q = p` does not copy the object. Both names point to the same object, so a change through `q` is seen through `p`."}]}],"advanced":[{"id":"js-a1","title":"Inheritance and polymorphism","summary":"extends, super, overriding methods, polymorphism","teach":[{"text":"A class can **extend** another class. The child gets all of the parent's fields and methods, and can add more.","code":"class Enemy {\n  constructor(name) { this.name = name; }\n  attack() { return `${this.name} attacks`; }\n}\nclass Archer extends Enemy {}\nconst a = new Archer(\"Robin\");\nconsole.log(a.attack()); // Robin attacks"},{"text":"If the child has its own constructor, it must call `super(...)` to run the parent's constructor **before** it uses `this`.","code":"class Boss extends Enemy {\n  constructor(name, phase) {\n    super(name); // runs Enemy's constructor\n    this.phase = phase;\n  }\n}\nconst b = new Boss(\"Dragon\", 2);\nconsole.log(b.name, b.phase); // Dragon 2"},{"text":"A child can **override** a method by defining one with the same name. Use `super.method()` to call the parent's version inside it.","code":"class Mage extends Enemy {\n  attack() {\n    return super.attack() + \" with fire\";\n  }\n}\nconsole.log(new Mage(\"Zed\").attack()); // Zed attacks with fire"},{"text":"**Polymorphism**: code can call the same method on different objects, and each one runs its own version. `instanceof` checks if an object comes from a class or one of its children.","code":"const enemies = [new Archer(\"Robin\"), new Mage(\"Zed\")];\nfor (const e of enemies) {\n  console.log(e.attack()); // Robin attacks, then Zed attacks with fire\n}\nconsole.log(enemies[1] instanceof Enemy); // true"},{"text":"JavaScript has no `interface` keyword. Any object that has the right method will work. This is often called **duck typing**: if it quacks like a duck, treat it like a duck.","code":"const robot = {\n  attack() { return \"Robot zaps\"; },\n};\nfor (const e of [new Mage(\"Zed\"), robot]) {\n  console.log(e.attack()); // Zed attacks with fire, then Robot zaps\n}"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"class A {\n  hi() { return \"A\"; }\n}\nclass B extends A {\n  hi() { return \"B\" + super.hi(); }\n}\nconsole.log(new B().hi());","options":["AB","B","A","BA"],"answer":3,"explain":"`B`'s `hi` overrides `A`'s, but it calls `super.hi()` to get `\"A\"` and adds it after `\"B\"`."},{"type":"bug","prompt":"Creating a `Cat` throws an error. Tap the line with the bug.","lines":["class Animal {","  constructor(name) { this.name = name; }","}","class Cat extends Animal {","  constructor(name) {","    this.name = name;","    this.lives = 9;","  }","}"],"answer":5,"explain":"A child constructor must call `super(name)` before using `this`. That line should be `super(name);`."},{"type":"output","prompt":"What does this print?","code":"class Shape {\n  area() { return 0; }\n  describe() { return `area ${this.area()}`; }\n}\nclass Square extends Shape {\n  constructor(side) { super(); this.side = side; }\n  area() { return this.side * this.side; }\n}\nconsole.log(new Square(3).describe());","options":["area 0","area 9","Error","area undefined"],"answer":1,"explain":"`describe` is inherited, but `this` is the `Square`, so `this.area()` runs the `Square` version. That is polymorphism."},{"type":"fill","prompt":"Fill the blanks so `Car` inherits from `Vehicle`.","code":"class Car ___ Vehicle {\n  constructor(model) {\n    ___(model);\n  }\n}","bank":["base","extends","inherits","this","super"],"answer":["extends","super"],"explain":"`extends` sets the parent class, and `super(...)` calls the parent's constructor."},{"type":"tf","prompt":"If `Mage extends Enemy`, then `new Mage(\"Zed\") instanceof Enemy` is `true`.","answer":true,"explain":"`instanceof` checks the whole parent chain, so a `Mage` is also an `Enemy`."},{"type":"output","prompt":"What does this print?","code":"class Parent {\n  constructor() { this.type = \"P\"; }\n  who() { return this.type; }\n}\nclass Child extends Parent {\n  constructor() { super(); this.type = \"C\"; }\n}\nconsole.log(new Parent().who(), new Child().who());","options":["P P","C P","C C","P C"],"answer":3,"explain":"`super()` sets `type` to `\"P\"` first, then the `Child` constructor changes it to `\"C\"`."},{"type":"mcq","prompt":"Which is true about JavaScript?","options":["It has an `interface` keyword like C#","A class can extend several classes at once","Any object with the needed methods can be used (duck typing)","Child classes cannot override methods"],"answer":2,"explain":"JavaScript has no interfaces and allows only one parent class. Code just calls the method, so any object that has it works."},{"type":"output","prompt":"What does this print?","code":"class A {\n  constructor() { this.init(); }\n  init() { this.v = 1; }\n}\nclass B extends A {\n  init() { this.v = 2; }\n}\nconsole.log(new B().v);","options":["1","2","Error","undefined"],"answer":1,"explain":"Even inside `A`'s constructor, `this` is a `B` object, so `this.init()` runs `B`'s override."}]},{"id":"js-a2","title":"Errors and exceptions","summary":"try/catch/finally, throwing, custom error classes","teach":[{"text":"When something goes wrong, JavaScript **throws** an error. If nothing catches it, the program stops. Wrap risky code in `try`, and handle the problem in `catch`.","code":"try {\n  const data = JSON.parse(\"{bad json}\");\n} catch (err) {\n  console.log(\"Could not read:\", err.name); // Could not read: SyntaxError\n}\nconsole.log(\"Still running\"); // Still running"},{"text":"You can throw your own errors with `throw new Error(\"message\")`. The `message` property holds the text.","code":"function setVolume(v) {\n  if (v < 0 || v > 100) {\n    throw new Error(\"Volume must be 0-100\");\n  }\n  return v;\n}\ntry {\n  setVolume(150);\n} catch (err) {\n  console.log(err.message); // Volume must be 0-100\n}"},{"text":"`finally` runs after `try` and `catch`, whether or not there was an error. Use it for clean-up, like closing a file or hiding a loading screen.","code":"try {\n  console.log(\"Opening\");      // Opening\n  throw new Error(\"Disk full\");\n} catch (err) {\n  console.log(err.message);    // Disk full\n} finally {\n  console.log(\"Closing\");      // Closing\n}"},{"text":"Make your own error types by extending `Error`. Then `instanceof` lets you handle each kind differently.","code":"class NotFoundError extends Error {\n  constructor(item) {\n    super(`${item} not found`);\n    this.name = \"NotFoundError\";\n  }\n}\ntry {\n  throw new NotFoundError(\"Key\");\n} catch (err) {\n  if (err instanceof NotFoundError) console.log(err.message); // Key not found\n}"},{"text":"Common built-in errors: `TypeError` (using a value the wrong way, like reading from `undefined`), `ReferenceError` (a name that does not exist) and `SyntaxError`. The `?.` operator safely skips a missing object.","code":"const player = undefined;\ntry {\n  player.jump();\n} catch (err) {\n  console.log(err.name); // TypeError\n}\nconsole.log(player?.name); // undefined"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"try {\n  console.log(\"A\");\n  throw new Error(\"B\");\n  console.log(\"C\");\n} catch (e) {\n  console.log(e.message);\n} finally {\n  console.log(\"D\");\n}","options":["A\nB\nC\nD","A\nC\nB\nD","A\nB\nD","A\nB"],"answer":2,"explain":"`throw` jumps straight to `catch`, so `C` is skipped. `finally` always runs at the end."},{"type":"output","prompt":"What does this print?","code":"function f() {\n  try {\n    return \"try\";\n  } finally {\n    console.log(\"finally\");\n  }\n}\nconsole.log(f());","options":["finally\ntry","try","finally","try\nfinally"],"answer":0,"explain":"`finally` runs before the function actually hands back its value, so `finally` prints first, then the caller prints `try`."},{"type":"fill","prompt":"Fill the blank so the function stops with an error.","code":"function setName(name) {\n  if (!name) ___ new Error(\"Name required\");\n  return name;\n}","bank":["throw","return","catch","raise"],"answer":["throw"],"explain":"`throw` raises the error. `return` would just hand the error object back as a normal value. `raise` is from Python."},{"type":"bug","prompt":"This should print `Out of ammo`. Tap the line with the bug.","lines":["try {","  throw new Error(\"Out of ammo\");","} catch (err) {","  console.log(err.msg);","}"],"answer":3,"explain":"The error's text is in `err.message`. `err.msg` does not exist, so it prints `undefined`."},{"type":"output","prompt":"What does this print?","code":"try {\n  null.x;\n} catch (e) {\n  console.log(e instanceof TypeError);\n}","options":["Error","null","true","false"],"answer":2,"explain":"Reading a property from `null` throws a `TypeError`, which `catch` receives."},{"type":"tf","prompt":"`finally` runs only when no error was thrown.","answer":false,"explain":"`finally` runs every time, error or not. That is what makes it good for clean-up."},{"type":"output","prompt":"What does this print?","code":"class GameError extends Error {}\ntry {\n  throw new GameError(\"oops\");\n} catch (e) {\n  console.log(e instanceof Error, e.name);\n}","options":["true GameError","false GameError","false Error","true Error"],"answer":3,"explain":"A `GameError` is also an `Error`. But `name` comes from `Error` unless you set it yourself, so it is still `\"Error\"`."}]},{"id":"js-a3","title":"Recursion","summary":"Base cases, the call stack, classic recursive problems","teach":[{"text":"A **recursive** function calls itself on a smaller version of the problem. It needs a **base case**: a simple case where it stops calling itself.","code":"function countdown(n) {\n  if (n === 0) {\n    console.log(\"Liftoff!\");\n    return;\n  }\n  console.log(n);\n  countdown(n - 1);\n}\ncountdown(3); // 3, then 2, then 1, then Liftoff!"},{"text":"Factorial is a classic example: 5! = 5 x 4 x 3 x 2 x 1. Each call handles one number and trusts the next call to handle the rest.","code":"function factorial(n) {\n  if (n <= 1) return 1;        // base case\n  return n * factorial(n - 1); // recursive case\n}\nconsole.log(factorial(5)); // 120"},{"text":"Each call waits on the **call stack** until the call it made returns. `factorial(3)` waits for `factorial(2)`, which waits for `factorial(1)`. Then the answers flow back up.","code":"// factorial(3)\n// = 3 * factorial(2)\n// = 3 * (2 * factorial(1))\n// = 3 * (2 * 1)\n// = 6"},{"text":"Without a base case, calls pile up until the stack runs out of room. JavaScript then throws `RangeError: Maximum call stack size exceeded`.","code":"function forever(n) {\n  return forever(n + 1); // no base case!\n}\ntry {\n  forever(0);\n} catch (err) {\n  console.log(err.name); // RangeError\n}"},{"text":"Recursion fits problems that contain smaller copies of themselves, like Fibonacci numbers (each is the sum of the two before). This simple version is slow for big `n`, because it repeats the same work many times.","code":"function fib(n) {\n  if (n < 2) return n;\n  return fib(n - 1) + fib(n - 2);\n}\nconsole.log(fib(7)); // 13"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"function f(n) {\n  if (n === 0) return 0;\n  return n + f(n - 1);\n}\nconsole.log(f(4));","options":["10","24","0","4"],"answer":0,"explain":"f(4) = 4 + 3 + 2 + 1 + 0 = 10. The base case returns 0."},{"type":"output","prompt":"What does this print?","code":"function show(n) {\n  if (n === 0) return;\n  show(n - 1);\n  console.log(n);\n}\nshow(3);","options":["3","1\n2\n3","3\n2\n1","0\n1\n2\n3"],"answer":1,"explain":"Each call recurses **before** printing. The deepest call (`n` = 1) finishes first, so the numbers print on the way back up."},{"type":"fill","prompt":"Fill the blanks so `power(2, 3)` returns 8.","code":"function power(base, exp) {\n  if (exp === ___) return 1;\n  return base * power(base, ___);\n}","bank":["exp","0","exp + 1","exp - 1","1"],"answer":["0","exp - 1"],"explain":"Any number to the power 0 is 1, which is the base case. Each step lowers `exp` by 1 to move toward it."},{"type":"bug","prompt":"Calling `fact(3)` never finishes. Tap the line with the bug.","lines":["function fact(n) {","  if (n === 1) return 1;","  return n * fact(n);","}"],"answer":2,"explain":"`fact(n)` calls itself with the same `n`, so it never reaches the base case. It should be `fact(n - 1)`."},{"type":"tf","prompt":"A recursive function with no base case will eventually crash.","answer":true,"explain":"Each call adds to the call stack. With no stopping point, the stack overflows and throws a `RangeError`."},{"type":"mcq","prompt":"What error does JavaScript throw when recursion goes too deep?","options":["RangeError","SyntaxError","TypeError","StackError"],"answer":0,"explain":"The message is `Maximum call stack size exceeded`, and the type is `RangeError`. There is no `StackError` type."},{"type":"output","prompt":"What does this print?","code":"function rev(s) {\n  if (s === \"\") return \"\";\n  return rev(s.slice(1)) + s[0];\n}\nconsole.log(rev(\"abc\"));","options":["cab","cba","bca","abc"],"answer":1,"explain":"Each call puts the first letter **after** the reversed rest: rev(\"abc\") = rev(\"bc\") + \"a\" = (\"c\" + \"b\") + \"a\"."},{"type":"output","prompt":"What does this print?","code":"function fib(n) {\n  if (n < 2) return n;\n  return fib(n - 1) + fib(n - 2);\n}\nconsole.log(fib(6));","options":["5","6","13","8"],"answer":3,"explain":"The sequence goes 0, 1, 1, 2, 3, 5, 8. `fib(6)` is the item at index 6, which is 8."}]},{"id":"js-a4","title":"Algorithms","summary":"Linear and binary search, a simple sort, Big-O","teach":[{"text":"**Linear search** checks each item from the start until it finds the target. It works on any array. It returns -1 if the target is not there.","code":"function linearSearch(arr, target) {\n  for (let i = 0; i < arr.length; i++) {\n    if (arr[i] === target) return i;\n  }\n  return -1;\n}\nconsole.log(linearSearch([7, 3, 9, 4], 9)); // 2\nconsole.log(linearSearch([7, 3, 9, 4], 5)); // -1"},{"text":"**Binary search** only works on a **sorted** array. It checks the middle item, then throws away the half that cannot hold the target. It repeats until it finds it or runs out.","code":"function binarySearch(arr, target) {\n  let low = 0;\n  let high = arr.length - 1;\n  while (low <= high) {\n    const mid = Math.floor((low + high) / 2);\n    if (arr[mid] === target) return mid;\n    if (arr[mid] < target) low = mid + 1;\n    else high = mid - 1;\n  }\n  return -1;\n}\nconsole.log(binarySearch([1, 3, 5, 7, 9, 11], 7)); // 3"},{"text":"**Bubble sort** walks through the array and swaps neighbours that are in the wrong order. After each pass, the biggest remaining item has bubbled to the end.","code":"function bubbleSort(arr) {\n  for (let i = 0; i < arr.length - 1; i++) {\n    for (let j = 0; j < arr.length - 1 - i; j++) {\n      if (arr[j] > arr[j + 1]) {\n        [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]]; // swap\n      }\n    }\n  }\n  return arr;\n}\nconsole.log(bubbleSort([5, 2, 4, 1])); // [ 1, 2, 4, 5 ]"},{"text":"In real code, use the built-in `sort`. Careful: by default it compares items **as text**, so `10` comes before `9`. Pass a compare function to sort numbers.","code":"console.log([10, 9, 1].sort());                // [ 1, 10, 9 ]\nconsole.log([10, 9, 1].sort((a, b) => a - b)); // [ 1, 9, 10 ]"},{"text":"**Big-O** describes how the work grows as the input grows. **O(1)**: same time always, like `arr[0]`. **O(log n)**: halves the work each step, like binary search. **O(n)**: grows with the size, like linear search. **O(n²)**: a loop inside a loop, like bubble sort.","code":"// 1,000,000 sorted items, worst case:\n// linear search: up to 1,000,000 checks\n// binary search: about 20 checks"}],"quiz":[{"type":"mcq","prompt":"What must be true before you can use binary search?","options":["The array has an even length","The array is sorted","The items are strings","The target is in the array"],"answer":1,"explain":"Binary search decides which half to throw away by comparing to the middle item. That only works if the array is in order."},{"type":"output","prompt":"What does this print?","code":"console.log([3, 20, 100].sort());","options":["[ 20, 3, 100 ]","[ 100, 20, 3 ]","[ 100, 3, 20 ]","[ 3, 20, 100 ]"],"answer":1,"explain":"Without a compare function, `sort` compares text. As text, `\"100\"` < `\"20\"` < `\"3\"`, because it compares the first character."},{"type":"fill","prompt":"Fill the blanks to finish the binary search step.","code":"if (arr[mid] < target) low = mid ___;\nelse high = mid ___;","bank":["* 2","- 1","+ 1","/ 2"],"answer":["+ 1","- 1"],"explain":"If the middle is too small, search the right half (start after `mid`). Otherwise search the left half (end before `mid`)."},{"type":"mcq","prompt":"Two nested loops each go over all `n` items. What is the Big-O?","options":["O(n²)","O(1)","O(n)","O(log n)"],"answer":0,"explain":"For each of the `n` outer passes, the inner loop does `n` steps, giving `n x n` work."},{"type":"bug","prompt":"This search says -1 for items that are in the array. Tap the line with the bug.","lines":["function find(arr, target) {","  for (let i = 0; i < arr.length; i++) {","    if (arr[i] === target) return i;","    else return -1;","  }","}"],"answer":3,"explain":"It gives up after checking only the first item. `return -1` belongs after the loop, once every item has been checked."},{"type":"output","prompt":"What does this print?","code":"let n = 64;\nlet steps = 0;\nwhile (n > 1) {\n  n = n / 2;\n  steps++;\n}\nconsole.log(steps);","options":["6","8","64","32"],"answer":0,"explain":"64, 32, 16, 8, 4, 2, 1 is 6 halvings. This is why halving algorithms like binary search are O(log n)."},{"type":"tf","prompt":"Doubling the size of an array roughly doubles the work for linear search.","answer":true,"explain":"Linear search is O(n): in the worst case it checks every item, so twice the items means about twice the checks."},{"type":"order","prompt":"Put the lines in order to swap the two numbers so it prints `[ 3, 8 ]`.","lines":["const nums = [8, 3];","const temp = nums[0];","nums[0] = nums[1];","nums[1] = temp;","console.log(nums);"],"explain":"Save the first value in `temp` before it is overwritten, then copy the second into the first, then put `temp` into the second."}]},{"id":"js-a5","title":"Async JavaScript","summary":"Callbacks, promises, async/await, the event loop","teach":[{"text":"Some work takes time, like loading a file or talking to a server. JavaScript does not stop and wait. It hands over a **callback** function to run later, and moves on to the next line.","code":"console.log(\"Start\"); // Start (1st)\nsetTimeout(() => {\n  console.log(\"Timer done\"); // Timer done (3rd, after 1 second)\n}, 1000);\nconsole.log(\"End\"); // End (2nd)"},{"text":"A **promise** is a value that will arrive later. It starts **pending**, then is either **fulfilled** with a value or **rejected** with an error. `.then()` handles the value and `.catch()` handles errors.","code":"const loadScore = () => new Promise((resolve, reject) => {\n  setTimeout(() => resolve(42), 100);\n});\nloadScore()\n  .then((score) => console.log(\"Score:\", score)) // Score: 42\n  .catch((err) => console.log(\"Failed:\", err.message));"},{"text":"`async`/`await` lets you write promise code that reads top to bottom. `await` pauses only this `async` function until the promise settles. Errors are handled with a normal `try/catch`.","code":"async function showScore() {\n  try {\n    const score = await loadScore();\n    console.log(\"Score:\", score); // Score: 42\n  } catch (err) {\n    console.log(\"Failed:\", err.message);\n  }\n}\nshowScore();"},{"text":"The **event loop** decides what runs when. First, all normal (sync) code finishes. Then promise callbacks run. Then timer callbacks run, even with a 0 ms delay.","code":"console.log(\"1 sync\");\nsetTimeout(() => console.log(\"4 timeout\"), 0);\nPromise.resolve().then(() => console.log(\"3 promise\"));\nconsole.log(\"2 sync\");\n// Output: 1 sync, 2 sync, 3 promise, 4 timeout"},{"text":"Several `await`s in a row run one after another. `Promise.all` starts tasks together and waits for all of them. The results keep the original order, not the finishing order.","code":"const wait = (ms, value) => new Promise((r) => setTimeout(() => r(value), ms));\nasync function main() {\n  const [a, b] = await Promise.all([wait(300, \"map\"), wait(100, \"sounds\")]);\n  console.log(a, b); // map sounds\n}\nmain();"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"console.log(\"A\");\nsetTimeout(() => console.log(\"B\"), 0);\nPromise.resolve().then(() => console.log(\"C\"));\nconsole.log(\"D\");","options":["A\nD\nC\nB","A\nC\nD\nB","A\nD\nB\nC","A\nB\nC\nD"],"answer":0,"explain":"Sync logs (`A`, `D`) run first. Then promise callbacks (`C`), then timers (`B`), even with a 0 ms delay."},{"type":"output","prompt":"What does this print?","code":"async function f() {\n  console.log(\"1\");\n  await null;\n  console.log(\"3\");\n}\nf();\nconsole.log(\"2\");","options":["1\n2","1\n2\n3","1\n3\n2","2\n1\n3"],"answer":1,"explain":"An `async` function runs normally until its first `await`. Then it pauses, the caller continues and prints `2`, and later `f` resumes."},{"type":"fill","prompt":"Fill the blank so `data` holds the result, not a promise.","code":"async function load() {\n  const data = ___ getData();\n  console.log(data);\n}","bank":["async","await","then","wait"],"answer":["await"],"explain":"`await` waits for the promise and gives you its value. It only works inside an `async` function."},{"type":"bug","prompt":"`getName` should return the user's name, but it gives `undefined`. Tap the line with the bug.","lines":["async function getName() {","  const user = fetchUser();","  return user.name;","}"],"answer":1,"explain":"`fetchUser()` returns a promise, and a promise has no `name`. It should be `const user = await fetchUser();`."},{"type":"output","prompt":"What does this print?","code":"Promise.resolve(2)\n  .then((x) => x * 3)\n  .then((x) => console.log(x));","options":["undefined","2","6","5"],"answer":2,"explain":"Each `.then` receives what the previous one returned. 2 becomes 6, which the last `.then` prints."},{"type":"tf","prompt":"`setTimeout(fn, 0)` runs `fn` right away, before the next line of code.","answer":false,"explain":"The callback waits in a queue until all current code (and any promise callbacks) are done, even with a 0 ms delay."},{"type":"output","prompt":"What does this print?","code":"async function f() {\n  throw new Error(\"oops\");\n}\nf().catch((e) => console.log(\"caught\", e.message));\nconsole.log(\"after\");","options":["after\ncaught oops","caught oops\nafter","Error: oops","after"],"answer":0,"explain":"An error in an `async` function rejects its promise instead of crashing. The `.catch` callback runs later, after the sync `console.log`."},{"type":"mcq","prompt":"`a()` takes 2 seconds and `b()` takes 3 seconds. About how long does `await Promise.all([a(), b()])` take?","options":["2 seconds","5 seconds","3 seconds","6 seconds"],"answer":2,"explain":"Both start at the same time, so you wait for the slowest one. Awaiting them one after another would take 5 seconds."}]}]}},{"id":"java","name":"Java","blurb":"A strongly typed language for Android apps, big business
