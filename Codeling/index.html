error. It returns `true` plus the results, or `false` plus the error message. Note: you pass the function and its arguments separately.","code":"local ok, result = pcall(withdraw, 10, 3)\nprint(ok)      -- true\nprint(result)  -- 7\nlocal ok2, err = pcall(withdraw, 10, 50)\nprint(ok2)     -- false\nprint(err)     -- main.lua:3: not enough money"},{"text":"Give `error` a second argument of `0` to leave out the file and line. You can also raise a **table** as the error, which lets you carry extra details.","code":"local ok, err = pcall(function()\n  error(\"bad input\", 0)\nend)\nprint(err)  -- bad input\n\nok, err = pcall(function()\n  error({code = 404})\nend)\nprint(err.code)  -- 404"},{"text":"`assert(value, message)` returns `value` when it is truthy, and raises an error with `message` when it is `false` or `nil`. It is a quick way to check results like `tonumber`.","code":"local n = assert(tonumber(\"42\"), \"not a number\")\nprint(n)  -- 42\nlocal ok, err = pcall(function()\n  return assert(tonumber(\"abc\"), \"not a number\")\nend)\nprint(ok)  -- false"},{"text":"Lua has no `finally`. To make cleanup always run, call the risky work with `pcall`, do the cleanup, and then pass the error on with `error(err, 0)`. The `0` keeps the original message unchanged.","code":"local function withLock(work)\n  print(\"lock\")\n  local ok, err = pcall(work)\n  print(\"unlock\")  -- always runs\n  if not ok then error(err, 0) end\nend\nlocal ok, err = pcall(withLock, function() error(\"boom\", 0) end)\nprint(err)\n-- lock\n-- unlock\n-- boom"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"local ok, msg = pcall(function()\n  error(\"oops\", 0)\nend)\nprint(ok)\nprint(msg)","options":["true\noops","false\noops","false\nnil","Error"],"answer":1,"explain":"`pcall` catches the error, so the program keeps going. It returns `false` and the message."},{"type":"output","prompt":"What does this print?","code":"local function risky()\n  print(\"A\")\n  error(\"fail\")\n  print(\"B\")\nend\nlocal ok = pcall(risky)\nprint(\"C\")\nprint(ok)","options":["A\nB\nC\nfalse","A\nC\ntrue","A\nC\nfalse","Error"],"answer":2,"explain":"`error` stops `risky` right away, so B never prints. `pcall` catches it, the program continues with C, and `ok` is false."},{"type":"output","prompt":"What does this print?","code":"local function divide(a, b)\n  if b == 0 then error(\"divide by zero\", 0) end\n  return a // b\nend\nlocal ok, r = pcall(divide, 9, 2)\nprint(r)\nok, r = pcall(divide, 1, 0)\nprint(r)","options":["4\ndivide by zero","4.5\ndivide by zero","4\nfalse","4\nnil"],"answer":0,"explain":"On success the second value is the result, 9 // 2 = 4. On failure it is the error message."},{"type":"output","prompt":"What does this print?","code":"local ok, e = pcall(function()\n  error({msg = \"low hp\", hp = 3})\nend)\nprint(type(e) .. \" \" .. e.hp)","options":["string 3","Error","table nil","table 3"],"answer":3,"explain":"An error value can be any type. `pcall` hands back the same table, so `e.hp` is 3."},{"type":"fill","prompt":"Catch the error and print its message.","code":"local ok, err = ___(function()\n  ___(\"something broke\", 0)\nend)\nprint(err)","bank":["pcall","error","try","throw","catch"],"answer":["pcall","error"],"explain":"`error` raises and `pcall` catches. Lua has no `try`, `throw` or `catch` keywords."},{"type":"bug","prompt":"This should catch the error and print missing map. Tap the line with the bug.","lines":["local function loadLevel(name)","  error(\"missing \" .. name, 0)","end","local ok, err = pcall(loadLevel(\"map\"))","print(err)"],"answer":3,"explain":"`loadLevel(\"map\")` runs before `pcall` even starts, so the error is not caught. Write `pcall(loadLevel, \"map\")`."},{"type":"tf","prompt":"`assert(x, msg)` returns `x` when `x` is truthy.","answer":true,"explain":"That is why `local n = assert(tonumber(s), \"bad\")` is a common pattern."},{"type":"mcq","prompt":"Lua has no `finally`. How do you make sure cleanup code always runs?","options":["Put the cleanup right before the error() call","Run the work with pcall, do the cleanup, then re-raise the error if there was one","Wrap it in try/finally","Nothing: Lua always runs cleanup automatically"],"answer":1,"explain":"`pcall` stops the error from escaping, so the cleanup line after it always runs. Then `error(err, 0)` passes the error on."}]},{"id":"lua-a3","title":"Recursion","summary":"Base cases, the call stack, and tail calls","teach":[{"text":"A **recursive** function calls itself on a smaller version of the problem. It needs a **base case**: a simple case where it stops instead of calling itself again.","code":"local function countdown(n)\n  if n == 0 then\n    print(\"Liftoff!\")\n    return\n  end\n  print(n)\n  countdown(n - 1)\nend\ncountdown(3)  -- 3, 2, 1, Liftoff! (one per line)"},{"text":"Recursive functions often build their answer from the smaller call's answer. `fact(5)` is `5 * fact(4)`, which is `4 * fact(3)`, and so on down to the base case `fact(1) = 1`.","code":"local function fact(n)\n  if n <= 1 then return 1 end\n  return n * fact(n - 1)\nend\nprint(fact(5))  -- 120"},{"text":"Each call waits on the **call stack** until the call it made finishes. Code before the recursive call runs on the way down, and code after it runs on the way back up, in reverse order.","code":"local function show(n)\n  if n == 0 then return end\n  print(\"down \" .. n)\n  show(n - 1)\n  print(\"up \" .. n)\nend\nshow(2)\n-- down 2\n-- down 1\n-- up 1\n-- up 2"},{"text":"Recursion works on tables too. Here the extra parameter `i` tracks the position, starting at 1. Write `local function` so the function can see its own name; `local f = function` cannot call itself.","code":"local function sum(t, i)\n  i = i or 1\n  if i > #t then return 0 end\n  return t[i] + sum(t, i + 1)\nend\nprint(sum({4, 5, 6}))  -- 15"},{"text":"Without a base case, calls pile up until Lua raises a **stack overflow** error. But Lua has proper **tail calls**: when the very last thing is `return f(x)`, Lua reuses the current stack slot, so the stack does not grow.","code":"local function loop(n)\n  if n == 0 then return \"done\" end\n  return loop(n - 1)  -- tail call: no stack growth\nend\nprint(loop(1000000))  -- done"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"local function fib(n)\n  if n < 2 then return n end\n  return fib(n - 1) + fib(n - 2)\nend\nprint(fib(7))","options":["8","13","21","7"],"answer":1,"explain":"The sequence goes 0, 1, 1, 2, 3, 5, 8, 13, so `fib(7)` is 13."},{"type":"output","prompt":"What does this print?","code":"local function f(n)\n  if n > 0 then\n    f(n - 1)\n    print(n)\n  end\nend\nf(3)","options":["3\n2\n1","0\n1\n2\n3","1\n2\n3","3"],"answer":2,"explain":"Each call goes deeper before printing, so the prints happen on the way back up: `f(1)` prints first, `f(3)` last."},{"type":"output","prompt":"What does this print?","code":"local function rev(s)\n  if #s <= 1 then return s end\n  return rev(s:sub(2)) .. s:sub(1, 1)\nend\nprint(rev(\"lua\"))","options":["lua","aul","ual","Error"],"answer":1,"explain":"`rev(\"lua\")` is `rev(\"ua\") .. \"l\"`, which is `(\"a\" .. \"u\") .. \"l\"`, giving \"aul\"."},{"type":"output","prompt":"What does this print?","code":"local calls = 0\nlocal function pow(b, e)\n  calls = calls + 1\n  if e == 0 then return 1 end\n  return b * pow(b, e - 1)\nend\nlocal r = pow(2, 4)\nprint(r .. \" \" .. calls)","options":["16 4","8 4","32 5","16 5"],"answer":3,"explain":"2^4 is 16. The calls use e = 4, 3, 2, 1 and 0, which is 5 calls including the base case."},{"type":"fill","prompt":"Complete the base case so `fact(0)` and `fact(1)` both give 1.","code":"local function fact(n)\n  if n ___ 1 then\n    return ___\n  end\n  return n * fact(n - 1)\nend\nprint(fact(5))","bank":["<=","1","0",">=","nil"],"answer":["<=","1"],"explain":"When n is 1 or less, stop and return 1. Returning 0 would make every answer 0."},{"type":"bug","prompt":"This should print 6. Tap the line with the bug.","lines":["local sumTo = function(n)","  if n == 0 then return 0 end","  return n + sumTo(n - 1)","end","print(sumTo(3))"],"answer":0,"explain":"With `local sumTo = function`, the name `sumTo` does not exist yet inside the body, so the inner call finds a nil global. Use `local function sumTo(n)`."},{"type":"tf","prompt":"In Lua, `return f(n - 1)` is a proper tail call, so it does not grow the call stack.","answer":true,"explain":"Lua guarantees proper tail calls. `return n * f(n - 1)` is not one, because the multiply still has to happen afterward."},{"type":"mcq","prompt":"You remove the base case from `fact`. What happens when you call `fact(5)`?","options":["It returns nil","It returns 0","It keeps calling itself until Lua raises a stack overflow error","Lua adds a base case for you"],"answer":2,"explain":"Every call makes another call and none ever returns, so the stack fills up and Lua raises an error."}]},{"id":"lua-a4","title":"Algorithms","summary":"Searching, sorting, and Big-O in plain words","teach":[{"text":"**Linear search** checks each item one by one. It works on any list. With n items it may need n checks, which we write as **O(n)**.","code":"local function find(t, target)\n  for i, v in ipairs(t) do\n    if v == target then return i end\n  end\n  return nil\nend\nprint(find({7, 3, 9}, 9))  -- 3\nprint(find({7, 3, 9}, 4))  -- nil"},{"text":"**Binary search** only works on a **sorted** list. It checks the middle and throws away the half that cannot hold the target. Halving each step makes it **O(log n)**. Use `//` for the middle so the index stays a whole number.","code":"local function bsearch(t, target)\n  local lo, hi = 1, #t\n  while lo <= hi do\n    local mid = (lo + hi) // 2\n    if t[mid] == target then return mid\n    elseif t[mid] < target then lo = mid + 1\n    else hi = mid - 1 end\n  end\nend\nprint(bsearch({2, 4, 6, 8, 10}, 8))  -- 4"},{"text":"**Bubble sort** walks through the list and swaps neighbors that are in the wrong order, over and over. Lua can swap in one line: `a, b = b, a`. Two nested loops make it **O(n^2)**: fine for 10 items, slow for 100,000.","code":"local function bubbleSort(t)\n  for i = 1, #t - 1 do\n    for j = 1, #t - i do\n      if t[j] > t[j + 1] then\n        t[j], t[j + 1] = t[j + 1], t[j]\n      end\n    end\n  end\nend\nlocal nums = {5, 1, 4, 2}\nbubbleSort(nums)\nprint(table.concat(nums, \" \"))  -- 1 2 4 5"},{"text":"In real code, use `table.sort`. It sorts in place, smallest first. Pass a function to choose the order: it must return `true` when `a` should come **before** `b`, using a strict `<` or `>`.","code":"local scores = {40, 95, 70}\ntable.sort(scores)\nprint(table.concat(scores, \" \"))  -- 40 70 95\ntable.sort(scores, function(a, b) return a > b end)\nprint(table.concat(scores, \" \"))  -- 95 70 40"},{"text":"**Big-O** describes how the work grows as the data grows. O(1): same speed at any size. O(log n): about 20 steps for a million items. O(n): one step per item. O(n^2): every item compared with every other item.","code":"-- t[5]           O(1)      instant, any size\n-- binary search  O(log n)  ~20 steps for 1,000,000 items\n-- linear search  O(n)      up to 1,000,000 steps\n-- bubble sort    O(n^2)    ~1,000,000,000,000 steps"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"local t = {}\nfor i = 1, 100 do t[i] = i end\nlocal lo, hi, steps = 1, #t, 0\nwhile lo <= hi do\n  steps = steps + 1\n  local mid = (lo + hi) // 2\n  if t[mid] == 1 then break\n  elseif t[mid] < 1 then lo = mid + 1\n  else hi = mid - 1 end\nend\nprint(steps)","options":["1","6","7","100"],"answer":1,"explain":"The middle checks are 50, 25, 12, 6, 3 and finally 1. That is 6 steps instead of 100."},{"type":"output","prompt":"What does this print?","code":"local names = {\"bob\", \"Zed\", \"amy\"}\ntable.sort(names)\nprint(table.concat(names, \",\"))","options":["amy,bob,Zed","Zed,amy,bob","bob,Zed,amy","amy,Zed,bob"],"answer":1,"explain":"Strings are compared by character codes, and every uppercase letter comes before every lowercase one. So \"Zed\" sorts first."},{"type":"output","prompt":"What does this print?","code":"local t = {4, 3, 2, 1}\nfor j = 1, #t - 1 do\n  if t[j] > t[j + 1] then\n    t[j], t[j + 1] = t[j + 1], t[j]\n  end\nend\nprint(table.concat(t, \" \"))","options":["1 2 3 4","3 4 2 1","3 2 1 4","4 3 2 1"],"answer":2,"explain":"One pass of bubble sort carries the biggest number to the end: 3 4 2 1, then 3 2 4 1, then 3 2 1 4. It needs more passes to finish."},{"type":"fill","prompt":"Sort from biggest to smallest.","code":"local list = {3, 9, 1}\ntable.sort(list, function(a, b)\n  return a ___ b\nend)\nprint(table.concat(list, \" \"))","bank":[">","<",">=","=="],"answer":[">"],"explain":"`a > b` puts bigger numbers first. `>=` looks similar but breaks `table.sort`, which needs a strict comparison."},{"type":"bug","prompt":"This binary search sometimes fails with an error. Tap the line with the bug.","lines":["local function bsearch(t, x)","  local lo, hi = 1, #t","  while lo <= hi do","    local mid = (lo + hi) / 2","    if t[mid] == x then return mid","    elseif t[mid] < x then lo = mid + 1","    else hi = mid - 1 end","  end","end"],"answer":3,"explain":"`/` always gives a float, like 2.5. `t[2.5]` is nil, and comparing nil with a number fails. Use `//`."},{"type":"mcq","prompt":"What is the Big-O of this code for a list of n items?","code":"local count = 0\nfor i = 1, #t do\n  for j = 1, #t do\n    count = count + 1\n  end\nend","options":["O(1)","O(log n)","O(n)","O(n^2)"],"answer":3,"explain":"The inner loop runs n times for each of the n outer rounds, so n * n steps."},{"type":"mcq","prompt":"About how many steps does binary search need for 1,000,000 sorted items?","options":["About 20","About 1,000","About 500,000","About 1,000,000"],"answer":0,"explain":"Each step halves the range, and halving 1,000,000 about 20 times gets you down to 1."},{"type":"tf","prompt":"Binary search works on any list, sorted or not.","answer":false,"explain":"Throwing away half only makes sense if the list is sorted. For unsorted data, use linear search or sort first."}]},{"id":"lua-a5","title":"Metatables and coroutines","summary":"Metamethods like __add, and coroutines that yield","teach":[{"text":"A metatable can hold **metamethods**: functions that decide how operators work on your tables. `__add` runs when you use `+` on them. Great for vectors in game code.","code":"local V = {}\nlocal function vec(x, y)\n  return setmetatable({x = x, y = y}, V)\nend\nV.__add = function(a, b)\n  return vec(a.x + b.x, a.y + b.y)\nend\n\nlocal p = vec(1, 2) + vec(3, 4)\nprint(p.x .. \", \" .. p.y)  -- 4, 6"},{"text":"`__tostring` controls how `print` and `tostring` show the table. `__eq` defines `==`, and `__lt` defines `<` (and `>`, by swapping sides). Note that `..` does **not** use `__tostring`.","code":"V.__tostring = function(v)\n  return \"(\" .. v.x .. \", \" .. v.y .. \")\"\nend\nV.__eq = function(a, b)\n  return a.x == b.x and a.y == b.y\nend\nprint(vec(1, 2))               -- (1, 2)\nprint(vec(1, 2) == vec(1, 2))  -- true\nprint(\"at \" .. tostring(vec(0, 5)))  -- at (0, 5)"},{"text":"`__index` can also be a **function**. Lua calls it with the table and the missing key, which is handy for default values.","code":"local settings = setmetatable({}, {\n  __index = function(t, key)\n    return \"default \" .. key\n  end\n})\nsettings.music = \"on\"\nprint(settings.music)  -- on\nprint(settings.sound)  -- default sound"},{"text":"A **coroutine** is a function that can pause in the middle with `coroutine.yield()` and continue later with `coroutine.resume()`. Games use this for things that take many frames, like cutscenes or enemy patrols.","code":"local co = coroutine.create(function()\n  print(\"step 1\")\n  coroutine.yield()\n  print(\"step 2\")\nend)\ncoroutine.resume(co)         -- step 1\nprint(coroutine.status(co))  -- suspended\ncoroutine.resume(co)         -- step 2\nprint(coroutine.status(co))  -- dead"},{"text":"`coroutine.yield(x)` hands `x` out, and `coroutine.resume` returns `true` plus those values. `coroutine.wrap` makes a plain function that resumes for you and returns just the values: a neat generator.","code":"local nextId = coroutine.wrap(function()\n  local id = 0\n  while true do\n    id = id + 1\n    coroutine.yield(id)\n  end\nend)\nprint(nextId())  -- 1\nprint(nextId())  -- 2\nprint(nextId())  -- 3"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"local Money = {}\nMoney.__tostring = function(m) return \"$\" .. m.amount end\nlocal m = setmetatable({amount = 5}, Money)\nprint(m)\nprint(\"You have \" .. m)","options":["$5\nYou have $5","$5\nError","table\nError","Error"],"answer":1,"explain":"`print` uses `__tostring`, so the first line works. But `..` needs a `__concat` metamethod, so joining a table to a string is an error."},{"type":"output","prompt":"What does this print?","code":"local co = coroutine.create(function(a)\n  local b = coroutine.yield(a * 2)\n  return a + b\nend)\nlocal _, x = coroutine.resume(co, 5)\nlocal _, y = coroutine.resume(co, 3)\nprint(x .. \" \" .. y)","options":["5 3","10 13","10 8","10 15"],"answer":2,"explain":"The first resume passes `a = 5` and gets the yielded 10. The second resume makes `yield` return 3, so `b = 3` and the function returns 5 + 3."},{"type":"output","prompt":"What does this print?","code":"local co = coroutine.create(function()\n  coroutine.yield(\"a\")\n  return \"b\"\nend)\nlocal ok1, v1 = coroutine.resume(co)\nlocal ok2, v2 = coroutine.resume(co)\nlocal ok3, v3 = coroutine.resume(co)\nprint(v1 .. v2 .. \" \" .. tostring(ok3))","options":["ab true","ab false","a false","Error"],"answer":1,"explain":"The first resume yields \"a\" and the second finishes with \"b\". The coroutine is now dead, so the third resume returns false and an error message instead of crashing."},{"type":"output","prompt":"What does this print?","code":"local Lv = {}\nLv.__lt = function(a, b) return a.n < b.n end\nlocal a = setmetatable({n = 3}, Lv)\nlocal b = setmetatable({n = 7}, Lv)\nprint(a < b)\nprint(b > a)","options":["true\nfalse","true\ntrue","true\nError","Error"],"answer":1,"explain":"Lua turns `b > a` into `a < b` and uses the same `__lt`, so both are true."},{"type":"fill","prompt":"Make `gen` a generator that gives 10, then 20.","code":"local gen = coroutine.___(function()\n  for i = 1, 3 do\n    coroutine.___(i * 10)\n  end\nend)\nprint(gen())\nprint(gen())","bank":["wrap","yield","create","resume","return"],"answer":["wrap","yield"],"explain":"`wrap` returns a callable function, and `yield` pauses and hands out each value. `create` would give a coroutine object that you cannot call directly."},{"type":"bug","prompt":"This should print 3. Tap the line with the bug.","lines":["local V = {}","V.__index = V","V.add = function(a, b) return a.n + b.n end","local a = setmetatable({n = 1}, V)","local b = setmetatable({n = 2}, V)","print(a + b)"],"answer":2,"explain":"Metamethod names start with two underscores. Lua only uses `V.__add` for `+`, so `a + b` fails."},{"type":"tf","prompt":"`coroutine.yield()` pauses a coroutine, and the code after it runs on the next `coroutine.resume()`.","answer":true,"explain":"The coroutine keeps its local variables and position, and picks up right after the `yield`."},{"type":"mcq","prompt":"Which metamethod lets `print(obj)` show your own text?","options":["__index","__concat","__tostring","__print"],"answer":2,"explain":"`print` calls `tostring`, which uses `__tostring` when the metatable has it. There is no `__print`."}]}]}}]</script>

const GLOSS_ALIAS = { variables: 'variable', values: 'value', types: 'type', strings: 'string', integers: 'integer', floats: 'float',
  booleans: 'boolean', functions: 'function', methods: 'method', parameters: 'parameter', arguments: 'argument', returns: 'return',
  loops: 'loop', arrays: 'array', lists: 'list', indexes: 'index', indices: 'index', elements: 'element', dictionaries: 'dictionary',
  maps: 'map', keys: 'key', tables: 'table', classes: 'class', objects: 'object', instances: 'instance', constructors: 'constructor',
  fields: 'field', properties: 'property', interfaces: 'interface', exceptions: 'exception', operators: 'operator',
  expressions: 'expression', statements: 'statement', algorithms: 'algorithm', comments: 'comment', pointers: 'pointer',
  references: 'reference', callbacks: 'callback', promises: 'promise', lambdas: 'lambda', generics: 'generic', libraries: 'library',
  modules: 'module', conditions: 'condition', events: 'event', coroutines: 'coroutine', metatables: 'metatable', compiles: 'compile',
  declared: 'declare', assigned: 'assign', initialized: 'initialize', iterates: 'iterate', inherits: 'inherit', overrides: 'override',
  recursive: 'recursion' }
const GLOSS_RE = new RegExp('\\b(' + [...Object.keys(GLOSS), ...Object.keys(GLOSS_ALIAS)]
  .sort((a, b) => b.length - a.length).map(w => w.replace(/ /g, '\\s')).join('|') + ')\\b', 'gi')

// md() plus tappable jargon. each word gets marked once, max 3 per block, so it doesnt turn into a sea of dots
function mdx(s) {
  const seen = new Set()
  return String(s).split('`').map((part, i) => {
    if (i % 2) return `<code>${esc(part)}</code>`
    return esc(part).replace(GLOSS_RE, w => {
      const k = w.toLowerCase().replace(/\s+/g, ' ')
      const key = GLOSS[k] ? k : GLOSS_ALIAS[k]
      if (!key || seen.has(key) || seen.size >= 3) return w
      seen.add(key)
      return `<button type="button" class="term" data-act="term" data-t="${key}">${w}</button>`
    }).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
  }).join('')
}
const shuffle = a => {
  a = a.slice()
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.random() * (i + 1) | 0
    ;[a[i], a[j]] = [a[j], a[i]]
  }
  return a
}

const KEY = 'codeling-save-1'
let save = load()

function load() {
  const blank = { xp: 0, streak: 0, last: null, days: {}, done: {}, level: {}, sound: true }
  try { return Object.assign(blank, JSON.parse(localStorage.getItem(KEY)) || {}) } catch { return blank }
}
function store(local) {
  try { localStorage.setItem(KEY, JSON.stringify(save)) } catch {}
  if (!local) try { schedulePush() } catch {}
}

function day(offset = 0) {
  const d = new Date()
  d.setDate(d.getDate() + offset)
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
}
const streak = () => (save.last === day() || save.last === day(-1) ? save.streak : 0)
const todayXp = () => save.days[day()] || 0

function addXp(n) {
  if (save.last !== day()) {
    save.streak = save.last === day(-1) ? save.streak + 1 : 1
    save.last = day()
  }
  save.xp += n
  save.days[day()] = todayXp() + n
  noteXp(n)
  store()
}

const isDone = id => !!save.done[id]
const doneIn = (c, lvl) => c.levels[lvl].filter(l => isDone(l.id)).length

// ---- sound, made on the fly so there are no files

let ac
function beep(notes, type = 'triangle', vol = 0.16) {
  if (!save.sound) return
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)()
    const t = ac.currentTime
    for (const [f, at, len] of notes) {
      const o = ac.createOscillator(), g = ac.createGain()
      o.type = type
      o.frequency.value = f
      g.gain.setValueAtTime(0.0001, t + at)
      g.gain.exponentialRampToValueAtTime(vol, t + at + 0.012)
      g.gain.exponentialRampToValueAtTime(0.0001, t + at + len)
      o.connect(g).connect(ac.destination)
      o.start(t + at)
      o.stop(t + at + len + 0.05)
    }
  } catch {}
}
const sfx = {
  good: () => beep([[660, 0, 0.12], [990, 0.09, 0.22]]),
  bad: () => beep([[196, 0, 0.16], [147, 0.12, 0.26]], 'sawtooth', 0.07),
  done: () => beep([[523, 0, 0.14], [659, 0.12, 0.14], [784, 0.24, 0.14], [1047, 0.36, 0.4]]),
  tap: () => beep([[520, 0, 0.035]], 'sine', 0.06),
}

const KW = {
  python: 'and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return self True try while with yield',
  javascript: 'async await break case catch class const continue default delete do else export extends false finally for function if import in instanceof let new null of return static super switch this throw true try typeof undefined var void while yield',
  java: 'abstract boolean break byte case catch char class continue default do double else enum extends false final finally float for if implements import instanceof int interface long new null package private protected public record return short static super switch this throw throws true try var void while',
  csharp: 'abstract as base bool break byte case catch char class const continue decimal default delegate do double else enum event false finally float for foreach get if in int interface internal is long namespace new null object out override private protected public readonly ref return sealed set static string struct switch this throw true try using var virtual void while yield',
  cpp: 'auto bool break case catch char class const constexpr continue default delete do double else enum explicit false float for if int long namespace new nullptr override private protected public return short signed sizeof static struct switch template this throw true try typename unsigned using virtual void while',
  lua: 'and break do else elseif end false for function goto if in local nil not or repeat return then true until while self',
}
const lexers = {}
function lexer(lang) {
  if (lexers[lang]) return lexers[lang]
  const pre = lang === 'cpp' ? String.raw`#\s*\w+(?:\s*<[^>\n]+>)?` : '(?!)'
  const com = lang === 'python' ? '#.*' : lang === 'lua' ? String.raw`--\[\[[\s\S]*?\]\]|--.*` : String.raw`//.*|/\*[\s\S]*?\*/`
  let str = String.raw`"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'`
  if (lang === 'javascript') str += '|`(?:\\\\.|[^`\\\\])*`'
  const num = String.raw`\b\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?[fFdDLmMuU]?\b`
  const re = new RegExp(`(${pre})|(${com})|(${str})|(${num})|([A-Za-z_]\\w*)(?=\\s*\\()|([A-Za-z_]\\w*)`, 'g')
  return (lexers[lang] = { re, kw: new Set(KW[lang].split(' ')) })
}
function hl(code, lang) {
  const { re, kw } = lexer(lang)
  let out = '', last = 0, m
  re.lastIndex = 0
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index))
    const t = esc(m[0])
    if (m[1]) out += `<span class="k">${t}</span>`
    else if (m[2]) out += `<span class="c">${t}</span>`
    else if (m[3]) out += `<span class="s">${t}</span>`
    else if (m[4]) out += `<span class="n">${t}</span>`
    else if (kw.has(m[0])) out += `<span class="k">${t}</span>`
    else if (m[5]) out += `<span class="f">${t}</span>`
    else out += t
    last = re.lastIndex
  }
  return out + esc(code.slice(last))
}
const codeBlock = (code, lang, label = true) =>
  `<div class="code-wrap">${label ? `<span class="lang">${esc(course(lang).name)}</span>` : ''}<pre class="code">${hl(code, lang)}</pre></div>`

      <small>${doneIn(c, l.id)}/5</small>

  return `<div class="wrap"><div class="picker">
    <button class="back" data-act="home">${ic('left')}All courses</button>
    <h1>How much ${esc(c.name)} do you know?</h1>
    <p>This only picks where you start. You can switch levels any time.</p>
    <div class="levels">${rows}</div>
  </div></div>`
}

const OFFSET = [0, 64, 96, 64, 0, -64]

function coursePage() {
  const c = course(view.course)
  const lvl = save.level[c.id] || 'beginner'
  const L = LEVELS.find(l => l.id === lvl)
  const lessons = c.levels[lvl]
  const cur = lessons.findIndex(l => !isDone(l.id))
  const reviewId = `${c.id}-${lvl}-review`

  const nodes = lessons.map((les, i) => {
    const state = isDone(les.id) ? 'done' : i === cur ? 'current' : 'locked'
    return node(i, OFFSET[i], state, les.id, `Lesson ${i + 1}`, les.title, les.summary, state === 'locked' ? 'lock' : state === 'done' ? 'check' : 'star')
  })
  const allDone = cur === -1
  nodes.push(node(5, OFFSET[5], isDone(reviewId) ? 'done' : allDone ? 'current' : 'locked', reviewId, 'Level review', `${L.name} review`, 'Mixed questions from the whole level', 'trophy'))

  const tabs = LEVELS.map(l =>
    `<button class="tab" role="tab" aria-selected="${l.id === lvl}" data-act="level" data-l="${l.id}">${l.name} · ${doneIn(c, l.id)}/5</button>`).join('')
  const levelRows = LEVELS.map(l =>
    `<div><span style="text-align:left;color:var(--ink)">${l.name}</span><span class="bar"><i style="width:${doneIn(c, l.id) * 20}%"></i></span><span>${doneIn(c, l.id)}/5</span></div>`).join('')
  const anyDone = doneAll(c) > 0

  return `<div class="wrap"><div class="course-page" style="${tint(c.id)}">
    <div>
      <button class="back" data-act="home">${ic('left')}All courses</button>
      <div class="unit" style="${tint(c.id)}">
        <div><small>${esc(c.name)} · ${L.who}</small><h2>${L.name}</h2><p>${lessons.length} lessons and a level review</p></div>
        <span class="badge" style="grid-row:auto;background:rgb(255 255 255 / .18);box-shadow:none">${LOOK[c.id].badge}</span>
      </div>
      <div class="tabs" role="tablist">${tabs}</div>
      <div class="path">${nodes.join('')}</div>
    </div>
    <aside class="side">
      <div class="card">
        <div class="row">${ic('term')}<h3>Run ${esc(c.name)} on your PC</h3></div>
        <p>${md(c.setup)}</p>
      </div>
      <div class="card">
        <h3>Your progress</h3>
        <div class="level-list">${levelRows}</div>
      </div>
      <div class="card">
        <div class="row">${ic('dumbbell')}<h3>Practice</h3></div>
        <p>${anyDone ? 'Eight random questions from lessons you have finished. Good for keeping things fresh.' : 'Finish a lesson first, then come back here to practice it.'}</p>
        <button class="btn ghost wide" data-act="practice" ${anyDone ? '' : 'disabled'}>Practice +${XP.practice} XP</button>
      </div>
      ${mistakeCard(c.id)}
    </aside>
  </div></div>`
}

function node(i, off, state, id, kicker, title, sub, icon) {
  const open = pop === id
  const labelSide = off > 0 ? 'right:calc(100% + 18px);text-align:right' : 'left:calc(100% + 18px)'
  let body = ''
  if (open) {
    const review = icon === 'trophy'
    const xp = review ? XP.practice : isDone(id) ? XP.again : XP.first
    const btn = state === 'locked'
      ? `<p>${review ? 'Finish all five lessons to unlock the review.' : 'Finish the lesson before this one to unlock it.'}</p>`
      : `<button class="btn wide" data-act="${review ? 'review' : 'start'}" data-id="${id}">${state === 'done' ? 'Go again' : 'Start'} +${xp} XP</button>
         ${review ? '' : `<button class="pop-link" data-act="notes" data-id="${id}">Read the notes first</button>`}`
    body = `<div class="pop" style="${state === 'done' ? '--c: var(--xp)' : state === 'locked' ? '--c: var(--ink-2)' : ''}">
      <small style="font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px;opacity:.85">${kicker}</small>
      <h3>${esc(title)}</h3><p>${md(sub)}</p>${btn}</div>`
  }
  return `<div class="node-row${open ? ' open' : ''}">
    <div style="position:relative;transform:translateX(calc(var(--k) * ${off}px))">
      ${state === 'current' && !open ? `<span class="start-tip">${i === 0 ? 'Start here' : 'Next'}</span>` : ''}
      <button class="node ${state}" data-act="node" data-id="${id}" aria-label="${esc(kicker + ': ' + title)}" aria-expanded="${open}">${ic(icon)}</button>
      <span class="node-label" style="${labelSide}"><b>${esc(title)}</b>${md(sub)}</span>
      ${body}
    </div></div>`
}

// ---- lesson player

const player = $('#player')
let run = null

function findLesson(c, id) {
  for (const l of LEVELS) {
    const hit = c.levels[l.id].find(x => x.id === id)
    if (hit) return hit
  }
}

function begin(c, title, steps, kind, id) {
  run = {
    c, title, kind, id, steps, i: 0, hearts: 5, firstTries: 0, asked: 0, combo: 0,
    total: steps.length, progress: 0, t0: Date.now(), s: null, checked: false,
    streakBefore: streak(),
  }
  player.hidden = false
  document.body.style.overflow = 'hidden'
  player.innerHTML = `<div class="p-top">
      <button class="icon-btn" data-act="quit" aria-label="Quit lesson">${ic('x')}</button>
      <span class="bar" role="progressbar" aria-label="Lesson progress"><i></i></span>
      <span class="combo" aria-live="polite"></span>
      <span class="hearts">${ic('heart')}<span>5</span></span>
    </div>
    <div class="p-body"><div class="p-inner"></div></div>
    <div class="p-foot"></div>`
  step()
}

function startLesson(cid, id) {
  const c = course(cid), les = findLesson(c, id)
  begin(c, les.title, [...les.teach.map(t => ({ teach: t })), ...les.quiz.map((q, qi) => ({ q, cid, lid: id, qi }))], 'lesson', id)
}

function startMix(cid, pool, kind, id) {
  const c = course(cid)
  const qs = shuffle(pool.flatMap(l => l.quiz.map((q, qi) => ({ q, cid, lid: l.id, qi })))).slice(0, 8)
  begin(c, kind === 'review' ? 'Level review' : 'Practice', qs, kind, id)
}

function step() {
  const st = run.steps[run.i]
  const inner = $('.p-inner', player)
  run.checked = false
  $('.p-top .bar i', player).style.width = (run.progress / run.total) * 100 + '%'
  $('.p-body', player).scrollTop = 0

  if (st.teach) {
    const first = run.i === 0
    inner.innerHTML = `
      <span class="kicker">${ic('book').replace('<svg', '<svg width="18" height="18"')}${first ? 'New lesson' : 'Keep going'}</span>
      ${first ? `<h2>${esc(run.title)}</h2>` : ''}
      <div class="speech">${bit()}<div class="bubble"><p class="teach-text">${mdx(st.teach.text)}</p></div></div>
      ${st.teach.code ? codeBlock(st.teach.code, run.c.id) : ''}
      <div class="helpers ai">
        <button class="helper" data-act="bit" data-ask="Explain it simpler">Explain it simpler</button>
        ${st.teach.code ? `<button class="helper" data-act="bit" data-ask="Walk me through the code">Walk me through the code</button>` : ''}
        <button class="helper" data-act="bit">Ask Bit something</button>
      </div>`
    foot('teach')
    return
  }

  const q = st.q
  run.s = { sel: null }
  if (q.type === 'fill') {
    run.s.bank = shuffle(q.bank)
    run.s.slots = q.answer.map(() => null)
  }
  if (q.type === 'order') {
    let p = shuffle(q.lines.map((_, i) => i))
    while (p.every((v, i) => v === i)) p = shuffle(p)
    run.s.pool = p
    run.s.slots = []
  }
  inner.innerHTML = `
    <div class="q-head"><span class="kicker">${st.again ? 'Try this one again' : KIND[q.type]}</span>
      <span class="q-help ai"><button class="helper" data-act="bit" data-ask="Help me step by step">Help me step by step</button><button class="helper" data-act="bit" data-ask="Give me a hint">Hint</button></span></div>
    <h2>${mdx(q.prompt)}</h2>
    ${q.code && q.type !== 'fill' ? codeBlock(q.code, run.c.id) : ''}
    <div id="w"></div>`
  widget()
  foot('ask')
}

// draws the answer area for the current question from run.s
function widget(result) {
  const q = run.steps[run.i].q, s = run.s, w = $('#w', player), lang = run.c.id
  const st = i => (!result ? '' : i === result.right ? ' right' : i === s.sel ? ' wrong' : '')
  const on = i => (!result && s.sel === i ? ' aria-pressed="true"' : '')
  const off = run.checked ? ' disabled' : ''

  if (q.type === 'mcq' || q.type === 'output') {
    const mono = q.type === 'output'
    w.innerHTML = `<div class="opts">${q.options.map((o, i) =>
      `<button class="opt${st(i)}" data-act="pick" data-i="${i}"${on(i)}${off}><kbd>${i + 1}</kbd><span class="${mono ? 'out' : ''}">${mono ? esc(o) : md(o)}</span></button>`).join('')}</div>`
  } else if (q.type === 'tf') {
    w.innerHTML = `<div class="opts tf">${['True', 'False'].map((o, i) =>
      `<button class="opt${st(i)}" data-act="pick" data-i="${i}"${on(i)}${off}><kbd>${i + 1}</kbd>${o}</button>`).join('')}</div>`
  } else if (q.type === 'bug') {
    w.innerHTML = `<div class="bug-lines">${q.lines.map((l, i) =>
      `<button class="bug-line${st(i)}" data-act="pick" data-i="${i}"${on(i)}${off}><span>${i + 1}</span><span>${hl(l, lang) || ' '}</span></button>`).join('')}</div>`
  } else if (q.type === 'fill') {
    const parts = q.code.split('___')
    const width = Math.max(...q.bank.map(b => b.length)) + 1
    const next = s.slots.indexOf(null)
    let html = ''
    parts.forEach((p, i) => {
      html += hl(p, lang)
      if (i < parts.length - 1) {
        const v = s.slots[i]
        let cls = 'blank' + (v != null ? ' filled' : i === next && !result ? ' next' : '')
        if (result) cls += s.bank[v] === q.answer[i] ? ' right' : ' wrong'
        html += `<button class="${cls}" style="min-width:${width}ch" data-act="unfill" data-i="${i}"${off} aria-label="Blank ${i + 1}">${v != null ? esc(s.bank[v]) : ' '}</button>`
      }
    })
    w.innerHTML = `<div class="code-wrap"><pre class="code fill-code">${html}</pre></div>
      <div class="bank">${s.bank.map((b, i) =>
        `<button class="tile${s.slots.includes(i) ? ' used' : ''}" data-act="tile" data-i="${i}"${off}>${esc(b)}</button>`).join('')}</div>
      ${result && !result.ok ? `<p class="prose" style="color:var(--ink-2)">Answer: ${q.answer.map(a => `<code>${esc(a)}</code>`).join(' ')}</p>` : ''}`
  } else if (q.type === 'order') {
    const cls = result ? (result.ok ? ' right' : ' wrong') : ''
    w.innerHTML = `<div class="order-slots${cls}">${s.slots.map((li, k) =>
      `<button class="line-tile" data-act="unplace" data-k="${k}"${off}>${hl(q.lines[li], lang)}</button>`).join('')}</div>
      <div class="order-pool">${s.pool.map(li =>
        `<button class="line-tile${s.slots.includes(li) ? ' used' : ''}" data-act="place" data-i="${li}"${off}>${hl(q.lines[li], lang)}</button>`).join('')}</div>
      ${result && !result.ok ? `<p style="color:var(--ink-2);font-weight:700">Correct order:</p><pre class="code">${hl(q.lines.join('\n'), lang)}</pre>` : ''}`
  }
  if (!run.checked) {
    const b = $('[data-act=check]', player)
    if (b) b.disabled = !ready()
  }
}

function ready() {
  const q = run.steps[run.i].q, s = run.s
  if (q.type === 'fill') return !s.slots.includes(null)
  if (q.type === 'order') return s.slots.length === q.lines.length
  return s.sel != null
}

function grade() {
  const q = run.steps[run.i].q, s = run.s
  switch (q.type) {
    case 'mcq': case 'output': case 'bug': return { ok: s.sel === q.answer, right: q.answer }
    case 'tf': return { ok: (s.sel === 0) === q.answer, right: q.answer ? 0 : 1 }
    case 'fill': return { ok: s.slots.every((v, i) => s.bank[v] === q.answer[i]) }
    case 'order': return { ok: s.slots.every((li, k) => q.lines[li] === q.lines[k]) }
  }
}

const NICE = ['Nice!', 'Correct!', 'You got it!', 'Great job!', 'Exactly right!']
const OOPS = ['Not quite', 'Almost', 'Not this time']
const any = a => a[Math.random() * a.length | 0]

function check() {
  if (run.checked || !ready()) return
  run.checked = true
  const st = run.steps[run.i], res = grade()
  if (!st.again) {
    run.asked++
    if (res.ok) run.firstTries++
  }
  noteAnswer(st, res.ok)
  if (!res.ok) $('.combo', player).textContent = ''
  if (res.ok) {
    run.progress++
    sfx.good()
  } else {
    run.hearts--
    run.steps.push({ ...st, again: true })
    sfx.bad()
    const h = $('.hearts', player)
    $('span', h).textContent = run.hearts
    h.classList.remove('hit'); void h.offsetWidth; h.classList.add('hit')
  }
  $('.p-top .bar i', player).style.width = (run.progress / run.total) * 100 + '%'
  widget(res)
  foot(res.ok ? 'good' : 'bad', st.q.explain)
}

function next() {
  if (run.hearts <= 0) return outOfHearts()
  if (run.steps[run.i].teach) run.progress++
  run.i++
  if (run.i >= run.steps.length) return finish()
  step()
}

function foot(kind, text) {
  const f = $('.p-foot', player)
  f.className = 'p-foot' + (kind === 'good' ? ' good' : kind === 'bad' ? ' bad' : '')
  let left = '<span></span>', right = ''
  if (kind === 'teach') right = `<button class="btn" data-act="next" data-main>Continue</button>`
  if (kind === 'ask') right = `<button class="btn good" data-act="check" data-main disabled>Check</button>`
  if (kind === 'good' || kind === 'bad') {
    const good = kind === 'good'
    left = `<div class="verdict" role="status"><span class="ic">${ic(good ? 'check' : 'x')}</span><div><h3>${any(good ? NICE : OOPS)}</h3><p>${mdx(text)}</p>
      <button class="more ai" data-act="bit" data-ask="${good ? 'Why is that the answer?' : 'Explain my mistake'}">${good ? 'Explain more' : 'Explain my mistake'}</button></div></div>`
    right = `<button class="btn ${good ? 'good' : 'bad'}" data-act="next" data-main>${good ? 'Continue' : 'Got it'}</button>`
  }
  if (kind === 'quit') {
    left = `<div class="verdict"><div><h3>Leave this lesson?</h3><p>You will lose your progress in it.</p></div></div>`
    right = `<span style="display:flex;gap:10px;flex-wrap:wrap"><button class="skip" data-act="leave">Leave</button><button class="btn" data-act="stay" data-main>Keep going</button></span>`
  }
  f.innerHTML = `<div class="foot-in">${left}${right}</div>`
  if (kind === 'ask') widget()
  const main = $('[data-main]', f)
  if (main && !main.disabled) main.focus({ preventScroll: true })
}

function finish() {
  const before = save.done[run.id]
  const perfect = run.asked > 0 && run.firstTries === run.asked
  let xp = run.kind === 'lesson' ? (before ? XP.again : XP.first) : XP.practice
  if (perfect && run.kind === 'lesson' && !before) xp += XP.perfect
  if (run.id) save.done[run.id] = { at: day(), score: Math.max(before ? before.score : 0, run.asked ? run.firstTries / run.asked : 1) }
  addXp(xp)
  noteFinish(run.kind, perfect)
  const left = dailyQuests().filter(q => !questState(q).done).length
  sfx.done()

  const secs = Math.round((Date.now() - run.t0) / 1000)
  const acc = run.asked ? Math.round((run.firstTries / run.asked) * 100) : 100
  const s = streak()
  const grew = s > run.streakBefore
  const msg = grew ? `That makes ${s} ${s === 1 ? 'day' : 'days'} in a row. Come back tomorrow to keep it going.`
    : todayXp() >= GOAL ? `Daily goal done: ${todayXp()} XP today.`
    : `${GOAL - todayXp()} more XP to hit today's goal.`
  $('.p-top', player).style.visibility = 'hidden'
  $('.p-inner', player).innerHTML = `<div class="end">
    ${bit(perfect ? 'wow' : '')}
    <h2>${perfect ? 'Perfect run!' : run.kind === 'lesson' ? 'Lesson complete!' : run.kind === 'mistakes' ? 'Mistakes fixed!' : 'Practice done!'}</h2>
    <p>${msg}</p>
    <div class="scores">
      <div class="score" style="--sc: var(--xp)"><small>XP earned</small><b>+${xp}</b></div>
      <div class="score" style="--sc: var(--good)"><small>Accuracy</small><b>${acc}%</b></div>
      <div class="score" style="--sc: var(--accent)"><small>Time</small><b>${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}</b></div>
    </div>
    <p class="muted small">${left ? `${left} daily ${left === 1 ? 'quest' : 'quests'} left today.` : 'All daily quests done. Claim them on the Quests page!'}</p></div>`
  $('.p-foot', player).className = 'p-foot'
  $('.p-foot', player).innerHTML = `<div class="foot-in"><span></span><button class="btn" data-act="close" data-main>Continue</button></div>`
  $('[data-main]', player).focus({ preventScroll: true })
}

function outOfHearts() {
  $('.p-inner', player).innerHTML = `<div class="end">
    ${bit('sad')}
    <h2>Out of hearts</h2>
    <p>That one was tough. Go back over the notes and try again. Mistakes are how this stuff sticks.</p></div>`
  $('.p-foot', player).className = 'p-foot'
  $('.p-foot', player).innerHTML = `<div class="foot-in"><button class="skip" data-act="close">Back to course</button><button class="btn" data-act="retry" data-main>Try again</button></div>`
  $('[data-main]', player).focus({ preventScroll: true })
}

function closePlayer() {
  if (!bitPanel.hidden) closeBit()
  player.hidden = true
  player.innerHTML = ''
  document.body.style.overflow = ''
  run = null
  draw()
}

// ---- clicks + keys

const act = {
  home: () => go({ page: 'home' }),
  sound: () => { save.sound = !save.sound; store(); drawTop(); sfx.tap() },
  open: el => {
    const id = el.dataset.c
    go({ page: save.level[id] ? 'course' : 'pick', course: id })
  },
  level: el => {
    save.level[view.course] = el.dataset.l
    store()
    view.page === 'pick' ? go({ page: 'course', course: view.course }) : (pop = null, draw())
  },
  node: el => { pop = pop === el.dataset.id ? null : el.dataset.id; draw() },
  start: el => startLesson(view.course, el.dataset.id),
  review: el => startMix(view.course, course(view.course).levels[save.level[view.course] || 'beginner'], 'review', el.dataset.id),
  practice: () => {
    const c = course(view.course)
    const done = LEVELS.flatMap(l => c.levels[l.id]).filter(l => isDone(l.id))
    if (done.length) startMix(c.id, done, 'practice', null)
  },
  pick: el => { if (run.checked) return; run.s.sel = +el.dataset.i; sfx.tap(); widget() },
  tile: el => {
    if (run.checked) return
    const at = run.s.slots.indexOf(null)
    if (at < 0) return
    run.s.slots[at] = +el.dataset.i
    sfx.tap()
    widget()
  },
  unfill: el => { if (run.checked) return; run.s.slots[+el.dataset.i] = null; widget() },
  place: el => { if (run.checked) return; run.s.slots.push(+el.dataset.i); sfx.tap(); widget() },
  unplace: el => { if (run.checked) return; run.s.slots.splice(+el.dataset.k, 1); widget() },
  check,
  next,
  quit: () => {
    if (!run || run.i >= run.steps.length || run.hearts <= 0) return closePlayer()
    run.wasFoot = $('.p-foot', player).innerHTML
    run.wasClass = $('.p-foot', player).className
    foot('quit')
  },
  stay: () => {
    const f = $('.p-foot', player)
    f.innerHTML = run.wasFoot
    f.className = run.wasClass
    if (!run.checked && run.steps[run.i].q) widget()
  },
  leave: closePlayer,
  nav: el => { const p = el.dataset.p; go({ page: p }) },
  claim: el => claim(el.dataset.q),
  login: () => authModal('login'),
  authmode: el => authModal(el.dataset.m),
  google: () => googleIn(),
  forgot: () => forgot(),
  logout: () => logOut(),
  closemodal: () => closeModal(),
  boardtab: el => { board.tab = el.dataset.t; board.rows = null; board.key = ''; draw() },
  boardretry: () => { board.key = ''; draw() },
  user: el => go({ page: 'user', uid: el.dataset.u }),
  editprofile: () => editProfile(),
  swatch: el => { save.profile.color = +el.dataset.i; for (const b of document.querySelectorAll('.sw')) b.classList.toggle('on', b === el) },
  share: () => sharePanel(),
  copy: () => copyLink(),
  nativeshare: () => nativeShare(),
  mistakes: el => startMistakes(el.dataset.c),
  notes: el => go({ page: 'notes', course: view.course, lesson: el.dataset.id }),
  bit: el => openBit(el.dataset.ask),
  bitclose: () => closeBit(),
  term: el => showTerm(el),
  stop: () => chat.ctl && chat.ctl.abort(),
  close: closePlayer,
  retry: () => {
    const { c, kind, id } = run
    if (kind === 'lesson') startLesson(c.id, id)
    else if (kind === 'review') act.review({ dataset: { id } })
    else if (kind === 'mistakes') startMistakes(c.id)
    else act.practice()
  },
}

document.addEventListener('click', e => {
  if (!tip.hidden && !e.target.closest('#tip') && !e.target.closest('.term')) tip.hidden = true
  if (e.target.id === 'modal') return closeModal()
  const el = e.target.closest('[data-act]')
  if (el && !el.disabled) return act[el.dataset.act](el)
  if (pop && !e.target.closest('.pop')) { pop = null; draw() }
})

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) return closeModal()
  if (!$('#modal').hidden) return
  if (e.key === 'Escape' && !tip.hidden) { tip.hidden = true; return }
  if (e.key === 'Escape' && !bitPanel.hidden) return closeBit()
  if (e.target.closest && e.target.closest('input, textarea, #bit')) return
  if (!run || e.metaKey || e.ctrlKey || e.altKey) return
  if (e.key === 'Escape') return act.quit()
  if (e.key === 'Enter') {
    const main = $('.p-foot [data-main]', player)
    if (main && !main.disabled) { e.preventDefault(); main.click() }
    return
  }
  const st = run.steps[run.i]
  if (!st || !st.q || run.checked) return
  const q = st.q, n = parseInt(e.key, 10)
  if (e.key === 'Backspace') {
    if (q.type === 'fill') {
      const last = run.s.slots.map(v => v != null).lastIndexOf(true)
      if (last >= 0) run.s.slots[last] = null
    }
    if (q.type === 'order') run.s.slots.pop()
    return widget()
  }
  if (!n) return
  const btns = q.type === 'fill' ? [...player.querySelectorAll('.tile')]
    : q.type === 'order' ? [...player.querySelectorAll('.order-pool .line-tile')]
    : [...player.querySelectorAll('#w [data-act=pick]')]
  const b = btns[n - 1]
  if (b && !b.classList.contains('used')) b.click()
})

    }
    return { key: 'home', lang: null, text: 'The learner is on the home page, choosing which language to learn: Python, JavaScript, Java, C#, C++ or Lua.' }
  }
  const c = run.c, st = run.steps[run.i]
  const where = `${c.name} course, ${run.kind === 'lesson' ? `lesson "${run.title}" (${levelOf(c, run.id)} level)` : run.title.toLowerCase()}.`
  if (!st) return { key: 'end', lang: c, text: `The learner just finished a ${where}` }
  if (st.teach) {

    return {

    }
  }
  const q = st.q, s = run.s
  let t = `${where}\nThey are on a quiz question (${KIND[q.type]}).\nQuestion: ${q.prompt}`
  if (q.code) t += `\nCode:\n${q.code}`
  if (q.options) t += '\nChoices:\n' + q.options.map((o, i) => `${i + 1}) ${o}`).join('\n')
  if (q.type === 'tf') t += '\nChoices: True, False'
  if (q.type === 'bug') t += '\nLines:\n' + q.lines.map((l, i) => `${i + 1}: ${l}`).join('\n')
  if (q.type === 'fill') t += '\nWord tiles they can use: ' + s.bank.join('  |  ')
  if (q.type === 'order') t += '\nLines to put in order (shuffled):\n' + s.pool.map(i => q.lines[i]).join('\n')
  if (!run.checked) {
    t += '\nThey have NOT answered yet. Help them think, but never say which answer is right and never write the finished code for them.'
  } else {

      : q.type === 'bug' ? 'line ' + (s.sel + 1)
      : q.type === 'fill' ? s.slots.map(v => s.bank[v]).join(', ')
      : s.slots.map(i => q.lines[i]).join(' / ')
    const right = q.type === 'mcq' || q.type === 'output' ? q.options[q.answer]
      : q.type === 'tf' ? String(q.answer)
      : q.type === 'bug' ? 'line ' + (q.answer + 1)
      : q.type === 'fill' ? q.answer.join(', ')
      : q.lines.join(' / ')
    t += `\nThey answered: ${theirs}\nThat was ${r.ok ? 'RIGHT' : 'WRONG'}. The correct answer: ${right}\nThe lesson's own explanation: ${q.explain}`
  }
  return { key: run.id + ':' + run.i + (run.checked ? ':done' : ''), lang: c, question: true, checked: run.checked, ok: run.checked && grade().ok, text: t }
}

function rules(sc) {

  return `You are Bit, the friendly helper inside Codeling, an app that teaches coding with short lessons and pop quizzes. Right now the learner is learning ${lang}.

How to answer:
- Use plain, simple words, like explaining to a 12 year old who has never coded. Short sentences.
- Avoid jargon. If you must use a technical word, explain it right away in a few words.
- A quick everyday comparison often helps (boxes, labels, recipes, games).
- Keep it short: usually 2 to 6 short sentences, or a few bullet points. No big essays.
- If you show code, keep it tiny and in ${lang}. When walking through code, go one line at a time.
- Formatting: plain text. You may use \`backticks\` for code words, **bold**, "- " bullets, and \`\`\` code blocks. No headings, no tables.
- Only help with coding and this app's lessons. Be encouraging, never make them feel dumb.
- You can see the exact question or card they are on (below), so never ask them to paste it. "This question" means that one.
- If they are confused or ask for help step by step, coach them one small step at a time: say what the first step is, ask them one tiny question about it, then stop and wait for their reply. Only move to the next step after they answer. If they have not answered the quiz yet, never give away which answer is right, but you can say if their thinking is on track.

What is on the learner's screen right now:
${sc.text}`
}

// on your own website Bit talks to /api/bit (the Netlify function) instead of Claude-in-the-page
function remoteSample(sc) {
  return async (input, opts = {}) => {
    const u = me()
    if (!u) throw { code: 'login' }
    const stopped = () => opts.signal && opts.signal.aborted
    let r
    try {
      const token = await u.getIdToken()
      r = await fetch('/api/bit', {
        method: 'POST', signal: opts.signal,
        headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
        body: JSON.stringify({ lang: sc.lang && sc.lang.name, screen: sc.text, turns: input.slice(1) }),
      })
    } catch { throw { code: stopped() ? 'cancelled' : 'upstream_error' } }
    if (!r.ok) {
      const err = (await r.json().catch(() => ({}))).error
      throw { code: r.status === 401 ? 'login' : r.status === 429 ? 'rate_limited' : r.status === 404 ? 'no_server' : err === 'not_setup' ? 'not_setup' : 'upstream_error' }
    }
    const rd = r.body.getReader(), dec = new TextDecoder()
    let text = ''
    try {
      for (;;) {
        const { done, value } = await rd.read()
        if (done) break
        const delta = dec.decode(value, { stream: true })
        if (delta) { text += delta; opts.onText && opts.onText({ text, delta }) }
      }
    } catch { throw { code: stopped() ? 'cancelled' : 'upstream_error', text } }
    if (!text.trim()) throw { code: 'empty_completion' }
    return { text, truncated: false }
  }
}

const SORRY = {
  login: 'Log in first and I can help you. <button class="linkish" data-act="login">Log in</button>',
  no_server: 'I\'m not set up on this website yet. (The site owner needs to add the Bit function on Netlify.)',
  not_setup: 'I\'m almost ready! The site owner still needs to add the Claude key on Netlify.',
  rate_limited: 'I need a short break. Try again in a minute.',
  session_expired: 'You got signed out of Claude. Sign in again and I can help.',

async function ask(text) {
  if (!ai || chat.busy) return
  const sc = screen()
  if (sc.key !== chat.key) return openBit(text)
  addMsg('you', `<p>${esc(text)}</p>`)
  chat.turns.push({ role: 'user', content: text })
  const out = addMsg('bit', '<p class="thinking">Thinking<span>.</span><span>.</span><span>.</span></p>')
  const ctl = chat.ctl = new AbortController()
  const log = $('#bit-log')
  setBusy(true)
  try {
    const askFn = ai === 'remote' ? remoteSample(sc) : ai
    const { text: reply } = await askFn([{ role: 'user', content: rules(sc) }, ...chat.turns.slice(-12)], {
      modelTier: 'quick', cache: false, signal: ctl.signal,
      onText: ({ text: t }) => {
        out.innerHTML = rich(t, sc.lang && sc.lang.id)
        log.scrollTop = log.scrollHeight
      },
    })
    chat.turns.push({ role: 'assistant', content: reply })
  } catch (e) {
    chat.turns.pop()
    const code = e && e.code
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) {
      out.innerHTML = '<p>The helper is turned off here, so I can\'t answer. Tap the dotted words in lessons for quick meanings.</p>'
      aiGone()
    } else if (code === 'cancelled') {
      if (e.text) out.innerHTML = rich(e.text, sc.lang && sc.lang.id) + '<p class="cut">(stopped)</p>'
      else out.remove()
    } else {
      out.innerHTML = (e && e.text ? rich(e.text, sc.lang && sc.lang.id) : '') + `<p class="cut">${SORRY[code] || 'Something went wrong. Try again.'}</p>`
    }
  } finally {
    if (chat.ctl === ctl) setBusy(false)
  }
}

// turns Bit's reply (bits of markdown) into safe html
function rich(t, lang) {
  const html = []
  t.split('```').forEach((part, i) => {
    if (i % 2) {
      const nl = part.indexOf('\n')
      const code = nl >= 0 && /^[\w#+.-]*$/.test(part.slice(0, nl).trim()) ? part.slice(nl + 1) : part
      html.push(`<pre class="code">${lang ? hl(code.replace(/\n+$/, ''), lang) : esc(code.replace(/\n+$/, ''))}</pre>`)
      return
    }
    let list = []
    const flush = () => { if (list.length) html.push('<ul>' + list.map(l => `<li>${md(l)}</li>`).join('') + '</ul>'); list = [] }
    for (const line of part.split('\n')) {
      const m = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/)
      if (m) { list.push(m[1]); continue }
      flush()
      if (line.trim()) html.push(`<p>${md(line.replace(/^#+\s*/, ''))}</p>`)
    }
    flush()
  })
  return html.join('')
}

// monday-based week, like "2026w42"
function week(offsetWeeks = 0) {
  const d = new Date()
  d.setHours(0, 0, 0, 0)
  d.setDate(d.getDate() + offsetWeeks * 7 + 3 - ((d.getDay() + 6) % 7))
  const jan4 = new Date(d.getFullYear(), 0, 4)
  const n = 1 + Math.round(((d - jan4) / 864e5 - 3 + ((jan4.getDay() + 6) % 7)) / 7)
  return d.getFullYear() + 'w' + String(n).padStart(2, '0')
}
function weekEnds() {
  const d = new Date()
  d.setHours(24, 0, 0, 0)
  while (d.getDay() !== 1) d.setDate(d.getDate() + 1)
  return d
}
function untilText(t) {
  const ms = Math.max(0, t - Date.now()), h = Math.floor(ms / 36e5), m = Math.floor(ms / 6e4) % 60
  return h >= 24 ? `${Math.floor(h / 24)}d ${h % 24}h` : h ? `${h}h ${m}m` : `${m}m`
}
const tomorrow = () => { const d = new Date(); d.setHours(24, 0, 0, 0); return d }

const bucket = (store, key) => (store[key] = store[key] || { answered: 0, correct: 0, xp: 0, lessons: 0, perfect: 0, practice: 0, combo: 0, fixed: 0, byLang: {} })

const thisWeek = () => bucket(save.weekly, week())

// keep the save small: drop old days and weeks
function prune() {
  const cut = day(-20), wcut = week(-4)
  for (const k of Object.keys(save.daily)) if (k < cut) delete save.daily[k]
  for (const k of Object.keys(save.weekly)) if (k < wcut) delete save.weekly[k]
  for (const k of Object.keys(save.claimed)) if (k.length === 10 ? k < cut : k < wcut) delete save.claimed[k]
  if (save.mistakes.length > 150) save.mistakes = save.mistakes.slice(-150)
}

function seeded(s) {
  let h = 2166136261
  for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619)
  return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296
}

// todays quests are picked from the date, so everyone gets the same ones
function questsFor(key, tiers) {
  const r = seeded(key)
  const started = COURSES.filter(c => doneAll(c) > 0).map(c => c.id)
  const langs = started.length ? started : ['python', 'javascript', 'csharp']
  return tiers.map(t => {
    const pool = QUESTS[t]
    const q = pool[Math.floor(r() * pool.length)]
    const lang = langs[Math.floor(r() * langs.length)]
    return { ...q, uid: key + ':' + t + ':' + q.id, tier: t, lang: q.lang ? lang : null, text: q.text.replace('{lang}', LANG_NAMES[lang]), reward: REWARD[t] }
  })
}
const dailyQuests = () => questsFor(day(), ['easy', 'medium', 'hard'])
const weeklyQuests = () => questsFor(week(), ['week'])

function questState(q) {
  const b = q.tier === 'week' ? thisWeek() : today()
  const have = Math.min(q.need, q.of(b, q.lang) || 0)
  const key = q.tier === 'week' ? week() : day()
  const claimed = (save.claimed[key] || []).includes(q.uid)
  return { have, done: have >= q.need, claimed }
}
const allQuests = () => [...dailyQuests(), ...weeklyQuests()]
const claimable = () => allQuests().filter(q => { const s = questState(q); return s.done && !s.claimed }).length

function claim(uid) {
  const q = allQuests().find(x => x.uid === uid)
  if (!q) return
  const s = questState(q)
  if (!s.done || s.claimed) return
  const key = q.tier === 'week' ? week() : day()
  ;(save.claimed[key] = save.claimed[key] || []).push(uid)
  save.stats.quests++

// ---- merging the save on this device with the one in the cloud

function mergeSaves(a, b) {
  if (!b) return a
  const out = JSON.parse(JSON.stringify(a))
  const maxNums = (x, y) => { for (const [k, v] of Object.entries(y || {})) if (typeof v === 'number') x[k] = Math.max(x[k] || 0, v); else if (v && typeof v === 'object') x[k] = maxNums(x[k] || {}, v); return x }
  out.xp = Math.max(a.xp || 0, b.xp || 0)
  if ((b.last || '') > (a.last || '')) { out.last = b.last; out.streak = b.streak } else if (b.last === a.last) out.streak = Math.max(a.streak, b.streak)
  out.days = maxNums(out.days || {}, b.days)
  for (const [id, v] of Object.entries(b.done || {})) if (!out.done[id] || out.done[id].score < v.score) out.done[id] = v
  out.level = Object.assign({}, b.level, a.level)
  out.stats = maxNums(out.stats, b.stats)
  out.daily = maxNums(out.daily, b.daily)
  out.weekly = maxNums(out.weekly, b.weekly)
  for (const [k, v] of Object.entries(b.claimed || {})) out.claimed[k] = [...new Set([...(out.claimed[k] || []), ...v])]
  for (const [k, v] of Object.entries(b.trophies || {})) if (!out.trophies[k] || v < out.trophies[k]) out.trophies[k] = v
  const keys = new Set(out.mistakes.map(m => m.k))
  for (const m of b.mistakes || []) if (!keys.has(m.k)) out.mistakes.push(m)
  if (b.profile && b.profile.name) out.profile = b.profile
  if ((b.leagueWeek || '') >= (out.leagueWeek || '')) { out.league = b.league; out.leagueWeek = b.leagueWeek }
  return out
}

const SYNC_KEYS = ['xp', 'streak', 'last', 'days', 'done', 'level', 'stats', 'daily', 'weekly', 'claimed', 'trophies', 'mistakes', 'profile', 'league', 'leagueWeek']
const syncable = () => Object.fromEntries(SYNC_KEYS.map(k => [k, save[k]]))

async function pullAndMerge() {
  const u = me()
  try {
    const snap = await cloud.db.collection('users').doc(u.uid).get()
    const theirs = snap.exists ? snap.data().save : null
    save = Object.assign(save, mergeSaves(save, theirs))
    if (!save.profile.name) save.profile.name = (u.displayName || 'coder').replace(/[^\w]/g, '').slice(0, 20) || 'coder'
    await rollLeague()
    checkTrophies()
    store(true)
    await push()
  } catch (e) {
    console.warn('sync failed', e)
    toast('Could not sync', 'Your progress is safe on this device. It will sync next time.')
  }
}

let pushTimer = null
function schedulePush() {
  if (!cloud.on || !me()) return
  clearTimeout(pushTimer)
  pushTimer = setTimeout(push, 2500)
}

async function push() {
  const u = me()
  if (!u) return
  clearTimeout(pushTimer)
  const w = week()
  const pub = {
    name: save.profile.name, color: save.profile.color, xp: save.xp, streak: streak(), league: save.league,
    lessons: COURSES.reduce((n, c) => n + doneAll(c), 0), trophies: Object.keys(save.trophies),
    [wkField(w)]: (save.weekly[w] || {}).xp || 0, [lgField(w)]: save.league,
    updated: firebase.firestore.FieldValue.serverTimestamp(),
  }
  try {
    await Promise.all([
      cloud.db.collection('users').doc(u.uid).set({ save: syncable(), updated: pub.updated }),
      cloud.db.collection('profiles').doc(u.uid).set(pub, { merge: true }),
    ])
  } catch (e) { console.warn('push failed', e) }
}

// once a week: look at how you placed last week and move you up or down a league
async function rollLeague() {
  const w = week()
  if (save.leagueWeek === w) return
  const last = week(-1)
  const was = save.league || 0
  if (save.leagueWeek === last && cloud.on) {
    try {
      const snap = await cloud.db.collection('profiles').orderBy(wkField(last), 'desc').limit(300).get()
      const group = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => (p[lgField(last)] || 0) === was && p[wkField(last)] > 0)
      const rank = group.findIndex(p => p.id === me().uid) + 1
      if (rank && rank <= 7 && was < LEAGUES.length - 1) save.league = was + 1
      else if (rank && group.length >= 12 && rank > group.length - 3 && was > 0) save.league = was - 1
      else if (!rank && was > 0) save.league = was - 1
    } catch (e) { console.warn('league check failed', e) }
  }
  save.leagueWeek = w
  if (save.league > was) toast('Promoted!', `You moved up to the ${LEAGUES[save.league].name} league.`, 'quest')
  else if (save.league < was) toast('New week', `You're in the ${LEAGUES[save.league].name} league this week. Climb back up!`)
}

const AUTH_ERR = {
  'auth/email-already-in-use': 'That email already has an account. Try logging in.',
  'auth/invalid-email': 'That email doesn\'t look right.',
  'auth/weak-password': 'Use at least 6 characters for your password.',

  'taken': 'That username is taken. Try another one.',
}
const authErr = e => AUTH_ERR[e && e.code] || AUTH_ERR[e && e.message] || 'Something went wrong. Try again.'
const cleanName = s => String(s || '').trim()
const nameOk = s => /^[A-Za-z0-9_]{3,20}$/.test(s)

async function claimName(name, uid) {
  const ref = cloud.db.collection('usernames').doc(name.toLowerCase())
  await cloud.db.runTransaction(async t => {
    const s = await t.get(ref)
    if (s.exists && s.data().uid !== uid) throw { code: 'taken' }
    t.set(ref, { uid })
  })
}

function authModal(mode = 'login', err = '') {
  const sign = mode === 'signup'
  modal(`
    <div class="auth">
      ${bit()}
      <h2>${sign ? 'Make your account' : 'Welcome back'}</h2>
      <p class="muted">${sign ? 'Save your progress, climb the leaderboard and show off your trophies.' : 'Log in to pick up where you left off.'}</p>
      <div class="seg" role="tablist">
        <button role="tab" aria-selected="${!sign}" data-act="authmode" data-m="login">Log in</button>
        <button role="tab" aria-selected="${sign}" data-act="authmode" data-m="signup">Sign up</button>
      </div>
      <form id="auth-form" class="form">
        ${sign ? `<label for="a-name">Username</label><input id="a-name" autocomplete="username" maxlength="20" placeholder="letters, numbers and _">` : ''}
        <label for="a-email">Email</label><input id="a-email" type="email" autocomplete="email">
        <label for="a-pass">Password</label><input id="a-pass" type="password" autocomplete="${sign ? 'new-password' : 'current-password'}" minlength="6">
        <p class="err" id="a-err" role="alert">${esc(err)}</p>
        <button class="btn wide" type="submit">${sign ? 'Create account' : 'Log in'}</button>
      </form>
      <div class="or"><span>or</span></div>
      <button class="btn ghost wide" data-act="google">Continue with Google</button>
      ${sign ? '' : `<button class="linkish" data-act="forgot">Forgot your password?</button>`}
    </div>`)
  $('#auth-form').addEventListener('submit', async e => {
    e.preventDefault()
    const email = $('#a-email').value.trim(), pass = $('#a-pass').value
    const errEl = $('#a-err'), btn = e.target.querySelector('button[type=submit]')
    errEl.textContent = ''
    btn.disabled = true
    try {
      if (sign) {
        const name = cleanName($('#a-name').value)
        if (!nameOk(name)) throw { message: 'Usernames are 3 to 20 letters, numbers or _.' }
        const before = save.profile.name
        save.profile.name = name
        const cred = await cloud.auth.createUserWithEmailAndPassword(email, pass).catch(x => { save.profile.name = before; throw x })
        try { await claimName(name, cred.user.uid) } catch (x) { save.profile.name = before; await cred.user.delete().catch(() => {}); throw x }
        store()
        await push()
      } else {
        await cloud.auth.signInWithEmailAndPassword(email, pass)
      }
      closeModal()
      toast(sign ? 'Account made!' : 'Logged in', sign ? 'Your progress is saved to your account now.' : 'Your progress is synced.', 'quest')
    } catch (x) {
      errEl.textContent = x.message && !x.code ? x.message : authErr(x)
      btn.disabled = false
    }
  })
}

async function googleIn() {
  try {
    await cloud.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
    closeModal()
    const u = me()
    if (u && !(await cloud.db.collection('usernames').where('uid', '==', u.uid).limit(1).get()).size) {
      let base = (u.displayName || 'coder').replace(/[^\w]/g, '').slice(0, 14) || 'coder'
      for (let i = 0; i < 5; i++) {
        const n = i ? base + Math.floor(Math.random() * 9000 + 1000) : base
        try { await claimName(n, u.uid); save.profile.name = n; break } catch {}
      }
      store()
      push()
    }
  } catch (x) {
    const e = $('#a-err')
    if (e) e.textContent = authErr(x)
  }
}

async function forgot() {
  const email = ($('#a-email') || {}).value
  const e = $('#a-err')
  if (!email) { e.textContent = 'Type your email above first.'; return }
  try { await cloud.auth.sendPasswordResetEmail(email.trim()); e.textContent = 'Check your email for a reset link.' }
  catch (x) { e.textContent = authErr(x) }

async function rename(name) {
  name = cleanName(name)
  if (!nameOk(name)) return 'Usernames are 3 to 20 letters, numbers or _.'
  if (cloud.on && me()) {
    try {
      await claimName(name, me().uid)
      const old = save.profile.name
      if (old && old.toLowerCase() !== name.toLowerCase()) cloud.db.collection('usernames').doc(old.toLowerCase()).delete().catch(() => {})
    } catch (x) { return authErr(x) }
  }
  save.profile.name = name
  store()
  return ''
}
