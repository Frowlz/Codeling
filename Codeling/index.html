    </section>
    <section class="card">
      <div class="row-h"><h2>Weekly quest</h2><span class="muted">Ends in ${untilText(weekEnds())}</span></div>
      <div class="quests">${w.map(questRow).join('')}</div>
    </section>
    <section class="card">
      <h2>Today so far</h2>
      <div class="tiles">
        <div><b>${t.answered}</b><span>questions</span></div>
        <div><b>${t.answered ? Math.round((t.correct / t.answered) * 100) : 0}%</b><span>right</span></div>
        <div><b>${t.lessons}</b><span>lessons</span></div>
        <div><b>${t.combo}</b><span>best streak in a row</span></div>
      </div>
    </section>
    ${mistakeCard()}
  </div>`
}

function mistakeCard(cid) {
  const all = mistakeQs(cid)
  const byLang = {}
  for (const m of all) byLang[m.cid] = (byLang[m.cid] || 0) + 1
  const langs = Object.entries(byLang)
  return `<section class="card">
    <div class="row">${ic('check')}<h2>Mistakes to fix</h2></div>
    <p class="muted">${all.length ? 'Questions you got wrong come back here. Get one right and it leaves the list.' : 'Nothing here. Questions you get wrong will show up here so you can try them again later.'}</p>
    ${langs.length ? `<div class="fixes">${langs.map(([c, n]) => `<button class="btn ghost" data-act="mistakes" data-c="${c}" style="${tint(c)}">${esc(LANG_NAMES[c])} <span class="pill">${n}</span></button>`).join('')}</div>` : ''}
  </section>`
}

// ---- leaderboard

let board = { tab: 'league', rows: null, err: '', loading: false, key: '' }

async function loadBoard() {
  const key = board.tab + week()
  if (board.loading || board.key === key) return
  board = { ...board, loading: true, err: '', key }
  try {
    const q = board.tab === 'league'
      ? cloud.db.collection('profiles').orderBy(wkField(), 'desc').limit(200)
      : cloud.db.collection('profiles').orderBy('xp', 'desc').limit(50)
    const snap = await q.get()
    let rows = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    if (board.tab === 'league') rows = rows.filter(r => (r[lgField()] ?? r.league ?? 0) === (save.league || 0))
    board.rows = rows
  } catch (e) {
    console.warn(e)
    board.err = 'Could not load the leaderboard. Check your internet and try again.'
    board.key = ''
  }
  board.loading = false
  if (view.page === 'board') draw()
}

function boardPage() {
  const lg = LEAGUES[save.league || 0]
  const head = `<div class="league-head" style="--lg:${lg.color}">
      <svg viewBox="0 0 48 48" class="shield" aria-hidden="true"><path d="M24 3l17 6v13c0 11-7 19-17 23C14 41 7 33 7 22V9z"/></svg>
      <div><small>This week</small><h1>${lg.name} League</h1><p>Top 7 move up a league. Ends in ${untilText(weekEnds())}.</p></div>
    </div>
    <div class="seg" role="tablist">
      <button role="tab" aria-selected="${board.tab === 'league'}" data-act="boardtab" data-t="league">My league</button>
      <button role="tab" aria-selected="${board.tab === 'all'}" data-act="boardtab" data-t="all">All time</button>
    </div>`
  if (!cloud.on) {
    return `<div class="wrap narrow">${head}<section class="card">
      <h2>Leaderboards need accounts</h2>
      <p class="muted">${inClaude ? 'Accounts and leaderboards work on the version of Codeling you host yourself (for example on GitHub Pages).' : 'Accounts aren\'t set up on this copy of Codeling yet. The person running it needs to add a Firebase config (see the setup guide).'}</p>
      ${boardTable([{ id: 'me', name: myName(), color: save.profile.color, xp: save.xp, [wkField()]: thisWeek().xp }], 'me')}
    </section></div>`
  }
  if (!me()) {
    return `<div class="wrap narrow">${head}<section class="card center">
      ${bit()}<h2>Log in to join the league</h2><p class="muted">Compete with other learners every week. Your progress so far comes with you.</p>
      <button class="btn" data-act="login">Log in or sign up</button></section></div>`
  }
  loadBoard()
  const body = board.err ? `<p class="err">${board.err}</p><button class="btn ghost" data-act="boardretry">Try again</button>`
    : !board.rows ? `<p class="muted">Loading...</p>`
    : boardTable(board.rows, me().uid)
  return `<div class="wrap narrow">${head}<section class="card">${body}</section></div>`
}

function boardTable(rows, myId) {
  const weekly = board.tab === 'league'
  const val = r => weekly ? (r[wkField()] || 0) : (r.xp || 0)
  rows = rows.slice().sort((a, b) => val(b) - val(a))
  if (!rows.some(r => r.id === myId)) rows.push({ id: myId, name: myName(), color: save.profile.color, xp: save.xp, [wkField()]: thisWeek().xp })
  if (!rows.length) return '<p class="muted">Nobody has XP this week yet. Do a lesson and take first place.</p>'
  return `<ol class="board">${rows.map((r, i) => {
    const zone = weekly ? (i < 7 ? ' up' : rows.length >= 12 && i >= rows.length - 3 ? ' down' : '') : ''
    return `<li class="${r.id === myId ? 'me' : ''}${zone}">
      <span class="rank">${i + 1}</span>
      <button class="who" data-act="user" data-u="${esc(r.id)}" ${r.id === 'me' ? 'disabled' : ''}>${avatar(r.name, r.color, 36)}<b>${esc(r.name || 'coder')}${r.id === myId ? ' <em>(you)</em>' : ''}</b></button>
      <span class="xpv">${val(r)} XP</span></li>`
  }).join('')}</ol>`
}

// ---- profile

function profilePage() {
  const s = save.stats
  const got = TROPHIES.filter(t => save.trophies[t.id])
  const last7 = [...Array(7)].map((_, i) => { const k = day(i - 6); return { k, xp: (save.daily[k] || {}).xp || save.days[k] || 0 } })
  const top = Math.max(30, ...last7.map(d => d.xp))
  const acct = !cloud.on ? `<p class="muted small">Progress is saved in this browser.</p>`
    : me() ? `<div class="acct"><span class="muted small">Logged in${me().email ? ' as ' + esc(me().email) : ''}</span><button class="linkish" data-act="logout">Log out</button></div>`
    : `<button class="btn" data-act="login">Log in or sign up to save it</button>`
  return `<div class="wrap narrow">
    <section class="card profile-top">
      ${avatar(myName(), save.profile.color, 76)}
      <div class="p-id">
        <h1>${esc(myName())}</h1>
        <p class="muted">${LEAGUES[save.league || 0].name} League · ${save.xp} XP · ${streak()} day streak</p>
        <div class="p-actions">
          <button class="btn ghost" data-act="editprofile">Edit profile</button>
          <button class="btn" data-act="share">Share my trophies</button>
        </div>
        ${acct}
      </div>
    </section>
    <section class="card">
      <h2>Last 7 days</h2>
      <svg class="week-chart" viewBox="0 0 340 130" role="img" aria-label="XP earned each of the last 7 days">
        ${last7.map((d, i) => {
          const h = Math.round((d.xp / top) * 90), x = 14 + i * 46
          const lbl = new Date(d.k + 'T12:00').toLocaleDateString(undefined, { weekday: 'short' })
          return `<rect x="${x}" y="${100 - h}" width="34" height="${Math.max(h, 2)}" rx="5" class="${i === 6 ? 'now' : ''}"/>
            <text x="${x + 17}" y="${94 - h}" class="v">${d.xp || ''}</text><text x="${x + 17}" y="120" class="d">${lbl}</text>`
        }).join('')}
      </svg>
    </section>
    <section class="card">
      <h2>Stats</h2>
      <div class="tiles">
        <div><b>${s.answered}</b><span>questions answered</span></div>
        <div><b>${s.answered ? Math.round((s.correct / s.answered) * 100) : 0}%</b><span>answered right</span></div>
        <div><b>${COURSES.reduce((n, c) => n + doneAll(c), 0)}</b><span>lessons done</span></div>
        <div><b>${s.combo}</b><span>most in a row</span></div>
      </div>
      <div class="lang-bars">${COURSES.map(c => `<div style="${tint(c.id)}"><span>${esc(c.name)}</span><span class="bar"><i style="width:${(doneAll(c) / 15) * 100}%"></i></span><span>${doneAll(c)}/15</span></div>`).join('')}</div>
    </section>
    <section class="card">
      <div class="row-h"><h2>Trophies</h2><span class="muted">${got.length} of ${TROPHIES.length}</span></div>
      <div class="shelf">${TROPHIES.map(t => {
        const have = !!save.trophies[t.id]
        const p = Math.min(t.need, t.of())
        return `<div class="trophy${have ? '' : ' off'}" title="${esc(t.desc)}">${medal(t, !have)}
          <b>${esc(t.name)}</b><span>${have ? esc(t.desc) : `${p}/${t.need} · ${esc(t.desc)}`}</span></div>`
      }).join('')}</div>
    </section>
  </div>`
}

function editProfile() {
  modal(`<div class="auth"><h2>Edit profile</h2>
    <form id="p-form" class="form">
      <label for="p-name">Username</label><input id="p-name" maxlength="20" value="${esc(save.profile.name)}">
      <label>Color</label>
      <div class="swatches">${AVATARS.map((c, i) => `<button type="button" class="sw${i === (save.profile.color || 0) ? ' on' : ''}" style="--av:${c}" data-act="swatch" data-i="${i}" aria-label="Color ${i + 1}"></button>`).join('')}</div>
      <p class="err" id="p-err" role="alert"></p>
      <button class="btn wide" type="submit">Save</button>
    </form></div>`)
  $('#p-form').addEventListener('submit', async e => {
    e.preventDefault()
    const n = $('#p-name').value.trim()
    if (n !== save.profile.name) {
      const err = await rename(n)
      if (err) { $('#p-err').textContent = err; return }
    }
    store()
    closeModal()
    draw()
  })
}

// someone elses profile (from the leaderboard or a shared link)
let other = { id: '', data: null, err: '' }
async function loadUser(id) {
  other = { id, data: null, err: '' }
  try {
    const s = await cloud.db.collection('profiles').doc(id).get()
    other.data = s.exists ? s.data() : null
    if (!s.exists) other.err = 'That player doesn\'t exist anymore.'
  } catch { other.err = 'Could not load this profile.' }
  if (view.page === 'user') draw()
}
function userPage() {
  if (!cloud.on) return `<div class="wrap narrow"><section class="card"><p class="muted">Profiles need accounts, which aren't set up on this copy of Codeling.</p></section></div>`
  if (other.id !== view.uid) loadUser(view.uid)
  const p = other.data
  if (!p) return `<div class="wrap narrow"><section class="card"><p class="${other.err ? 'err' : 'muted'}">${other.err || 'Loading...'}</p></section></div>`
  const have = new Set(p.trophies || [])
  return `<div class="wrap narrow">
    <button class="back" data-act="nav" data-p="board">${ic('left')}Leaderboard</button>
    <section class="card profile-top">${avatar(p.name, p.color, 76)}
      <div class="p-id"><h1>${esc(p.name)}</h1><p class="muted">${LEAGUES[p.league || 0].name} League · ${p.xp || 0} XP · ${p.streak || 0} day streak · ${p.lessons || 0} lessons</p></div></section>
    <section class="card"><div class="row-h"><h2>Trophies</h2><span class="muted">${have.size} of ${TROPHIES.length}</span></div>
      <div class="shelf">${TROPHIES.filter(t => have.has(t.id)).map(t => `<div class="trophy">${medal(t)}<b>${esc(t.name)}</b><span>${esc(t.desc)}</span></div>`).join('') || '<p class="muted">No trophies yet.</p>'}</div></section>
  </div>`
}

// ---- share card: an image of your trophies + a link to your profile

function shareCard() {
  const cv = document.createElement('canvas')
  cv.width = 1080; cv.height = 1080
  const g = cv.getContext('2d')
  const css = getComputedStyle(document.documentElement)
  const tok = n => css.getPropertyValue(n).trim()
  const font = (w, s, fam) => `${w} ${s}px ${fam || 'Bricolage Grotesque, Segoe UI, sans-serif'}`
  g.fillStyle = '#121a30'; g.fillRect(0, 0, 1080, 1080)
  g.fillStyle = '#3355ff'; g.beginPath(); g.arc(980, 120, 260, 0, 7); g.fill()
  g.fillStyle = '#1e2742'; g.beginPath(); g.arc(80, 1040, 220, 0, 7); g.fill()
  g.fillStyle = AVATARS[(save.profile.color || 0) % AVATARS.length]; g.beginPath(); g.arc(150, 170, 70, 0, 7); g.fill()
  g.fillStyle = '#fff'; g.font = font(800, 72); g.textAlign = 'center'; g.textBaseline = 'middle'
  g.fillText(myName()[0].toUpperCase(), 150, 174)
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'
  g.font = font(800, 64); g.fillText(myName(), 250, 165)
  g.fillStyle = '#9fb0ff'; g.font = font(700, 30, 'Figtree, Segoe UI, sans-serif')
  g.fillText(`${LEAGUES[save.league || 0].name} League  ·  ${save.xp} XP  ·  ${streak()} day streak`, 252, 215)
  const got = TROPHIES.filter(t => save.trophies[t.id])
  const boxes = [[COURSES.reduce((n, c) => n + doneAll(c), 0), 'lessons'], [save.stats.answered, 'questions'], [save.stats.combo, 'best in a row']]
  boxes.forEach(([v, label], i) => {
    const x = 90 + i * 310
    g.fillStyle = '#1e2742'; g.beginPath(); g.roundRect(x, 270, 280, 120, 24); g.fill()
    g.fillStyle = '#fff'; g.font = font(800, 54); g.fillText(String(v), x + 26, 340)
    g.fillStyle = '#9fb0ff'; g.font = font(700, 24, 'Figtree, Segoe UI, sans-serif'); g.fillText(label, x + 28, 372)
  })
  g.fillStyle = '#fff'; g.font = font(800, 44); g.fillText(`${got.length} ${got.length === 1 ? 'trophy' : 'trophies'}`, 90, 480)
  const tierCol = { bronze: '#c9814b', silver: '#b8c2d6', gold: '#f2b705' }
  if (got.length > 12) { g.fillStyle = '#9fb0ff'; g.font = font(700, 26, 'Figtree, Segoe UI, sans-serif'); g.fillText(`+${got.length - 12} more`, 820, 478) }
  got.slice(0, 12).forEach((t, i) => {
    const x = 90 + (i % 3) * 310, y = 520 + Math.floor(i / 3) * 96
    g.fillStyle = tierCol[t.tier]; g.beginPath(); g.arc(x + 30, y + 28, 28, 0, 7); g.fill()
    g.fillStyle = '#121a30'; g.beginPath(); g.arc(x + 30, y + 28, 19, 0, 7); g.fill()
    g.fillStyle = '#fff'; g.font = font(700, 26, 'Figtree, Segoe UI, sans-serif')
    g.fillText(t.name.length > 16 ? t.name.slice(0, 15) + '…' : t.name, x + 72, y + 37)
  })
  if (!got.length) { g.fillStyle = '#9fb0ff'; g.font = font(600, 30, 'Figtree, Segoe UI, sans-serif'); g.fillText('Just getting started!', 90, 540) }
  g.fillStyle = '#fff'; g.font = font(800, 40); g.fillText('codeling', 90, 1000)
  g.fillStyle = '#9fb0ff'; g.font = font(600, 26, 'Figtree, Segoe UI, sans-serif'); g.fillText('learn to code a few minutes at a time', 300, 998)
  return cv
}

function profileLink() {
  if (!cloud.on || !me()) return ''
  return location.origin + location.pathname + '#u-' + me().uid
}

function sharePanel() {
  const cv = shareCard()
  const url = profileLink()
  const img = cv.toDataURL('image/png')
  modal(`<div class="auth share">
    <h2>Share your trophies</h2>
    <img src="${img}" alt="Your trophy card: ${esc(myName())}, ${save.xp} XP, ${Object.keys(save.trophies).length} trophies" class="share-img">
    ${url ? `<label for="s-url">Link to your profile</label><div class="copy"><input id="s-url" value="${esc(url)}" readonly><button class="btn" data-act="copy">Copy</button></div>`
      : `<p class="muted small">${cloud.on ? 'Log in to get a link to your profile.' : 'Save the picture and post it anywhere.'}</p>`}
    <div class="p-actions">
      ${inClaude ? '' : `<a class="btn ghost" download="codeling-trophies.png" href="${img}">Save picture</a>`}
      ${navigator.share ? `<button class="btn ghost" data-act="nativeshare">Share...</button>` : ''}
    </div>
  </div>`)
  sharePanel.canvas = cv
}

async function nativeShare() {
  const url = profileLink()
  try {
    const blob = await new Promise(r => sharePanel.canvas.toBlob(r, 'image/png'))
    const file = new File([blob], 'codeling-trophies.png', { type: 'image/png' })
    const data = { title: 'My Codeling trophies', text: `I have ${Object.keys(save.trophies).length} trophies on Codeling!`, url: url || undefined }
    if (navigator.canShare && navigator.canShare({ files: [file] })) data.files = [file]
    await navigator.share(data)
  } catch {}
}

async function copyLink() {
  const i = $('#s-url')
  try { await navigator.clipboard.writeText(i.value); toast('Copied', 'Paste the link anywhere to share your profile.') }
  catch { i.select() }
}

// ---- lesson notes: read the cards again without the quiz

function notesPage() {
  const c = course(view.course), les = findLesson(c, view.lesson)
  return `<div class="wrap narrow">
    <button class="back" data-act="open" data-c="${c.id}">${ic('left')}${esc(c.name)}</button>
    <div class="page-h"><small class="kicker">${ic('book')}Lesson notes</small><h1>${esc(les.title)}</h1><p>${mdx(les.summary)}</p></div>
    ${les.teach.map((t, i) => `<section class="card note"><span class="n">${i + 1}</span><p>${mdx(t.text)}</p>${t.code ? codeBlock(t.code, c.id) : ''}</section>`).join('')}
    <div class="p-actions"><button class="btn" data-act="start" data-id="${les.id}">Take the quiz</button>
      <button class="helper ai" data-act="bit" data-ask="Summarize this lesson in 3 short bullet points.">Ask Bit to sum it up</button></div>
  </div>`
}

// a link like ...#python jumps straight into that course
const start = location.hash.slice(1)
if (course(start)) view = { page: save.level[start] ? 'course' : 'pick', course: start }
else if (/^u-[\w-]+$/.test(start)) view = { page: 'user', uid: start.slice(2) }
if (!FIRE || inClaude) rollLeague()
checkTrophies()
draw()
startCloud()
setInterval(() => { if (!run && $('#modal').hidden && ['quests', 'board'].includes(view.page)) draw() }, 60000)

</script>
