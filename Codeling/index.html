nst auto& w : words) {\n    counts[w]++;\n}\nstd::cout << counts[\"hi\"] << counts[\"yo\"];","options":["31","13","22","4"],"answer":0,"explain":"Each word starts at 0 the first time it is seen and goes up by one each time. \"hi\" appears 3 times, \"yo\" once."}]},{"id":"cpp-i4","title":"Working with text","summary":"Length, substr, find, and number conversion","teach":[{"text":"A `std::string` knows its `length()`. You can read single characters with `[i]`, starting at 0. `back()` gives the last character.","code":"std::string word = \"Unity\";\nstd::cout << word.length() << \"\\n\";  // 5\nstd::cout << word[0] << \"\\n\";        // U\nstd::cout << word.back() << \"\\n\";    // y"},{"text":"`substr(start, count)` copies part of a string. Leave out `count` to go to the end. `find` returns the index where some text starts.","code":"std::string s = \"Hello, world\";\nstd::cout << s.substr(0, 5) << \"\\n\";   // Hello\nstd::cout << s.substr(7) << \"\\n\";      // world\nstd::cout << s.find(\"world\") << \"\\n\";  // 7"},{"text":"If `find` cannot find the text, it returns the special value `std::string::npos`. Always compare against it before using the result.","code":"std::string s = \"banana\";\nif (s.find(\"x\") == std::string::npos) {\n    std::cout << \"not found\\n\";   // not found\n}\nstd::cout << s.find(\"an\") << \"\\n\"; // 1"},{"text":"Strings can be changed: `+=` adds to the end, `s[i] = ...` swaps one character, and `replace(start, count, text)` swaps a section.","code":"std::string s = \"cat\";\ns += \"s\";              // now: cats\ns[0] = 'b';            // now: bats\ns.replace(0, 1, \"h\");  // now: hats\nstd::cout << s;        // hats"},{"text":"Convert numbers to text with `std::to_string`. Convert text to numbers with `std::stoi` (to int) and `std::stod` (to double).","code":"int lives = 3;\nstd::string text = \"Lives: \" + std::to_string(lives);\nstd::cout << text << \"\\n\";           // Lives: 3\nint n = std::stoi(\"42\");\ndouble d = std::stod(\"2.5\");\nstd::cout << n + 1 << \" \" << d * 2;  // 43 5"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"std::string s = \"keyboard\";\nstd::cout << s.substr(3, 5);","options":["keybo","board","boar","yboard"],"answer":1,"explain":"Start at index 3 (the `b`) and take 5 characters: b, o, a, r, d."},{"type":"output","prompt":"What does this print?","code":"std::string s = \"racecar\";\nstd::cout << s.find(\"car\") << \" \" << s.length();","options":["3 7","4 6","5 7","4 7"],"answer":3,"explain":"r-a-c-e are indexes 0 to 3, so \"car\" starts at index 4. The word has 7 letters."},{"type":"fill","prompt":"Turn the text into a number so it prints 25.","code":"std::string input = \"20\";\nint n = std::___(input);\nstd::cout << n + 5;","bank":["stoi","to_string","toInt","parse"],"answer":["stoi"],"explain":"`std::stoi` means \"string to int\". `std::to_string` goes the other way."},{"type":"output","prompt":"What does this print?","code":"std::string a = \"7\";\nstd::cout << a + \"7\" << \" \" << std::stoi(a) + 7;","options":["14 14","77 77","77 14","14 77"],"answer":2,"explain":"`a + \"7\"` joins two strings. `std::stoi(a)` turns the text into the number 7 first, so adding gives 14."},{"type":"bug","prompt":"Tap the line with the bug.","lines":["std::string name = \"Ada\";","int age = 36;","std::string msg = name + \" is \" + age;","std::cout << msg;"],"answer":2,"explain":"You cannot add an int to a string. Use `std::to_string(age)` to convert it first."},{"type":"tf","prompt":"`s.substr(2)` gives everything from index 2 to the end of `s`.","answer":true,"explain":"When you leave out the count, `substr` takes the rest of the string."},{"type":"mcq","prompt":"What does `s.find(\"z\")` return when \"z\" is not in `s`?","options":["-1","0","std::string::npos","An empty string"],"answer":2,"explain":"`npos` is a special very large number meaning \"not found\". Compare with it, not with -1."},{"type":"output","prompt":"What does this print?","code":"std::string s = \"a-b-c\";\nint dashes = 0;\nfor (char c : s) {\n    if (c == '-') dashes++;\n}\nstd::cout << dashes << s.length();","options":["23","25","35","2 5"],"answer":1,"explain":"The loop finds two dashes, and the string has 5 characters. Nothing prints a space between them."}]},{"id":"cpp-i5","title":"Classes and objects","summary":"Fields, constructors, methods, and private","teach":[{"text":"A **class** is a blueprint. It groups data (**fields**) and functions (**methods**) together. Members under `public:` can be used from outside. Notice the `;` after the closing brace.","code":"class Player {\npublic:\n    std::string name;\n    int health = 100;\n\n    void takeDamage(int amount) {\n        health -= amount;\n    }\n};"},{"text":"An **object** is one thing built from the class. Create it like a variable, then use `.` to reach its fields and methods.","code":"Player p;\np.name = \"Rin\";\np.takeDamage(30);\nstd::cout << p.name << \" \" << p.health;  // Rin 70"},{"text":"A **constructor** runs when an object is created. It has the class name and no return type. The **member initializer list** after the `:` sets each field directly.","code":"class Enemy {\npublic:\n    std::string type;\n    int hp;\n    Enemy(std::string t, int h) : type(t), hp(h) {}\n};\n// in main:\nEnemy e(\"Slime\", 15);\nstd::cout << e.type << \" \" << e.hp;  // Slime 15"},{"text":"Make fields `private:` to protect them. Outside code must go through public methods, which can check the values. A method marked `const` promises not to change the object.","code":"class Wallet {\nprivate:\n    int coins = 0;\npublic:\n    void add(int n) { if (n > 0) coins += n; }\n    int getCoins() const { return coins; }\n};\n// in main:\nWallet w;\nw.add(5);\nw.add(-3);  // ignored\nstd::cout << w.getCoins();  // 5"},{"text":"Every object has its own copy of the fields. Changing one object does not change another.","code":"Player a;\nPlayer b;\na.takeDamage(10);\nstd::cout << a.health << \" \" << b.health;  // 90 100"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"class Counter {\npublic:\n    int value = 0;\n    void tick() { value += 2; }\n};\n// in main:\nCounter c;\nc.tick();\nc.tick();\nstd::cout << c.value;","options":["4","2","0","1"],"answer":0,"explain":"`value` starts at 0 and each `tick()` adds 2, so two ticks give 4."},{"type":"output","prompt":"What does this print?","code":"class Box {\npublic:\n    int size;\n    Box(int s) : size(s) {}\n};\n// in main:\nBox a(3);\nBox b = a;\nb.size = 10;\nstd::cout << a.size << \" \" << b.size;","options":["10 10","3 10","3 3"],"answer":1,"explain":"In C++, `Box b = a;` makes a full **copy**. Changing `b` leaves `a` alone. (In C# or Java, class variables would share one object.)"},{"type":"fill","prompt":"Finish the constructor's member initializer list.","code":"class Dog {\npublic:\n    std::string name;\n    int age;\n    Dog(std::string n, int a) ___ name(n), ___(a) {}\n};","bank":[":","age","=","a","->","this"],"answer":[":","age"],"explain":"The initializer list starts with a colon, then lists each field with its starting value in parentheses."},{"type":"bug","prompt":"Tap the line with the bug.","lines":["class Coin {","public:","    int value = 1;","}"],"answer":3,"explain":"A class definition must end with `};`. Forgetting that semicolon causes confusing compiler errors."},{"type":"mcq","prompt":"A class has `int hp;` under `private:`. What happens if `main` runs `e.hp = 5;`?","options":["hp is set to 5","hp is set to 0","A compile error: hp is private","The program crashes when it runs"],"answer":2,"explain":"Private members can only be used inside the class's own methods. The compiler blocks the access."},{"type":"tf","prompt":"In a C++ `class`, members are private unless you write `public:`.","answer":true,"explain":"That is the default for `class`. A `struct` is the same thing, except its members are public by default."},{"type":"output","prompt":"What does this print?","code":"class Light {\npublic:\n    bool on;\n    Light() : on(false) {}\n    void toggle() { on = !on; }\n};\n// in main:\nLight l;\nl.toggle();\nl.toggle();\nl.toggle();\nstd::cout << l.on;","options":["true","0","3","1"],"answer":3,"explain":"Starting at false, three toggles give true, false, true. A `bool` prints as `1` without `std::boolalpha`."}]}],"advanced":[{"id":"cpp-a1","title":"Inheritance and polymorphism","summary":"Base classes, virtual, override, abstract","teach":[{"text":"**Inheritance** lets a class reuse another class. `class Dog : public Animal` means a Dog **is an** Animal: it gets all of Animal's public members and can add its own.","code":"class Animal {\npublic:\n    std::string name;\n    void eat() { std::cout << name << \" eats\\n\"; }\n};\nclass Dog : public Animal {\npublic:\n    void bark() { std::cout << \"Woof\\n\"; }\n};\n// in main:\nDog d; d.name = \"Rex\";\nd.eat();  // Rex eats"},{"text":"A derived class calls the base constructor in its member initializer list. The base part is always built first.","code":"class Animal {\npublic:\n    std::string name;\n    Animal(std::string n) : name(n) {}\n};\nclass Cat : public Animal {\npublic:\n    Cat(std::string n) : Animal(n) {}\n};\n// in main:\nCat c(\"Tom\");\nstd::cout << c.name;  // Tom"},{"text":"Mark a method `virtual` in the base class so derived classes can replace it. Write `override` in the derived class so the compiler checks the signature really matches. Base classes should also have a `virtual` destructor.","code":"class Shape {\npublic:\n    virtual double area() const { return 0; }\n    virtual ~Shape() = default;\n};\nclass Square : public Shape {\npublic:\n    double side;\n    Square(double s) : side(s) {}\n    double area() const override { return side * side; }\n};"},{"text":"**Polymorphism**: code that takes a `Shape&` works with any shape. Because `area` is virtual, C++ calls the version for the object's real type at run time. Without `virtual`, this would print 0.","code":"void printArea(const Shape& s) {\n    std::cout << s.area() << \"\\n\";\n}\n// in main:\nSquare sq(3);\nprintArea(sq);  // 9"},{"text":"A **pure virtual** method (`= 0`) has no body. A class with one is **abstract**: you cannot create it directly. It works like an interface that derived classes must fill in.","code":"class Enemy {\npublic:\n    virtual void attack() const = 0;  // pure virtual\n    virtual ~Enemy() = default;\n};\nclass Orc : public Enemy {\npublic:\n    void attack() const override { std::cout << \"Smash\\n\"; }\n};\n// in main:\nOrc o;       // ok, but \"Enemy e;\" would not compile\no.attack();  // Smash"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"class A {\npublic:\n    void hi() const { std::cout << \"A\"; }\n};\nclass B : public A {\npublic:\n    void hi() const { std::cout << \"B\"; }\n};\nvoid call(const A& x) { x.hi(); }\n// in main:\nB b;\ncall(b);\nb.hi();","options":["AB","BB","AA","BA"],"answer":0,"explain":"`hi` is not virtual, so through an `A&` the compiler picks `A::hi`. Called directly on `b`, it picks `B::hi`."},{"type":"output","prompt":"What does this print?","code":"class A {\npublic:\n    virtual void hi() const { std::cout << \"A\"; }\n};\nclass B : public A {\npublic:\n    void hi() const override { std::cout << \"B\"; }\n};\nvoid call(const A& x) { x.hi(); }\n// in main:\nB b;\ncall(b);\nb.hi();","options":["AB","AA","BB","BA"],"answer":2,"explain":"Now `hi` is virtual, so even through an `A&` the call goes to the real object's version, `B::hi`."},{"type":"fill","prompt":"Let Bird replace speak, and have the compiler check it.","code":"class Base {\npublic:\n    ___ void speak() const { std::cout << \"...\"; }\n};\nclass Bird : public Base {\npublic:\n    void speak() const ___ { std::cout << \"Tweet\"; }\n};","bank":["virtual","override","static","public","new"],"answer":["virtual","override"],"explain":"`virtual` in the base allows overriding. `override` goes after the signature in the derived class."},{"type":"bug","prompt":"This does not compile. Tap the line with the bug.","lines":["class Shape {","public:","    virtual double area() const { return 0; }","};","class Circle : public Shape {","public:","    double area() override { return 3.14; }","};"],"answer":6,"explain":"The base method is `const`, but this one is not, so it does not actually override anything and `override` reports an error. It needs `double area() const override`."},{"type":"tf","prompt":"You cannot create an object of a class that has a pure virtual method (`= 0`).","answer":true,"explain":"Such a class is abstract. You can only create objects of derived classes that override every pure virtual method."},{"type":"mcq","prompt":"Why give a base class a `virtual` destructor?","options":["To stop the class from being copied","To make every method faster","So the derived destructor also runs when the object is deleted through a base pointer","Every class needs one or it will not compile"],"answer":2,"explain":"Without it, deleting a derived object through a base pointer only runs the base destructor, so the derived part is never cleaned up properly."},{"type":"output","prompt":"What does this print?","code":"class Base {\npublic:\n    Base() { std::cout << \"B\"; }\n};\nclass Derived : public Base {\npublic:\n    Derived() { std::cout << \"D\"; }\n};\n// in main:\nDerived d;","options":["D","DB","B","BD"],"answer":3,"explain":"The base part of an object is always constructed first, then the derived part."}]},{"id":"cpp-a2","title":"Errors and exceptions","summary":"throw, try / catch, and cleaning up with RAII","teach":[{"text":"When something goes wrong, code can `throw` an exception. A `try` block runs code that might throw, and `catch` handles the error. Execution jumps straight to `catch`, skipping the rest of the `try`. Standard error types live in `<stdexcept>`.","code":"try {\n    throw std::runtime_error(\"Out of ammo\");\n    std::cout << \"never runs\\n\";\n} catch (const std::runtime_error& e) {\n    std::cout << \"Error: \" << e.what() << \"\\n\";  // Error: Out of ammo\n}"},{"text":"Functions throw when they cannot do their job. The exception travels up through the callers until some `catch` handles it. `e.what()` gives the message.","code":"double divide(double a, double b) {\n    if (b == 0) throw std::invalid_argument(\"divide by zero\");\n    return a / b;\n}\n// in main:\ntry {\n    std::cout << divide(10, 4) << \"\\n\";  // 2.5\n    std::cout << divide(1, 0) << \"\\n\";\n} catch (const std::exception& e) {\n    std::cout << e.what() << \"\\n\";       // divide by zero\n}"},{"text":"You can have several `catch` blocks. C++ uses the **first** one that matches, so put specific types before general ones. `std::exception` matches all standard errors, and `catch (...)` catches anything.","code":"try {\n    std::vector<int> v = {1, 2};\n    std::cout << v.at(5);\n} catch (const std::out_of_range& e) {\n    std::cout << \"Bad index\\n\";    // Bad index\n} catch (const std::exception& e) {\n    std::cout << \"Other error\\n\";\n} catch (...) {\n    std::cout << \"Unknown\\n\";\n}"},{"text":"The standard library throws too. For example, `std::stoi` throws `std::invalid_argument` when the text is not a number. Catch exceptions by `const` reference so nothing is copied.","code":"try {\n    int n = std::stoi(\"abc\");\n    std::cout << n;\n} catch (const std::invalid_argument&) {\n    std::cout << \"Not a number\";  // Not a number\n}"},{"text":"C++ has no `finally`. Instead it uses **RAII**: an object's destructor (`~Name`) runs automatically when it goes out of scope, even when an exception is flying. Put cleanup in destructors and it can never be skipped.","code":"class Guard {\npublic:\n    ~Guard() { std::cout << \"cleanup\\n\"; }  // cleanup (first)\n};\n// in main:\ntry {\n    Guard g;\n    throw std::runtime_error(\"boom\");\n} catch (const std::exception& e) {\n    std::cout << e.what() << \"\\n\";  // boom (second)\n}"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"try {\n    std::cout << \"A\";\n    throw std::runtime_error(\"x\");\n    std::cout << \"B\";\n} catch (const std::exception& e) {\n    std::cout << \"C\";\n}\nstd::cout << \"D\";","options":["ABCD","ACD","AC","AD"],"answer":1,"explain":"After the throw, the rest of the `try` (B) is skipped. The catch prints C, then the program continues normally with D."},{"type":"output","prompt":"What does this print?","code":"try {\n    throw std::out_of_range(\"oops\");\n} catch (const std::exception& e) {\n    std::cout << \"general \";\n} catch (const std::out_of_range& e) {\n    std::cout << \"range \";\n}\nstd::cout << \"done\";","options":["range done","done","general range done","general done"],"answer":3,"explain":"`out_of_range` is a kind of `std::exception`, and the first matching catch wins. The specific handler below it can never run."},{"type":"fill","prompt":"Handle the error when the text is not a number.","code":"___ {\n    int n = std::stoi(\"hi\");\n} ___ (const std::exception& e) {\n    std::cout << \"Bad input\";\n}","bank":["try","catch","throw","except","finally"],"answer":["try","catch"],"explain":"Risky code goes in `try`, and the handler is `catch`. `except` and `finally` are not C++ keywords."},{"type":"bug","prompt":"`checkAge(-5)` should throw, but it returns -5. Tap the line with the bug.","lines":["int checkAge(int age) {","    if (age < 0) std::invalid_argument(\"negative age\");","    return age;","}"],"answer":1,"explain":"The line creates an exception object but never throws it. It needs the `throw` keyword in front."},{"type":"tf","prompt":"C++ has a `finally` keyword, like Java and C#.","answer":false,"explain":"C++ relies on RAII instead: destructors run cleanup automatically when objects go out of scope."},{"type":"output","prompt":"What does this print?","code":"void level2() {\n    throw std::runtime_error(\"deep\");\n}\nvoid level1() {\n    level2();\n    std::cout << \"after level2 \";\n}\n// in main:\ntry {\n    level1();\n} catch (const std::exception& e) {\n    std::cout << \"caught \" << e.what();\n}","options":["after level2 caught deep","deep","caught deep","after level2"],"answer":2,"explain":"The exception leaves `level2` and `level1` immediately, so the print in `level1` never runs."},{"type":"mcq","prompt":"Why catch with `const std::exception& e` instead of `std::exception e`?","options":["It is the only form that compiles","A reference keeps the real exception type, so e.what() gives the right message","It makes the program throw fewer exceptions","References make exceptions travel faster"],"answer":1,"explain":"Catching by value copies only the base part (called slicing), so `what()` loses the real message. A reference avoids the copy and keeps the real type."},{"type":"output","prompt":"What does this print?","code":"class Log {\npublic:\n    std::string tag;\n    Log(std::string t) : tag(t) { std::cout << \"+\" << tag; }\n    ~Log() { std::cout << \"-\" << tag; }\n};\n// in main:\ntry {\n    Log a(\"a\");\n    Log b(\"b\");\n    throw 1;\n} catch (int) {\n    std::cout << \"!\";\n}","options":["+a+b-a-b!","+a+b!-b-a","+a+b-b-a!","+a+b!"],"answer":2,"explain":"Leaving the `try` destroys local objects in reverse order (b, then a) before the `catch` block runs."}]},{"id":"cpp-a3","title":"Recursion","summary":"Base cases, the call stack, classic examples","teach":[{"text":"A **recursive** function calls itself on a smaller problem. It needs a **base case**: a simple case where it stops instead of calling itself again.","code":"void countdown(int n) {\n    if (n == 0) {                // base case: stop here\n        std::cout << \"Liftoff!\\n\";\n        return;\n    }\n    std::cout << n << \" \";\n    countdown(n - 1);            // recursive call\n}\n// countdown(3);  prints: 3 2 1 Liftoff!"},{"text":"Recursive functions can return values. Each call does a little work and combines it with the answer from the smaller call.","code":"int factorial(int n) {\n    if (n <= 1) return 1;          // base case\n    return n * factorial(n - 1);   // 5 * 4 * 3 * 2 * 1\n}\n// std::cout << factorial(5);  prints: 120"},{"text":"Each call waits on the **call stack** until the call it made returns. Code placed **after** the recursive call runs on the way back out, so here the numbers come out in reverse.","code":"void show(int n) {\n    if (n == 0) return;\n    show(n - 1);            // go deeper first\n    std::cout << n << \" \";  // runs on the way back\n}\n// show(3);  prints: 1 2 3"},{"text":"If the base case is never reached, calls pile up until the stack runs out of space: a **stack overflow**, and the program crashes. Make sure every call moves closer to the base case.","code":"int sumTo(int n) {\n    if (n == 0) return 0;\n    return n + sumTo(n - 1);\n}\n// sumTo(4) is 4 + 3 + 2 + 1 + 0 = 10\n// sumTo(-1) never reaches 0: stack overflow!"},{"text":"Fibonacci is a classic: each number is the sum of the two before it. The simple recursive version is short but slow, because it solves the same small problems again and again.","code":"int fib(int n) {\n    if (n < 2) return n;\n    return fib(n - 1) + fib(n - 2);\n}\n// fib(10) is 55\n// fib(40) makes over 300 million calls!"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"int f(int n) {\n    if (n == 0) return 0;\n    return 2 + f(n - 1);\n}\n// in main:\nstd::cout << f(4);","options":["4","6","8","10"],"answer":2,"explain":"Each of the 4 calls before the base case adds 2, and the base case adds 0. That is 8."},{"type":"output","prompt":"What does this print?","code":"void p(int n) {\n    if (n == 0) return;\n    std::cout << n;\n    p(n - 1);\n    std::cout << n;\n}\n// in main:\np(3);","options":["321123","123321","321321","321"],"answer":0,"explain":"The first print runs on the way down (3, 2, 1). The second runs on the way back up (1, 2, 3)."},{"type":"fill","prompt":"Complete the recursive power function.","code":"int power(int base, int exp) {\n    if (exp == ___) return 1;\n    return base * ___(base, exp - 1);\n}","bank":["0","power","1","exp","base"],"answer":["0","power"],"explain":"Any number to the power 0 is 1, which is the base case. The function then calls itself with a smaller exponent."},{"type":"bug","prompt":"This should add the digits of n (123 gives 6). Tap the line with the bug.","lines":["int sumDigits(int n) {","    if (n == 0) return 0;","    return n % 10 + sumDigits(n);","}"],"answer":2,"explain":"It calls itself with the same `n`, so it never gets closer to 0 and overflows the stack. It should pass `n / 10`."},{"type":"tf","prompt":"Every recursive function needs a base case that stops the recursion.","answer":true,"explain":"Without one, the function keeps calling itself until the call stack runs out."},{"type":"output","prompt":"What does this print?","code":"int fib(int n) {\n    if (n < 2) return n;\n    return fib(n - 1) + fib(n - 2);\n}\n// in main:\nstd::cout << fib(6);","options":["5","8","13","6"],"answer":1,"explain":"The sequence goes 0, 1, 1, 2, 3, 5, 8 for n = 0 to 6."},{"type":"mcq","prompt":"What usually happens if a recursive function never reaches its base case?","options":["It returns 0","The compiler refuses to build it","It loops forever but uses no extra memory","The call stack runs out of space and the program crashes"],"answer":3,"explain":"Every call takes stack space until it returns. Endless calls fill the stack and cause a stack overflow."},{"type":"output","prompt":"What does this print?","code":"std::string rev(const std::string& s) {\n    if (s.empty()) return \"\";\n    return rev(s.substr(1)) + s[0];\n}\n// in main:\nstd::cout << rev(\"abc\");","options":["abc","bca","cab","cba"],"answer":3,"explain":"`rev(\"abc\")` is `rev(\"bc\") + 'a'`, which is `rev(\"c\") + 'b' + 'a'`, giving \"cba\"."}]},{"id":"cpp-a4","title":"Algorithms","summary":"Searching, sorting, and Big-O","teach":[{"text":"**Linear search** checks items one by one until it finds the target. It works on any list. On a list of n items it may need n checks.","code":"int linearSearch(const std::vector<int>& v, int target) {\n    for (std::size_t i = 0; i < v.size(); i++) {\n        if (v[i] == target) return static_cast<int>(i);\n    }\n    return -1;  // not found\n}\n// in main:\nstd::cout << linearSearch({7, 3, 9}, 9);  // 2"},{"text":"**Binary search** only works on **sorted** data. It checks the middle item, then throws away the half that cannot contain the target. Each step halves the work.","code":"int binarySearch(const std::vector<int>& v, int target) {\n    int lo = 0, hi = static_cast<int>(v.size()) - 1;\n    while (lo <= hi) {\n        int mid = lo + (hi - lo) / 2;\n        if (v[mid] == target) return mid;\n        if (v[mid] < target) lo = mid + 1;\n        else hi = mid - 1;\n    }\n    return -1;\n}\n// in main:\nstd::cout << binarySearch({1, 4, 6, 9, 12}, 9);  // 3"},{"text":"**Bubble sort** walks through the list and swaps neighbors that are in the wrong order. After each pass, the biggest remaining item has \"bubbled\" to the end.","code":"void bubbleSort(std::vector<int>& v) {\n    for (std::size_t i = 0; i < v.size(); i++) {\n        for (std::size_t j = 0; j + 1 < v.size() - i; j++) {\n            if (v[j] > v[j + 1]) std::swap(v[j], v[j + 1]);\n        }\n    }\n}\n// in main:\nstd::vector<int> v = {5, 1, 4, 2};\nbubbleSort(v);\nfor (int x : v) std::cout << x << \" \";  // 1 2 4 5"},{"text":"**Big-O** describes how the work grows as the input grows. O(1): same time for any size. O(log n): grows very slowly (binary search). O(n): grows with the size (linear search). O(n^2): grows with size times size (bubble sort).","code":"// Searching 1,000,000 sorted items:\n// linear search: up to 1,000,000 checks   O(n)\n// binary search: about 20 checks          O(log n)\n// bubble sort of n items: about n*n steps  O(n^2)\n// reading v[i]: 1 step for any size        O(1)"},{"text":"In real code, use the standard library from `<algorithm>`. `std::sort` is fast (O(n log n)), and `std::binary_search` tells you if a sorted range contains a value.","code":"std::vector<int> v = {8, 3, 5, 1};\nstd::sort(v.begin(), v.end());  // now: 1 3 5 8\nbool has5 = std::binary_search(v.begin(), v.end(), 5);\nstd::cout << has5 << \" \" << v.front();  // 1 1"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"std::vector<int> v = {2, 4, 6, 8, 10, 12, 14};\nint lo = 0, hi = 6, steps = 0;\nwhile (lo <= hi) {\n    int mid = (lo + hi) / 2;\n    steps++;\n    if (v[mid] == 12) break;\n    if (v[mid] < 12) lo = mid + 1;\n    else hi = mid - 1;\n}\nstd::cout << steps;","options":["1","2","3","6"],"answer":1,"explain":"Step 1 checks index 3 (value 8), which is too small, so `lo` becomes 4. Step 2 checks index 5, which is 12. Found."},{"type":"mcq","prompt":"What does binary search need in order to work?","options":["An even number of items","No negative numbers","The data must be sorted","The items must be strings"],"answer":2,"explain":"Binary search decides which half to throw away by comparing with the middle. That only makes sense if the data is in order."},{"type":"fill","prompt":"Sort the whole vector.","code":"std::sort(v.___(), v.___());","bank":["begin","end","size","front","back"],"answer":["begin","end"],"explain":"Standard algorithms take a range from `begin()` up to (but not including) `end()`."},{"type":"bug","prompt":"This binary search can loop forever. Tap the line with the bug.","lines":["while (lo <= hi) {","    int mid = (lo + hi) / 2;","    if (v[mid] == target) return mid;","    if (v[mid] < target) lo = mid;","    else hi = mid - 1;","}"],"answer":3,"explain":"`lo = mid` can leave `lo` unchanged (for example when `lo == hi`), so the loop never ends. It must be `lo = mid + 1`."},{"type":"tf","prompt":"Binary search on 1,000,000 sorted items needs at most about 20 checks.","answer":true,"explain":"Halving 1,000,000 about 20 times gets down to 1, since 2 to the power 20 is about a million."},{"type":"mcq","prompt":"Two nested loops each run n times. What is the Big-O?","options":["O(n)","O(log n)","O(n^2)","O(1)"],"answer":2,"explain":"The inner loop runs n times for each of the n outer rounds, so about n times n steps."},{"type":"output","prompt":"What does this print?","code":"std::vector<int> v = {4, 3, 2, 1};\nfor (std::size_t j = 0; j + 1 < v.size(); j++) {\n    if (v[j] > v[j + 1]) std::swap(v[j], v[j + 1]);\n}\nfor (int x : v) std::cout << x;","options":["1234","3241","4321","3214"],"answer":3,"explain":"This is just one bubble sort pass. The 4 gets swapped all the way to the end, but the rest are not sorted yet."},{"type":"tf","prompt":"`std::sort` is usually a better choice than writing your own bubble sort.","answer":true,"explain":"`std::sort` runs in O(n log n) and is well tested. Bubble sort is O(n^2), so it gets slow on big lists."}]},{"id":"cpp-a5","title":"Pointers, references and memory","summary":"& and *, stack vs heap, and smart pointers","teach":[{"text":"Every variable lives at an **address** in memory. `&x` gives the address of `x`. A **pointer** (`int*`) stores an address. `*ptr` reads or writes the value at that address.","code":"int hp = 50;\nint* ptr = &hp;               // ptr holds the address of hp\nstd::cout << *ptr << \"\\n\";    // 50\n*ptr = 80;                    // change hp through the pointer\nstd::cout << hp << \"\\n\";      // 80"},{"text":"A **reference** (`int&`) is another name for an existing variable. It must be set when created and always refers to the same thing. A pointer can change targets, or point at nothing with `nullptr`.","code":"int score = 10;\nint& ref = score;      // ref is another name for score\nref += 5;\nstd::cout << score << \"\\n\";      // 15\nint* p = nullptr;      // a pointer can point at nothing\nif (p == nullptr) {\n    std::cout << \"no target\\n\";  // no target\n}"},{"text":"Local variables live on the **stack** and are freed automatically at the closing `}`. `new` creates a value on the **heap**, which stays alive until you `delete` it yourself.","code":"void demo() {\n    int a = 5;             // stack: freed automatically at }\n    int* b = new int(7);   // heap: lives until you delete it\n    std::cout << a + *b;   // 12\n    delete b;              // you must free it yourself\n}"},{"text":"Manual `new`/`delete` is risky. Forget `delete` and you get a **memory leak**. Use memory after `delete` and you have a **dangling pointer**. Delete twice and anything can happen. These bugs are hard to find.","code":"int* p = new int(3);\ndelete p;\n// *p = 4;     // dangling pointer: undefined behavior\n// delete p;   // double delete: undefined behavior\nint* q = new int(9);\nq = nullptr;   // leak: the 9 can never be freed now"},{"text":"**RAII** means an object owns a resource and its destructor frees it. **Smart pointers** in `<memory>` do this for heap memory. `std::unique_ptr` has one owner. `std::shared_ptr` counts its owners and frees the memory when the last one goes away. No `delete` needed.","code":"auto ammo = std::make_unique<int>(30);  // one owner\nstd::cout << *ammo << \"\\n\";             // 30\nauto a = std::make_shared<int>(5);\nauto b = a;                             // two owners now\nstd::cout << a.use_count() << \"\\n\";     // 2\n// memory is freed automatically when the owners go away"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"int a = 3;\nint* p = &a;\n*p = *p + 4;\nstd::cout << a;","options":["3","4","7","An address like 0x7ffd"],"answer":2,"explain":"`p` points at `a`, so `*p = *p + 4` changes `a` itself from 3 to 7."},{"type":"output","prompt":"What does this print?","code":"int x = 1;\nint y = x;\nint& r = x;\ny = 5;\nr = 9;\nstd::cout << x << y;","options":["15","95","99","91"],"answer":1,"explain":"`y` is a separate copy, so it becomes 5 on its own. `r` is another name for `x`, so `r = 9` sets `x` to 9."},{"type":"fill","prompt":"Create a boss that is owned by exactly one smart pointer.","code":"std::unique_ptr<Enemy> boss = std::___<Enemy>(\"Dragon\");","bank":["make_unique","make_shared","new","malloc"],"answer":["make_unique"],"explain":"`std::make_unique` creates the object and returns a `unique_ptr`. `make_shared` returns a `shared_ptr`, which cannot become a `unique_ptr`."},{"type":"bug","prompt":"Tap the line with the bug.","lines":["int* makeNumber() {","    int n = 42;","    return &n;","}"],"answer":2,"explain":"`n` lives on the stack and is destroyed when the function returns, so the returned pointer dangles. Return the value itself, or a `std::unique_ptr`."},{"type":"output","prompt":"What does this print?","code":"auto a = std::make_unique<int>(4);\nauto b = std::move(a);\nstd::cout << (a == nullptr) << *b;","options":["04","14","Compile error"],"answer":1,"explain":"A `unique_ptr` cannot be copied, but it can be **moved**. Ownership passes to `b`, and `a` is left empty (`nullptr`), so the check prints 1."},{"type":"output","prompt":"What does this print?","code":"auto a = std::make_shared<int>(1);\n{\n    auto b = a;\n    auto c = a;\n    std::cout << a.use_count();\n}\nstd::cout << a.use_count();","options":["31","33","21","11"],"answer":0,"explain":"Inside the block there are three owners: a, b and c. When the block ends, b and c are destroyed, leaving one."},{"type":"output","prompt":"What does this print?","code":"class Res {\npublic:\n    Res() { std::cout << \"open \"; }\n    ~Res() { std::cout << \"close \"; }\n};\n// in main:\n{\n    auto r = std::make_unique<Res>();\n    std::cout << \"use \";\n}\nstd::cout << \"end\";","options":["open use end close","open use end","open use close end","open close use end"],"answer":2,"explain":"When `r` goes out of scope at the `}`, the `unique_ptr` deletes the object, which runs the destructor before \"end\" prints."},{"type":"mcq","prompt":"Which code leaks memory?","options":["int x = 5;","auto p = std::make_unique<int>(5);","int* p = new int(5); p = nullptr;","int* p = new int(5); delete p;"],"answer":2,"explain":"Setting the only pointer to `nullptr` loses the address of the heap value, so it can never be deleted. The smart pointer frees itself."}]}]}},{"id":"lua","name":"Lua","blurb":"A small, fast scripting language for games: Roblox's Luau is based on it, and many game mods use it.","setup":"Install Lua 5.4 from lua.org (Windows: LuaBinaries, Mac: `brew install lua`, Linux: `sudo apt install lua5.4`). Save your code as `hello.lua` and run `lua hello.lua` in a terminal. Roblox Studio runs Luau, which is close to the Lua you learn here.","levels":{"beginner":[{"id":"lua-b1","title":"Your first program","summary":"Printing text, comments, and how Lua runs","teach":[{"text":"A program is a list of instructions the computer follows. Lua is a small, fast language that games use for scripting: Roblox's Luau is based on it, and many game mods are written in it. This course teaches standard Lua 5.4. Your first instruction: `print` shows text on the screen.","code":"print(\"Hello, world!\")  -- Hello, world!"},{"text":"Text goes inside quotes. Without quotes, Lua treats the words as code. So `print(5 + 3)` does the math, but `print(\"5 + 3\")` shows the text exactly as written.","code":"print(5 + 3)    -- 8\nprint(\"5 + 3\")  -- 5 + 3\nprint('Single quotes work too')  -- Single quotes work too"},{"text":"A **comment** is a note for humans. Lua ignores it. Two dashes `--` start a comment that lasts to the end of the line. `--[[` and `]]` wrap a comment over many lines.","code":"-- This line is ignored\nprint(\"Hi\")  -- a comment can follow code\n--[[\nEverything in here\nis ignored too\n]]"},{"text":"Lua runs your file from the top line to the bottom line, one instruction at a time. You do not need a `main` function: the file itself is the program. Save it as `hello.lua` and run `lua hello.lua` in a terminal.","code":"print(\"One\")    -- One\nprint(\"Two\")    -- Two\nprint(\"Three\")  -- Three"},{"text":"Lua is **case sensitive**. `print` works, but `Print` or `PRINT` is a different name that does not exist, so you get an error.","code":"print(\"ok\")   -- ok\n-- Print(\"ok\")  -- error: attempt to call a nil value"}],"quiz":[{"type":"mcq","prompt":"Which line prints the word Hello?","options":["echo \"Hello\"","Print(\"Hello\")","print(\"Hello\")","print(Hello)"],"answer":2,"explain":"`print` must be lowercase and the text needs quotes. `print(Hello)` looks for a variable named `Hello`, which does not exist, so it prints `nil`."},{"type":"output","prompt":"What does this print?","code":"print(\"5 + 3\")\nprint(5 + 3)","options":["8\n8","5 + 3\n8","5 + 3\n5 + 3","8\n5 + 3"],"answer":1,"explain":"Inside quotes, `5 + 3` is just text. Without quotes Lua does the math and prints `8`."},{"type":"output","prompt":"What does this print?","code":"-- print(\"A\")\nprint(\"B\")\n--[[\nprint(\"C\")\n]]\nprint(\"D\")","options":["A\nB\nC\nD","B\nC\nD","B\nD","D"],"answer":2,"explain":"The `--` line and the `--[[ ... ]]` block are comments, so only B and D are printed."},{"type":"fill","prompt":"Turn the first line into a comment.","code":"___ this line is ignored\nprint(\"Hi\")","bank":["--","//","#","/*"],"answer":["--"],"explain":"Lua comments start with two dashes. `//` and `#` are comments in other languages, not in Lua."},{"type":"order","prompt":"Put the lines in order so it prints Ready, then Set, then Go.","lines":["print(\"Ready\")","print(\"Set\")","print(\"Go\")"],"explain":"Lua runs from top to bottom, so the first line printed is the first line in the file."},{"type":"bug","prompt":"Tap the line with the bug.","lines":["print(\"Start\")","print(\"Middle)","print(\"End\")"],"answer":1,"explain":"The text `\"Middle` has no closing quote, so Lua cannot tell where the string ends."},{"type":"tf","prompt":"Lua needs a `main` function before your code will run.","answer":false,"explain":"Lua runs the file from top to bottom. There is no required `main` function."},{"type":"tf","prompt":"In Lua, `Print` and `print` are two different names.","answer":true,"explain":"Lua is case sensitive. Only lowercase `print` is the built-in function."}]},{"id":"lua-b2","title":"Variables and types","summary":"local variables, numbers, strings, booleans, nil","teach":[{"text":"A **variable** is a name that holds a value. Create one with `local`, a name, `=` and a value. To change it later, leave out `local`. Without `local` on the first use, the variable becomes **global** and can clash with other code, so always start with `local`.","code":"local name = \"Mia\"\nlocal age = 14\nprint(name)  -- Mia\nage = 15     -- change it, no local this time\nprint(age)   -- 15"},{"text":"Every value has a **type**. The main ones are `number`, `string` (text), `boolean` (`true` or `false`) and `nil`. The `type` function tells you which one you have.","code":"print(type(42))     -- number\nprint(type(3.5))    -- number\nprint(type(\"hi\"))   -- string\nprint(type(true))   -- boolean\nprint(type(nil))    -- nil"},{"text":"`nil` means **no value**. A variable that was never given a value is `nil`. Reading it is not an error, you just get `nil` back.","code":"local score\nprint(score)  -- nil\nscore = 10\nprint(score)  -- 10\nprint(lives)  -- nil (never created)"},{"text":"Lua 5.4 numbers come in two flavors: **integers** (whole numbers like `10`) and **floats** (decimals like `10.0` or `2.5`). Both have type `number`. `math.type` shows which flavor it is.","code":"print(math.type(10))    -- integer\nprint(math.type(10.0))  -- float\nprint(10 == 10.0)       -- true"},{"text":"Naming rules: use letters, digits and `_`, do not start with a digit, and do not use a keyword like `end`, `local`, `then` or `nil`. Names are case sensitive, so `score` and `Score` are different variables.","code":"local playerName = \"Sam\"  -- ok\nlocal player_2 = \"Kai\"    -- ok\n-- local 2player = \"x\"    -- error: starts with a digit\n-- local end = 5          -- error: end is a keyword"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"local x = 5\nx = x + 2\nprint(x)","options":["7","5","x + 2","52"],"answer":0,"explain":"`x` starts at 5, then `x = x + 2` stores 7 in it."},{"type":"output","prompt":"What does this print?","code":"print(type(\"42\"))","options":["number","42","string","nil"],"answer":2,"explain":"The quotes make `\"42\"` a string, even though it looks like a number."},{"type":"output","prompt":"What does this print?","code":"local a\nprint(a)","options":["0","Error","nil","false"],"answer":2,"explain":"A variable with no value holds `nil`. Lua does not give it 0 or false, and reading it is not an error."},{"type":"output","prompt":"What does this print?","code":"print(math.type(7.0))","options":["integer","float","number","7"],"answer":1,"explain":"`7.0` has a decimal point, so it is a float. `type` would say `number`, but `math.type` tells the flavor."},{"type":"mcq","prompt":"Which is a valid variable name?","options":["2fast","my-score","high_score","end"],"answer":2,"explain":"Names can use letters, digits and `_`. `2fast` starts with a digit, `my-score` has a minus sign, and `end` is a keyword."},{"type":"mcq","prompt":"Which value has the type `boolean`?","options":["\"true\"","true","1","nil"],"answer":1,"explain":"`true` without quotes is a boolean. With quotes it is a string."},{"type":"fill","prompt":"Create a local variable `lives` that holds 3.","code":"___ lives ___ 3","bank":["local","=","==","var","let",":="],"answer":["local","="],"explain":"`local` creates the variable and a single `=` stores the value. `==` compares, and `var`/`let` are from other languages."},{"type":"bug","prompt":"Tap the line with the bug.","lines":["local name = \"Ava\"","local 1stScore = 50","print(name)"],"answer":1,"explain":"A variable name cannot start with a digit. Something like `firstScore` would work."}]},{"id":"lua-b3","title":"Math and text","summary":"Operators, division, and joining text with ..","teach":[{"text":"Lua has the usual math operators: `+`, `-`, `*` and `/`. `%` gives the **remainder** after dividing, and `^` raises to a power. `^` always gives a float, such as `8.0`.","code":"print(7 + 3)  -- 10\nprint(7 - 3)  -- 4\nprint(7 * 3)  -- 21\nprint(7 % 3)  -- 1\nprint(2 ^ 3)  -- 8.0"},{"text":"`/` **always** gives a float, even when the answer is whole: `10 / 2` is `5.0`. For whole-number division use `//` (floor division). It rounds **down**, which matters for negative numbers.","code":"print(10 / 2)   -- 5.0\nprint(7 / 2)    -- 3.5\nprint(7 // 2)   -- 3\nprint(-7 // 2)  -- -4"},{"text":"Join strings with `..` (two dots). Lua does **not** use `+` for text. Numbers are turned into text automatically when you join them.","code":"local name = \"Zoe\"\nprint(\"Hi, \" .. name .. \"!\")  -- Hi, Zoe!\nprint(\"Score: \" .. 100)       -- Score: 100\nprint(\"5\" .. \"5\")             -- 55"},{"text":"Watch out: `+` on strings tries to do **math**. `\"5\" + 5` turns the text into a number and gives 10. The `#` operator gives the length of a string.","code":"print(\"5\" + 5)   -- 10\nprint(\"5\" .. 5)  -- 55\nprint(#\"hello\")  -- 5"},{"text":"`string.format` builds neat text. `%s` is replaced by any value, `%d` by a whole number, and `%.2f` by a number with 2 decimals.","code":"local price = 4.5\nprint(string.format(\"Total: %.2f\", price))  -- Total: 4.50\nprint(string.format(\"%s has %d coins\", \"Ana\", 12))  -- Ana has 12 coins"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"print(9 / 3)","options":["3","3.0","3.00","Error"],"answer":1,"explain":"In Lua 5.4, `/` always gives a float, so the answer is `3.0`. Use `9 // 3` to get `3`."},{"type":"output","prompt":"What does this print?","code":"print(17 // 5)\nprint(17 % 5)","options":["3.4\n2","3\n3","3\n2","2\n3"],"answer":2,"explain":"17 divided by 5 is 3 with 2 left over. `//` gives the 3 and `%` gives the 2."},{"type":"output","prompt":"What does this print?","code":"print(\"10\" .. 5)\nprint(\"10\" + 5)","options":["15\n15","105\n105","105\n15","15\n105"],"answer":2,"explain":"`..` joins text, giving `105`. `+` does math, turning \"10\" into 10 and giving `15`."},{"type":"output","prompt":"What does this print?","code":"print(string.format(\"%.2f\", 10 / 4))","options":["2.5","2.50","2","2.500"],"answer":1,"explain":"`10 / 4` is 2.5, and `%.2f` always shows exactly 2 decimals."},{"type":"mcq","prompt":"What does `#\"Lua!\"` give?","options":["3","4","5","Error"],"answer":1,"explain":"`#` counts characters. L, u, a and ! make 4."},{"type":"fill","prompt":"Make it print Level 3.","code":"local level = 3\nprint(\"Level \" ___ level)","bank":["..","+","&","."],"answer":[".."],"explain":"`..` joins text and numbers. `+` would try to do math on \"Level \" and fail."},{"type":"bug","prompt":"Tap the line with the bug.","lines":["local first = \"Ada\"","local last = \"Lovelace\"","print(first + \" \" + last)"],"answer":2,"explain":"`+` is for math. Joining text needs `..`: `first .. \" \" .. last`."},{"type":"order","prompt":"Put the lines in order so it prints 30.","lines":["local total = 10","total = total + 5","total = total * 2","print(total)"],"explain":"(10 + 5) * 2 is 30. Doing the `* 2` first would give 25."}]},{"id":"lua-b4","title":"Decisions","summary":"if, elseif, else, ~=, and/or/not","teach":[{"text":"Comparisons give `true` or `false`. Lua uses `==` for equal and `~=` for **not equal**. Note: it is `~=`, not `!=` like in many other languages.","code":"print(5 == 5)      -- true\nprint(5 ~= 3)      -- true\nprint(2 > 7)       -- false\nprint(\"a\" == \"A\")  -- false"},{"text":"`if` runs code only when a condition is true. The pattern is `if condition then ... end`. Do not forget `then` and `end`.","code":"local hp = 0\nif hp <= 0 then\n  print(\"Game over\")\nend\n-- Game over"},{"text":"Add more choices with `elseif` (one word) and a fallback with `else`. Lua checks from the top and runs only the **first** branch that matches.","code":"local score = 72\nif score >= 90 then\n  print(\"A\")\nelseif score >= 70 then\n  print(\"B\")\nelse\n  print(\"Try again\")\nend\n-- B"},{"text":"Combine conditions with `and` (both must be true), `or` (at least one) and `not` (flips true and false).","code":"local hasKey = true\nlocal doorLocked = true\nif hasKey and doorLocked then\n  print(\"Unlock!\")  -- Unlock!\nend\nprint(not hasKey)     -- false\nprint(false or true)  -- true"},{"text":"In Lua only `false` and `nil` count as false. **Everything else is true, even `0` and the empty string `\"\"`.** A handy trick: `x or default` gives `default` when `x` is `nil`.","code":"if 0 then\n  print(\"0 is true in Lua\")  -- 0 is true in Lua\nend\nlocal name = nil\nprint(name or \"Guest\")  -- Guest"}],"quiz":[{"type":"mcq","prompt":"Which operator means \"not equal\" in Lua?","options":["!=","~=","<>","=/="],"answer":1,"explain":"Lua uses `~=`. Writing `!=` is a syntax error."},{"type":"output","prompt":"What does this print?","code":"local x = 0\nif x then\n  print(\"yes\")\nelse\n  print(\"no\")\nend","options":["no","Error","yes","0"],"answer":2,"explain":"Only `false` and `nil` are false in Lua. The number 0 counts as true."},{"type":"output","prompt":"What does this print?","code":"local temp = 15\nif temp > 25 then\n  print(\"hot\")\nelseif temp > 10 then\n  print(\"warm\")\nelseif temp > 0 then\n  print(\"cold\")\nelse\n  print(\"freezing\")\nend","options":["cold","warm\ncold","freezing","warm"],"answer":3,"explain":"15 > 10 is the first true test, so only \"warm\" prints. Later branches are skipped even if they would also match."},{"type":"output","prompt":"What does this print?","code":"print(5 > 3 and \"big\" or \"small\")\nprint(not nil)","options":["big\ntrue","true\ntrue","big\nnil","small\nfalse"],"answer":0,"explain":"`a and b or c` picks `b` when `a` is true. `nil` counts as false, so `not nil` is `true`."},{"type":"fill","prompt":"Print the message when `lives` is not 0.","code":"local lives = 2\nif lives ___ 0 ___\n  print(\"Still alive\")\nend","bank":["~=","!=","then","do",":"],"answer":["~=","then"],"explain":"Not-equal is `~=` in Lua, and an `if` condition is followed by `then`."},{"type":"bug","prompt":"Tap the line with the bug.","lines":["local age = 15","if age >= 13 then","  print(\"Teen\")","else if age >= 5 then","  print(\"Kid\")","end"],"answer":3,"explain":"Lua spells it `elseif` as one word. `else if` starts a new, nested `if` that needs its own `end`."},{"type":"tf","prompt":"In Lua, the number `0` counts as false in an `if`.","answer":false,"explain":"Only `false` and `nil` are false. `0` and `\"\"` are both true."},{"type":"order","prompt":"Put the lines in order so it prints Pass.","lines":["local mark = 55","if mark >= 50 then","  print(\"Pass\")","else","  print(\"Fail\")","end"],"explain":"The value is set first. The `if` branch runs because 55 >= 50, and `else` holds the other choice."}]},{"id":"lua-b5","title":"Loops","summary":"while, for, repeat, break, and skipping","teach":[{"text":"A `while` loop repeats as long as its condition is true: `while condition do ... end`. Make sure something inside changes, or it runs forever.","code":"local n = 1\nwhile n <= 3 do\n  print(n)\n  n = n + 1\nend\n-- 1\n-- 2\n-- 3"},{"text":"A **numeric for** loop counts for you: `for i = start, stop do`. Both ends are **included**, so `1, 3` gives 1, 2 and 3. The variable `i` only exists inside the loop.","code":"for i = 1, 3 do\n  print(\"Lap \" .. i)\nend\n-- Lap 1\n-- Lap 2\n-- Lap 3"},{"text":"Add a third number for the **step**. It can be negative to count down.","code":"for i = 10, 0, -5 do\n  print(i)\nend\n-- 10\n-- 5\n-- 0"},{"text":"`repeat ... until condition` checks at the **end**, so the body always runs at least once. It stops when the condition becomes true.","code":"local tries = 0\nrepeat\n  tries = tries + 1\nuntil tries >= 3\nprint(tries)  -- 3"},{"text":"`break` leaves a loop early. Lua has no `continue`. To skip to the next round, jump to a label at the end of the loop with `goto continue`.","code":"for i = 1, 10 do\n  if i % 2 == 0 then goto continue end\n  if i > 7 then break end\n  print(i)  -- 1, 3, 5, 7 (one per line)\n  ::continue::\nend"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"for i = 2, 8, 3 do\n  print(i)\nend","options":["2\n5","2\n5\n8","2\n3\n4","3\n6"],"answer":1,"explain":"Start at 2 and add 3 each time: 2, 5, 8. The end value 8 is included."},{"type":"output","prompt":"What does this print?","code":"for i = 5, 1 do\n  print(i)\nend\nprint(\"done\")","options":["5\n4\n3\n2\n1\ndone","5\ndone","done","Error"],"answer":2,"explain":"Without a step, Lua counts up by 1. Since 5 is already past 1, the loop body never runs."},{"type":"output","prompt":"What does this print?","code":"local total = 0\nfor i = 1, 10 do\n  total = total + i\n  if total > 10 then break end\nend\nprint(total)","options":["55","10","11","15"],"answer":3,"explain":"The total goes 1, 3, 6, 10, 15. At 15 it is more than 10, so `break` stops the loop."},{"type":"fill","prompt":"Make the loop count down 3, 2, 1.","code":"for i = 3, 1, ___ ___\n  print(i)\nend","bank":["-1","1","do","then","0"],"answer":["-1","do"],"explain":"A step of -1 counts down, and a `for` header ends with `do` (`then` is for `if`)."},{"type":"bug","prompt":"This should print 1 to 5. Tap the line with the bug.","lines":["local count = 1","while count <= 5 do","  print(count)","  count = count - 1","end"],"answer":3,"explain":"`count` goes down, so it is always <= 5 and the loop never ends. It should be `count + 1`."},{"type":"tf","prompt":"A `repeat ... until` loop always runs its body at least once.","answer":true,"explain":"The condition is checked after the body, so the body runs before the first check."},{"type":"mcq","prompt":"Lua has no `continue`. How do you skip to the next round of a loop?","options":["continue","next","goto continue, with a ::continue:: label at the end of the loop","skip"],"answer":2,"explain":"Lua uses `goto` with a label placed just before the loop's `end`."},{"type":"order","prompt":"Put the lines in order so it prints 6.","lines":["local sum = 0","for i = 1, 3 do","  sum = sum + i","end","print(sum)"],"explain":"Create `sum` first, add 1, 2 and 3 inside the loop, then print after the loop ends."}]}],"intermediate":[{"id":"lua-i1","title":"Functions","summary":"Define functions, parameters, returns, scope","teach":[{"text":"A **function** is a named block of code you can run again and again. Define it with `local function name(params) ... end`, then call it with parentheses.","code":"local function greet(name)\n  print(\"Hello, \" .. name .. \"!\")\nend\n\ngreet(\"Lee\")   -- Hello, Lee!\ngreet(\"Ruby\")  -- Hello, Ruby!"},{"text":"`return` sends a value back to whoever called the function. The function stops as soon as it returns.","code":"local function area(w, h)\n  return w * h\nend\n\nlocal a = area(3, 4)\nprint(a)  -- 12"},{"text":"Lua functions can return **several values** at once. Catch them with several variables, separated by commas.","code":"local function minMax(a, b)\n  if a < b then\n    return a, b\n  end\n  return b, a\nend\n\nlocal lo, hi = minMax(9, 4)\nprint(lo .. \" \" .. hi)  -- 4 9"},{"text":"Missing arguments become `nil`, and extra ones are ignored. Use `or` to give a parameter a default value.","code":"local function shout(word, times)\n  times = times or 1\n  return string.rep(word .. \"!\", times)\nend\n\nprint(shout(\"Go\"))     -- Go!\nprint(shout(\"Go\", 3))  -- Go!Go!Go!"},{"text":"**Scope**: a `local` variable inside a function only exists inside that function. If you forget `local`, the variable becomes global and leaks out, which causes hard-to-find bugs.","code":"local function setup()\n  local secret = 42\n  leaked = \"oops\"  -- no local: becomes global!\nend\n\nsetup()\nprint(secret)  -- nil\nprint(leaked)  -- oops"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"local function double(n)\n  return n * 2\nend\nprint(double(double(3)))","options":["6","9","12","36"],"answer":2,"explain":"The inner call gives 6, then doubling 6 gives 12."},{"type":"output","prompt":"What does this print?","code":"local function add(a, b)\n  local sum = a + b\nend\nlocal r = add(2, 3)\nprint(r)","options":["5","nil","0","Error"],"answer":1,"explain":"The function computes `sum` but never returns it, so the call gives back nothing and `r` is `nil`."},{"type":"output","prompt":"What does this print?","code":"local function stats()\n  return 10, 20, 30\nend\nlocal a, b = stats()\nprint(a + b)","options":["60","30","Error","10"],"answer":1,"explain":"`a` gets 10 and `b` gets 20. The third value, 30, has no variable, so it is dropped."},{"type":"output","prompt":"What does this print?","code":"local x = 1\nlocal function change()\n  local x = 5\nend\nchange()\nprint(x)","options":["5","nil","1"],"answer":2,"explain":"`local x = 5` makes a new variable that only lives inside `change`. The outer `x` stays 1."},{"type":"fill","prompt":"Complete the function so it gives back n squared.","code":"local function square(n)\n  ___ n * n\n___\nprint(square(4))","bank":["return","end","print","done","then"],"answer":["return","end"],"explain":"`return` sends the value back to the caller, and every function body closes with `end`."},{"type":"bug","prompt":"Tap the line with the bug.","lines":["local function isEven(n)","  return n % 2 = 0","end","print(isEven(4))"],"answer":1,"explain":"A single `=` assigns. Comparing needs `==`: `n % 2 == 0`."},{"type":"tf","prompt":"If you call a Lua function with fewer arguments than it has parameters, the missing ones are `nil`.","answer":true,"explain":"Lua does not complain about missing arguments. They are simply `nil` inside the function."},{"type":"order","prompt":"Put the lines in order so it prints Hi Max.","lines":["local function greet(name)","  return \"Hi \" .. name","end","print(greet(\"Max\"))"],"explain":"Define the function (header, body, `end`) before you call it."}]},{"id":"lua-i2","title":"Tables as arrays","summary":"Lists start at 1: create, index, add, remove, loop","teach":[{"text":"Lua has one data structure for groups of values: the **table**. Used as a list, it keeps values in order. **Big rule: Lua counts from 1, not 0.** The first item is `t[1]`. Python, JavaScript and C# start at 0, so this trips up many people.","code":"local fruits = {\"apple\", \"banana\", \"cherry\"}\nprint(fruits[1])  -- apple\nprint(fruits[3])  -- cherry\nprint(fruits[0])  -- nil (there is no item 0!)"},{"text":"`#` gives the length of a list. Because counting starts at 1, the last item is at `t[#t]`. You can change an item by assigning to its position.","code":"local scores = {10, 20, 30, 40}\nprint(#scores)          -- 4\nprint(scores[#scores])  -- 40\nscores[2] = 25\nprint(scores[2])        -- 25"},{"text":"`table.insert` adds an item (at the end, or at a position you give). `table.remove` takes one out and returns it (the last one, or at a position). `table.concat` joins a list into one string.","code":"local bag = {\"sword\"}\ntable.insert(bag, \"shield\")     -- add to the end\ntable.insert(bag, 1, \"map\")     -- add at position 1\nprint(table.concat(bag, \", \"))  -- map, sword, shield\nprint(table.remove(bag))        -- shield\ntable.remove(bag, 1)            -- removes \"map\"\nprint(#bag)                     -- 1"},{"text":"Loop over a list with a numeric `for` from 1 to `#t`, or with `ipairs`, which gives you each position and value in order.","code":"local colors = {\"red\", \"green\", \"blue\"}\nfor i, color in ipairs(colors) do\n  print(i .. \": \" .. color)\nend\n-- 1: red\n-- 2: green\n-- 3: blue"},{"text":"Do not leave **holes** in a list by setting an item to `nil`. `ipairs` stops at the first `nil`, and `#` becomes unreliable. Use `table.remove` instead, which shifts the other items down.","code":"local t = {\"a\", \"b\", \"c\"}\nt[2] = nil  -- makes a hole: avoid this!\nfor i, v in ipairs(t) do\n  print(v)  -- a   (then ipairs stops at the hole)\nend"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"local nums = {5, 10, 15}\nprint(nums[1] + nums[2])","options":["25","10","15","Error"],"answer":2,"explain":"Lua lists start at 1, so `nums[1]` is 5 and `nums[2]` is 10."},{"type":"output","prompt":"What does this print?","code":"local t = {\"x\", \"y\", \"z\"}\nprint(t[0])","options":["x","nil","Error","z"],"answer":1,"explain":"There is no item at position 0 in a Lua list. Reading a missing position gives `nil`, not an error."},{"type":"output","prompt":"What does this print?","code":"local list = {3, 6, 9}\ntable.insert(list, 12)\ntable.remove(list, 1)\nprint(#list .. \" \" .. list[1])","options":["4 3","3 3","3 6","3 9"],"answer":2,"explain":"After the insert the list is {3, 6, 9, 12}. Removing position 1 leaves {6, 9, 12}: 3 items, first one 6."},{"type":"fill","prompt":"Loop over every pet in order.","code":"local pets = {\"cat\", \"dog\"}\nfor i, pet in ___(pets) do\n  print(pet)\nend","bank":["ipairs","range","each","items"],"answer":["ipairs"],"explain":"`ipairs` walks a list from position 1 upward. `range`, `each` and `items` are not built into Lua."},{"type":"fill","prompt":"Print the last item, whatever the length of the list.","code":"local items = {\"bow\", \"axe\", \"rope\"}\nprint(items[___])","bank":["#items","-1","0","len(items)"],"answer":["#items"],"explain":"`#items` is the length, which is also the position of the last item. Lua lists do not support -1, and position 0 is empty."},{"type":"bug","prompt":"This should print all three names. Tap the line with the bug.","lines":["local names = {\"Ava\", \"Ben\", \"Cy\"}","for i = 0, #names - 1 do","  print(names[i])","end"],"answer":1,"explain":"That loop is written for 0-based lists. In Lua it prints nil, Ava, Ben. Use `for i = 1, #names do`."},{"type":"tf","prompt":"In Lua, `t[1]` is the first item of a list-style table.","answer":true,"explain":"Lua lists start at index 1. This is one of the biggest differences from most other languages."},{"type":"order","prompt":"Put the lines in order so it prints gem, coin.","lines":["local items = {}","table.insert(items, \"gem\")","table.insert(items, \"coin\")","print(table.concat(items, \", \"))"],"explain":"Create the empty table first, insert in the order you want them shown, then print."}]},{"id":"lua-i3","title":"Tables as dictionaries","summary":"Key/value tables: look up, add, remove, loop","teach":[{"text":"The same table type can store values under **names** (keys) instead of positions. This works like a dictionary or map. Read a value with `t.key` or `t[\"key\"]`.","code":"local player = {name = \"Rex\", level = 3}\nprint(player.name)      -- Rex\nprint(player[\"level\"])  -- 3"},{"text":"Add a key by assigning to it, change it the same way, and **remove** it by setting it to `nil`.","code":"local player = {name = \"Rex\"}\nplayer.hp = 100       -- add a new key\nplayer.name = \"Rexy\"  -- change a value\nplayer.hp = nil       -- remove the key\nprint(player.name)    -- Rexy\nprint(player.hp)      -- nil"},{"text":"A missing key gives `nil`, not an error. So to check if a key exists, compare with `nil`.","code":"local prices = {apple = 3, pear = 5}\nif prices.kiwi == nil then\n  print(\"No kiwi\")  -- No kiwi\nend\nif prices[\"apple\"] ~= nil then\n  print(\"Apple costs \" .. prices.apple)  -- Apple costs 3\nend"},{"text":"`t.item` always means the key named \"item\". When the key is stored in a **variable**, use brackets: `t[item]`. Brackets also work for keys with spaces.","code":"local stock = {sword = 2, [\"magic wand\"] = 1}\nlocal item = \"sword\"\nprint(stock[item])          -- 2\nprint(stock.item)           -- nil (looks for a key named \"item\")\nprint(stock[\"magic wand\"])  -- 1"},{"text":"`pairs` loops over every key and value. The order is **not guaranteed**, so do not rely on it. `#` only counts the list part, so it is 0 for a pure dictionary.","code":"local ages = {ana = 12, ben = 15, cy = 13}\nlocal total = 0\nfor name, age in pairs(ages) do\n  total = total + age\nend\nprint(total)  -- 40\nprint(#ages)  -- 0"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"local pet = {name = \"Bo\", kind = \"dog\"}\npet.kind = \"cat\"\nprint(pet.name .. \" the \" .. pet.kind)","options":["Bo the dog","Bo the cat","name the kind","Error"],"answer":1,"explain":"Assigning to `pet.kind` replaces the old value \"dog\" with \"cat\"."},{"type":"output","prompt":"What does this print?","code":"local hero = {hp = 50}\nlocal key = \"hp\"\nprint(hero.key)\nprint(hero[key])","options":["50\n50","50\nnil","Error","nil\n50"],"answer":3,"explain":"`hero.key` looks for a key literally named \"key\", which does not exist. `hero[key]` uses the variable's value, \"hp\"."},{"type":"output","prompt":"What does this print?","code":"local inv = {gold = 5, gems = 2, keys = 1}\nlocal count = 0\nfor k, v in pairs(inv) do\n  count = count + 1\nend\nprint(count .. \" \" .. #inv)","options":["3 3","3 0","0 0","8 0"],"answer":1,"explain":"`pairs` visits all 3 keys. `#` only measures the list part (positions 1, 2, 3...), and this table has none."},{"type":"fill","prompt":"Print \"Leo has a score\" only when the key `leo` exists.","code":"local scores = {mia = 90}\nif scores.leo ___ ___ then\n  print(\"Leo has a score\")\nelse\n  print(\"No score for Leo\")\nend","bank":["~=","nil","==","null","0"],"answer":["~=","nil"],"explain":"A missing key is `nil`, so `~= nil` means the key exists. Lua has no `null`."},{"type":"bug","prompt":"This should print blue. Tap the line with the bug.","lines":["local colors = {sky = \"blue\", grass = \"green\"}","local thing = \"sky\"","print(colors.thing)"],"answer":2,"explain":"`colors.thing` looks for a key named \"thing\". To use the variable, write `colors[thing]`."},{"type":"tf","prompt":"`pairs()` always visits keys in the order you wrote them.","answer":false,"explain":"The order of `pairs` on named keys is not guaranteed. Use a list with `ipairs` if order matters."},{"type":"mcq","prompt":"How do you remove the key `hp` from table `p`?","options":["table.remove(p, \"hp\")","delete p.hp","p.hp = nil","p.hp = 0"],"answer":2,"explain":"Setting a key to `nil` removes it. `table.remove` is for list positions, and `p.hp = 0` keeps the key."},{"type":"order","prompt":"Put the lines in order so it prints Dune Messiah.","lines":["local book = {title = \"Dune\"}","book.title = book.title .. \" Messiah\"","print(book.title)"],"explain":"The table must exist before you change its `title`, and the print comes last."}]},{"id":"lua-i4","title":"Working with text","summary":"String methods, substrings, format, tonumber","teach":[{"text":"Strings have built-in methods you call with a colon: `s:upper()`, `s:lower()`, `s:len()` and `s:rep(n)`. Strings never change: each method returns a **new** string.","code":"local s = \"Hello\"\nprint(s:upper())  -- HELLO\nprint(s:lower())  -- hello\nprint(s:len())    -- 5\nprint(s:rep(2))   -- HelloHello"},{"text":"`s:sub(i, j)` cuts out part of a string. Positions start at **1** and both ends are included. Leave out `j` to go to the end. Negative numbers count from the end.","code":"local word = \"Lua rocks\"\nprint(word:sub(1, 3))  -- Lua\nprint(word:sub(5))     -- rocks\nprint(word:sub(-3))    -- cks\nprint(word:sub(2, 2))  -- u"},{"text":"`s:find(text)` returns the position where `text` starts, or `nil` if it is not there. `s:gsub(old, new)` replaces every match and returns the new string **and** the number of replacements.","code":"local msg = \"I like cats\"\nprint(msg:find(\"cats\") ~= nil)  -- true\nlocal start = msg:find(\"cats\")\nprint(start)                    -- 8\nlocal fixed, count = msg:gsub(\"cats\", \"dogs\")\nprint(fixed)                    -- I like dogs\nprint(count)                    -- 1"},{"text":"`string.format` fills a template. `%s` takes any value, `%d` a whole number, `%.2f` a number with 2 decimals, and `%05d` pads with zeros to 5 digits.","code":"local name, coins = \"Ana\", 7\nprint(string.format(\"%s has %d coins\", name, coins))  -- Ana has 7 coins\nprint(string.format(\"%.2f\", 3.14159))  -- 3.14\nprint(string.format(\"%05d\", 42))       -- 00042"},{"text":"`tonumber` turns text into a number, or gives `nil` if it cannot. `tostring` turns any value into text. Use them when reading input or building messages.","code":"local input = \"42\"\nlocal n = tonumber(input)\nprint(n + 1)                 -- 43\nprint(tonumber(\"abc\"))       -- nil\nprint(tostring(3.5) .. \"!\")  -- 3.5!"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"local s = \"banana\"\nprint(s:sub(2, 4))","options":["nan","ana","ban","anan"],"answer":1,"explain":"Position 1 is b, so positions 2 to 4 (both included) are a, n, a."},{"type":"output","prompt":"What does this print?","code":"print((\"abc\"):upper() .. #\"abc\")","options":["ABC3","abc3","ABC 3","Error"],"answer":0,"explain":"`upper` gives \"ABC\" and `#\"abc\"` is 3, and `..` joins them with no space."},{"type":"output","prompt":"What does this print?","code":"local s = \"red,green,blue\"\nlocal t, n = s:gsub(\",\", \" \")\nprint(t)\nprint(n)","options":["red green blue\n2","red green blue","red green blue\n3","red,green,blue\n0"],"answer":0,"explain":"`gsub` returns two values: the new string and how many replacements it made. There are 2 commas."},{"type":"output","prompt":"What does this print?","code":"local a = \"10\"\nlocal b = \"20\"\nprint(a .. b)\nprint(tonumber(a) + tonumber(b))","options":["30\n30","1020\n30","1020\n1020","30\n1020"],"answer":1,"explain":"`..` joins the text into \"1020\". After `tonumber`, `+` adds the numbers to get 30."},{"type":"fill","prompt":"Make it print png.","code":"local file = \"photo.png\"\nprint(file:sub(___))","bank":["-3","3","-4","0"],"answer":["-3"],"explain":"`sub(-3)` starts 3 characters from the end. `-4` would include the dot, and `3` would start at the letter o."},{"type":"fill","prompt":"Make it print Kim is 15 years.","code":"print(string.format(\"___ is ___ years\", \"Kim\", 15))","bank":["%s","%d","%f","%n"],"answer":["%s","%d"],"explain":"`%s` fits the string \"Kim\" and `%d` fits the whole number 15. `%f` would print 15.000000."},{"type":"bug","prompt":"This should print Sam. Tap the line with the bug.","lines":["local name = \"sam\"","local first = name:sub(1, 1):upper()","local rest = name:sub(2)","print(first + rest)"],"answer":3,"explain":"`+` tries to do math on \"S\" and \"am\" and fails. Join strings with `..`."},{"type":"tf","prompt":"`s:upper()` changes the string stored in `s`.","answer":false,"explain":"Strings in Lua never change. `s:upper()` returns a new string, and `s` stays the same unless you assign the result back."}]},{"id":"lua-i5","title":"Objects and classes","summary":"Objects from tables, : methods, and metatables","teach":[{"text":"Lua has no `class` keyword. An **object** is just a table that holds data (fields) and functions (methods). A method needs to know which object it works on, so it takes that object as its first parameter, usually named `self`.","code":"local dog = {name = \"Rex\", tricks = 0}\nfunction dog.learn(self)\n  self.tricks = self.tricks + 1\nend\ndog.learn(dog)\nprint(dog.tricks)  -- 1"},{"text":"The **colon** makes this shorter. `function dog:learn()` adds a hidden `self` parameter, and `dog:learn()` passes `dog` as `self` for you. `obj:m()` is the same as `obj.m(obj)`.","code":"local dog = {name = \"Rex\", tricks = 0}\nfunction dog:learn()\n  self.tricks = self.tricks + 1\nend\ndog:learn()  -- same as dog.learn(dog)\ndog:learn()\nprint(dog.tricks)  -- 2"},{"text":"To make many objects of the same kind, build a **class**: a table of shared methods plus a `new` function. `setmetatable(obj, Dog)` links each new object to the class, and `Dog.__index = Dog` tells Lua to look in `Dog` for anything the object does not have.","code":"local Dog = {}\nDog.__index = Dog\n\nfunction Dog.new(name)\n  local self = setmetatable({}, Dog)\n  self.name = name\n  return self\nend\n\nfunction Dog:bark()\n  return self.name .. \" says woof\"\nend"},{"text":"Now create **instances** with `Dog.new`. Each one has its own fields, but they all share the same methods from `Dog`.","code":"local a = Dog.new(\"Rex\")\nlocal b = Dog.new(\"Bo\")\nprint(a:bark())          -- Rex says woof\nprint(b:bark())          -- Bo says woof\nprint(a.bark == b.bark)  -- true (one shared method)"},{"text":"How the lookup works: `a.name` is found in `a` itself. `a.bark` is missing from `a`, so Lua checks the **metatable's** `__index`, which is `Dog`, and finds it there. Common mistake: calling `a.bark()` with a dot, which leaves `self` as `nil`.","code":"local c = Dog.new(\"Max\")\nprint(c.name)                  -- Max\nprint(rawget(c, \"bark\"))       -- nil (not stored in c)\nprint(getmetatable(c) == Dog)  -- true"}],"quiz":[{"type":"mcq","prompt":"`obj:move(5)` is the same as which call?","options":["obj.move(5)","obj.move(obj, 5)","move(obj, 5)","obj.move(self, 5)"],"answer":1,"explain":"The colon passes the object itself as the first argument, which becomes `self`."},{"type":"output","prompt":"What does this print?","code":"local Counter = {}\nCounter.__index = Counter\nfunction Counter.new()\n  return setmetatable({count = 0}, Counter)\nend\nfunction Counter:add(n)\n  self.count = self.count + n\nend\nlocal c = Counter.new()\nc:add(2)\nc:add(3)\nprint(c.count)","options":["0","3","5","Error"],"answer":2,"explain":"Each `c:add(n)` passes `c` as `self`, so the count goes 0, 2, 5."},{"type":"output","prompt":"Using the same `Counter` class as before, what does this print?","code":"local a = Counter.new()\nlocal b = Counter.new()\na:add(4)\nprint(a.count .. \" \" .. b.count)","options":["4 4","4 0","0 4","Error"],"answer":1,"explain":"Each `Counter.new()` makes a fresh table with its own `count`. Changing `a` does not touch `b`."},{"type":"output","prompt":"Look closely. What does this print?","code":"local Cat = {}\n\nfunction Cat.new(name)\n  return setmetatable({name = name}, Cat)\nend\n\nfunction Cat:meow()\n  return self.name .. \": meow\"\nend\n\nlocal c = Cat.new(\"Tom\")\nprint(c:meow())","options":["Tom: meow","nil","Error","meow"],"answer":2,"explain":"`Cat.__index = Cat` is missing, so the object cannot find `meow` in `Cat`. `c.meow` is `nil`, and calling `nil` is an error."},{"type":"fill","prompt":"Complete the class so that `Ship.new(\"Pearl\"):sail()` works.","code":"local Ship = {}\nShip.__index = Ship\n\nfunction Ship.new(name)\n  local self = ___({}, Ship)\n  self.name = name\n  return self\nend\n\nfunction Ship___sail()\n  print(self.name .. \" sets sail\")\nend\nShip.new(\"Pearl\"):sail()","bank":["setmetatable","getmetatable",":",".","new"],"answer":["setmetatable",":"],"explain":"`setmetatable` links the new object to the class. The colon in `Ship:sail()` creates the hidden `self` parameter."},{"type":"bug","prompt":"Tap the line with the bug.","lines":["local Player = {}","Player.__index = Player","function Player.new(name) return setmetatable({name = name}, Player) end","function Player:greet() print(\"Hi, \" .. self.name) end","local p = Player.new(\"Kai\")","p.greet()"],"answer":5,"explain":"With a dot, nothing is passed as `self`, so `self.name` fails. Call methods with a colon: `p:greet()`."},{"type":"tf","prompt":"When `__index` points to the class, every instance gets its own copy of each method.","answer":false,"explain":"Methods live once in the class table. Instances only hold their own fields, and Lua finds methods through `__index`."},{"type":"order","prompt":"Put the constructor lines in order.","lines":["function Box.new(size)","  local self = setmetatable({}, Box)","  self.size = size","  return self","end"],"explain":"Create `self` first, then set its fields, then return it before the closing `end`."}]}],"advanced":[{"id":"lua-a1","title":"Inheritance and polymorphism","summary":"Metatable inheritance, overriding, duck typing","teach":[{"text":"Start with a normal base class. `intro` calls `self:speak()`, and that small detail is what makes polymorphism work later.","code":"local Animal = {}\nAnimal.__index = Animal\nfunction Animal.new(name)\n  return setmetatable({name = name}, Animal)\nend\nfunction Animal:speak() return \"...\" end\nfunction Animal:intro()\n  return self.name .. \" says \" .. self:speak()\nend"},{"text":"A **child class** is a table whose own metatable has `__index = Animal`. Then anything missing in `Cat` is looked up in `Animal`. `Cat.new` builds an Animal and re-links it to `Cat`. Defining `Cat:speak` **overrides** the parent version.","code":"local Cat = setmetatable({}, {__index = Animal})\nCat.__index = Cat\n\nfunction Cat.new(name)\n  local self = Animal.new(name)\n  return setmetatable(self, Cat)\nend\nfunction Cat:speak() return \"meow\" end\n\nprint(Cat.new(\"Tom\"):intro())  -- Tom says meow"},{"text":"The lookup chain is: the object, then `Cat`, then `Animal`. `intro` lives in `Animal`, but `self:speak()` starts the search at the object again, so it finds `Cat`'s version. One call, different behavior per type: that is **polymorphism**.","code":"local pets = {Animal.new(\"Rock\"), Cat.new(\"Tom\")}\nfor _, p in ipairs(pets) do\n  print(p:intro())\nend\n-- Rock says ...\n-- Tom says meow"},{"text":"To extend a parent method instead of replacing it, call the parent's version directly with a **dot** and pass `self` yourself: `Cat.speak(self)`.","code":"local Lion = setmetatable({}, {__index = Cat})\nLion.__index = Lion\nfunction Lion.new(name)\n  return setmetatable(Cat.new(name), Lion)\nend\nfunction Lion:speak()\n  return Cat.speak(self):upper() .. \" ROAR\"\nend\nprint(Lion.new(\"Leo\"):intro())  -- Leo says MEOW ROAR"},{"text":"Lua has no interfaces. It uses **duck typing**: any table that has the right method can be used, whatever its class. If it speaks like an animal, it works.","code":"local robot = {}\nfunction robot:speak() return \"beep\" end\n\nlocal things = {Cat.new(\"Tom\"), robot}\nfor _, t in ipairs(things) do\n  print(t:speak())\nend\n-- meow\n-- beep"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"local Base = {}\nBase.__index = Base\nfunction Base.new() return setmetatable({}, Base) end\nfunction Base:name() return \"base\" end\nfunction Base:hello() return \"I am \" .. self:name() end\n\nlocal Child = setmetatable({}, {__index = Base})\nChild.__index = Child\nfunction Child.new() return setmetatable(Base.new(), Child) end\nfunction Child:name() return \"child\" end\n\nprint(Child.new():hello())","options":["I am child","I am base","Error","I am nil"],"answer":0,"explain":"`hello` is found in `Base`, but `self` is the Child object, so `self:name()` finds `Child:name` first."},{"type":"output","prompt":"One line is missing from `Child`. What happens?","code":"local Base = {}\nBase.__index = Base\nfunction Base:hi() return \"hi\" end\n\nlocal Child = setmetatable({}, {__index = Base})\nfunction Child:bye() return \"bye\" end\n\nlocal obj = setmetatable({}, Child)\nprint(obj:bye())","options":["bye","nil","Error"],"answer":2,"explain":"`Child.__index = Child` is missing. Lua reads `__index` directly from the metatable (it is not inherited), so `obj` finds nothing and calling `nil` fails."},{"type":"output","prompt":"What does this print?","code":"local A = {}\nA.__index = A\nfunction A:value() return 10 end\n\nlocal B = setmetatable({}, {__index = A})\nB.__index = B\nfunction B:value() return A.value(self) + 5 end\n\nlocal obj = setmetatable({}, B)\nprint(obj:value())","options":["10","15","5","Error"],"answer":1,"explain":"`obj:value()` finds `B.value`, which calls the parent's version directly (10) and adds 5."},{"type":"output","prompt":"What does this print?","code":"local Base = {speed = 1}\nBase.__index = Base\nlocal car = setmetatable({}, Base)\nlocal bike = setmetatable({}, Base)\ncar.speed = 5\nprint(car.speed .. \" \" .. bike.speed)","options":["5 5","1 1","1 5","5 1"],"answer":3,"explain":"`car.speed = 5` stores a new field in `car` itself. `bike` has no own field, so it still finds 1 in `Base`."},{"type":"fill","prompt":"Make `Dog` inherit from `Animal`.","code":"local Dog = setmetatable({}, {__index = ___})\nDog.__index = ___","bank":["Animal","Dog","self","nil"],"answer":["Animal","Dog"],"explain":"The class's own metatable points to the parent. `Dog.__index = Dog` lets Dog instances find Dog's methods."},{"type":"bug","prompt":"A Hero's attack should do double the damage of a Unit's attack. Tap the line with the bug.","lines":["local Hero = setmetatable({}, {__index = Unit})","Hero.__index = Hero","function Hero:attack()","  return self:attack() * 2","end"],"answer":3,"explain":"`self:attack()` finds `Hero:attack` again and calls itself forever. Call the parent directly: `Unit.attack(self) * 2`."},{"type":"tf","prompt":"Lua has a built-in `class` keyword for inheritance.","answer":false,"explain":"Lua builds classes and inheritance out of tables and metatables with `__index`."},{"type":"mcq","prompt":"`obj` is a Cat, and Cat inherits from Animal. In what order does Lua search for `obj:intro`?","options":["Animal, then Cat, then obj","obj, then Cat, then Animal","Cat only","obj, then Animal"],"answer":1,"explain":"Lua checks the object first, then follows `__index` to `Cat`, then `Cat`'s metatable `__index` to `Animal`."}]},{"id":"lua-a2","title":"Errors and pcall","summary":"error, pcall, assert, and cleaning up","teach":[{"text":"When something goes wrong, Lua raises an **error** and the program stops. You can raise your own with `error(message)`. Lua adds the file name and line number to the front of a text message.","code":"local function withdraw(balance, amount)\n  if amount > balance then\n    error(\"not enough money\")\n  end\n  return balance - amount\nend\nprint(withdraw(10, 3))   -- 7\nprint(withdraw(10, 50))  -- crash: main.lua:3: not enough money"},{"text":"Lua has no try/catch. Instead, `pcall(f, args...)` (protected call) runs `f` and **catches** any
