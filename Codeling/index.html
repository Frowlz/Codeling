<style>
/* chunky press-down buttons, dark code everywhere, one column on phones */
:root {
  --bg: #f3f5fa;
  --surface: #ffffff;
  --surface-2: #e9edf6;
  --line: #d5dbe8;
  --ink: #17203a;
  --ink-2: #59637d;
  --accent: #3355ff;
  --accent-deep: #2238c4;
  --accent-soft: #e3e8ff;
  --good: #12a672;
  --good-deep: #0b7c55;
  --good-soft: #ddf5ea;
  --good-ink: #0b7c55;
  --bad: #e5484d;
  --bad-deep: #b4262b;
  --bad-soft: #fde3e3;
  --bad-ink: #b4262b;
  --xp: #e89b00;
  --flame: #ff7a1a;
  --lock: #c3cad9;

  --code-bg: #121a30;
  --code-fg: #dfe5f5;
  --code-dim: #7f8bab;
  --c-kw: #ff8fb1;
  --c-str: #9be38a;
  --c-num: #ffc66d;
  --c-com: #6f7c9e;
  --c-fn: #7cc4ff;

  --py: #3572a5;
  --js: #c99a00;
  --java: #d9661a;
  --cs: #7b3fbf;
  --cpp: #00599c;
  --lua: #2c2d72;

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1324; --surface: #161d33; --surface-2: #1e2742; --line: #2c3757;
    --ink: #e8ecf8; --ink-2: #97a2c0;
    --accent: #6e86ff; --accent-deep: #3f55cc; --accent-soft: #232d55;
    --good: #2bc48a; --good-deep: #178a5e; --good-soft: #123a2c; --good-ink: #5fe0ac;
    --bad: #ff6b6f; --bad-deep: #b83a3e; --bad-soft: #3d1c22; --bad-ink: #ff9a9d;
    --xp: #ffbe3d; --lock: #3a4566;
    --code-bg: #0a0f1e;
    --py: #5a97d0; --js: #e6b400; --java: #f08a3c; --cs: #a274e0; --cpp: #3b8fd6; --lua: #7a7be0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1324; --surface: #161d33; --surface-2: #1e2742; --line: #2c3757;
  --ink: #e8ecf8; --ink-2: #97a2c0;
  --accent: #6e86ff; --accent-deep: #3f55cc; --accent-soft: #232d55;
  --good: #2bc48a; --good-deep: #178a5e; --good-soft: #123a2c; --good-ink: #5fe0ac;
  --bad: #ff6b6f; --bad-deep: #b83a3e; --bad-soft: #3d1c22; --bad-ink: #ff9a9d;
  --xp: #ffbe3d; --lock: #3a4566;
  --code-bg: #0a0f1e;
  --py: #5a97d0; --js: #e6b400; --java: #f08a3c; --cs: #a274e0; --cpp: #3b8fd6; --lua: #7a7be0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.1; margin: 0; text-wrap: balance; }
p { margin: 0; }
code, pre, .mono { font-family: var(--f-code); }
p code, .prose code {
  font-size: .88em; background: var(--surface-2); padding: .1em .35em; border-radius: 5px;
}
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; }

/* top bar */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 2px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand {
  display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0;
  font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.02em;
}
.brand svg { width: 34px; height: 34px; }
.stats { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.stat {
  display: flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 12px;
  font-weight: 700; font-variant-numeric: tabular-nums; background: none; border: 0;
}
.stat svg { width: 22px; height: 22px; }
.stat.flame { color: var(--flame); }
.stat.flame.off { color: var(--ink-2); filter: grayscale(1); opacity: .7; }
.stat.gem { color: var(--xp); }
.goal-ring { width: 30px; height: 30px; }
.goal-ring circle { fill: none; stroke-width: 4; }
.goal-ring .bg { stroke: var(--line); }
.goal-ring .fg { stroke: var(--good); stroke-linecap: round; transition: stroke-dashoffset .5s; }
.icon-btn { border: 0; background: none; padding: 6px; border-radius: 10px; color: var(--ink-2); display: grid; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }

/* buttons */
.btn {
  --b: var(--accent); --d: var(--accent-deep);
  border: 0; border-radius: 14px; padding: 13px 22px; min-height: 50px;
  background: var(--b); color: #fff; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: 15px;
  box-shadow: 0 4px 0 var(--d); transition: transform .06s, box-shadow .06s, filter .15s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--d); }
.btn:disabled { --b: var(--surface-2); --d: var(--line); color: var(--ink-2); cursor: default; }
.btn.good { --b: var(--good); --d: var(--good-deep); }
.btn.bad { --b: var(--bad); --d: var(--bad-deep); }
.btn.ghost { --b: var(--surface); --d: var(--line); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn.wide { width: 100%; }

/* home */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; padding-block: 40px 28px; }
.hero .bit { width: 120px; height: 120px; }
.hero h1 { font-size: clamp(32px, 5.2vw, 52px); font-weight: 800; letter-spacing: -.03em; }
.hero p { color: var(--ink-2); font-size: 18px; margin-top: 10px; max-width: 58ch; }
.today {
  display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 18px; color: var(--ink-2); font-weight: 600; font-size: 14px;
}
.today b { color: var(--ink); font-variant-numeric: tabular-nums; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 10px 0 14px; }
.section-h h2 { font-size: 24px; }
.section-h span { color: var(--ink-2); font-size: 14px; }

.courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; padding-bottom: 48px; }
.course {
  --c: var(--accent);
  position: relative; text-align: left; display: grid; grid-template-columns: 58px 1fr; gap: 6px 14px; align-items: start;
  background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 18px;
  box-shadow: 0 4px 0 var(--line); transition: transform .08s, box-shadow .08s, border-color .15s;
}
.course:hover { border-color: var(--c); box-shadow: 0 4px 0 var(--c); }
.course:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--c); }
.badge {
  grid-row: span 3; width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center;
  background: var(--c); color: #fff; font: 800 18px/1 var(--f-code); letter-spacing: -.04em;
  box-shadow: inset 0 -5px 0 rgb(0 0 0 / .22);
}
.course .name { font: 800 21px/1.1 var(--f-display); }
.course .tag { font-size: 12px; font-weight: 700; color: var(--c); text-transform: uppercase; letter-spacing: .06em; }
.course .desc { color: var(--ink-2); font-size: 14px; line-height: 1.45; }
.course .tag, .course .name, .course .desc { display: block; }
.meter { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--c, var(--good)); transition: width .4s; }

/* level picker */
.picker { max-width: 640px; margin: 0 auto; padding-block: 40px 60px; }
.picker h1 { font-size: clamp(28px, 4vw, 38px); letter-spacing: -.02em; margin-top: 12px; }
.picker > p { color: var(--ink-2); margin-top: 8px; }
.levels { display: grid; gap: 12px; margin-top: 24px; }
.lvl {
  display: grid; grid-template-columns: 48px 1fr auto; gap: 14px; align-items: center; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: 0 4px 0 var(--line);
}
.lvl:hover { border-color: var(--accent); }
.lvl .bars { display: flex; align-items: flex-end; gap: 3px; height: 30px; justify-self: center; }
.lvl .bars i { width: 8px; border-radius: 3px; background: var(--line); }
.lvl .bars i.on { background: var(--accent); }
.lvl b { display: block; font-size: 17px; }
.lvl span { color: var(--ink-2); font-size: 14px; }
.lvl small { color: var(--ink-2); font-weight: 700; font-variant-numeric: tabular-nums; }
.back { border: 0; background: none; color: var(--ink-2); font-weight: 700; padding: 6px 0; display: inline-flex; gap: 6px; align-items: center; }
.back:hover { color: var(--ink); }
.back svg { width: 18px; height: 18px; }

/* course page */
.course-page { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; padding-block: 24px 64px; align-items: start; }
.unit {
  --c: var(--accent);
  background: var(--c); color: #fff; border-radius: 18px; padding: 18px 20px; box-shadow: 0 5px 0 rgb(0 0 0 / .25);
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
}
.unit small { display: block; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; font-size: 12px; opacity: .85; }
.unit h2 { font-size: 26px; color: #fff; }
.unit p { opacity: .9; font-size: 14px; margin-top: 2px; }
.tabs { display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
.tab {
  border: 2px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-weight: 700; font-size: 14px; color: var(--ink-2);
}
.tab[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.path { --k: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 60px 0 20px; }
#w { display: grid; gap: 18px; }
.node-row { position: relative; display: flex; justify-content: center; width: 100%; }
.node-row.open { z-index: 5; }
.node {
  --c: var(--accent);
  position: relative; width: 78px; height: 72px; border-radius: 50%; border: 0;
  background: var(--c); color: #fff; box-shadow: 0 7px 0 color-mix(in srgb, var(--c) 70%, #000);
  display: grid; place-items: center; transition: transform .08s, box-shadow .08s;
}
.node svg { width: 34px; height: 34px; }
.node:active:not(.locked) { transform: translateY(6px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 70%, #000); }
.node.done { --c: var(--xp); }
.node.locked { --c: var(--lock); color: color-mix(in srgb, var(--ink-2) 70%, transparent); cursor: default; }
.node.current::before {
  content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 4px solid var(--c); opacity: .35;
  animation: ping 1.8s ease-out infinite;
}
@keyframes ping { 0% { transform: scale(.9); opacity: .5; } 100% { transform: scale(1.18); opacity: 0; } }
.node-label {
  position: absolute; top: 50%; transform: translateY(-50%); width: 170px; pointer-events: none; font-size: 14px; line-height: 1.3; color: var(--ink-2);
}
.node-label b { display: block; color: var(--ink); font-size: 15px; }
.start-tip {
  position: absolute; bottom: calc(100% + 14px); left: 50%; transform: translateX(-50%);
  background: var(--surface); border: 2px solid var(--line); color: var(--accent); font-weight: 800; font-size: 13px; letter-spacing: .06em;
  padding: 6px 12px; border-radius: 10px; white-space: nowrap; text-transform: uppercase; animation: bob 1.6s ease-in-out infinite;
}
.start-tip::after {
  content: ""; position: absolute; top: 100%; left: 50%; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--line);
}
@keyframes bob { 50% { transform: translate(-50%, -5px); } }

.pop {
  position: absolute; z-index: 3; top: calc(100% + 16px); left: 50%; transform: translateX(-50%); width: min(300px, calc(100vw - 32px));
  background: var(--c, var(--accent)); color: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgb(0 0 0 / .25);
  display: grid; gap: 10px;
}
.pop::before { content: ""; position: absolute; bottom: 100%; left: 50%; margin-left: -9px; border: 9px solid transparent; border-bottom-color: var(--c, var(--accent)); }
.pop h3 { font-size: 19px; color: #fff; }
.pop p { opacity: .92; font-size: 14px; }
.pop .btn { --b: #fff; --d: rgb(0 0 0 / .25); color: var(--c, var(--accent)); }
.node.done ~ .pop .btn { color: #8a5a00; }

.side { display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 10px; }
.card h3 { font-size: 18px; }
.card p { color: var(--ink-2); font-size: 14px; }
.card .row { display: flex; align-items: center; gap: 10px; }
.card .row svg { width: 28px; height: 28px; flex: none; }
.level-list { display: grid; gap: 8px; font-size: 14px; }
.level-list div { display: grid; grid-template-columns: 96px 1fr 36px; gap: 10px; align-items: center; font-weight: 600; }
.level-list span { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* lesson player */
.player {
  position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto;
  padding-top: env(safe-area-inset-top, 0px);
}
.p-top { display: flex; align-items: center; gap: 14px; padding: 16px; max-width: 760px; width: 100%; margin: 0 auto; }
.p-top .bar { height: 16px; }
.p-top .bar i { background: var(--good); box-shadow: inset 0 -4px 0 rgb(0 0 0 / .12); }
.hearts { display: flex; align-items: center; gap: 4px; color: var(--bad); font-weight: 800; font-variant-numeric: tabular-nums; }
.hearts svg { width: 24px; height: 24px; }
.hearts.hit { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.p-body { overflow-y: auto; padding: 8px 16px 32px; }
.p-inner { max-width: 680px; margin: 0 auto; display: grid; gap: 18px; padding-top: 12px; }
.kicker { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); display: flex; gap: 8px; align-items: center; }
.kicker.new { color: var(--cs); }
.p-inner h2 { font-size: clamp(22px, 3.4vw, 28px); letter-spacing: -.01em; }
.teach-text { font-size: 18px; line-height: 1.6; max-width: 62ch; }
.speech { display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: start; }
.speech .bit { width: 72px; height: 72px; }
.bubble { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; position: relative; min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -10px; top: 22px; border: 9px solid transparent; border-right-color: var(--line); border-left: 0; }

pre.code {
  margin: 0; background: var(--code-bg); color: var(--code-fg); border-radius: 14px; padding: 16px 18px;
  font-size: 14.5px; line-height: 1.6; overflow-x: auto; tab-size: 4;
}
.code-wrap { min-width: 0; position: relative; }
.code-wrap .lang { position: absolute; top: 8px; right: 12px; font: 700 11px/1 var(--f-code); color: var(--code-dim); text-transform: uppercase; letter-spacing: .08em; }
.k { color: var(--c-kw); } .s { color: var(--c-str); } .n { color: var(--c-num); } .c { color: var(--c-com); font-style: italic; } .f { color: var(--c-fn); }

.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: 0 3px 0 var(--line);
  min-width: 0;
}
.opt:hover:not(:disabled) { background: var(--surface-2); }
.opt kbd {
  width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center;
  font: 700 13px/1 var(--f-code); color: var(--ink-2);
}
.opt .out { font-family: var(--f-code); white-space: pre-wrap; word-break: break-word; font-size: 15px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 3px 0 var(--accent); }
.opt[aria-pressed="true"] kbd { border-color: var(--accent); color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); box-shadow: 0 3px 0 var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 3px 0 var(--bad); }
.tf { grid-template-columns: 1fr 1fr; }
.tf .opt { grid-template-columns: 1fr; text-align: center; font-weight: 800; font-size: 18px; padding: 20px; }
.tf .opt kbd { display: none; }

.fill-code .blank {
  display: inline-block; min-width: 4.2ch; padding: 0 6px; margin: 0 1px; border-bottom: 2px dashed var(--code-dim); color: var(--code-fg);
  border-radius: 6px 6px 0 0; text-align: center; vertical-align: baseline; background: none; border-top: 0; border-left: 0; border-right: 0;
  font: inherit; line-height: 1.35;
}
.fill-code .blank.filled { background: rgb(255 255 255 / .12); border-bottom: 2px solid var(--c-fn); }
.fill-code .blank.next { border-bottom-color: var(--c-num); }
.fill-code .blank.right { background: color-mix(in srgb, var(--good) 35%, transparent); border-bottom-color: var(--good); }
.fill-code .blank.wrong { background: color-mix(in srgb, var(--bad) 35%, transparent); border-bottom-color: var(--bad); }
.bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.tile {
  font: 600 15px/1.2 var(--f-code); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px;
  box-shadow: 0 3px 0 var(--line); white-space: pre;
}
.tile:hover:not(:disabled) { background: var(--surface-2); }
.tile.used { visibility: hidden; }

.order-slots, .order-pool { display: grid; gap: 8px; }
.order-slots { min-height: 60px; padding: 10px; border: 2px dashed var(--line); border-radius: 14px; }
.order-slots:empty::before { content: "Tap lines below to build the program"; color: var(--ink-2); font-size: 14px; text-align: center; padding: 8px; }
.line-tile {
  display: block; width: 100%; text-align: left; background: var(--code-bg); color: var(--code-fg); border: 2px solid transparent; border-radius: 10px;
  padding: 8px 12px; font: 14.5px/1.5 var(--f-code); white-space: pre; overflow-x: auto; box-shadow: 0 3px 0 rgb(0 0 0 / .3);
}
.line-tile:hover:not(:disabled) { border-color: var(--c-fn); }
.line-tile.used { visibility: hidden; height: 0; padding: 0; margin: -4px 0; border: 0; }
.order-slots.right { border-color: var(--good); border-style: solid; background: var(--good-soft); }
.order-slots.wrong { border-color: var(--bad); border-style: solid; background: var(--bad-soft); }

.bug-lines { background: var(--code-bg); border-radius: 14px; padding: 8px; display: grid; gap: 2px; overflow-x: auto; }
.bug-line {
  display: grid; grid-template-columns: 34px 1fr; gap: 8px; text-align: left; border: 2px solid transparent; background: none; color: var(--code-fg);
  border-radius: 8px; padding: 5px 8px; font: 14.5px/1.5 var(--f-code); white-space: pre; min-width: max-content;
}
.bug-line span:first-child { color: var(--code-dim); text-align: right; }
.bug-line:hover:not(:disabled) { background: rgb(255 255 255 / .06); }
.bug-line[aria-pressed="true"] { border-color: var(--c-num); background: rgb(255 198 109 / .12); }
.bug-line.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 22%, transparent); }
.bug-line.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 22%, transparent); }

.p-foot { border-top: 2px solid var(--line); background: var(--bg); padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.p-foot.good { background: var(--good-soft); border-color: transparent; }
.p-foot.bad { background: var(--bad-soft); border-color: transparent; }
.foot-in { max-width: 760px; margin: 0 auto; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.verdict { display: flex; gap: 12px; align-items: flex-start; flex: 1 1 320px; min-width: 0; }
.verdict .ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; }
.verdict .ic svg { width: 26px; height: 26px; }
.p-foot.good .ic { background: var(--good); } .p-foot.bad .ic { background: var(--bad); }
.verdict h3 { font-size: 20px; }
.p-foot.good h3 { color: var(--good-ink); } .p-foot.bad h3 { color: var(--bad-ink); }
.verdict p { font-size: 15px; margin-top: 3px; }
.foot-in .btn { min-width: 160px; }
.skip { border: 0; background: none; color: var(--ink-2); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 14px; padding: 12px 6px; }

/* end screens */
.end { max-width: 520px; margin: 0 auto; text-align: center; display: grid; gap: 18px; justify-items: center; padding-top: 6vh; }
.end .bit { width: 140px; height: 140px; }
.end h2 { font-size: clamp(28px, 5vw, 38px); }
.end > p { color: var(--ink-2); font-size: 17px; }
.scores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.score { border: 2px solid var(--sc); border-radius: 14px; overflow: hidden; }
.score small { display: block; background: var(--sc); color: #fff; font-weight: 800; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 5px; }
.score b { display: block; font: 800 24px/1 var(--f-display); padding: 14px 4px; font-variant-numeric: tabular-nums; }

.bit .body { fill: var(--accent); }
.bit .brace { fill: none; stroke: var(--accent-deep); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.bit .eye { fill: #fff; } .bit .pupil { fill: #17203a; } .bit .mouth { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; }
.bit .cheek { fill: #ff9ab0; opacity: .6; }
.bit.sad .body { fill: var(--ink-2); }
.bit.sad .brace { stroke: var(--line); }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px;
}
.foot { color: var(--ink-2); font-size: 13px; padding-block: 0 32px; text-align: center; }

@media (max-width: 860px) {
  .course-page { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
}
@media (max-width: 560px) {
  .hero { grid-template-columns: 1fr; gap: 12px; padding-block: 24px 16px; }
  .hero .bit { width: 84px; height: 84px; }
  .stat { padding: 6px; }
  .brand span { display: none; }
  .path { --k: .45; gap: 34px; }
  .node-label { width: 118px; font-size: 13px; }
  .foot-in .btn { width: 100%; }
  .speech { grid-template-columns: 1fr; }
  .speech .bit { display: none; }
  .bubble::before { display: none; }
  .teach-text { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* Bit helper (only when the page can ask Claude) */
body:not(.ai-on) .ai { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ask-btn {
  display: flex; align-items: center; gap: 6px; border: 2px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 4px 10px 4px 6px; font-weight: 800; font-size: 14px; color: var(--accent);
}
.ask-btn svg { width: 24px; height: 24px; }
.ask-btn:hover { border-color: var(--accent); }
.helpers { display: flex; flex-wrap: wrap; gap: 8px; }
.helper {
  border: 2px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 14px;
  font-weight: 700; font-size: 14px; color: var(--accent);
}
.helper:hover { border-color: var(--accent); background: var(--accent-soft); }
.q-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.q-head .helper { padding: 4px 12px; font-size: 13px; }
.more {
  border: 0; background: none; padding: 4px 0 0; font-weight: 800; font-size: 14px; color: inherit; text-decoration: underline;
  text-underline-offset: 3px; opacity: .85;
}
.p-foot.good .more { color: var(--good-ink); } .p-foot.bad .more { color: var(--bad-ink); }

/* tappable jargon */
.term {
  all: unset; cursor: help; border-bottom: 2px dotted var(--accent); color: inherit;
}
.term:hover { background: var(--accent-soft); border-radius: 3px; }
.term:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.tip {
  position: fixed; z-index: 60; background: var(--surface); color: var(--ink); border: 2px solid var(--accent); border-radius: 14px;
  padding: 12px 14px; box-shadow: 0 12px 30px rgb(0 0 0 / .2); display: grid; gap: 6px; font-size: 15px; line-height: 1.45;
}
.tip b { font-family: var(--f-display); font-size: 17px; text-transform: capitalize; }
.tip .more { justify-self: start; color: var(--accent); }

/* long comments wrap instead of running off the edge */
.p-inner pre.code { white-space: pre-wrap; overflow-wrap: anywhere; }
.code-wrap .lang + pre.code { padding-top: 26px; }

.bitpanel {
  position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; width: min(420px, 100%);
  background: var(--bg); border-left: 2px solid var(--line); box-shadow: -16px 0 40px rgb(0 0 0 / .18);
  display: grid; grid-template-rows: auto 1fr auto auto auto;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
  gap: 10px;
}
.bit-head { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; }
.bit-head .bit { width: 44px; height: 44px; }
.bit-head b { font-family: var(--f-display); font-size: 20px; display: block; }
.bit-head small { color: var(--ink-2); font-size: 13px; }
.bit-log { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; min-height: 0; }
.msg { max-width: 92%; border-radius: 16px; padding: 10px 14px; font-size: 15.5px; line-height: 1.5; display: grid; gap: 8px; min-width: 0; }
.msg p, .msg ul { margin: 0; }
.msg ul { padding-left: 20px; display: grid; gap: 4px; }
.msg pre.code { font-size: 13.5px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg code { font-size: .88em; background: var(--surface-2); padding: .1em .35em; border-radius: 5px; }
.bit-msg { align-self: flex-start; background: var(--surface); border: 2px solid var(--line); border-top-left-radius: 4px; }
.you-msg { align-self: flex-end; background: var(--accent); color: #fff; border-top-right-radius: 4px; }
.msg .cut { color: var(--ink-2); font-size: 13px; }
.thinking { color: var(--ink-2); }
.thinking span { animation: blink 1.2s infinite; }
.thinking span:nth-child(2) { animation-delay: .2s; } .thinking span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .2; } }
.bit-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 2px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13.5px; font-weight: 700;
  color: var(--accent);
}
.chip:hover:not(:disabled) { border-color: var(--accent); }
.chip:disabled { opacity: .5; cursor: default; }
.bit-form { display: flex; gap: 8px; }
.bit-form input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 2px solid var(--line);
  border-radius: 14px; padding: 10px 14px;
}
.bit-form input:focus { outline: none; border-color: var(--accent); }
.bit-form .btn { min-height: 46px; padding: 10px 18px; }
.bit-note { color: var(--ink-2); font-size: 12px; text-align: center; }
@media (max-width: 560px) {
  .bitpanel { top: auto; height: 78%; width: 100%; border-left: 0; border-top: 2px solid var(--line); border-radius: 20px 20px 0 0; }
  .ask-btn span { display: none; }
  .ask-btn { padding: 4px; }
}
@media (max-width: 560px) {
  .bit-chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  .chip { white-space: nowrap; flex: none; }
}
.q-help { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.q-help .helper { padding: 4px 12px; font-size: 13px; }
@media (max-width: 560px) {
  .q-head { flex-wrap: wrap; }
  .q-help { justify-content: flex-start; order: 2; width: 100%; }
}

/* ---- accounts, quests, trophies, leaderboard */
:root { --bronze: #c9814b; --silver: #9aa6bd; --gold: #e8a800; --plat: #3fb8af; --diamond: #4d8dff; --legend: #b04cf0; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.center { text-align: center; justify-items: center; }
.center .bit { width: 90px; height: 90px; }
.wrap.narrow { max-width: 760px; padding-block: 24px 110px; display: grid; gap: 18px; }
.page-h h1 { font-size: clamp(28px, 4vw, 40px); letter-spacing: -.02em; }
.page-h p { color: var(--ink-2); margin-top: 6px; }
.row-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.row-h .muted { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; }
.row-h .muted svg { width: 16px; height: 16px; color: var(--flame); }
.card h2 { font-size: 20px; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 800; font-size: 14px; }
.linkish:hover { text-decoration: underline; }
.pill { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 12px; margin-left: 6px; }

/* nav */
.top-nav { display: flex; gap: 4px; margin-left: 18px; }
.nav-btn {
  position: relative; display: flex; align-items: center; gap: 7px; border: 2px solid transparent; background: none; border-radius: 12px;
  padding: 7px 12px; font-weight: 800; font-size: 14px; color: var(--ink-2); letter-spacing: .02em;
}
.nav-btn svg { width: 20px; height: 20px; }
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn.on { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.nav-btn .dot { position: absolute; top: -4px; right: -4px; font-style: normal; min-width: 18px; height: 18px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 4px; }
#nav { display: none; }
.avatar { display: inline-grid; place-items: center; border-radius: 50%; background: var(--av); color: #fff; font-family: var(--f-display); font-weight: 800; flex: none; box-shadow: inset 0 -3px 0 rgb(0 0 0 / .2); }
.me-btn { border: 0; background: none; padding: 0; border-radius: 50%; display: grid; }
.login-btn { min-height: 38px; padding: 8px 14px; font-size: 13px; }
@media (max-width: 900px) {
  .top-nav { display: none; }
  #nav {
    display: flex; position: fixed; z-index: 8; left: 0; right: 0; bottom: 0; justify-content: space-around;
    background: var(--surface); border-top: 2px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  #nav .nav-btn { flex-direction: column; gap: 2px; font-size: 11px; padding: 5px 10px; }
  body { padding-bottom: 72px; }
  .bitpanel { z-index: 50; }
}

/* home strip */
.home-strip { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; margin-bottom: 26px; align-items: start; }
@media (max-width: 760px) { .home-strip { grid-template-columns: minmax(0, 1fr); } }

/* quests */
.quests { display: grid; gap: 10px; }
.quest {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center;
  border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--surface);
}
.quest.ready { border-color: var(--good); background: var(--good-soft); }
.quest.claimed { opacity: .65; }
.q-main { display: grid; gap: 4px; min-width: 0; }
.q-main b { font-size: 15px; }
.q-main .meter { margin: 0; }
.q-tier { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; border-radius: 8px; color: #fff; }
.t-easy { background: var(--good); } .t-medium { background: var(--accent); } .t-hard { background: var(--bad); } .t-week { background: var(--cs); }
.q-claim { min-height: 38px; padding: 8px 12px; font-size: 13px; }
.q-reward, .q-got { display: inline-flex; align-items: center; gap: 3px; font-weight: 800; color: var(--xp); font-variant-numeric: tabular-nums; }
.q-got { color: var(--good-ink); font-size: 13px; }
.q-reward svg, .q-got svg { width: 18px; height: 18px; }
.quests.compact .quest { padding: 10px 12px; }
@media (max-width: 560px) { .quest { grid-template-columns: minmax(0, 1fr) auto; } .q-tier { grid-column: 1 / -1; justify-self: start; } }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tiles div { border: 2px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 2px; }
.tiles b { font: 800 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.tiles span { color: var(--ink-2); font-size: 13px; }
@media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fixes { display: flex; flex-wrap: wrap; gap: 8px; }
.fixes .btn { min-height: 42px; padding: 8px 14px; text-transform: none; letter-spacing: 0; color: var(--c); }

/* leaderboard */
.league-head { display: grid; grid-template-columns: 74px 1fr; gap: 16px; align-items: center; }
.shield { width: 74px; height: 74px; }
.shield path { fill: var(--lg); stroke: color-mix(in srgb, var(--lg) 60%, #000); stroke-width: 2; }
.league-head small { text-transform: uppercase; letter-spacing: .08em; font-weight: 800; font-size: 12px; color: var(--ink-2); }
.league-head h1 { font-size: clamp(26px, 4vw, 36px); }
.league-head p { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; justify-self: start; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 7px 14px; font-weight: 800; font-size: 14px; color: var(--ink-2); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 2px 0 var(--line); }
.board { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.board li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; }
.board li.up .rank { color: var(--good-ink); }
.board li.down .rank { color: var(--bad-ink); }
.board li.me { background: var(--accent-soft); }
.board li:nth-child(7).up { border-bottom: 2px dashed var(--good); border-radius: 12px 12px 0 0; }
.rank { font: 800 18px/1 var(--f-display); text-align: center; font-variant-numeric: tabular-nums; }
.who { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; min-width: 0; text-align: left; }
.who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who em { font-style: normal; color: var(--ink-2); font-weight: 600; }
.xpv { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink-2); }

/* profile */
.profile-top { grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 18px; }
.p-id { display: grid; gap: 8px; min-width: 0; }
.p-id h1 { font-size: clamp(26px, 4vw, 34px); overflow-wrap: anywhere; }
.p-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.p-actions .btn { min-height: 44px; padding: 10px 16px; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; }
.acct { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
@media (max-width: 560px) { .profile-top { grid-template-columns: 1fr; justify-items: start; } }
.week-chart { width: 100%; max-width: 520px; height: auto; }
.week-chart rect { fill: color-mix(in srgb, var(--accent) 45%, var(--surface-2)); }
.week-chart rect.now { fill: var(--accent); }
.week-chart text { font: 700 12px var(--f-body); text-anchor: middle; fill: var(--ink-2); }
.week-chart text.v { fill: var(--ink); }
.lang-bars { display: grid; gap: 8px; margin-top: 4px; }
.lang-bars div { display: grid; grid-template-columns: 96px 1fr 40px; gap: 10px; align-items: center; font-size: 14px; font-weight: 600; }
.lang-bars span:last-child { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.trophy { display: grid; justify-items: center; text-align: center; gap: 4px; padding: 12px 8px; border: 2px solid var(--line); border-radius: 14px; }
.trophy b { font-size: 14px; line-height: 1.2; }
.trophy span { font-size: 12px; color: var(--ink-2); line-height: 1.3; }
.trophy.off { opacity: .7; }
.medal { width: 58px; height: 58px; }
.medal .m-ribbon { fill: color-mix(in srgb, var(--m) 55%, var(--accent)); }
.medal .m-ring { fill: var(--m); }
.medal .m-face { fill: color-mix(in srgb, var(--m) 70%, #fff); }
.medal .m-glyph { color: color-mix(in srgb, var(--m) 45%, #000); }
.medal .m-glyph path { fill: currentColor; stroke: currentColor; }
.medal .m-badge { font: 800 11px var(--f-code); fill: color-mix(in srgb, var(--m) 40%, #000); }
.medal.locked .m-ribbon, .medal.locked .m-ring, .medal.locked .m-face { fill: var(--lock); }
.medal.locked .m-glyph { color: var(--surface-2); }

/* modal */
#modal { position: fixed; inset: 0; z-index: 70; background: rgb(10 14 30 / .55); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
#modal[hidden] { display: none; }
.m-box { position: relative; background: var(--bg); border-radius: 20px; padding: 26px 22px; width: min(440px, 100%); box-shadow: 0 30px 60px rgb(0 0 0 / .3); }
.m-x { position: absolute; top: 10px; right: 10px; }
.auth { display: grid; gap: 12px; justify-items: center; text-align: center; }
.auth .bit { width: 70px; height: 70px; }
.auth h2 { font-size: 26px; }
.form { display: grid; gap: 6px; width: 100%; text-align: left; }
.form label { font-weight: 800; font-size: 13px; margin-top: 6px; }
.form input {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 11px 13px; width: 100%;
}
.form input:focus { outline: none; border-color: var(--accent); }
.form .btn { margin-top: 8px; }
.err { color: var(--bad-ink); font-size: 14px; font-weight: 600; min-height: 1em; }
.or { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; color: var(--ink-2); font-size: 13px; font-weight: 700; }
.or::before, .or::after { content: ""; height: 2px; background: var(--line); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; background: var(--av); box-shadow: inset 0 -3px 0 rgb(0 0 0 / .2); }
.sw.on { border-color: var(--ink); }
.share { text-align: left; justify-items: stretch; }
.share-img { width: 100%; border-radius: 14px; }
.copy { display: flex; gap: 8px; }
.copy input { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px; }
.copy .btn { min-height: 44px; padding: 8px 14px; }

/* notes */
.note { grid-template-columns: 34px minmax(0, 1fr); align-items: start; }
.note .n { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 800; }
.note p { font-size: 17px; line-height: 1.6; }
.note .code-wrap { grid-column: 2; }
.note pre.code { white-space: pre-wrap; overflow-wrap: anywhere; }
.page-h .kicker svg { width: 18px; height: 18px; }
.pop-link { border: 0; background: none; color: #fff; font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; padding: 2px; }

/* lesson extras */
.combo { display: inline-flex; align-items: center; gap: 3px; color: var(--flame); font-weight: 800; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }

.combo.pop { animation: pop .35s; }
@keyframes pop { 40% { transform: scale(1.25); } }
.end .small { margin-top: -4px; }

/* toasts */
#toasts { position: fixed; z-index: 80; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 50%; transform: translateX(-50%); display: grid; gap: 8px; width: min(380px, calc(100% - 32px)); pointer-events: none; }
.toast-card {
  display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; background: var(--surface); color: var(--ink);
  border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; box-shadow: 0 14px 30px rgb(0 0 0 / .18); animation: drop .35s;
}
.toast-card.tk-trophy { border-color: var(--gold); }
.toast-card.tk-quest { border-color: var(--good); }
.toast-card .medal { width: 46px; height: 46px; }
.toast-card .t-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.toast-card.tk-quest .t-ic { background: var(--good-soft); color: var(--good-ink); }
.toast-card .t-ic svg { width: 22px; height: 22px; }
.toast-card b { font-size: 15px; }
.toast-card p { font-size: 13px; color: var(--ink-2); }
.toast-card.out { opacity: 0; transform: translateY(-8px); transition: .3s; }
@keyframes drop { from { opacity: 0; transform: translateY(-12px); } }

<script type="application/json" id="courses">[{"id":"python","name":"Python","blurb":"A friendly, readable language for scripts, automation, data science, AI, and web backends.","setup":"Install Python 3 from python.org (on Windows, tick \"Add python.exe to PATH\" in the installer). Save your code in a file like `hello.py`, then run `python hello.py` in a terminal (use `python3` on Mac and Linux).","levels":{"beginner":[{"id":"py-b1","title":"Your first program","summary":"Printing text, comments, and running order","teach":[{"text":"A **program** is a list of instructions for the computer. In Python you write them in a plain text file that ends in `.py`. Python reads the file and runs it. No `main` function is needed: the code just starts at the top.","code":"print(\"Hello, world!\")  # Hello, world!"},{"text":"`print()` shows something on the screen. Put text inside quotes. Each `print` starts on a new line.","code":"print(\"Hello!\")                # Hello!\nprint(\"I am learning Python\")  # I am learning Python"},{"text":"You can print numbers too, without quotes. Python does the math first, then prints the result. Separate several values with commas and `print` puts a space between them.","code":"print(7)           # 7\nprint(2 + 3)       # 5\nprint(\"Age:\", 12)  # Age: 12"},{"text":"A **comment** starts with `#`. Python ignores everything after the `#` on that line. Comments are notes for humans, like explaining what the code does.","code":"# Say hello to the player\nprint(\"Hi\")  # Hi"},{"text":"Python runs your file from top to bottom, one line at a time. Order matters: if you swap two `print` lines, the output swaps too.","code":"print(\"First\")\nprint(\"Second\")\nprint(\"Third\")\n# First\n# Second\n# Third"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"print(\"Hi\")\nprint(\"there\")","options":["Hi there","Hi\nthere","Hithere","there\nHi"],"answer":1,"explain":"Each `print` call puts its text on a new line, and the lines run from top to bottom."},{"type":"output","prompt":"What does this print?","code":"print(4 + 5)","options":["4 + 5","45","9","Error"],"answer":2,"explain":"Without quotes, `4 + 5` is math. Python works it out and prints `9`."},{"type":"output","prompt":"What does this print?","code":"print(\"4 + 5\")","options":["9","45","Error","4 + 5"],"answer":3,"explain":"With quotes, `\"4 + 5\"` is just text, so Python prints it exactly as written."},{"type":"output","prompt":"What does this print?","code":"print(\"A\")  # print(\"B\")\nprint(\"C\")","options":["A\nB\nC","A\nC","A","C"],"answer":1,"explain":"Everything after `#` is a comment, so the `print(\"B\")` part never runs."},{"type":"fill","prompt":"Make it print `Hello, world!`","code":"___(\"Hello, world!\")","bank":["echo","print","say","Print"],"answer":["print"],"explain":"The function is called `print`, all lowercase. Python is case sensitive, so `Print` does not work."},{"type":"order","prompt":"Put the lines in order for a countdown: 3, 2, 1, Liftoff!","lines":["print(\"3\")","print(\"2\")","print(\"1\")","print(\"Liftoff!\")"],"explain":"Python runs lines from top to bottom, so the lines must be in the same order as the countdown."},{"type":"bug","prompt":"Tap the line with the bug","lines":["print(\"Start\")","print(\"Middle)","print(\"End\")"],"answer":1,"explain":"Text needs a quote at both ends. `\"Middle` is missing its closing quote."},{"type":"tf","prompt":"Python runs the lines in a file from top to bottom.","answer":true,"explain":"Unless something like a loop or an `if` changes the flow, Python runs one line after another, starting at the top."}]},{"id":"py-b2","title":"Variables and types","summary":"Storing numbers, text, and true/false values","teach":[{"text":"A **variable** is a name that holds a value. Use `=` to store a value in it. Later, use the name to get the value back.","code":"score = 10\nprint(score)  # 10"},{"text":"You can change a variable at any time. The new value replaces the old one. A variable can even use its own old value.","code":"lives = 3\nlives = 2\nprint(lives)  # 2\nlives = lives - 1\nprint(lives)  # 1"},{"text":"Every value has a **type**. `int` is a whole number, `float` has a decimal point, `str` (string) is text in quotes, and `bool` is `True` or `False`. `type()` tells you the type.","code":"print(type(42))    # <class 'int'>\nprint(type(3.5))   # <class 'float'>\nprint(type(\"hi\"))  # <class 'str'>\nprint(type(True))  # <class 'bool'>"},{"text":"Names can use letters, digits, and `_`, but they cannot start with a digit or contain spaces. Names are case sensitive: `score` and `Score` are different. Python style is **snake_case**, like `player_name`.","code":"player_name = \"Ava\"\nhigh_score = 99\nprint(player_name, high_score)  # Ava 99"},{"text":"`True` and `False` must start with a capital letter. Quotes matter: `\"5\"` is text, `5` is a number. Adding two strings sticks them together.","code":"is_ready = True\nprint(is_ready)   # True\nprint(\"5\" + \"5\")  # 55\nprint(5 + 5)      # 10"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"x = 5\nx = x + 2\nprint(x)","options":["7","5","x + 2","52"],"answer":0,"explain":"`x + 2` uses the old value 5, so `x` becomes 7."},{"type":"mcq","prompt":"Which one is a valid variable name?","options":["2players","player_name","player-name","player name"],"answer":1,"explain":"Names can use letters, digits, and `_`. They cannot start with a digit, use `-`, or contain spaces."},{"type":"output","prompt":"What does this print?","code":"print(type(4.0))","options":["<class 'int'>","<class 'float'>","<class 'str'>","<class 'bool'>"],"answer":1,"explain":"`4.0` has a decimal point, so it is a `float`, even though it is a whole amount."},{"type":"fill","prompt":"Store the boolean true in `is_open`","code":"is_open = ___","bank":["\"True\"","True","TRUE","true"],"answer":["True"],"explain":"Booleans are written `True` and `False` with a capital first letter. `\"True\"` with quotes is a string, not a boolean."},{"type":"bug","prompt":"This should print 15. Tap the line with the bug.","lines":["score = 10","bonus = 5","total = score + Bonus","print(total)"],"answer":2,"explain":"The variable is `bonus` with a lowercase b. `Bonus` is a different name that was never created, so Python raises a `NameError`."},{"type":"output","prompt":"What does this print?","code":"a = \"3\"\nb = \"4\"\nprint(a + b)","options":["7","3 4","Error","34"],"answer":3,"explain":"`a` and `b` are strings, so `+` joins them instead of adding numbers."},{"type":"tf","prompt":"`\"7\"` and `7` are the same value in Python.","answer":false,"explain":"`\"7\"` is a string (text) and `7` is an `int` (number). They are different types."},{"type":"mcq","prompt":"What type is `False`?","options":["str","int","float","bool"],"answer":3,"explain":"`True` and `False` are the two values of the `bool` type."}]},{"id":"py-b3","title":"Math and text","summary":"Operators, division, and joining strings","teach":[{"text":"Python does math with `+`, `-`, `*` and `/`. Normal math order applies: `*` and `/` happen before `+` and `-`. Use parentheses to change the order.","code":"print(2 + 3 * 4)    # 14\nprint((2 + 3) * 4)  # 20"},{"text":"`/` always gives a decimal (`float`). `//` divides and drops the remainder. `%` gives just the remainder. `**` is power.","code":"print(7 / 2)   # 3.5\nprint(7 // 2)  # 3\nprint(7 % 2)   # 1\nprint(2 ** 3)  # 8"},{"text":"`+` joins strings and `*` repeats them. You cannot add a string and a number directly. Use `str()` to turn the number into text first.","code":"print(\"Game\" + \"Over\")    # GameOver\nprint(\"ha\" * 3)           # hahaha\nprint(\"Level \" + str(5))  # Level 5"},{"text":"An **f-string** is the easiest way to mix text and values. Put `f` right before the opening quote and put values inside `{}`.","code":"name = \"Mia\"\ncoins = 12\nprint(f\"{name} has {coins} coins\")  # Mia has 12 coins\nprint(f\"Half is {coins / 2}\")       # Half is 6.0"},{"text":"Shortcuts like `+=` update a variable in place. `x += 5` means the same as `x = x + 5`. There are also `-=`, `*=` and `/=`.","code":"x = 10\nx += 5\nx *= 2\nprint(x)  # 30"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"print(10 / 4)","options":["2","2.0","3","2.5"],"answer":3,"explain":"`/` is true division and always returns a float, so you get `2.5`."},{"type":"output","prompt":"What does this print?","code":"print(10 // 4, 10 % 4)","options":["2.5 2","2 0.5","2.5 0","2 2"],"answer":3,"explain":"`10 // 4` is 2 (4 fits twice) and `10 % 4` is the remainder, also 2."},{"type":"output","prompt":"What does this print?","code":"print(\"5\" * 2)","options":["10","5 5","Error","55"],"answer":3,"explain":"`\"5\"` is a string, and `*` repeats a string, so you get `55`."},{"type":"fill","prompt":"Make it print `Score: 8`","code":"points = 8\nprint(___\"Score: {points}\")","bank":["+","f","$","str"],"answer":["f"],"explain":"The `f` before the quote makes it an f-string, so `{points}` is replaced by the value 8."},{"type":"bug","prompt":"Tap the line with the bug","lines":["lives = 3","message = \"Lives: \" + lives","print(message)"],"answer":1,"explain":"You cannot add a string and an int. Use `str(lives)` or an f-string like `f\"Lives: {lives}\"`."},{"type":"mcq","prompt":"What is the value of `2 + 3 * 2 ** 2`?","options":["100","20","22","14"],"answer":3,"explain":"`**` goes first (2 ** 2 = 4), then `*` (3 * 4 = 12), then `+` (2 + 12 = 14)."},{"type":"order","prompt":"Put the lines in order so it prints `15`","lines":["x = 4","x += 1","x *= 3","print(x)"],"explain":"4 + 1 is 5, then 5 * 3 is 15. Doing `*= 3` first would give 4 * 3 + 1 = 13."},{"type":"tf","prompt":"`8 / 2` gives the int `4`.","answer":false,"explain":"`/` always returns a float, so `8 / 2` is `4.0`. Use `//` for whole-number division."}]},{"id":"py-b4","title":"Decisions","summary":"Comparisons, if / elif / else, and / or / not","teach":[{"text":"Comparisons give a `bool`. `==` checks if two values are equal and `!=` checks if they are different. There are also `<`, `>`, `<=` and `>=`. Remember: `=` stores a value, `==` compares.","code":"print(5 > 3)   # True\nprint(5 == 3)  # False\nprint(5 != 3)  # True"},{"text":"`if` runs a block only when its condition is `True`. End the `if` line with a colon `:` and indent the block with 4 spaces. Indentation is how Python knows what is inside the `if`.","code":"health = 20\nif health < 30:\n    print(\"Low health!\")\nprint(\"Done\")\n# Low health!\n# Done"},{"text":"`elif` (short for else if) checks another condition. `else` catches everything left over. Python checks from the top and runs only the **first** block that matches.","code":"score = 75\nif score >= 90:\n    print(\"A\")\nelif score >= 70:\n    print(\"B\")\nelse:\n    print(\"C\")\n# B"},{"text":"`and` is `True` only when both sides are `True`. `or` is `True` when at least one side is. `not` flips `True` to `False` and back.","code":"age = 15\nhas_ticket = True\nif age >= 13 and has_ticket:\n    print(\"Enter\")\nif not has_ticket:\n    print(\"Buy a ticket\")\n# Enter"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"x = 7\nif x > 10:\n    print(\"big\")\nelif x > 5:\n    print(\"medium\")\nelse:\n    print(\"small\")","options":["big","medium","small","medium\nsmall"],"answer":1,"explain":"7 is not greater than 10, but it is greater than 5. Only that one block runs."},{"type":"output","prompt":"What does this print?","code":"n = 15\nif n > 5:\n    print(\"A\")\nelif n > 10:\n    print(\"B\")","options":["A","B","A\nB","Nothing"],"answer":0,"explain":"15 > 5 is already true, so `A` prints and the `elif` is skipped, even though it is also true."},{"type":"output","prompt":"What does this print?","code":"print(not (3 > 2 and 1 > 2))","options":["False","Error","True"],"answer":2,"explain":"`3 > 2` is True and `1 > 2` is False, so the `and` is False. `not False` is True."},{"type":"fill","prompt":"Complete the check so it prints `Even` for 8","code":"n = 8\nif n % 2 ___ 0___\n    print(\"Even\")","bank":["==",";",":","!=","="],"answer":["==",":"],"explain":"`==` compares values (a single `=` would be an error here), and every `if` line ends with a colon."},{"type":"bug","prompt":"Tap the line with the bug","lines":["temp = 30","if temp > 25","    print(\"Hot\")","else:","    print(\"Nice\")"],"answer":1,"explain":"The `if` line must end with a colon: `if temp > 25:`."},{"type":"mcq","prompt":"Which operator checks if two values are equal?","options":["==","=","===","equals"],"answer":0,"explain":"`==` compares. A single `=` stores a value in a variable. Python has no `===`."},{"type":"output","prompt":"What does this print?","code":"a = True\nb = False\nprint(a or b, a and b)","options":["True True","False True","True False","False False"],"answer":2,"explain":"`or` needs one True side, so it is True. `and` needs both, so it is False."},{"type":"tf","prompt":"In an `if` / `elif` / `else` chain, more than one block can run.","answer":false,"explain":"Python runs only the first block whose condition is true, then skips the rest of the chain."}]},{"id":"py-b5","title":"Loops","summary":"while, for, range, break and continue","teach":[{"text":"A **loop** repeats code. A `while` loop keeps going as long as its condition is `True`. Make sure something changes inside, or it loops forever.","code":"count = 1\nwhile count <= 3:\n    print(count)\n    count += 1\n# 1\n# 2\n# 3"},{"text":"A `for` loop goes through items one at a time. `range(n)` gives the numbers from 0 up to n - 1. So `range(3)` is 0, 1, 2.","code":"for i in range(3):\n    print(i)\n# 0\n# 1\n# 2"},{"text":"`range(start, stop, step)` lets you pick where to start and how big each step is. The stop number is never included. A negative step counts down.","code":"for i in range(2, 10, 3):\n    print(i)\n# 2\n# 5\n# 8"},{"text":"`break` stops the loop right away. `continue` skips the rest of this round and jumps to the next one.","code":"for n in range(1, 6):\n    if n == 2:\n        continue\n    if n == 4:\n        break\n    print(n)\n# 1\n# 3"},{"text":"A `for` loop also works on text, one character at a time.","code":"for letter in \"VR\":\n    print(letter)\n# V\n# R"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"for i in range(4):\n    print(i)","options":["0\n1\n2\n3","1\n2\n3\n4","0\n1\n2\n3\n4","4"],"answer":0,"explain":"`range(4)` starts at 0 and stops before 4."},{"type":"output","prompt":"What does this print?","code":"x = 10\nwhile x > 0:\n    x -= 3\nprint(x)","options":["-2","1","0","-3"],"answer":0,"explain":"x goes 10, 7, 4, 1, -2. The loop only stops when the check `x > 0` fails, which happens at -2."},{"type":"output","prompt":"What does this print?","code":"for i in range(5):\n    if i % 2 == 0:\n        continue\n    print(i)","options":["0\n2\n4","1\n3\n5","0\n1\n2\n3\n4","1\n3"],"answer":3,"explain":"`continue` skips the even numbers (0, 2, 4), so only 1 and 3 are printed."},{"type":"fill","prompt":"Make it print 5, 4, 3, 2, 1 (one per line)","code":"for i in range(5, ___, ___):\n    print(i)","bank":["-1","1","0","6","-2"],"answer":["0","-1"],"explain":"Start at 5, step by -1, and stop before 0. The stop value is never included."},{"type":"order","prompt":"Put the lines in order so it prints 1, 2, 3","lines":["n = 1","while n <= 3:","    print(n)","    n += 1"],"explain":"Set `n` first, then loop. Printing before adding 1 gives 1, 2, 3. Adding first would print 2, 3, 4."},{"type":"bug","prompt":"This should print 0 to 4. Tap the line with the bug.","lines":["i = 0","while i < 5:","    print(i)","i += 1"],"answer":3,"explain":"`i += 1` is not indented, so it is outside the loop. `i` never changes and the loop runs forever."},{"type":"tf","prompt":"`range(1, 5)` includes the number 5.","answer":false,"explain":"The stop value is never included. `range(1, 5)` gives 1, 2, 3, 4."}]}],"intermediate":[{"id":"py-i1","title":"Functions","summary":"def, parameters, return values, and scope","teach":[{"text":"A **function** is a named block of code you can run again and again. Define it with `def`, a name, parentheses, and a colon. Call it by writing its name with `()`.","code":"def greet():\n    print(\"Hello!\")\n\ngreet()\ngreet()\n# Hello!\n# Hello!"},{"text":"**Parameters** are the inputs a function expects. You list them in the parentheses. The values you pass in when you call it are called **arguments**.","code":"def greet(name):\n    print(f\"Hi, {name}!\")\n\ngreet(\"Leo\")  # Hi, Leo!\ngreet(\"Ava\")  # Hi, Ava!"},{"text":"`return` sends a value back to the caller and ends the function right away. A function with no `return` gives back `None`.","code":"def add(a, b):\n    return a + b\n\nresult = add(2, 3)\nprint(result)      # 5\nprint(add(10, 1))  # 11"},{"text":"Parameters can have **default values**. If the caller leaves that argument out, the default is used.","code":"def power(base, exp=2):\n    return base ** exp\n\nprint(power(3))     # 9\nprint(power(2, 5))  # 32"},{"text":"**Scope**: variables created inside a function are **local**. They only exist while the function runs and cannot be seen outside it. Assigning to a name inside a function makes a new local variable.","code":"def make_secret():\n    secret = 42\n    return secret\n\nprint(make_secret())  # 42\nprint(secret)         # NameError: name 'secret' is not defined"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"def double(x):\n    return x * 2\n\nprint(double(4) + 1)","options":["8","10","9","5"],"answer":2,"explain":"`double(4)` returns 8, then 1 is added, giving 9."},{"type":"output","prompt":"What does this print?","code":"def show(x):\n    print(x)\n\nresult = show(3)\nprint(result)","options":["3\n3","3\nNone","None","3"],"answer":1,"explain":"`show` prints 3 but has no `return`, so it gives back `None`, which is then printed."},{"type":"output","prompt":"What does this print?","code":"def hi(name, punct=\"!\"):\n    return \"Hi \" + name + punct\n\nprint(hi(\"Zoe\", \"?\"))","options":["Hi Zoe?","Hi Zoe!","Hi Zoe!?","Hi Zoe"],"answer":0,"explain":"The caller passed `\"?\"`, so it replaces the default `\"!\"`."},{"type":"output","prompt":"What does this print?","code":"x = 5\n\ndef change():\n    x = 10\n\nchange()\nprint(x)","options":["10","Error","None","5"],"answer":3,"explain":"`x = 10` inside the function creates a new local `x`. The outer `x` is untouched."},{"type":"fill","prompt":"Complete the function so it prints 12","code":"___ area(w, h):\n    ___ w * h\n\nprint(area(3, 4))","bank":["print","def","function","return","func"],"answer":["def","return"],"explain":"Functions start with `def`, and `return` hands the result back so `print` can show it."},{"type":"bug","prompt":"This should print 5.0. Tap the line with the bug.","lines":["def average(a, b):","    total = a + b","    return total / 2","print(average(4, 6, 8))"],"answer":3,"explain":"`average` takes exactly 2 arguments, but it is called with 3. Python raises a `TypeError`."},{"type":"tf","prompt":"A function stops running as soon as it reaches `return`.","answer":true,"explain":"`return` ends the function immediately. Any lines after it in that call are skipped."}]},{"id":"py-i2","title":"Lists","summary":"Create, index, change, and loop over lists","teach":[{"text":"A **list** holds many values in order. Write it with square brackets and commas between items. `len()` tells you how many items it has.","code":"fruits = [\"apple\", \"banana\", \"cherry\"]\nprint(len(fruits))  # 3"},{"text":"Each item has an **index**, its position. Indexes start at 0, not 1. Negative indexes count from the end, so `-1` is the last item.","code":"fruits = [\"apple\", \"banana\", \"cherry\"]\nprint(fruits[0])   # apple\nprint(fruits[2])   # cherry\nprint(fruits[-1])  # cherry"},{"text":"Lists can change. Assign to an index to replace an item. `append()` adds to the end, `remove()` deletes by value, and `pop()` removes by index (the last item if you give no index) and returns it.","code":"nums = [10, 20, 30]\nnums[0] = 5\nnums.append(40)\nnums.remove(20)\nlast = nums.pop()\nprint(nums, last)  # [5, 30] 40"},{"text":"Loop over a list with `for`. Use `enumerate()` when you also want the index. Use `in` to check whether an item is in the list.","code":"colors = [\"red\", \"green\"]\nfor i, c in enumerate(colors):\n    print(i, c)\nprint(\"red\" in colors)\n# 0 red\n# 1 green\n# True"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"nums = [3, 6, 9]\nprint(nums[1])","options":["6","3","9","Error"],"answer":0,"explain":"Indexes start at 0, so index 1 is the second item."},{"type":"output","prompt":"What does this print?","code":"items = [\"a\", \"b\", \"c\", \"d\"]\nprint(items[-2])","options":["c","b","d","Error"],"answer":0,"explain":"`-1` is the last item (`d`), so `-2` is the one before it."},{"type":"output","prompt":"What does this print?","code":"nums = [1, 2, 3]\nnums.append(4)\nnums.pop(0)\nprint(nums, len(nums))","options":["[1, 2, 3] 3","[1, 2, 3, 4] 4","[2, 3, 4] 4","[2, 3, 4] 3"],"answer":3,"explain":"`append(4)` adds to the end, then `pop(0)` removes the item at index 0, leaving 3 items."},{"type":"output","prompt":"What does this print?","code":"a = [1, 2]\nb = a\nb.append(3)\nprint(a)","options":["[1, 2]","[1, 2, 3]","[3]","Error"],"answer":1,"explain":"`b = a` does not copy the list. Both names point to the same list, so changing `b` changes `a` too."},{"type":"fill","prompt":"Add `\"sword\"` to the end of the list","code":"inventory = [\"shield\"]\ninventory.___(\"sword\")\nprint(inventory)","bank":["append","insert","push","add"],"answer":["append"],"explain":"`append()` adds an item to the end. Python lists have no `add` or `push`, and `insert` also needs a position."},{"type":"bug","prompt":"This should print the last score. Tap the line with the bug.","lines":["scores = [12, 45, 7]","last = scores[3]","print(last)"],"answer":1,"explain":"The list has 3 items, so the indexes are 0, 1, 2. `scores[3]` raises an `IndexError`. Use `scores[2]` or `scores[-1]`."},{"type":"order","prompt":"Put the lines in order so it prints `60`","lines":["total = 0","for n in [10, 20, 30]:","    total += n","print(total)"],"explain":"Start the total at 0, add each number inside the loop, then print once after the loop ends."},{"type":"tf","prompt":"The first item in a Python list is at index 1.","answer":false,"explain":"Python counts from 0, so the first item is `items[0]`."}]},{"id":"py-i3","title":"Dictionaries","summary":"Key/value lookup, adding, checking, looping","teach":[{"text":"A **dictionary** (`dict`) stores pairs: a **key** and its **value**. Write it with curly braces and a colon between each key and value. Look up a value by putting its key in square brackets.","code":"player = {\"name\": \"Ana\", \"level\": 3}\nprint(player[\"name\"])   # Ana\nprint(player[\"level\"])  # 3"},{"text":"Assign to a key to add a new pair, or to change an existing one. Use `del` to remove a pair.","code":"player = {\"name\": \"Ana\", \"level\": 3}\nplayer[\"level\"] = 4  # change\nplayer[\"hp\"] = 100   # add\ndel player[\"name\"]   # remove\nprint(player)        # {'level': 4, 'hp': 100}"},{"text":"Looking up a key that does not exist raises a `KeyError`. Check first with `in`, or use `get()`, which returns `None` (or a default you choose) instead of crashing.","code":"ages = {\"Tom\": 12}\nprint(\"Tom\" in ages)       # True\nprint(ages.get(\"Sue\"))     # None\nprint(ages.get(\"Sue\", 0))  # 0"},{"text":"Loop with `.items()` to get each key and value together. A plain `for k in d` loops over the keys only.","code":"prices = {\"apple\": 2, \"pear\": 3}\nfor fruit, price in prices.items():\n    print(fruit, price)\n# apple 2\n# pear 3"},{"text":"Each key appears only once. A common pattern is counting: use `get(key, 0)` to start at 0, then add 1.","code":"counts = {}\nfor ch in \"banana\":\n    counts[ch] = counts.get(ch, 0) + 1\nprint(counts)  # {'b': 1, 'a': 3, 'n': 2}"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"d = {\"a\": 1, \"b\": 2}\nd[\"a\"] = 5\nprint(d)","options":["{'a': 1, 'b': 2}","{'a': 1, 'b': 2, 'a': 5}","Error","{'a': 5, 'b': 2}"],"answer":3,"explain":"Assigning to an existing key replaces its value. Keys are never duplicated."},{"type":"output","prompt":"What does this print?","code":"stock = {\"apples\": 4}\nprint(stock.get(\"pears\", 0))","options":["None","Error","0","4"],"answer":2,"explain":"`\"pears\"` is not a key, so `get` returns the default you gave, 0."},{"type":"output","prompt":"What does this print?","code":"d = {\"x\": 1}\nd[\"x\"] += 1\nd[\"y\"] = d[\"x\"] * 10\nprint(d[\"y\"])","options":["10","2","20","Error"],"answer":2,"explain":"`d[\"x\"]` becomes 2, then the new key `\"y\"` gets 2 * 10 = 20."},{"type":"fill","prompt":"Only print the score if the key exists","code":"scores = {\"ana\": 9}\nif \"ana\" ___ scores:\n    print(scores___)","bank":["has","(\"ana\")","in","[\"ana\"]",".ana"],"answer":["in","[\"ana\"]"],"explain":"`in` checks whether a key exists, and square brackets look up its value."},{"type":"bug","prompt":"This should print 3. Tap the line with the bug.","lines":["lives = {\"Ana\": 3, \"Ben\": 5}","name = \"ana\"","print(lives[name])"],"answer":1,"explain":"Keys are case sensitive. The key is `\"Ana\"`, so looking up `\"ana\"` raises a `KeyError`."},{"type":"order","prompt":"Put the lines in order so it prints `{'hi': 2, 'yo': 1}`","lines":["counts = {}","for word in [\"hi\", \"yo\", \"hi\"]:","    counts[word] = counts.get(word, 0) + 1","print(counts)"],"explain":"Create the empty dict, count each word inside the loop, then print once at the end."},{"type":"tf","prompt":"A dictionary can hold the same key twice.","answer":false,"explain":"Keys are unique. Assigning to a key that already exists replaces its old value."},{"type":"mcq","prompt":"What happens with `d[\"missing\"]` if that key does not exist?","options":["It returns `None`","It returns 0","It raises a `KeyError`","It adds the key"],"answer":2,"explain":"Square brackets crash on a missing key. Use `d.get(\"missing\")` if you want `None` instead."}]},{"id":"py-i4","title":"Working with text","summary":"String methods, slicing, and converting types","teach":[{"text":"Strings have built-in **methods**. They return a new string. The original never changes, because strings are **immutable**.","code":"s = \"Hello\"\nprint(s.upper())  # HELLO\nprint(s.lower())  # hello\nprint(s)          # Hello"},{"text":"Handy methods: `strip()` removes spaces at both ends, `replace()` swaps text, `split()` breaks a string into a list, and `join()` glues a list back into one string.","code":"print(\"  hi  \".strip())           # hi\nprint(\"cat\".replace(\"c\", \"b\"))    # bat\nprint(\"a,b,c\".split(\",\"))         # ['a', 'b', 'c']\nprint(\"-\".join([\"x\", \"y\", \"z\"]))  # x-y-z"},{"text":"**Slicing** takes part of a string: `s[start:stop]`. The stop index is not included. Leave a side empty to go to the start or end. `s[::-1]` reverses the string.","code":"word = \"Python\"\nprint(word[0:2])   # Py\nprint(word[2:])    # thon\nprint(word[-3:])   # hon\nprint(word[::-1])  # nohtyP"},{"text":"Convert between text and numbers with `int()`, `float()` and `str()`. `input()` always gives you a string, so convert it before doing math.","code":"age_text = \"14\"\nage = int(age_text)\nprint(age + 1)       # 15\nprint(str(3) + \"D\")  # 3D"},{"text":"f-strings can format numbers: `:.2f` shows 2 decimal places. To search text, use `in` or `find()`, which gives the index of the first match (or -1).","code":"price = 3.14159\nprint(f\"{price:.2f}\")       # 3.14\nprint(\"VR\" in \"Unity VR\")   # True\nprint(\"banana\".find(\"n\"))   # 2"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"s = \"keyboard\"\nprint(s[3:6])","options":["yboa","boar","boa","ybo"],"answer":2,"explain":"Index 3 is `b`. The slice stops before index 6, so you get indexes 3, 4, 5: `boa`."},{"type":"output","prompt":"What does this print?","code":"name = \"  Sky \"\nprint(len(name.strip()))","options":["6","5","4","3"],"answer":3,"explain":"`strip()` removes the spaces at both ends, leaving `Sky`, which has 3 characters."},{"type":"output","prompt":"What does this print?","code":"words = \"red green blue\".split()\nprint(words[1].upper())","options":["green","GREEN","RED","['GREEN']"],"answer":1,"explain":"`split()` with no argument splits on spaces, giving a list. Index 1 is `green`, then `upper()` makes it `GREEN`."},{"type":"output","prompt":"What does this print?","code":"s = \"hello\"\ns.upper()\nprint(s)","options":["HELLO","Hello","hello","None"],"answer":2,"explain":"Strings never change. `s.upper()` returns a new string, but it is thrown away. You would need `s = s.upper()`."},{"type":"fill","prompt":"Turn the text into a number so it prints 25","code":"text = \"20\"\ntotal = ___(text) + 5\nprint(total)","bank":["int","len","number","str"],"answer":["int"],"explain":"`int()` turns `\"20\"` into the number 20. Without it, adding 5 to a string is an error."},{"type":"bug","prompt":"This should print `U`. Tap the line with the bug.","lines":["name = \"unity\"","first = name[1]","print(first.upper())"],"answer":1,"explain":"Indexes start at 0. `name[1]` is `n`. The first letter is `name[0]`."},{"type":"tf","prompt":"`\"abc\".replace(\"b\", \"x\")` changes the original string.","answer":false,"explain":"Strings are immutable. `replace()` returns a new string, `\"axc\"`, and the original stays `\"abc\"`."},{"type":"mcq","prompt":"What is `\"Python\"[::-1]`?","options":["\"nohtyP\"","\"Python\"","\"P\"","\"n\""],"answer":0,"explain":"A step of -1 walks the string backwards, which reverses it."}]},{"id":"py-i5","title":"Classes and objects","summary":"Attributes, __init__, methods, and instances","teach":[{"text":"A **class** is a blueprint. An **object** (also called an **instance**) is one thing built from that blueprint. One `Dog` class can make many different dogs.","code":"class Dog:\n    pass\n\nrex = Dog()\nfido = Dog()"},{"text":"`__init__` is the **constructor**. It runs automatically when you create an object. `self` is the object being built, and you store data on it as **attributes**, like `self.name`.","code":"class Dog:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\nrex = Dog(\"Rex\", 3)\nprint(rex.name, rex.age)  # Rex 3"},{"text":"**Methods** are functions inside a class. Their first parameter is `self`, so they can read and change the object's attributes. Python passes `self` for you when you call the method.","code":"class Counter:\n    def __init__(self):\n        self.count = 0\n\n    def tick(self):\n        self.count += 1\n\nc = Counter()\nc.tick()\nc.tick()\nprint(c.count)  # 2"},{"text":"Each object has its own attributes. Changing one object does not change another.","code":"class Player:\n    def __init__(self, name):\n        self.name = name\n        self.hp = 100\n\na = Player(\"Ana\")\nb = Player(\"Ben\")\na.hp -= 30\nprint(a.hp, b.hp)  # 70 100"},{"text":"The special method `__str__` controls what an object looks like when you print it.","code":"class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __str__(self):\n        return f\"({self.x}, {self.y})\"\n\nprint(Point(2, 5))  # (2, 5)"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"class Box:\n    def __init__(self, size):\n        self.size = size\n\nb = Box(4)\nb.size += 1\nprint(b.size)","options":["4","5","Error","None"],"answer":1,"explain":"The constructor sets `size` to 4, then `b.size += 1` changes that object's attribute to 5."},{"type":"output","prompt":"What does this print?","code":"class Cat:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return self.name + \" says meow\"\n\nprint(Cat(\"Tom\").speak())","options":["name says meow","says meow","Tom says meow","Error"],"answer":2,"explain":"`self.name` is the value stored by the constructor, which is `\"Tom\"`."},{"type":"output","prompt":"What does this print?","code":"class Coin:\n    def __init__(self):\n        self.value = 1\n\na = Coin()\nb = Coin()\na.value = 5\nprint(a.value + b.value)","options":["10","6","2","5"],"answer":1,"explain":"`a` and `b` are separate objects. Only `a.value` changed to 5, so 5 + 1 = 6."},{"type":"fill","prompt":"Complete the class so it prints `red`","code":"class Car:\n    def ___(self, color):\n        ___.color = color\n\nmy_car = Car(\"red\")\nprint(my_car.color)","bank":["this","__start__","self","init","__init__"],"answer":["__init__","self"],"explain":"The constructor must be named `__init__` with two underscores on each side, and attributes are stored on `self`."},{"type":"bug","prompt":"Tap the line with the bug","lines":["class Light:","    def __init__(self):","        self.on = False","    def toggle():","        self.on = not self.on"],"answer":3,"explain":"Every method needs `self` as its first parameter: `def toggle(self):`. Without it, calling `toggle()` raises a `TypeError`, because Python always passes the object in."},{"type":"order","prompt":"Put the lines in order so it prints `Kai`","lines":["class Hero:","    def __init__(self, name):","        self.name = name","hero = Hero(\"Kai\")","print(hero.name)"],"explain":"Define the class first, then create an object from it, then use its attribute."},{"type":"tf","prompt":"When you call `obj.method()`, you must pass `self` yourself.","answer":false,"explain":"Python passes the object as `self` automatically. You only pass the other arguments."},{"type":"mcq","prompt":"What does `__init__` do?","options":["Deletes an object","Prints the object","Runs automatically when a new object is created","Copies the class"],"answer":2,"explain":"`__init__` is the constructor. It sets up each new object's starting attributes."}]}],"advanced":[{"id":"py-a1","title":"Inheritance and polymorphism","summary":"Subclasses, super(), overriding, duck typing","teach":[{"text":"**Inheritance** lets a new class reuse an existing one. Put the parent class in parentheses after the child's name. The child gets all of the parent's methods for free.","code":"class Animal:\n    def breathe(self):\n        return \"breathing\"\n\nclass Dog(Animal):\n    pass\n\nprint(Dog().breathe())  # breathing"},{"text":"A child can **override** a method by defining one with the same name. When you call a method, Python looks in the object's own class first, then in the parent.","code":"class Animal:\n    def sound(self):\n        return \"...\"\n\nclass Cat(Animal):\n    def sound(self):\n        return \"meow\"\n\nprint(Animal().sound(), Cat().sound())  # ... meow"},{"text":"`super()` calls the parent's version of a method. It is common in `__init__`, so the parent can set up its own attributes before the child adds more.","code":"class Enemy:\n    def __init__(self, hp):\n        self.hp = hp\n\nclass Boss(Enemy):\n    def __init__(self, hp, phase):\n        super().__init__(hp)\n        self.phase = phase\n\nb = Boss(500, 2)\nprint(b.hp, b.phase)  # 500 2"},{"text":"**Polymorphism** means different objects answer the same method call in their own way. Python uses **duck typing**: if an object has the method, you can call it, shared parent or not.","code":"class Dog:\n    def speak(self):\n        return \"Woof\"\n\nclass Duck:\n    def speak(self):\n        return \"Quack\"\n\nfor pet in [Dog(), Duck()]:\n    print(pet.speak())\n# Woof\n# Quack"},{"text":"`isinstance(obj, Class)` checks whether an object is that class or a child of it. A child object counts as its parent type, but not the other way around.","code":"class Vehicle:\n    pass\n\nclass Car(Vehicle):\n    pass\n\nprint(isinstance(Car(), Vehicle))  # True\nprint(isinstance(Vehicle(), Car))  # False"}],"quiz":[{"type":"output","prompt":"What does this print?","code":"class A:\n    def hi(self):\n        return \"A\"\n\nclass B(A):\n    pass\n\nprint(B().hi())","options":["A","B","Error","None"],"answer":0,"explain":"`B` has no `hi` method of its own, so Python finds the one it inherited from `A`."},{"type":"output","prompt":"What does this print?","code":"class Base:\n    def name(self):\n        return \"Base\"\n\n    def greet(self):\n        return \"I am \" + self.name()\n\nclass Child(Base):\n    def name(self):\n        return \"Child\"\n\nprint(Child().greet())","options":["I am Base","Error","I am Base Child","I am Child"],"answer":3,"explain":"`greet` lives in `Base`, but `self` is a `Child` object, so `self.name()` finds the child's override."},{"type":"output","prompt":"What does this print?","code":"class Weapon:\n    def damage(self):\n        return 10\n\nclass Sword(Weapon):\n    def damage(self):\n        return super().damage() * 2\n\nprint(Sword().damage())","options":["10","12","20","Error"],"answer":2,"explain":"`super().damage()` runs the parent's version, which returns 10, and the child doubles it."},{"type":"output","prompt":"What does this print?","code":"class A:\n    pass\n\nclass B(A):\n    pass\n\nprint(isinstance(B(), A), isinstance(A(), B))","options":["True True","False True","False False","True False"],"answer":3,"explain":"A `B` is also an `A` because it inherits from it. A plain `A` is not a `B`."},{"type":"fill","prompt":"Make `Dog` inherit from `Pet` and reuse its constructor","code":"class Pet:\n    def __init__(self, name):\n        self.name = name\n\nclass Dog(___):\n    def __init__(self, name):\n        ___().__init__(name)\n        self.tricks = []\n\nprint(Dog(\"Rex\").name)","bank":["parent","super","Pet","Dog","self"],"answer":["Pet","super"],"explain":"The parent goes in the parentheses, and `super().__init__(name)` lets `Pet` set up `name`."},{"type":"bug","prompt":"Tap the line with the bug","lines":["class Enemy:","    def __init__(self, hp):","        self.hp = hp","class Boss(Enemy):","    def __init
